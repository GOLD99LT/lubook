name: Deploy VitePress docs to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & assemble multi-app bundle (VP_BASE=/lubook/)
        run: pnpm bundle:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (whole bundle)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .bundle

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy HTTP smoke
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check portal + hardware routes
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          portal="${BASE_URL}"
          hardware="${BASE_URL}hardware/"
          chapter="${BASE_URL}hardware/basics/voltage-current-power"
          for url in "$portal" "$hardware" "$chapter"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")
            echo "GET $url -> $code"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $url" >&2
              exit 1
            fi
          done
