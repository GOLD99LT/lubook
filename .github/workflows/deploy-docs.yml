name: Deploy VitePress docs to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 内容到 4.6MB 后 VitePress 默认堆不够；本工作流也会整体重构建（bundle:pages），
# 因此在工作流级统一抬高堆上限，避免逐个 job 漏配（见 docs/adr/ADR-0011.md）。
env:
  NODE_OPTIONS: --max-old-space-size=6144

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 门禁先行（F05）：同一 SHA 上先跑 Quality Gate，绿了才允许构建与部署。
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & assemble multi-app bundle (VP_BASE=/lubook/)
        shell: bash
        run: |
          set +e
          pnpm bundle:pages > /tmp/bundle.log 2>&1
          rc=$?
          tail -n 40 /tmp/bundle.log
          if [ $rc -ne 0 ]; then
            tail -n 25 /tmp/bundle.log \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | tr '\n' ' ' > /tmp/msg.txt
            echo "::error title=bundle:pages failed (rc=$rc)::$(cat /tmp/msg.txt)"
          fi
          exit $rc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (whole bundle)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .bundle

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy HTTP smoke
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check portal + hardware routes
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          # 注意：只断言 HTTP 200 是不够的 —— VitePress 的 404 页同样返回 200。
          # 2026-10-21 门户点卡片落到 /lubook/hardware/ 时服务器返回的正是
          # 门户自己的 404 页（200），旧 smoke 会全绿放行。这里额外断言正文特征串。
          check() {
            url="$1"; expect="$2"
            body=$(curl -sS -L "$url")
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$url")
            echo "GET $url -> $code"
            if [ "$code" != "200" ]; then
              echo "Expected 200 for $url" >&2; exit 1
            fi
            case "$body" in
              *"$expect"*) echo "  content ok (contains '$expect')" ;;
              *) echo "  content MISMATCH: expected '$expect' in $url" >&2; exit 1 ;;
            esac
            case "$body" in
              *"PAGE NOT FOUND"*) echo "  got VitePress 404 page at $url" >&2; exit 1 ;;
            esac
          }
          check "${BASE_URL}" "路书"
          check "${BASE_URL}hardware/" "硬件工程师手册"
          check "${BASE_URL}hardware/basics/voltage-current-power" "欧姆"
