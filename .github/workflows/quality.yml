name: Quality Gate

# 分支与 PR 多 app 质量门禁：门户 + 各分册在线构建（矩阵）、内容分册 manifest 一致性
# + 质检、离线单文件、learning 单测。不部署；部署见 deploy-docs.yml / deploy-cloudflare.yml。
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ['portal', 'hardware']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (VitePress, base 由 VP_BASE 派生)
        run: pnpm build:${{ matrix.app }}

  content-gate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: pnpm Setup
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scaffold build (empty app must pass)
        run: pnpm --filter @lubook/site-template docs:build

      - name: "Quality gate (hardware: manifest + validate + scan)"
        run: pnpm quality:hardware

      - name: Offline single-file build + manifest reconciliation
        run: pnpm offline:hardware

      - name: learning unit tests
        run: pnpm test:learning
