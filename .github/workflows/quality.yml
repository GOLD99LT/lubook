name: Quality Gate

# 分支与 PR 多 app 质量门禁：门户 + 各分册在线构建（矩阵）、内容分册 manifest 一致性
# + 质检、离线单文件、learning 单测。不部署；部署见 deploy-docs.yml / deploy-cloudflare.yml。
#
# workflow_call：让部署流水线把它当前置 job 调用（F05）——push main 时部署必须
# 先等门禁跑绿，否则同一次提交会出现“门禁红、线上升”。
#
on:
  # 不要在这里同时监听 main：部署流水线（deploy-docs.yml）会通过 workflow_call
  # 把本文件当前置门禁；若同时保留 push: main，同一个 commit 会起两个 run，
  # 二者落在同一个 concurrency 组（quality-<ref>）里互相取消——2026-10-22 首次上线
  # 就因此把部署 run 取消掉了。main 的门禁统一由部署 run 内的 quality job 承担。
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 自动枚举 apps/*（带 package.json 的目录），避免每加一册都改 CI 矩阵。
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: list
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, 'packages/tooling/src')
          from paths_util import list_apps
          print('apps=' + json.dumps(list_apps()))
          PY

  build:
    needs: enumerate
    runs-on: ubuntu-latest
    # 内容到 4.6MB 后默认堆不够；.npmrc 的 node-options 在个别 pnpm 版本下不传给子进程，
    # 这里显式再设一次，保证 CI 与本地一致（见 docs/adr/ADR-0011.md）。
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.enumerate.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 先算内存预算：峰值 ≈ 1.16 GB + 33 MB × 页面数（见 docs/adr/ADR-0011.md）。
      # 预计超出就在 OOM 之前失败，并直接给出处置建议，避免"神秘 OOM + 读不到日志"。
      - name: Build memory budget
        continue-on-error: true
        run: |
          python packages/tooling/src/build_memory_budget.py \
            --src "apps/${{ matrix.app }}/docs" --heap-mb 8192

      # 直接按 workspace 包名构建，不依赖根 package.json 里逐册手写的 build:<app>
      # 失败时把日志尾部写成 ::error:: annotation —— 这样不带凭证也能从
      # /commits/<sha>/check-runs 的 annotations 接口读到真实原因（Actions 日志需认证）。
      - name: Build app (VitePress, base 由 VP_BASE 派生)
        shell: bash
        run: |
          set +e
          pnpm -F "@lubook/${{ matrix.app }}" docs:build > /tmp/build.log 2>&1
          rc=$?
          tail -n 40 /tmp/build.log
          if [ $rc -ne 0 ]; then
            tail -n 25 /tmp/build.log \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | tr '\n' ' ' > /tmp/msg.txt
            echo "::error title=VitePress build failed (rc=$rc)::$(cat /tmp/msg.txt)"
          fi
          exit $rc

      # 数学渲染契约（ADR-0012）：产物必须是占位而不是构建期 katex，
      # 且客户端渲染器与 katex chunk 都在（否则读者看到的会是原始 TeX）。
      - name: Math render contract
        run: python packages/tooling/src/scan_math_render.py --app "${{ matrix.app }}"

  content-gate:
    needs: [enumerate, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.enumerate.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Content gate (manifest + validate + scan)
        run: |
          set -e
          APP="${{ matrix.app }}"
          if [ -f "apps/$APP/docs/SUMMARY.md" ]; then
            python run_quality.py --app "$APP"
          else
            echo "app=$APP 无 SUMMARY.md（门户类），跳过内容检查"
            python run_quality.py --app "$APP" --kind portal
          fi

      - name: Offline single-file build + manifest reconciliation
        run: |
          set -e
          APP="${{ matrix.app }}"
          if [ -f "apps/$APP/docs/SUMMARY.md" ]; then
            python packages/tooling/src/freeze_manifest.py --app "$APP"
            python packages/tooling/src/build_single_html.py --app "$APP" \
              --manifest ".generated/$APP-content-manifest.json"
          else
            echo "app=$APP 无内容，跳过离线构建"
          fi

      # TS 与 Python 是两个独立解析器，必须逐字段对齐；历史上这个对账从未真正跑过。
      - name: TS / Python parser parity
        run: |
          set -e
          APP="${{ matrix.app }}"
          if [ -f "apps/$APP/docs/SUMMARY.md" ]; then
            node packages/content-core/src/parity.ts --app "$APP"
          else
            echo "app=$APP 无内容，跳过 parser parity"
          fi

  scaffold:
    needs: enumerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 新册脚手架必须"复制即通过"：构建 + 校验器 + 学习单测
      - name: Scaffold build (empty app must pass)
        run: pnpm --filter @lubook/site-template docs:build

      - name: Scaffold passes the content validator
        run: python packages/tooling/src/validate.py --src templates/site-template/docs

      - name: learning unit tests
        run: pnpm test:learning