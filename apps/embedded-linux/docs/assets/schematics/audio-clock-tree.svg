<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>音频时钟树、I2S 帧结构与 TDM 槽位</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">音频时钟树：从 24 MHz 晶振到 48 kHz 采样率</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">左：PLL 与三级整数分频；右上：I2S 一帧两槽；右下：TDM 八槽；下：关键算式</text>

    <rect x="24" y="78" width="206" height="44" rx="6" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.6"/>
    <text x="36" y="96" font-size="14" font-weight="700" fill="#1a2b3a">晶振 XTAL</text>
    <text x="36" y="114" font-size="13" fill="#2b3a4a">24 MHz</text>

    <line x1="127" y1="122" x2="127" y2="132" stroke="#2b3a4a" stroke-width="2"/>
    <text x="240" y="131" font-size="13" fill="#b5642e">×16.384</text>

    <rect x="24" y="132" width="206" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="36" y="150" font-size="14" font-weight="700" fill="#1a2b3a">AUDIO_PLL</text>
    <text x="36" y="168" font-size="13" fill="#2b3a4a">393.216 MHz = 8192 × fs</text>

    <line x1="127" y1="176" x2="127" y2="186" stroke="#2b3a4a" stroke-width="2"/>
    <text x="240" y="185" font-size="13" fill="#b5642e">÷32</text>

    <rect x="24" y="186" width="206" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="36" y="204" font-size="14" font-weight="700" fill="#1a2b3a">MCLK = 256 × fs</text>
    <text x="36" y="222" font-size="13" fill="#2b3a4a">12.288 MHz</text>

    <line x1="127" y1="230" x2="127" y2="240" stroke="#2b3a4a" stroke-width="2"/>
    <text x="240" y="239" font-size="13" fill="#b5642e">÷4</text>

    <rect x="24" y="240" width="206" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="36" y="258" font-size="14" font-weight="700" fill="#1a2b3a">BCLK = 64 × fs</text>
    <text x="36" y="276" font-size="13" fill="#2b3a4a">3.072 MHz</text>

    <line x1="127" y1="284" x2="127" y2="294" stroke="#2b3a4a" stroke-width="2"/>
    <text x="240" y="293" font-size="13" fill="#b5642e">÷64</text>

    <rect x="24" y="294" width="206" height="44" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.6"/>
    <text x="36" y="312" font-size="14" font-weight="700" fill="#1a2b3a">LRCK = fs</text>
    <text x="36" y="330" font-size="13" fill="#2b3a4a">48 kHz（一帧 20.833 µs）</text>

    <text x="280" y="84" font-size="13" fill="#2b3a4a">I2S 帧：LRCK 低 = 左声道，数据 MSB 先出（BCLK 已压缩）</text>

    <text x="350" y="120" font-size="13" text-anchor="end" fill="#2b3a4a">BCLK</text>
    <path d="M360,124 L405,124 L405,108 L450,108 L450,124 L495,124 L495,108 L540,108 L540,124 L585,124 L585,108 L630,108 L630,124 L675,124 L675,108 L720,108" fill="none" stroke="#1a4f8b" stroke-width="2"/>

    <text x="350" y="170" font-size="13" text-anchor="end" fill="#2b3a4a">LRCK</text>
    <path d="M360,172 L540,172 L540,156 L720,156" fill="none" stroke="#4f9e63" stroke-width="2"/>
    <text x="450" y="148" font-size="13" text-anchor="middle" fill="#4f9e63">左声道 32 slot</text>
    <text x="630" y="148" font-size="13" text-anchor="middle" fill="#4f9e63">右声道 32 slot</text>

    <text x="350" y="220" font-size="13" text-anchor="end" fill="#2b3a4a">SDATA</text>
    <rect x="360" y="204" width="90" height="24" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.2"/>
    <rect x="450" y="204" width="90" height="24" fill="#dbe4ee" stroke="#8fa8c0" stroke-width="1.2"/>
    <rect x="540" y="204" width="90" height="24" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.2"/>
    <rect x="630" y="204" width="90" height="24" fill="#dbe4ee" stroke="#8fa8c0" stroke-width="1.2"/>
    <text x="405" y="221" font-size="13" text-anchor="middle" fill="#1a2b3a">31..16</text>
    <text x="495" y="221" font-size="13" text-anchor="middle" fill="#1a2b3a">15..0</text>
    <text x="585" y="221" font-size="13" text-anchor="middle" fill="#1a2b3a">31..16</text>
    <text x="675" y="221" font-size="13" text-anchor="middle" fill="#1a2b3a">15..0</text>

    <text x="280" y="266" font-size="14" font-weight="700" fill="#1a2b3a">TDM 8 槽 × 32 bit：一帧 256 bit = 20.833 µs</text>
    <rect x="280" y="280" width="55" height="26" fill="#eef1f4" stroke="#6b7f95" stroke-width="1"/>
    <rect x="335" y="280" width="55" height="26" fill="#dbe4ee" stroke="#6b7f95" stroke-width="1"/>
    <rect x="390" y="280" width="55" height="26" fill="#eef1f4" stroke="#6b7f95" stroke-width="1"/>
    <rect x="445" y="280" width="55" height="26" fill="#dbe4ee" stroke="#6b7f95" stroke-width="1"/>
    <rect x="500" y="280" width="55" height="26" fill="#eef1f4" stroke="#6b7f95" stroke-width="1"/>
    <rect x="555" y="280" width="55" height="26" fill="#dbe4ee" stroke="#6b7f95" stroke-width="1"/>
    <rect x="610" y="280" width="55" height="26" fill="#eef1f4" stroke="#6b7f95" stroke-width="1"/>
    <rect x="665" y="280" width="55" height="26" fill="#dbe4ee" stroke="#6b7f95" stroke-width="1"/>
    <text x="307" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch0</text>
    <text x="362" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch1</text>
    <text x="417" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch2</text>
    <text x="472" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch3</text>
    <text x="527" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch4</text>
    <text x="582" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch5</text>
    <text x="637" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch6</text>
    <text x="692" y="298" font-size="13" text-anchor="middle" fill="#1a2b3a">ch7</text>
    <text x="280" y="332" font-size="13" fill="#2b3a4a">每槽 2.604 µs，BCLK 12.288 MHz，帧同步脉冲标记 ch0 起点</text>

    <line x1="24" y1="352" x2="736" y2="352" stroke="#c9d2da" stroke-width="1.2"/>

    <text x="24" y="374" font-size="13" fill="#1a2b3a">BCLK = 2 × 16 × 48 kHz × 2 = 3.072 MHz；MCLK = 256 fs = 12.288 MHz = 393.216 ÷ 32</text>
    <text x="24" y="396" font-size="13" fill="#1a2b3a">24 MHz × 16.384 = 393.216 MHz；44.1 kHz 切 361.2672 MHz（8192 × 44.1k），÷32 = 11.2896 MHz</text>
    <text x="24" y="418" font-size="13" fill="#8a4a1f">误用 12 MHz 当 MCLK：48 kHz 变 46.875 kHz，偏 41 cent，每分钟累积 1.4 s 音画失配</text>
  </g>
</svg>
