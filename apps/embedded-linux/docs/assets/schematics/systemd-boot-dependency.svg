<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>systemd 依赖图、4,600 ms 启动拆解与看门狗窗口</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b03a2e"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">systemd 启动：依赖图、关键路径与看门狗</text>
  <text x="24" y="52" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">实线 = Requires + After；虚线 = Wants；红色虚线 = 把 tmpfiles 串到 networkd 前的多余顺序边</text>

  <rect x="24" y="84" width="130" height="54" rx="7" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.6"/>
  <text x="89" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">local-fs.target</text>

  <line x1="154" y1="111" x2="184" y2="111" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="186" y="84" width="176" height="54" rx="7" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
  <text x="274" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">systemd-tmpfiles-</text>
  <text x="274" y="123" font-size="13" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">setup.service</text>

  <line x1="362" y1="111" x2="398" y2="111" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="400" y="84" width="160" height="54" rx="7" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.6"/>
  <text x="480" y="107" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">app.service</text>
  <text x="480" y="125" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">Wants=network-online</text>

  <line x1="560" y1="111" x2="598" y2="111" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="600" y="84" width="136" height="54" rx="7" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.6"/>
  <text x="668" y="116" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">multi-user.target</text>

  <rect x="24" y="168" width="130" height="54" rx="7" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.6"/>
  <text x="89" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">systemd-udevd</text>
  <text x="89" y="209" font-size="13" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">.service</text>

  <line x1="154" y1="195" x2="184" y2="195" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="186" y="168" width="176" height="54" rx="7" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
  <text x="274" y="191" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">systemd-networkd</text>
  <text x="274" y="209" font-size="13" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">.service</text>

  <line x1="274" y1="138" x2="274" y2="166" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <line x1="362" y1="195" x2="398" y2="140" stroke="#2b3a4a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="368" y="170" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">Wants</text>

  <line x1="24" y1="240" x2="54" y2="240" stroke="#2b3a4a" stroke-width="2"/>
  <text x="60" y="245" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">强依赖 + 顺序</text>
  <line x1="196" y1="240" x2="226" y2="240" stroke="#2b3a4a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="232" y="245" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">弱依赖</text>
  <line x1="326" y1="240" x2="356" y2="240" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="362" y="245" font-size="13" fill="#b03a2e" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">应删除的串行边（+210 ms）</text>

  <text x="24" y="278" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">4,600 ms 启动拆解：用户空间 1,890 ms 里，关键路径只有 1,640 ms</text>

  <rect x="30" y="300" width="175" height="30" fill="#6b7f95" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="205" y="300" width="48.7" height="30" fill="#8fa8c0" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="253.7" y="300" width="188.7" height="30" fill="#1a4f8b" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="442.4" y="300" width="287.6" height="30" fill="#b5642e" stroke="#ffffff" stroke-width="0.8"/>

  <text x="117" y="320" font-size="13" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">固件 1,150</text>
  <text x="229" y="340" font-size="13" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">U-Boot 320</text>
  <text x="348" y="320" font-size="13" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">内核 1,240</text>
  <text x="586" y="320" font-size="13" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">用户空间 1,890</text>

  <rect x="442.4" y="342" width="24.4" height="24" fill="#6b7f95" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="466.8" y="342" width="32.0" height="24" fill="#8fa8c0" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="498.7" y="342" width="51.7" height="24" fill="#1a4f8b" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="550.4" y="342" width="118.7" height="24" fill="#b5642e" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="669.1" y="342" width="22.8" height="24" fill="#4f9e63" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="691.9" y="342" width="38.0" height="24" fill="#c9d2da" stroke="#ffffff" stroke-width="0.8"/>

  <text x="609" y="359" font-size="13" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">app 780</text>
  <text x="711" y="359" font-size="13" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">250</text>

  <text x="30" y="384" font-size="13" fill="#2b3a4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">关键路径 160 + 210 + 340 + 780 + 150 = 1,640 ms；实测 1,890 ms，差额 250 ms</text>
  <text x="30" y="404" font-size="13" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">看门狗 W=10 s：检测 10 + 复位 1.8 + 启动 22 = 33.8 s；约束 W &gt; 2 × 2.8 = 5.6 s</text>
  <text x="30" y="424" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">只读根 /var 32 MiB、2.9 MiB/h 约 11 h 填满；配额 12 + 8 + 8 + 4 = 32 MiB</text>
</svg>
