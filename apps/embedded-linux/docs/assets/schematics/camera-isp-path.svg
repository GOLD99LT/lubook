<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>CSI-2 通道与包结构、V4L2 管线、ISP 功能块与延迟预算</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">Camera 与 ISP：链路、包结构、3A 与延迟预算</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">速率 = 宽 × 高 × 位深 × 帧率 × 消隐；延迟 = 曝光 + 读出 + ISP + 编码 + 显示</text>

    <text x="24" y="80" font-size="14" font-weight="700" fill="#1a2b3a">链路：4 条 D-PHY lane，每 lane 1.10 Gbit/s，VC 区分 sensor，DT 区分格式</text>
    <rect x="24" y="90" width="100" height="76" rx="6" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.4"/>
    <text x="74" y="116" font-size="13" text-anchor="middle" fill="#1a2b3a">sensor</text>
    <text x="74" y="136" font-size="13" text-anchor="middle" fill="#1a2b3a">RAW10</text>
    <text x="74" y="156" font-size="13" text-anchor="middle" fill="#5a6b7b">I2C 配置</text>

    <line x1="124" y1="100" x2="258" y2="100" stroke="#3a6ea5" stroke-width="1.4"/>
    <line x1="124" y1="116" x2="258" y2="116" stroke="#3a6ea5" stroke-width="1.4"/>
    <line x1="124" y1="132" x2="258" y2="132" stroke="#3a6ea5" stroke-width="1.4"/>
    <line x1="124" y1="148" x2="258" y2="148" stroke="#3a6ea5" stroke-width="1.4"/>
    <line x1="124" y1="164" x2="258" y2="164" stroke="#8fa8c0" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="M250,96 L258,100 L250,104" fill="none" stroke="#3a6ea5" stroke-width="1.4"/>
    <path d="M250,112 L258,116 L250,120" fill="none" stroke="#3a6ea5" stroke-width="1.4"/>
    <path d="M250,128 L258,132 L250,136" fill="none" stroke="#3a6ea5" stroke-width="1.4"/>
    <path d="M250,144 L258,148 L250,152" fill="none" stroke="#3a6ea5" stroke-width="1.4"/>

    <rect x="264" y="90" width="112" height="76" rx="6" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.4"/>
    <text x="320" y="116" font-size="13" text-anchor="middle" fill="#1a2b3a">CSI-2 RX</text>
    <text x="320" y="136" font-size="13" text-anchor="middle" fill="#1a2b3a">VC / DT 解析</text>
    <text x="320" y="156" font-size="13" text-anchor="middle" fill="#5a6b7b">ECC + CRC</text>

    <path d="M376,128 L422,128" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M414,123 L422,128 L414,133" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="428" y="90" width="100" height="76" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.4"/>
    <text x="478" y="116" font-size="13" text-anchor="middle" fill="#1a2b3a">ISP</text>
    <text x="478" y="136" font-size="13" text-anchor="middle" fill="#1a2b3a">去马赛克</text>
    <text x="478" y="156" font-size="13" text-anchor="middle" fill="#5a6b7b">3A 统计</text>

    <path d="M528,128 L574,128" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M566,123 L574,128 L566,133" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="580" y="90" width="100" height="76" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.4"/>
    <text x="630" y="116" font-size="13" text-anchor="middle" fill="#1a2b3a">/dev/video0</text>
    <text x="630" y="136" font-size="13" text-anchor="middle" fill="#1a2b3a">V4L2</text>
    <text x="630" y="156" font-size="13" text-anchor="middle" fill="#5a6b7b">DMA 出帧</text>

    <path d="M478,166 L478,190 L74,190 L74,166" fill="none" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="5 3"/>
    <path d="M70,172 L74,166 L78,172" fill="none" stroke="#b03a2e" stroke-width="1.6"/>
    <text x="240" y="184" font-size="13" fill="#8a2a20">AE / AWB 反馈经 I2C 回到 sensor</text>

    <text x="24" y="218" font-size="14" font-weight="700" fill="#1a2b3a">CSI-2 包：短包 8 B；长包 4 B 头 + N B 数据 + 2 B CRC</text>
    <rect x="24" y="226" width="300" height="30" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.2"/>
    <text x="174" y="246" font-size="13" text-anchor="middle" fill="#1a2b3a">包头 4 B：VC 2 + DT 6 + WC 16 + ECC 8</text>
    <rect x="328" y="226" width="220" height="30" fill="#f7f9fb" stroke="#8fa8c0" stroke-width="1.2"/>
    <text x="438" y="246" font-size="13" text-anchor="middle" fill="#1a2b3a">载荷 4 B：FS / FE / LS / LE</text>
    <text x="560" y="246" font-size="13" fill="#5a6b7b">短包标记帧与行边界</text>

    <rect x="24" y="262" width="90" height="30" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.2"/>
    <text x="69" y="282" font-size="13" text-anchor="middle" fill="#1a2b3a">包头 4 B</text>
    <rect x="118" y="262" width="330" height="30" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.2"/>
    <text x="283" y="282" font-size="13" text-anchor="middle" fill="#1a2b3a">图像数据 N B（WC × 2 字节）</text>
    <rect x="452" y="262" width="80" height="30" fill="#f7f9fb" stroke="#8fa8c0" stroke-width="1.2"/>
    <text x="492" y="282" font-size="13" text-anchor="middle" fill="#1a2b3a">CRC 2 B</text>
    <text x="560" y="282" font-size="13" fill="#5a6b7b">长包承载一行像素</text>

    <text x="24" y="312" font-size="13" fill="#8a4a1f">RAW10 每 4 像素 5 B；1080p 一行 2400 B，开销 6 B，效率 99.75%</text>

    <text x="24" y="336" font-size="14" font-weight="700" fill="#1a2b3a">端到端延迟 82.7 ms 的拆解</text>
    <text x="96" y="354" font-size="13" text-anchor="middle" fill="#5a6b7b">曝光</text>
    <text x="311" y="354" font-size="13" text-anchor="middle" fill="#5a6b7b">读出</text>
    <text x="480" y="354" font-size="13" text-anchor="middle" fill="#5a6b7b">ISP</text>
    <text x="549" y="354" font-size="13" text-anchor="middle" fill="#5a6b7b">编码</text>
    <text x="664" y="354" font-size="13" text-anchor="middle" fill="#5a6b7b">显示</text>

    <rect x="24" y="360" width="143.8" height="30" fill="#1a4f8b"/>
    <rect x="167.8" y="360" width="286.8" height="30" fill="#3a6ea5"/>
    <rect x="454.6" y="360" width="51.7" height="30" fill="#8fa8c0"/>
    <rect x="506.3" y="360" width="86.1" height="30" fill="#b5642e"/>
    <rect x="592.4" y="360" width="143.8" height="30" fill="#4f9e63"/>
    <text x="96" y="380" font-size="13" text-anchor="middle" fill="#ffffff">16.7 ms</text>
    <text x="311" y="380" font-size="13" text-anchor="middle" fill="#ffffff">33.3 ms</text>
    <text x="480" y="380" font-size="13" text-anchor="middle" fill="#ffffff">6</text>
    <text x="549" y="380" font-size="13" text-anchor="middle" fill="#ffffff">10 ms</text>
    <text x="664" y="380" font-size="13" text-anchor="middle" fill="#ffffff">16.7 ms</text>

    <text x="24" y="412" font-size="13" fill="#1a2b3a">读出接近一帧，是延迟主因；显示从 2 帧减到 1 帧可省 16.7 ms</text>
    <text x="24" y="432" font-size="13" fill="#1a2b3a">AE 每帧调 1 档：log2(33.3 / 1) = 5.06，6 帧收敛，30 fps 下 200 ms</text>
  </g>
</svg>
