<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>PCIe 三层开销与 LTSSM、USB 微帧预算与枚举</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">PCIe 与 USB 主机：字节账、状态机与微帧预算</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">PCIe 看链路训练与 TLP 开销；USB 看周期预算与枚举握手</text>

    <text x="24" y="78" font-size="14" font-weight="700" fill="#1a2b3a">PCIe：一次 256 B 写，线上是 290 B</text>
    <rect x="24" y="86" width="406" height="28" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="32" y="105" font-size="13" fill="#1a2b3a">事务层：TLP 头 16 B + 载荷 256 B = 272 B</text>
    <rect x="24" y="118" width="406" height="28" rx="3" fill="#dce9f5" stroke="#8fa8c0"/>
    <text x="32" y="137" font-size="13" fill="#1a2b3a">数据链路层：序号 2 B + LCRC 4 B + ACK 8 B = 14 B</text>
    <rect x="24" y="150" width="406" height="28" rx="3" fill="#c9dcef" stroke="#8fa8c0"/>
    <text x="32" y="169" font-size="13" fill="#1a2b3a">物理层：STP 4 B；编码开销已含在 GT/s 里，不重复折算</text>
    <text x="24" y="194" font-size="13" fill="#8a4a1f">290 B ÷ 256 B → 效率 88.3%，Gen3 x4 上有效 3476.7 MB/s</text>

    <text x="24" y="222" font-size="14" font-weight="700" fill="#1a2b3a">TLP 效率：载荷越小，固定开销占比越高</text>
    <text x="24" y="249" font-size="13" fill="#1a2b3a">4 B</text>
    <rect x="96" y="238" width="25" height="14" fill="#1a4f8b"/>
    <text x="344" y="250" font-size="13" fill="#1a2b3a">10.5%</text>
    <text x="24" y="275" font-size="13" fill="#1a2b3a">64 B</text>
    <rect x="96" y="264" width="157" height="14" fill="#3a6ea5"/>
    <text x="344" y="276" font-size="13" fill="#1a2b3a">65.3%</text>
    <text x="24" y="301" font-size="13" fill="#1a2b3a">256 B</text>
    <rect x="96" y="290" width="212" height="14" fill="#3a6ea5"/>
    <text x="344" y="302" font-size="13" fill="#1a2b3a">88.3%</text>
    <text x="24" y="327" font-size="13" fill="#1a2b3a">1 KiB</text>
    <rect x="96" y="316" width="232" height="14" fill="#8a4a1f"/>
    <text x="344" y="328" font-size="13" fill="#1a2b3a">96.8%</text>
    <line x1="96" y1="232" x2="96" y2="334" stroke="#8fa8c0" stroke-width="1"/>
    <line x1="336" y1="232" x2="336" y2="334" stroke="#8fa8c0" stroke-width="1"/>

    <text x="24" y="356" font-size="14" font-weight="700" fill="#1a2b3a">LTSSM：卡在哪个状态，决定查哪一层</text>
    <rect x="24" y="364" width="90" height="28" rx="3" fill="#1a4f8b"/>
    <text x="69" y="383" font-size="13" text-anchor="middle" fill="#ffffff">Detect</text>
    <rect x="122" y="364" width="90" height="28" rx="3" fill="#3a6ea5"/>
    <text x="167" y="383" font-size="13" text-anchor="middle" fill="#ffffff">Polling</text>
    <rect x="220" y="364" width="90" height="28" rx="3" fill="#5b8bbd"/>
    <text x="265" y="383" font-size="13" text-anchor="middle" fill="#ffffff">Config</text>
    <rect x="318" y="364" width="90" height="28" rx="3" fill="#b5642e"/>
    <text x="363" y="383" font-size="13" text-anchor="middle" fill="#ffffff">L0</text>
    <path d="M116,378 L120,378 M120,375 L122,378 L120,381 Z" fill="#1a2b3a"/>
    <path d="M214,378 L218,378 M218,375 L220,378 L218,381 Z" fill="#1a2b3a"/>
    <path d="M312,378 L316,378 M316,375 L318,378 L316,381 Z" fill="#1a2b3a"/>
    <text x="24" y="412" font-size="13" fill="#1a2b3a">Detect 停住查电源与时钟；Config 停住查 num-lanes</text>
    <text x="24" y="430" font-size="13" fill="#8a4a1f">Polling 停住查频偏与去加重；训练失败不会自动重试</text>

    <line x1="446" y1="70" x2="446" y2="424" stroke="#d5dde5" stroke-width="1"/>

    <text x="460" y="78" font-size="14" font-weight="700" fill="#1a2b3a">USB：每 125 微秒的 7500 B 怎么分</text>
    <rect x="460" y="88" width="115" height="34" fill="#1a4f8b"/>
    <rect x="575" y="88" width="8" height="34" fill="#3a6ea5"/>
    <rect x="583" y="88" width="102" height="34" fill="#8fa8c0"/>
    <rect x="685" y="88" width="51" height="34" fill="#d5dde5"/>
    <text x="466" y="110" font-size="13" fill="#ffffff">UVC 3072</text>
    <text x="590" y="110" font-size="13" fill="#1a2b3a">未用 2725</text>
    <text x="689" y="110" font-size="13" fill="#1a2b3a">20%</text>
    <text x="460" y="142" font-size="13" fill="#5a6b7b">深色为等时与中断，浅色为周期预算剩余</text>
    <text x="460" y="164" font-size="13" fill="#1a2b3a">周期预算 6000 B；已用 3275 B = 54.6%</text>
    <text x="460" y="184" font-size="13" fill="#1a2b3a">批量可用 4225 B/微帧 = 33.8 MB/s</text>
    <text x="460" y="206" font-size="13" fill="#8a4a1f">等时上限 1024×3 ÷ 125 微秒 = 24.576 MB/s</text>

    <text x="460" y="234" font-size="14" font-weight="700" fill="#1a2b3a">枚举四步：错在哪一步，报错就长什么样</text>
    <text x="460" y="256" font-size="13" fill="#1a2b3a">1 检测上拉，复位至少 10 ms</text>
    <text x="460" y="276" font-size="13" fill="#1a2b3a">2 读 8 B 描述符，取 bMaxPacketSize0</text>
    <text x="460" y="296" font-size="13" fill="#1a2b3a">3 SET_ADDRESS，再读 18 B 描述符</text>
    <text x="460" y="316" font-size="13" fill="#1a2b3a">4 SET_CONFIGURATION，然后 probe</text>

    <text x="460" y="344" font-size="14" font-weight="700" fill="#1a2b3a">两条硬约束</text>
    <text x="460" y="366" font-size="13" fill="#1a2b3a">PCIe x1：Gen3 984.6 MB/s，Gen2 500</text>
    <text x="460" y="386" font-size="13" fill="#1a2b3a">USB3 Gen1：500 MB/s 原始，按 400 可用</text>
    <text x="460" y="406" font-size="13" fill="#8a4a1f">识别不到：先量 VBUS 跌落，再量差分对</text>
    <text x="460" y="426" font-size="13" fill="#5a6b7b">MSI-X 表在 BAR 里，每向量可独立掩码</text>
  </g>
</svg>
