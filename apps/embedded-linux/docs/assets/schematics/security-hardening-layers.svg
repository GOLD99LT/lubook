<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>安全加固：信任链、攻击面收敛与 CVE 修复窗口</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">安全加固：信任链、攻击面收敛与修复窗口</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">每一级都要验证下一级；每砍掉一个入口，暴露面按比例下降</text>

    <text x="24" y="76" font-size="14" font-weight="700" fill="#1a2b3a">启动信任链：根在熔丝，逐级验签，最后锁住 rootfs</text>

    <rect x="24" y="84" width="134" height="58" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.4"/>
    <text x="91" y="108" font-size="13" text-anchor="middle" fill="#1a2b3a">熔丝 / BootROM</text>
    <text x="91" y="128" font-size="13" text-anchor="middle" fill="#5a6b7b">公钥哈希写死</text>

    <path d="M158,113 L168,113" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M163,109 L169,113 L163,117" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="168" y="84" width="134" height="58" rx="6" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.4"/>
    <text x="235" y="108" font-size="13" text-anchor="middle" fill="#1a2b3a">签名引导</text>
    <text x="235" y="128" font-size="13" text-anchor="middle" fill="#5a6b7b">BL1 / BL2 / U-Boot</text>

    <path d="M302,113 L312,113" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M307,109 L313,113 L307,117" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="312" y="84" width="134" height="58" rx="6" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.4"/>
    <text x="379" y="108" font-size="13" text-anchor="middle" fill="#1a2b3a">内核 + 设备树</text>
    <text x="379" y="128" font-size="13" text-anchor="middle" fill="#5a6b7b">FIT 签名校验</text>

    <path d="M446,113 L456,113" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M451,109 L457,113 L451,117" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="456" y="84" width="134" height="58" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.4"/>
    <text x="523" y="108" font-size="13" text-anchor="middle" fill="#1a2b3a">rootfs</text>
    <text x="523" y="128" font-size="13" text-anchor="middle" fill="#5a6b7b">dm-verity 逐块校验</text>

    <path d="M590,113 L600,113" fill="none" stroke="#2b3a4a" stroke-width="2"/>
    <path d="M595,109 L601,113 L595,117" fill="none" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="600" y="84" width="134" height="58" rx="6" fill="#eef4fa" stroke="#3a6ea5" stroke-width="1.4"/>
    <text x="667" y="108" font-size="13" text-anchor="middle" fill="#1a2b3a">应用</text>
    <text x="667" y="128" font-size="13" text-anchor="middle" fill="#5a6b7b">SELinux + seccomp</text>

    <text x="24" y="160" font-size="13" fill="#8a4a1f">根哈希随内核一起签名：验签通过才挂载，校验失败返回 EIO 而不是降级运行</text>

    <text x="24" y="184" font-size="14" font-weight="700" fill="#1a2b3a">攻击面收敛：三层入口各砍掉八成以上</text>

    <text x="24" y="203" font-size="13" fill="#1a2b3a">capabilities</text>
    <rect x="200" y="190" width="400" height="18" fill="#e3ecf5" stroke="#8fa8c0" stroke-width="1"/>
    <rect x="200" y="190" width="29" height="18" fill="#b03a2e"/>
    <text x="612" y="203" font-size="13" fill="#1a2b3a">41 个留 3 个，削减 92.7%</text>

    <text x="24" y="229" font-size="13" fill="#1a2b3a">系统调用</text>
    <rect x="200" y="216" width="400" height="18" fill="#e3ecf5" stroke="#8fa8c0" stroke-width="1"/>
    <rect x="200" y="216" width="69" height="18" fill="#b03a2e"/>
    <text x="612" y="229" font-size="13" fill="#1a2b3a">350 个留 60 个，削减 82.9%</text>

    <text x="24" y="255" font-size="13" fill="#1a2b3a">监听端口</text>
    <rect x="200" y="242" width="400" height="18" fill="#e3ecf5" stroke="#8fa8c0" stroke-width="1"/>
    <rect x="200" y="242" width="67" height="18" fill="#b03a2e"/>
    <text x="612" y="255" font-size="13" fill="#1a2b3a">12 个留 2 个，削减 83.3%</text>

    <text x="24" y="290" font-size="14" font-weight="700" fill="#1a2b3a">CVE 修复窗口：从公开到设备装上补丁，平均 110 天</text>

    <text x="60" y="316" font-size="13" text-anchor="middle" fill="#1a2b3a">T0 公开</text>
    <text x="167" y="316" font-size="13" text-anchor="middle" fill="#1a2b3a">上游修复</text>
    <text x="407" y="316" font-size="13" text-anchor="middle" fill="#1a2b3a">厂商适配</text>
    <text x="647" y="316" font-size="13" text-anchor="middle" fill="#8a2a20">设备修复</text>

    <line x1="60" y1="328" x2="700" y2="328" stroke="#2b3a4a" stroke-width="2"/>
    <circle cx="60" cy="328" r="4" fill="#b03a2e"/>
    <circle cx="167" cy="328" r="4" fill="#b5642e"/>
    <circle cx="407" cy="328" r="4" fill="#b5642e"/>
    <circle cx="647" cy="328" r="4" fill="#8a2a20"/>

    <text x="113" y="348" font-size="13" text-anchor="middle" fill="#5a6b7b">+20 天</text>
    <text x="287" y="348" font-size="13" text-anchor="middle" fill="#5a6b7b">+45 天</text>
    <text x="527" y="348" font-size="13" text-anchor="middle" fill="#5a6b7b">+45 天（季度发布取中位）</text>

    <text x="24" y="376" font-size="13" fill="#1a2b3a">窗口压到 60 天，暴露量降到 55%；20000 台设备、单台单日被利用概率 十万分之一，期望沦陷 22 台</text>
    <text x="24" y="396" font-size="13" fill="#1a2b3a">dm-verity：1 GiB rootfs 的哈希树占 8.06 MiB，开销 0.79%；全量校验 1 GiB 需 1.28 s（按 800 MB/s）</text>
    <text x="24" y="416" font-size="13" fill="#1a2b3a">签名链 5 级：RSA-2048 每级 1 ms 共 5 ms；ECDSA P-256 每级 2 ms 共 10 ms</text>
    <text x="24" y="436" font-size="13" fill="#5a6b7b">只读 rootfs 加 A/B：512 MiB 两槽占 4 GiB 的 25%；日志进 tmpfs，2 KiB/s 时 128 MiB 只够 18 小时</text>
  </g>
</svg>
