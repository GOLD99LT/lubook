    <text x="40" y="348" font-size="13" fill="#1a2b3a">上限侧 102 ppm</text>
    <text x="264" y="244" font-size="13" font-weight="700" fill="#1a2b3a">μ = 1.800 V，Cpk = 1.43</text>
    <line x1="264" y1="308" x2="440" y2="308" stroke="#8fa8c0" stroke-width="1"/>
    <line x1="272.8" y1="248" x2="272.8" y2="308" stroke="#b5642e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="272.8" y="326" font-size="13" text-anchor="middle" fill="#8a4a1f">1.71</text>
    <line x1="431.2" y1="248" x2="431.2" y2="308" stroke="#b5642e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="431.2" y="326" font-size="13" text-anchor="middle" fill="#8a4a1f">1.89</text>
    <polyline points="264.0,308.0 266.2,308.0 268.4,308.0 270.6,308.0 272.8,308.0 275.0,308.0 277.2,308.0 279.4,308.0 281.6,308.0 283.8,307.9 286.0,307.9 288.2,307.8 290.4,307.8 292.6,307.7 294.8,307.5 297.0,307.3 299.2,307.0 301.4,306.6 303.6,306.1 305.8,305.4 308.0,304.5 310.2,303.4 312.4,302.0 314.6,300.3 316.8,298.2 319.0,295.8 321.2,293.0 323.4,289.9 325.6,286.4 327.8,282.5 330.0,278.5 332.2,274.2 334.4,269.9 336.6,265.6 338.8,261.5 341.0,257.7 343.2,254.4 345.4,251.7 347.6,249.7 349.8,248.4 352.0,248.0 354.2,248.4 356.4,249.7 358.6,251.7 360.8,254.4 363.0,257.7 365.2,261.5 367.4,265.6 369.6,269.9 371.8,274.2 374.0,278.5 376.2,282.5 378.4,286.4 380.6,289.9 382.8,293.0 385.0,295.8 387.2,298.2 389.4,300.3 391.6,302.0 393.8,303.4 396.0,304.5 398.2,305.4 400.4,306.1 402.6,306.6 404.8,307.0 407.0,307.3 409.2,307.5 411.4,307.7 413.6,307.8 415.8,307.8 418.0,307.9 420.2,307.9 422.4,308.0 424.6,308.0 426.8,308.0 429.0,308.0 431.2,308.0 433.4,308.0 435.6,308.0 437.8,308.0 440.0,308.0" fill="none" stroke="#b5642e" stroke-width="2"/>
    <text x="264" y="348" font-size="13" fill="#1a2b3a">上限侧 18 ppm</text>
    <text x="486" y="266" font-size="13" fill="#3a6ea5">Cp 都是 1.43</text>
    <text x="486" y="288" font-size="13" fill="#3a6ea5">差别只在中心</text>
    <text x="486" y="316" font-size="13" fill="#5a6b7b">护栏 24 mV 会把</text>
    <text x="486" y="338" font-size="13" fill="#5a6b7b">拒收推到 0.84%</text>
    <text x="24" y="372" font-size="14" font-weight="700" fill="#1a2b3a">追溯链：批量失效要在 10 分钟内定位到共因</text>
    <rect x="24" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="79" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">SN 与工位</text>
    <rect x="143" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="198" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">程序版本</text>
    <rect x="262" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="317" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">夹具编号</text>
    <rect x="381" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="436" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">原始测量</text>
    <rect x="500" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="555" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">校准 CRC</text>
    <rect x="619" y="380" width="110" height="32" rx="3" fill="#eef4fa" stroke="#8fa8c0"/>
    <text x="674" y="401" font-size="13" text-anchor="middle" fill="#1a2b3a">MES 归档</text>
    <text x="24" y="432" font-size="13" fill="#8a4a1f">只存 PASS/FAIL 的日志，事后既算不出 Cpk，也看不出漂移</text>
  </g>
</svg>
