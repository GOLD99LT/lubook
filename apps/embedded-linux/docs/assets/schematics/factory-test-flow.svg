<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>测试项时间分配、Cpk 分布与规格限、追溯链</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">产线测试：183 秒节拍、Cpk 余量与追溯链</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">节拍决定工位数，Cpk 决定护栏，追溯决定能不能归因</text>
    <text x="24" y="78" font-size="14" font-weight="700" fill="#1a2b3a">单台 CT = 183 s：射频一项占 47.5%</text>
    <rect x="24" y="88" width="26.8" height="34" fill="#c9d2da"/>
    <text x="30.4" y="110" font-size="13" fill="#1a2b3a">11</text>
    <rect x="50.8" y="88" width="46.3" height="34" fill="#1a4f8b"/>
    <text x="74.0" y="110" font-size="13" text-anchor="middle" fill="#ffffff">电源 19</text>
    <rect x="97.1" y="88" width="97.5" height="34" fill="#3a6ea5"/>
    <text x="145.9" y="110" font-size="13" text-anchor="middle" fill="#ffffff">存储 40</text>
    <rect x="194.6" y="88" width="46.3" height="34" fill="#5b8bbd"/>
    <text x="217.8" y="110" font-size="13" text-anchor="middle" fill="#ffffff">接口 19</text>
    <rect x="240.9" y="88" width="212.0" height="34" fill="#b5642e"/>
    <text x="346.9" y="110" font-size="13" text-anchor="middle" fill="#ffffff">射频 87</text>
    <rect x="452.9" y="88" width="17.1" height="34" fill="#d5dde5"/>
    <text x="24" y="140" font-size="13" fill="#5a6b7b">灰为上下料 11 s 与校准写入 7 s；射频含 WiFi 35 s、BT 12 s、RF 40 s</text>
    <text x="24" y="160" font-size="13" fill="#1a2b3a">takt = 1.2672e6 s ÷ 50000 = 25.34 s → N = ceil(183 / 25.34) = 8 个工位</text>
    <text x="24" y="180" font-size="13" fill="#1a2b3a">8 × 18.10 UPH = 144.8 UPH → 16 h × 22 d 月产 5.10 万台，余量 1.9%</text>
    <text x="24" y="202" font-size="13" fill="#8a4a1f">整线产能等于瓶颈工位产能，优化非瓶颈是白花钱</text>
    <text x="24" y="224" font-size="14" font-weight="700" fill="#1a2b3a">Cpk：中心偏移 12 mV，不合格率相差 5.6 倍</text>
    <text x="40" y="244" font-size="13" font-weight="700" fill="#1a2b3a">μ = 1.812 V，Cpk = 1.24</text>
    <line x1="40" y1="308" x2="216" y2="308" stroke="#8fa8c0" stroke-width="1"/>
    <line x1="48.8" y1="248" x2="48.8" y2="308" stroke="#b5642e" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="48.8" y="326" font-size="13" text-anchor="middle" fill="#8a4a1f">1.71</text>
