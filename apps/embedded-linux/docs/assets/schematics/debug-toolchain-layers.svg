<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>调试工具链：目标端采集、主机端分析与运行时开销谱</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">调试工具链：目标端采集，主机端分析</text>
  <text x="24" y="52" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">按问题选工具；运行时开销决定它能不能出现在生产环境</text>

  <rect x="24" y="72" width="320" height="250" rx="9" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="40" y="96" font-size="15" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">目标板（ARM）</text>

  <rect x="40" y="108" width="288" height="48" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.5"/>
  <text x="184" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">应用 + gdbserver</text>
  <text x="184" y="147" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">断点、线程、内存</text>

  <rect x="40" y="166" width="288" height="48" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.5"/>
  <text x="184" y="186" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">动态库 / sysroot</text>
  <text x="184" y="205" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">符号与 build-id</text>

  <rect x="40" y="224" width="288" height="48" rx="6" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.5"/>
  <text x="184" y="244" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">内核 ftrace / perf</text>
  <text x="184" y="263" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">tracepoint、kprobe、PMU</text>

  <rect x="416" y="72" width="320" height="250" rx="9" fill="#f3f7f2" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="432" y="96" font-size="15" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">主机（x86_64）</text>

  <rect x="432" y="108" width="288" height="48" rx="6" fill="#eef4fa" stroke="#1a4f8b" stroke-width="1.5"/>
  <text x="576" y="128" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">gdb-multiarch</text>
  <text x="576" y="147" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">sysroot + solib-search-path</text>

  <rect x="432" y="166" width="288" height="48" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.5"/>
  <text x="576" y="186" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">perf report / trace-cmd</text>
  <text x="576" y="205" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">perf.data、trace.dat</text>

  <rect x="432" y="224" width="288" height="48" rx="6" fill="#f7f0f0" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="576" y="244" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">coredumpctl + gdb</text>
  <text x="576" y="263" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">build-id 符号与 core</text>

  <line x1="414" y1="132" x2="348" y2="132" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380" y="122" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">RSP</text>
  <text x="380" y="148" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">TCP 2345</text>

  <line x1="346" y1="190" x2="414" y2="190" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380" y="180" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">perf.data</text>
  <text x="380" y="208" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">trace.dat</text>

  <line x1="346" y1="248" x2="414" y2="248" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="380" y="238" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">core</text>
  <text x="380" y="266" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">journal</text>

  <text x="24" y="344" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">运行时开销（从左到右增大）</text>

  <line x1="40" y1="376" x2="722" y2="376" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="90" y1="370" x2="90" y2="382" stroke="#2b3a4a" stroke-width="1.6"/>
  <line x1="250" y1="370" x2="250" y2="382" stroke="#2b3a4a" stroke-width="1.6"/>
  <line x1="420" y1="370" x2="420" y2="382" stroke="#2b3a4a" stroke-width="1.6"/>
  <line x1="600" y1="370" x2="600" y2="382" stroke="#2b3a4a" stroke-width="1.6"/>
  <line x1="700" y1="370" x2="700" y2="382" stroke="#2b3a4a" stroke-width="1.6"/>

  <text x="90" y="396" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">core 0（事后）</text>
  <text x="250" y="396" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">ftrace 1–5%</text>
  <text x="420" y="396" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">perf 1–10%</text>
  <text x="600" y="396" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">strace 15–100%</text>
  <text x="700" y="396" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">gdb 暂停</text>

  <text x="24" y="416" font-size="13" fill="#2b3a4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">CPU：1.2 GHz × 2.24 = 2,688 DMIPS；6% 占用 = 72 MHz = 161 DMIPS</text>
  <text x="24" y="432" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">core 35.6 MiB → zstd 11.1 MiB；ftrace 4 MiB/CPU × 4 = 16 MiB，15k 事件/s 约 14 s 窗口</text>
</svg>
