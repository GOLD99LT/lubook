<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>看门狗复位链、恢复时间预算与日志写入链</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">看门狗复位链与日志写入链：两条都需要预算</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">上：三级喂狗到硬件计数器的复位路径；中：33.8 s 恢复预算；下：journald 落盘、配额与寿命</text>

    <rect x="24" y="76" width="124" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="34" y="96" font-size="14" font-weight="700" fill="#1a2b3a">应用心跳</text>
    <text x="34" y="113" font-size="13" fill="#2b3a4a">sd_notify 1 Hz</text>

    <line x1="148" y1="98" x2="168" y2="98" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="170" y="76" width="124" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="180" y="96" font-size="14" font-weight="700" fill="#1a2b3a">systemd</text>
    <text x="180" y="113" font-size="13" fill="#2b3a4a">W=10 s，5 s 一次</text>

    <line x1="294" y1="98" x2="314" y2="98" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="316" y="76" width="124" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="326" y="96" font-size="14" font-weight="700" fill="#1a2b3a">watchdog 核心</text>
    <text x="326" y="113" font-size="13" fill="#2b3a4a">/dev/watchdog</text>

    <line x1="440" y1="98" x2="460" y2="98" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="462" y="76" width="124" height="44" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.6"/>
    <text x="472" y="96" font-size="14" font-weight="700" fill="#1a2b3a">硬件计数器</text>
    <text x="472" y="113" font-size="13" fill="#2b3a4a">4096 Hz，40960</text>

    <line x1="586" y1="98" x2="606" y2="98" stroke="#b03a2e" stroke-width="2" stroke-dasharray="6 4"/>

    <rect x="608" y="76" width="124" height="44" rx="6" fill="#f7e9e7" stroke="#b03a2e" stroke-width="1.6"/>
    <text x="618" y="96" font-size="14" font-weight="700" fill="#8a2a20">复位 + 启动</text>
    <text x="618" y="113" font-size="13" fill="#8a2a20">1.8 + 22 s</text>

    <text x="24" y="144" font-size="14" font-weight="700" fill="#1a2b3a">恢复预算：检测 10 s + 复位 1.8 s + 启动 22 s = 33.8 s，SLA 60 s</text>

    <rect x="24" y="156" width="207" height="30" fill="#b5642e" stroke="#ffffff" stroke-width="1"/>
    <rect x="231" y="156" width="37" height="30" fill="#6b7f95" stroke="#ffffff" stroke-width="1"/>
    <rect x="268" y="156" width="456" height="30" fill="#1a4f8b" stroke="#ffffff" stroke-width="1"/>
    <text x="127" y="176" font-size="13" text-anchor="middle" fill="#ffffff">检测 10 s</text>
    <text x="249" y="176" font-size="13" text-anchor="middle" fill="#ffffff">1.8</text>
    <text x="496" y="176" font-size="13" text-anchor="middle" fill="#ffffff">启动到服务可用 22 s</text>
    <text x="24" y="204" font-size="13" fill="#4f9e63">余量 26.2 s；若应用初始化再占 3 s，端到端 36.8 s，余量 23.2 s</text>

    <text x="24" y="232" font-size="14" font-weight="700" fill="#1a2b3a">日志链：内核环形缓冲 → journald → 持久化目录 → 轮转与限流</text>

    <rect x="24" y="242" width="158" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="34" y="262" font-size="14" font-weight="700" fill="#1a2b3a">内核 printk</text>
    <text x="34" y="279" font-size="13" fill="#2b3a4a">/dev/kmsg + 环形缓冲</text>

    <line x1="182" y1="264" x2="202" y2="264" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="206" y="242" width="158" height="44" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.6"/>
    <text x="216" y="262" font-size="14" font-weight="700" fill="#1a2b3a">systemd-journald</text>
    <text x="216" y="279" font-size="13" fill="#2b3a4a">批量写 + 限流</text>

    <line x1="364" y1="264" x2="384" y2="264" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="388" y="242" width="158" height="44" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.6"/>
    <text x="398" y="262" font-size="14" font-weight="700" fill="#1a2b3a">/var/log/journal</text>
    <text x="398" y="279" font-size="13" fill="#2b3a4a">128 MiB 配额</text>

    <line x1="546" y1="264" x2="566" y2="264" stroke="#2b3a4a" stroke-width="2"/>

    <rect x="570" y="242" width="158" height="44" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.6"/>
    <text x="580" y="262" font-size="14" font-weight="700" fill="#1a2b3a">轮转与压缩</text>
    <text x="580" y="279" font-size="13" fill="#2b3a4a">7 天，压缩 2.5 倍</text>

    <line x1="24" y1="304" x2="736" y2="304" stroke="#c9d2da" stroke-width="1.2"/>

    <text x="24" y="326" font-size="13" fill="#1a2b3a">journald：180 B × 3 条/s = 540 B/s = 1.854 MiB/h；64 MiB 只够 34.5 h</text>
    <text x="24" y="348" font-size="13" fill="#1a2b3a">7 天需 311.5 MiB，压缩 2.5 倍后 124.6 MiB；限流 500 条/30 s 防打印风暴</text>
    <text x="24" y="370" font-size="13" fill="#1a2b3a">eMMC：8760 h × 1.854 MiB/h = 15.86 GiB/年；5 年 × 写放大 2 = 158.6 GiB，占 3 TB 的 5.3%</text>
    <text x="24" y="392" font-size="13" fill="#8a4a1f">掉电保持：2 W × 120 ms = 0.24 J；C = 2E / (5.0² − 3.3²) = 34 mF，检测点要在电容之后</text>
    <text x="24" y="414" font-size="13" fill="#4f9e63">误复位余量：M = 10 − 3 − 0.2 = 6.8 s；SLA 按最坏检测 10 s 算，不按平均 5 s</text>
  </g>
</svg>
