<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>交叉编译工具链数据流：源码经预处理、编译、汇编、链接生成目标 ELF，sysroot 提供目标头文件与库</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
    <marker id="arB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a4f8b"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f9e63"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">交叉编译数据流：从源码到目标 ELF</text>
  <text x="24" y="52" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">构建主机完成编译与链接；目标板只负责加载与运行，两侧由 sysroot 约定共享同一套 ABI</text>

  <rect x="16" y="66" width="552" height="348" rx="10" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="32" y="90" font-size="14" font-weight="700" fill="#1a4f8b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">构建主机 host（x86_64）</text>

  <rect x="580" y="66" width="164" height="348" rx="10" fill="#f3f7f2" stroke="#8fb89a" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="594" y="90" font-size="14" font-weight="700" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">目标板 target</text>
  <text x="594" y="110" font-size="13" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">ARMv7 + VFPv4</text>

  <rect x="32" y="102" width="112" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="88" y="125" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">源码 .c / .S</text>
  <text x="88" y="144" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">多个翻译单元</text>

  <line x1="144" y1="128" x2="174" y2="128" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="180" y="102" width="112" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="236" y="125" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">cpp 预处理</text>
  <text x="236" y="144" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">展开头文件</text>

  <line x1="292" y1="128" x2="322" y2="128" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="328" y="102" width="112" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="384" y="125" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">cc1 编译</text>
  <text x="384" y="144" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">-march 决定目标</text>

  <line x1="440" y1="128" x2="470" y2="128" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="476" y="102" width="84" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="518" y="133" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">as 汇编</text>

  <line x1="518" y1="154" x2="518" y2="179" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="476" y="185" width="84" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="518" y="216" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">目标 .o</text>

  <line x1="476" y1="211" x2="418" y2="211" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="300" y="185" width="110" height="52" rx="7" fill="#eef4fa" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="355" y="208" font-size="14" text-anchor="middle" fill="#1a4f8b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">ld 链接</text>
  <text x="355" y="227" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">crt + libc + .o</text>

  <line x1="355" y1="237" x2="355" y2="278" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="300" y="285" width="110" height="52" rx="7" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="355" y="308" font-size="14" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">ELF 可执行</text>
  <text x="355" y="327" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">含 PT_INTERP</text>

  <line x1="410" y1="311" x2="586" y2="311" stroke="#4f9e63" stroke-width="2" marker-end="url(#arG)"/>
  <text x="490" y="303" font-size="13" text-anchor="middle" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">部署</text>

  <rect x="32" y="180" width="232" height="196" rx="8" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.6"/>
  <text x="48" y="204" font-size="15" font-weight="700" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">sysroot（目标根视图）</text>
  <text x="48" y="230" font-size="13" fill="#5a4a3a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">usr/include/stdio.h</text>
  <text x="48" y="253" font-size="13" fill="#5a4a3a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">usr/lib/libc.so.6</text>
  <text x="48" y="276" font-size="13" fill="#5a4a3a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">usr/lib/crt1.o crti.o</text>
  <text x="48" y="299" font-size="13" fill="#5a4a3a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">lib/ld-linux-armhf.so.3</text>
  <text x="48" y="322" font-size="13" fill="#5a4a3a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">usr/lib/libc.a</text>
  <text x="48" y="345" font-size="13" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">同一份 sysroot 同时供头文件与库</text>
  <text x="48" y="364" font-size="13" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">版本必须与目标机 rootfs 同源</text>

  <line x1="200" y1="180" x2="200" y2="158" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arB)"/>

  <line x1="264" y1="211" x2="294" y2="211" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arB)"/>

  <text x="594" y="158" font-size="13" font-weight="700" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">rootfs 需包含：</text>
  <text x="594" y="182" font-size="13" fill="#3d6b4a" font-family="'DejaVu Sans Mono','Noto Sans SC',monospace">libc.so.6</text>
  <text x="594" y="204" font-size="13" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">ld-linux-armhf.so.3</text>
  <text x="594" y="226" font-size="13" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">VFP 支持</text>

  <rect x="592" y="285" width="140" height="56" rx="7" fill="#ffffff" stroke="#4f9e63" stroke-width="1.6"/>
  <text x="662" y="308" font-size="13" text-anchor="middle" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">内核 execve 加载</text>
  <text x="662" y="327" font-size="13" text-anchor="middle" fill="#3d6b4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">解释器 + 共享库</text>

  <text x="32" y="404" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">实线：编译与链接数据流　　虚线：sysroot 注入的头文件与库　　-march / -mfpu 决定指令集，三元组决定 ABI</text>
</svg>
