<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>设备树从 DTS 到 DTB 的编译交接，以及 compatible 匹配与 probe 资源门禁</title>
  <desc>上半部分是 DTS 与 DTSI 经 DTC 编译为 DTB，再由 U-Boot 交给内核解析的流程；下半部分是设备节点与驱动匹配表比较并进入 probe 的两道门。</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="dt-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="20" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">设备树：从源文件到驱动 probe</text>
  <text x="24" y="50" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">dtc 只保证结构合法；内核先按 compatible 匹配，再按资源门禁决定 probe 能否完成</text>

  <rect x="16" y="64" width="728" height="106" rx="8" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.3"/>
  <text x="28" y="84" font-size="13" font-weight="700" fill="#1a4f8b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">① 编译与交接</text>

  <rect x="28" y="92" width="126" height="66" rx="7" fill="#eef4fa" stroke="#1a4f8b" stroke-width="1.5"/>
  <text x="91" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">DTS + DTSI</text>
  <text x="91" y="136" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">节点 / 属性 / 标签</text>
  <text x="91" y="152" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">dt-bindings 头文件</text>

  <line x1="154" y1="125" x2="170" y2="125" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="174" y="92" width="112" height="66" rx="7" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.5"/>
  <text x="230" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">DTC</text>
  <text x="230" y="136" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">编译 / 反编译</text>
  <text x="230" y="152" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">-@ 保留符号</text>

  <line x1="286" y1="125" x2="302" y2="125" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="306" y="92" width="126" height="66" rx="7" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.5"/>
  <text x="369" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">DTB</text>
  <text x="369" y="136" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">header / struct</text>
  <text x="369" y="152" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">strings / symbols</text>

  <line x1="432" y1="125" x2="448" y2="125" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="452" y="92" width="126" height="66" rx="7" fill="#fff8e8" stroke="#b58a2e" stroke-width="1.5"/>
  <text x="515" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">U-Boot</text>
  <text x="515" y="136" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">加载 + fixup</text>
  <text x="515" y="152" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">bootargs / memory</text>

  <line x1="578" y1="125" x2="594" y2="125" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="598" y="92" width="132" height="66" rx="7" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.5"/>
  <text x="664" y="115" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">内核解析</text>
  <text x="664" y="136" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">device_node</text>
  <text x="664" y="152" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">platform_device</text>

  <text x="24" y="200" font-size="13" font-weight="700" fill="#1a4f8b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">② 匹配与 probe：认识彼此，还要资源可用</text>

  <rect x="24" y="214" width="170" height="118" rx="8" fill="#eef4fa" stroke="#1a4f8b" stroke-width="1.5"/>
  <text x="36" y="237" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">设备节点</text>
  <text x="36" y="259" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">compatible 列表</text>
  <text x="36" y="279" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">status / reg</text>
  <text x="36" y="299" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">interrupts / clocks</text>
  <text x="36" y="319" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">gpios / pinctrl</text>

  <line x1="194" y1="273" x2="210" y2="273" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="214" y="214" width="180" height="118" rx="8" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.5"/>
  <text x="226" y="237" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">platform 总线匹配</text>
  <text x="226" y="259" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">逐字符串比较</text>
  <text x="226" y="279" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">of_match_table</text>
  <text x="226" y="299" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">命中 → 绑定 driver</text>
  <text x="226" y="319" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">未命中 → 设备无驱动</text>

  <line x1="394" y1="273" x2="410" y2="273" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="414" y="214" width="170" height="118" rx="8" fill="#fff8e8" stroke="#b58a2e" stroke-width="1.5"/>
  <text x="426" y="237" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">probe()</text>
  <text x="426" y="259" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">解析 reg / irq</text>
  <text x="426" y="279" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">获取 clock / gpio</text>
  <text x="426" y="299" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">检查 regulator</text>
  <text x="426" y="319" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">返回错误 / defer</text>

  <line x1="584" y1="273" x2="600" y2="273" stroke="#2b3a4a" stroke-width="2" marker-end="url(#dt-arrow)"/>

  <rect x="604" y="214" width="126" height="118" rx="8" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.5"/>
  <text x="667" y="237" font-size="14" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">设备可用</text>
  <text x="667" y="259" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">driver 符号链接</text>
  <text x="667" y="279" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">资源已申请</text>
  <text x="667" y="299" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">中断已注册</text>
  <text x="667" y="319" font-size="13" text-anchor="middle" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">可读写寄存器</text>

  <text x="24" y="359" font-size="13" font-weight="700" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">资源门禁：匹配只解决“认识”，probe 还要解决“能不能用”</text>

  <rect x="20" y="368" width="136" height="42" rx="6" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="88" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">status = okay</text>
  <text x="88" y="402" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">否则节点不可用</text>

  <rect x="166" y="368" width="136" height="42" rx="6" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="234" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">reg 可申请</text>
  <text x="234" y="402" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">单元数 / 地址 / 冲突</text>

  <rect x="312" y="368" width="136" height="42" rx="6" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="380" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">中断可映射</text>
  <text x="380" y="402" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">parent / cells / flag</text>

  <rect x="458" y="368" width="136" height="42" rx="6" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="526" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">clk / gpio 就绪</text>
  <text x="526" y="402" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">提供者 / 单元 / 电平</text>

  <rect x="604" y="368" width="136" height="42" rx="6" fill="#f7fafc" stroke="#9fb3c8" stroke-width="1.2"/>
  <text x="672" y="385" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">pinctrl 生效</text>
  <text x="672" y="402" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">mux / 上下拉 / 占用</text>

  <text x="24" y="431" font-size="13" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">定位顺序：读回实际 DTB → 设备是否创建 → driver 是否绑定 → probe 错误与 deferred 依赖。</text>
</svg>
