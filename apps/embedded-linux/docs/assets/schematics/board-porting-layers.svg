<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>板级移植的六层清单与温度窗口</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1a4f8b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">板级移植的六层清单：从参考板到量产</text>
  <text x="24" y="52" font-size="13" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">移植不是重写 BSP，而是把差异管住：每一层差异都有判据，每一个判据都有回归项</text>

  <rect x="22" y="66" width="196" height="60" rx="7" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.5"/>
  <text x="34" y="88" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">参考板 REF-A</text>
  <text x="34" y="106" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">DTS 1,180 行</text>
  <text x="34" y="122" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">11 个外设节点</text>

  <line x1="220" y1="96" x2="240" y2="96" stroke="#1a4f8b" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="242" y="66" width="210" height="60" rx="7" fill="#eef4fa" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="254" y="88" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">定制板 CUST-B</text>
  <text x="254" y="106" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">DTS 1,392 行</text>
  <text x="254" y="122" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">14 个外设节点</text>

  <text x="472" y="88" font-size="13" fill="#2b3a4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">覆盖 +212 行，复用 82.0%</text>
  <text x="472" y="110" font-size="13" fill="#2b3a4a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">分区合计 1,383 MiB，占 9.3%</text>

  <rect x="22" y="140" width="352" height="50" rx="6" fill="#eef4fa" stroke="#8fa8c0" stroke-width="1.4"/>
  <text x="34" y="160" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">1 设备树 diff</text>
  <text x="34" y="178" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">memory / mmc / eth / panel / gpio / irq</text>

  <rect x="386" y="140" width="352" height="50" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.4"/>
  <text x="398" y="160" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">2 defconfig 与驱动</text>
  <text x="398" y="178" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">34 行 diff，关键驱动 =y，模块 7 个</text>

  <rect x="22" y="196" width="352" height="50" rx="6" fill="#eef1f4" stroke="#6b7f95" stroke-width="1.4"/>
  <text x="34" y="216" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">3 pinctrl 与电气属性</text>
  <text x="34" y="234" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">I2C 上拉 2.2 kΩ，1.8 V 与 3.3 V 电压域</text>

  <rect x="386" y="196" width="352" height="50" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.4"/>
  <text x="398" y="216" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">4 时钟与电源域</text>
  <text x="398" y="234" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">clk_summary 全绿，-517 归零</text>

  <rect x="22" y="252" width="352" height="50" rx="6" fill="#fdf6ee" stroke="#b5642e" stroke-width="1.4"/>
  <text x="34" y="272" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">5 量产差异</text>
  <text x="34" y="290" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">2D 训练 268 ms，保存后回放 22 ms</text>

  <rect x="386" y="252" width="352" height="50" rx="6" fill="#f3f7f2" stroke="#4f9e63" stroke-width="1.4"/>
  <text x="398" y="272" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">6 回归测试</text>
  <text x="398" y="290" font-size="13" fill="#4a5a6a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">42 项，4.75 h/台，1,000 台 594 h</text>

  <text x="24" y="318" font-size="14" font-weight="700" fill="#1a2b3a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">启动成功率随温度：16 个训练单元，25 °C 训练数据</text>

  <line x1="92" y1="342" x2="700" y2="342" stroke="#b5642e" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="24" y="338" font-size="13" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">95% 门槛</text>

  <line x1="120" y1="414" x2="700" y2="414" stroke="#9fb3c8" stroke-width="1.4"/>

  <rect x="136" y="380.8" width="56" height="33.2" fill="#c0662e"/>
  <text x="164" y="374" font-size="13" text-anchor="middle" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">43.7%</text>

  <rect x="232" y="350.9" width="56" height="63.1" fill="#d9a441"/>
  <text x="260" y="344" font-size="13" text-anchor="middle" fill="#8a6a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">83.1%</text>

  <rect x="328" y="341.1" width="56" height="72.9" fill="#4f9e63"/>
  <text x="356" y="334" font-size="13" text-anchor="middle" fill="#2f6b40" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">95.9%</text>

  <rect x="424" y="339.6" width="56" height="74.4" fill="#4f9e63"/>
  <text x="452" y="333" font-size="13" text-anchor="middle" fill="#2f6b40" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">97.9%</text>

  <rect x="520" y="351.3" width="56" height="62.7" fill="#d9a441"/>
  <text x="548" y="344" font-size="13" text-anchor="middle" fill="#8a6a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">82.4%</text>

  <rect x="616" y="387.6" width="56" height="26.4" fill="#c0662e"/>
  <text x="644" y="381" font-size="13" text-anchor="middle" fill="#8a4a1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">34.7%</text>

  <text x="164" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">-40 °C</text>
  <text x="260" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">-20 °C</text>
  <text x="356" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">0 °C</text>
  <text x="452" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">25 °C</text>
  <text x="548" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">55 °C</text>
  <text x="644" y="432" font-size="13" text-anchor="middle" fill="#5a6b7b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">85 °C</text>
</svg>
