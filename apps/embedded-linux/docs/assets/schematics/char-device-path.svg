<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>字符设备一次 read 或 write 的调用路径</title>
  <desc>主路径从用户态 read 经系统调用、VFS、file_operations 到驱动与 copy_to_user，左侧标出内核对象，右侧标出 open、ioctl、poll、中断唤醒等旁路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3a4a"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6772"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <text x="24" y="32" font-size="20" font-weight="700" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">字符设备的一次读写调用路径</text>
  <text x="24" y="55" font-size="13.5" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">用户态 read/write 经系统调用与 VFS 进入 file_operations，再由 copy_to_user 返回数据</text>
  <line x1="24" y1="68" x2="736" y2="68" stroke="#e3e0d7" stroke-width="1"/>

  <text x="28" y="80" font-size="13" font-weight="700" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">内核对象</text>
  <text x="254" y="80" font-size="13" font-weight="700" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">调用路径</text>
  <text x="594" y="80" font-size="13" font-weight="700" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">旁路与事件</text>

  <!-- 主路径第 1 行 -->
  <rect x="250" y="88" width="300" height="46" rx="4" fill="#eef5fb" stroke="#1a4f8b"/>
  <text x="262" y="108" font-size="13.5" font-weight="700" fill="#1a4f8b" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">用户态 read(fd, buf, n)</text>
  <text x="262" y="126" font-size="13" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">fd 来自 open()</text>

  <rect x="24" y="88" width="190" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="34" y="108" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">fd 表 → struct file</text>
  <text x="34" y="126" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">引用计数 +1</text>

  <rect x="590" y="88" width="146" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="600" y="108" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">open()</text>
  <text x="600" y="126" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">chrdev_open</text>

  <!-- 主路径第 2 行 -->
  <rect x="250" y="148" width="300" height="46" rx="4" fill="#eef5fb" stroke="#1a4f8b"/>
  <text x="262" y="168" font-size="13.5" font-weight="700" fill="#1a4f8b" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">ksys_read() → vfs_read()</text>
  <text x="262" y="186" font-size="13" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">系统调用与 VFS 层</text>

  <rect x="24" y="148" width="190" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="34" y="168" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">dev_t = major:minor</text>
  <text x="34" y="186" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">12 位主号 + 20 位次号</text>

  <rect x="590" y="148" width="146" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="600" y="168" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">ioctl()</text>
  <text x="600" y="186" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">unlocked_ioctl</text>

  <!-- 主路径第 3 行 -->
  <rect x="250" y="208" width="300" height="46" rx="4" fill="#eef5fb" stroke="#1a4f8b"/>
  <text x="262" y="228" font-size="13.5" font-weight="700" fill="#1a4f8b" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">file-&gt;f_op-&gt;read_iter</text>
  <text x="262" y="246" font-size="13" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">demo_read()：驱动入口</text>

  <rect x="24" y="208" width="190" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="34" y="228" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">cdev → fops</text>
  <text x="34" y="246" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">注册时绑定</text>

  <rect x="590" y="208" width="146" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="600" y="228" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">poll/select</text>
  <text x="600" y="246" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">poll_wait</text>

  <!-- 主路径第 4 行 -->
  <rect x="250" y="268" width="300" height="46" rx="4" fill="#eef5fb" stroke="#1a4f8b"/>
  <text x="262" y="288" font-size="13.5" font-weight="700" fill="#1a4f8b" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">wait_event_interruptible()</text>
  <text x="262" y="306" font-size="13" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">无数据时睡眠；非阻塞返回 EAGAIN</text>

  <rect x="24" y="268" width="190" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="34" y="288" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">wait_queue_head_t</text>
  <text x="34" y="306" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">条件与锁保护</text>

  <rect x="590" y="268" width="146" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="600" y="288" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">IRQ</text>
  <text x="600" y="306" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">wake_up_...</text>

  <!-- 主路径第 5 行 -->
  <rect x="250" y="328" width="300" height="46" rx="4" fill="#eef5fb" stroke="#1a4f8b"/>
  <text x="262" y="348" font-size="13.5" font-weight="700" fill="#1a4f8b" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">copy_to_user() → 返回 n</text>
  <text x="262" y="366" font-size="13" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">失败返回 -EFAULT</text>

  <rect x="24" y="328" width="190" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="34" y="348" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">内核缓冲区</text>
  <text x="34" y="366" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">环形队列 / 双缓冲</text>

  <rect x="590" y="328" width="146" height="46" rx="4" fill="#fbfdff" stroke="#b9c6d2"/>
  <text x="600" y="348" font-size="13" fill="#222a32" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">fasync</text>
  <text x="600" y="366" font-size="13" fill="#5c6772" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">SIGIO</text>

  <!-- 左侧对象到主路径的虚线 -->
  <line x1="214" y1="111" x2="246" y2="111" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="214" y1="171" x2="246" y2="171" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="214" y1="231" x2="246" y2="231" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="214" y1="291" x2="246" y2="291" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <line x1="214" y1="351" x2="246" y2="351" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- 主路径向下箭头 -->
  <line x1="400" y1="134" x2="400" y2="144" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="400" y1="194" x2="400" y2="204" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="400" y1="254" x2="400" y2="264" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="400" y1="314" x2="400" y2="324" stroke="#2b3a4a" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 中断唤醒指向等待队列 -->
  <line x1="590" y1="291" x2="554" y2="291" stroke="#5c6772" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- 底部说明 -->
  <rect x="24" y="392" width="712" height="34" rx="4" fill="#f7f9fb" stroke="#d5dde5"/>
  <text x="36" y="414" font-size="13.5" fill="#2b3a4a" font-family="'JetBrains Mono','Noto Sans SC',sans-serif">阻塞语义：条件不满足才睡眠；被信号打断返回 -ERESTARTSYS；poll 只注册等待队列，不睡眠</text>
</svg>
