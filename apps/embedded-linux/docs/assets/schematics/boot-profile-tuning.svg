<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>启动时间六段分解、边际收益、火焰图读法与回归噪声底</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="30" font-size="19" font-weight="700" fill="#1a2b3a">性能调优：启动分解、边际收益、火焰图与回归</text>
    <text x="24" y="52" font-size="13" fill="#5a6b7b">占比决定先看哪里，边际收益决定先改哪里，噪声底决定能不能宣称有效</text>
    <text x="24" y="80" font-size="14" font-weight="700" fill="#1a2b3a">启动 8.45 s 的六段：init 与 app 合计 61.0%</text>
    <rect x="24.0" y="90" width="27.0" height="34" fill="#c9d2da"/>
    <rect x="51.0" y="90" width="15.2" height="34" fill="#8fa8c0"/>
    <rect x="66.1" y="90" width="80.0" height="34" fill="#5b8bbd"/>
    <text x="106.2" y="112" font-size="13" text-anchor="middle" fill="#ffffff">U-Boot 11.2%</text>
    <rect x="146.2" y="90" width="155.9" height="34" fill="#3a6ea5"/>
    <text x="224.1" y="112" font-size="13" text-anchor="middle" fill="#ffffff">kernel 21.9%</text>
    <rect x="302.1" y="90" width="261.2" height="34" fill="#1a4f8b"/>
    <text x="432.7" y="112" font-size="13" text-anchor="middle" fill="#ffffff">init 36.7%</text>
    <rect x="563.3" y="90" width="172.7" height="34" fill="#b5642e"/>
    <text x="649.6" y="112" font-size="13" text-anchor="middle" fill="#ffffff">app 24.3%</text>
    <line x1="24" y1="126" x2="51" y2="126" stroke="#5a6b7b" stroke-width="1"/>
    <text x="24" y="146" font-size="13" fill="#5a6b7b">前两段 0.50 s（5.9%）由 ROM 与 DDR 初始化决定，软件基本改不动</text>
    <text x="24" y="166" font-size="13" fill="#8a4a1f">能改的是 kernel + init + app = 7.00 s；目标 5 s 要压掉其中 49%</text>
    <text x="24" y="196" font-size="14" font-weight="700" fill="#1a2b3a">每段再优化 30%，对总时长的贡献</text>
    <text x="24" y="221" font-size="13" fill="#1a2b3a">init</text>
    <rect x="96" y="210" width="150.0" height="14" fill="#1a4f8b"/>
    <text x="252" y="221" font-size="13" fill="#1a2b3a">11.0%</text>
    <text x="24" y="245" font-size="13" fill="#1a2b3a">app</text>
    <rect x="96" y="234" width="99.5" height="14" fill="#1a4f8b"/>
    <text x="252" y="245" font-size="13" fill="#1a2b3a">7.3%</text>
    <text x="24" y="269" font-size="13" fill="#1a2b3a">kernel</text>
    <rect x="96" y="258" width="90.0" height="14" fill="#1a4f8b"/>
    <text x="252" y="269" font-size="13" fill="#1a2b3a">6.6%</text>
    <text x="24" y="293" font-size="13" fill="#1a2b3a">U-Boot</text>
    <rect x="96" y="282" width="46.4" height="14" fill="#8fa8c0"/>
    <text x="252" y="293" font-size="13" fill="#1a2b3a">3.4%</text>
    <text x="24" y="317" font-size="13" fill="#1a2b3a">BootROM</text>
    <rect x="96" y="306" width="15.0" height="14" fill="#8fa8c0"/>
    <text x="252" y="317" font-size="13" fill="#1a2b3a">1.1%</text>
    <text x="24" y="341" font-size="13" fill="#1a2b3a">SPL</text>
    <rect x="96" y="330" width="8.2" height="14" fill="#8fa8c0"/>
    <text x="252" y="341" font-size="13" fill="#1a2b3a">0.6%</text>
    <text x="24" y="372" font-size="13" fill="#5a6b7b">前三段贡献 24.9%，后三段合计不到 6%</text>
    <text x="400" y="196" font-size="14" font-weight="700" fill="#1a2b3a">火焰图：宽度是样本数，不是时间轴</text>
    <rect x="404" y="206" width="320" height="20" fill="#1a4f8b"/>
    <text x="412" y="221" font-size="13" fill="#ffffff">all（990 samples）</text>
    <rect x="404" y="230" width="180" height="20" fill="#3a6ea5"/>
    <text x="411" y="245" font-size="13" fill="#ffffff">app_main 180</text>
    <rect x="584" y="230" width="96" height="20" fill="#b5642e"/>
    <text x="591" y="245" font-size="13" fill="#ffffff">sys_read 96</text>
    <rect x="680" y="230" width="44" height="20" fill="#c9d2da"/>
    <rect x="404" y="254" width="96" height="20" fill="#5b8bbd"/>
    <text x="410" y="269" font-size="13" fill="#ffffff">parse 96</text>
    <rect x="500" y="254" width="84" height="20" fill="#8a4a1f"/>
    <text x="506" y="269" font-size="13" fill="#ffffff">memcpy 84</text>
    <rect x="584" y="254" width="96" height="20" fill="#c97a48"/>
    <text x="590" y="269" font-size="13" fill="#ffffff">read 96</text>
    <rect x="500" y="278" width="84" height="20" fill="#a05a2c"/>
    <text x="506" y="293" font-size="13" fill="#ffffff">__copy_user</text>
    <text x="400" y="322" font-size="13" fill="#5a6b7b">底部是入口，顶部是叶子；先看最宽的叶子被谁调用</text>
    <text x="400" y="342" font-size="13" fill="#5a6b7b">看自身开销要加 --no-children</text>
    <text x="24" y="390" font-size="14" font-weight="700" fill="#1a2b3a">回归判定：差值必须大于 2σ 噪声底</text>
    <text x="24" y="408" font-size="13" fill="#1a2b3a">基线 8.440 ± 0.062 s，优化后 7.983 ± 0.065 s，差 0.457 s（5.4%）</text>
    <text x="24" y="426" font-size="13" fill="#8a4a1f">合并 σ = 0.064 s，t = 8.8；2σ 底 = 0.128 s，差值是其 3.6 倍</text>
  </g>
</svg>
