<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="680" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 电池在最左 -->
  <line x1="100" y1="120" x2="100" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="82" y1="160" x2="118" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="90" y1="173" x2="110" y2="173" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="82" y1="186" x2="118" y2="186" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="90" y1="199" x2="110" y2="199" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="199" x2="100" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="70" y="170" font-size="18" fill="#b5642e" font-weight="700">+</text>
  <text x="72" y="200" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="55" y="186" font-size="16" fill="#1a4f8b" font-weight="700">Vs</text>
  <!-- 上轨 / 下轨 -->
  <line x1="100" y1="120" x2="600" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="100" y1="280" x2="600" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 总电流箭头 -->
  <line x1="130" y1="120" x2="180" y2="120" stroke="#b5642e" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="155" y="108" font-size="16" fill="#b5642e" font-weight="700" text-anchor="middle">I总</text>
  <!-- R1 支路 -->
  <line x1="260" y1="120" x2="260" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="248" y="170" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="214" x2="260" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="198" font-size="16" fill="#1a4f8b" text-anchor="end" font-weight="700">R₁</text>
  <!-- R2 支路 -->
  <line x1="390" y1="120" x2="390" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="378" y="170" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="214" x2="390" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="370" y="198" font-size="16" fill="#1a4f8b" text-anchor="end" font-weight="700">R₂</text>
  <!-- R3 支路 -->
  <line x1="520" y1="120" x2="520" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="508" y="170" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="520" y1="214" x2="520" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="198" font-size="16" fill="#1a4f8b" text-anchor="end" font-weight="700">R₃</text>
  <!-- 节点 -->
  <circle cx="260" cy="120" r="4.5" fill="#2b3a4a"/>
  <circle cx="390" cy="120" r="4.5" fill="#2b3a4a"/>
  <circle cx="520" cy="120" r="4.5" fill="#2b3a4a"/>
  <circle cx="260" cy="280" r="4.5" fill="#2b3a4a"/>
  <circle cx="390" cy="280" r="4.5" fill="#2b3a4a"/>
  <circle cx="520" cy="280" r="4.5" fill="#2b3a4a"/>
  <!-- 支路电流箭头 -->
  <line x1="260" y1="130" x2="260" y2="158" stroke="#b5642e" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="278" y="150" font-size="14" fill="#b5642e" font-weight="700">I₁</text>
  <line x1="390" y1="130" x2="390" y2="158" stroke="#b5642e" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="408" y="150" font-size="14" fill="#b5642e" font-weight="700">I₂</text>
  <line x1="520" y1="130" x2="520" y2="158" stroke="#b5642e" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="538" y="150" font-size="14" fill="#b5642e" font-weight="700">I₃</text>
  <!-- 标注 -->
  <text x="340" y="330" font-size="16" fill="#222a32" text-anchor="middle">KCL：在上轨节点，I总 = I₁ + I₂ + I₃（电荷不堆积）</text>
  <text x="340" y="356" font-size="16" fill="#222a32" text-anchor="middle">KVL：沿任一回路，Vs − V_Rk = 0（电压升 = 电压降）</text>
</svg>
