<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace"><rect width="900" height="600" fill="#ffffff"/><text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">容性负载隔离补偿 Capacitive-Load Isolation</text><line x1="30" y1="46" x2="870" y2="46" stroke="#e3e0d7"/><polygon points="220,238 220,322 310,280" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/><text x="230" y="270" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">−</text><text x="230" y="302" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">+</text><line x1="170" y1="263" x2="220" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="170" y1="297" x2="220" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><line x1="310" y1="280" x2="350" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><text x="265" y="340" font-size="13" fill="#222a32" text-anchor="middle" font-weight="400">A1</text><text x="140" y="297" font-size="12" fill="#222a32" text-anchor="end" font-weight="700">Vin</text><line x1="310" y1="280" x2="380" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><circle cx="380" cy="280" r="4.5" fill="#2b3a4a"/><line x1="380" y1="280" x2="390" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><rect x="390" y="268" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/><line x1="450" y1="280" x2="460" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><text x="420" y="262" font-size="14" font-weight="700" fill="#1a4f8b" text-anchor="middle">Rs</text><line x1="460" y1="280" x2="560" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><circle cx="560" cy="280" r="4.5" fill="#2b3a4a"/><text x="575" y="285" font-size="12" fill="#222a32" text-anchor="start" font-weight="700">Vout</text><line x1="560" y1="280" x2="560" y2="360" stroke="#2b3a4a" stroke-width="2.2"/><line x1="560" y1="360" x2="560" y2="387" stroke="#2b3a4a" stroke-width="2.2"/><line x1="546" y1="387" x2="574" y2="387" stroke="#2b3a4a" stroke-width="2.6"/><line x1="546" y1="393" x2="574" y2="393" stroke="#2b3a4a" stroke-width="2.6"/><line x1="560" y1="393" x2="560" y2="420" stroke="#2b3a4a" stroke-width="2.2"/><text x="580" y="395" font-size="14" font-weight="700" fill="#1a4f8b" text-anchor="start">CL</text><line x1="560" y1="420" x2="560" y2="450" stroke="#2b3a4a" stroke-width="2.2"/><line x1="560" y1="430" x2="560" y2="450" stroke="#2b3a4a" stroke-width="2.2"/><line x1="546" y1="450" x2="574" y2="450" stroke="#2b3a4a" stroke-width="2.4"/><line x1="551" y1="457" x2="569" y2="457" stroke="#2b3a4a" stroke-width="2.4"/><line x1="555" y1="464" x2="565" y2="464" stroke="#2b3a4a" stroke-width="2.4"/><line x1="380" y1="280" x2="380" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="380" y1="263" x2="170" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><text x="300" y="120" font-size="13" fill="#5c6772" text-anchor="start" font-weight="400">容性负载隔离：小 Rs（几十Ω）串在输出与 CL 之间，反馈取 Rs 前</text><text x="300" y="480" font-size="13" fill="#5c6772" text-anchor="start" font-weight="400">把负载极点与运放输出隔开，消除振荡；代价是 Vout 在 Rs 上有微小压降</text></svg>