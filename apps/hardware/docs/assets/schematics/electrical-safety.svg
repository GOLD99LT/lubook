<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 620 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="620" height="340" fill="#ffffff"/>
  <!-- 插座端子 -->
  <text x="60" y="80" font-size="16" fill="#b5642e" font-weight="700">L 火线</text>
  <text x="60" y="260" font-size="16" fill="#2b3a4a" font-weight="700">N 零线</text>
  <!-- L 线 + 保险丝 -->
  <line x1="130" y1="80" x2="200" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="200" y="68" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="230" y="60" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">保险丝</text>
  <line x1="260" y1="80" x2="360" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 人体（简笔）接在 L 与地之间 -->
  <circle cx="360" cy="130" r="18" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="148" x2="360" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="170" x2="330" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="170" x2="390" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="220" x2="340" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="220" x2="380" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="400" y="135" font-size="14" fill="#b5642e" font-weight="700">人体</text>
  <!-- 电流路径箭头 -->
  <line x1="360" y1="90" x2="360" y2="112" stroke="#b5642e" stroke-width="2.2"/>
  <!-- 接地 -->
  <line x1="360" y1="260" x2="360" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="346" y1="280" x2="374" y2="280" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="351" y1="287" x2="369" y2="287" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="355" y1="294" x2="365" y2="294" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- N 线 -->
  <line x1="130" y1="260" x2="360" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="310" y="325" font-size="15" fill="#222a32" text-anchor="middle">触电：电流经人体从 L 流入大地；保险丝/漏电保护器在电流过大或漏电时切断电源</text>
</svg>
