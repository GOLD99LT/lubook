<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>5V 单电源、增益 5 的摆幅预算：输入共模范围、轻载与重载输出摆幅反推的输入区间、传感器实际区间，以及三者交集</title>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">摆幅预算：输入共模范围与输出摆幅是两条独立边界 Supply Rails Budget</text>
  <text x="30" y="58" font-size="12.5" fill="#5c6772">条件：V+ = 5 V、V− = 0 V、同相增益 G = 5、输出余量 0.1 V（轻载）/ 0.5 V（20 mA）、输入共模 −0.1 ~ 3.5 V</text>
  <line x1="30" y1="72" x2="870" y2="72" stroke="#e3e0d7"/>

  <!-- 行标签 -->
  <text x="30" y="114" font-size="13" fill="#1a4f8b" font-weight="700">输入共模范围</text>
  <text x="30" y="132" font-size="11.5" fill="#5c6772">ICMR −0.1 ~ 3.5 V</text>

  <text x="30" y="166" font-size="13" fill="#b5642e" font-weight="700">输出反推 · 轻载</text>
  <text x="30" y="184" font-size="11.5" fill="#5c6772">0.02 ~ 0.98 V</text>

  <text x="30" y="218" font-size="13" fill="#cc5a47" font-weight="700">输出反推 · 20 mA</text>
  <text x="30" y="236" font-size="11.5" fill="#5c6772">0.10 ~ 0.90 V</text>

  <text x="30" y="270" font-size="13" fill="#2f7d4f" font-weight="700">传感器实际输出</text>
  <text x="30" y="288" font-size="11.5" fill="#5c6772">0.20 ~ 0.80 V</text>

  <text x="30" y="322" font-size="13" fill="#222a32" font-weight="700">可用交集</text>
  <text x="30" y="340" font-size="11.5" fill="#5c6772">重载 0.10 ~ 0.90 V 覆盖信号</text>

  <!-- 行 1：输入共模范围（右端超出图幅） -->
  <line x1="194" y1="112" x2="852" y2="112" stroke="#1a4f8b" stroke-width="14" stroke-linecap="round" opacity="0.28"/>
  <line x1="194" y1="112" x2="850" y2="112" stroke="#1a4f8b" stroke-width="2.2" stroke-dasharray="6,5"/>
  <text x="860" y="96" font-size="12" fill="#1a4f8b" text-anchor="end" font-weight="700">上限 3.5 V 超出图幅</text>
  <circle cx="194" cy="112" r="4.5" fill="#1a4f8b"/>
  <text x="194" y="100" font-size="11.5" fill="#1a4f8b" text-anchor="middle">−0.1 V</text>

  <!-- 行 2：轻载反推 -->
  <line x1="261" y1="162" x2="799" y2="162" stroke="#b5642e" stroke-width="14" stroke-linecap="round" opacity="0.38"/>
  <line x1="261" y1="162" x2="799" y2="162" stroke="#b5642e" stroke-width="1.8"/>
  <line x1="261" y1="152" x2="261" y2="172" stroke="#b5642e" stroke-width="2.4"/>
  <line x1="799" y1="152" x2="799" y2="172" stroke="#b5642e" stroke-width="2.4"/>
  <text x="261" y="148" font-size="11.5" fill="#b5642e" text-anchor="middle">0.02</text>
  <text x="799" y="148" font-size="11.5" fill="#b5642e" text-anchor="middle">0.98</text>
  <text x="530" y="148" font-size="11.5" fill="#b5642e" text-anchor="middle">Vin ≤ 4.9 V / 5</text>

  <!-- 行 3：重载反推 -->
  <line x1="306" y1="214" x2="754" y2="214" stroke="#cc5a47" stroke-width="14" stroke-linecap="round" opacity="0.38"/>
  <line x1="306" y1="214" x2="754" y2="214" stroke="#cc5a47" stroke-width="1.8"/>
  <line x1="306" y1="204" x2="306" y2="224" stroke="#cc5a47" stroke-width="2.4"/>
  <line x1="754" y1="204" x2="754" y2="224" stroke="#cc5a47" stroke-width="2.4"/>
  <text x="306" y="200" font-size="11.5" fill="#cc5a47" text-anchor="middle">0.10</text>
  <text x="754" y="200" font-size="11.5" fill="#cc5a47" text-anchor="middle">0.90</text>

  <!-- 行 4：信号 -->
  <line x1="362" y1="266" x2="698" y2="266" stroke="#2f7d4f" stroke-width="14" stroke-linecap="round" opacity="0.42"/>
  <line x1="362" y1="266" x2="698" y2="266" stroke="#2f7d4f" stroke-width="1.8"/>
  <line x1="362" y1="256" x2="362" y2="276" stroke="#2f7d4f" stroke-width="2.4"/>
  <line x1="698" y1="256" x2="698" y2="276" stroke="#2f7d4f" stroke-width="2.4"/>
  <text x="362" y="252" font-size="11.5" fill="#2f7d4f" text-anchor="middle">0.20</text>
  <text x="698" y="252" font-size="11.5" fill="#2f7d4f" text-anchor="middle">0.80</text>

  <!-- 行 5：交集 -->
  <rect x="306" y="310" width="448" height="16" rx="6" fill="#e8f0f9" stroke="#222a32" stroke-width="1.6"/>
  <line x1="306" y1="302" x2="306" y2="336" stroke="#222a32" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="754" y1="302" x2="754" y2="336" stroke="#222a32" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="306" y="352" font-size="11.5" fill="#222a32" text-anchor="middle">0.10</text>
  <text x="754" y="352" font-size="11.5" fill="#222a32" text-anchor="middle">0.90</text>

  <!-- 坐标轴 -->
  <line x1="250" y1="370" x2="830" y2="370" stroke="#2b3a4a" stroke-width="2"/>
  <g font-size="11.5" fill="#5c6772" text-anchor="middle">
    <text x="250" y="390">0</text>
    <text x="362" y="390">0.2</text>
    <text x="474" y="390">0.4</text>
    <text x="586" y="390">0.6</text>
    <text x="698" y="390">0.8</text>
    <text x="810" y="390">1.0</text>
  </g>
  <g stroke="#2b3a4a" stroke-width="1.6">
    <line x1="250" y1="370" x2="250" y2="376"/>
    <line x1="362" y1="370" x2="362" y2="376"/>
    <line x1="474" y1="370" x2="474" y2="376"/>
    <line x1="586" y1="370" x2="586" y2="376"/>
    <line x1="698" y1="370" x2="698" y2="376"/>
    <line x1="810" y1="370" x2="810" y2="376"/>
  </g>
  <text x="840" y="374" font-size="12.5" fill="#2b3a4a">Vin / V</text>

  <text x="30" y="392" font-size="11.5" fill="#5c6772">所有区间由不等式 Vdrop ≤ 5·Vin ≤ 5 V − Vdrop 与 ICMR 反推；负载电流不同，Vdrop 不同，区间随之内缩</text>
</svg>
