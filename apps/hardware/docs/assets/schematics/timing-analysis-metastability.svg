<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">同时钟域数据通路：建立/保持时间分析 Setup/Hold Check</text>

  <!-- Launch FF -->
  <rect x="60" y="110" width="110" height="110" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="115" y="160" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">Launch FF</text>
  <text x="115" y="180" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">（发）</text>
  <!-- D of launch -->
  <text x="20" y="130" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">D</text>
  <line x1="35" y1="126" x2="60" y2="126" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- Q of launch -> combo -->
  <line x1="170" y1="165" x2="260" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="155" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Tco</text>

  <!-- Combinational logic box -->
  <rect x="260" y="120" width="160" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="340" y="160" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">组合逻辑</text>
  <text x="340" y="182" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Tlogic</text>

  <!-- combo -> dest D -->
  <line x1="420" y1="165" x2="510" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="460" y="155" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">数据到达</text>

  <!-- Capture FF -->
  <rect x="510" y="110" width="110" height="110" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="565" y="160" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">Capture FF</text>
  <text x="565" y="180" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">（收）</text>
  <!-- Q of capture -->
  <line x1="620" y1="165" x2="680" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="640" y="155" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Q</text>

  <!-- common CLK -->
  <text x="24" y="280" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">CLK</text>
  <line x1="60" y1="276" x2="620" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="115" y1="276" x2="115" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="565" y1="276" x2="565" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="95,200 95,240 115,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="545,200 545,240 565,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- setup/hold window annotation at capture D -->
  <line x1="510" y1="165" x2="510" y2="60" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="380" y="55" font-size="13" fill="#b5642e" text-anchor="start" font-weight="700">建立时间 tSU：数据须在捕获沿前稳定</text>
  <line x1="565" y1="220" x2="565" y2="60" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="430" y="40" font-size="13" fill="#b5642e" text-anchor="start" font-weight="700">保持时间 tH：沿后还要保持</text>
</svg>
