<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>桥式电流泵的结构示意：四个电阻构成桥臂，运放比较两个分压点，负载接在输出与地之间；平衡条件 R1/R2 = R3/R4</title>
  <rect width="920" height="540" fill="#ffffff"/>
  <line x1="60" y1="250" x2="150" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="42" y="245" font-size="18" fill="#222a32" text-anchor="start" font-weight="400">Vin</text>
  <rect x="150" y="200" width="200" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="250" y="238" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">桥臂 R1 ~ R4</text>
  <text x="250" y="266" font-size="15" fill="#222a32" text-anchor="middle" font-weight="400">R1/R2 = R3/R4</text>
  <line x1="350" y1="250" x2="450" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="450,190 450,310 610,250" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="530" y="300" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">A</text>
  <line x1="610" y1="250" x2="700" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="700" cy="250" r="4.5" fill="#2b3a4a"/>
  <line x1="700" y1="250" x2="700" y2="350" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="689" y="350" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="716" y="379" font-size="17" fill="#1a4f8b" text-anchor="start" font-weight="700">RL</text>
  <line x1="700" y1="396" x2="700" y2="430" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="700" y1="430" x2="700" y2="436" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="686" y1="436" x2="714" y2="436" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="691" y1="443" x2="709" y2="443" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="695" y1="450" x2="705" y2="450" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="716" y="410" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">接地负载</text>
  <line x1="700" y1="250" x2="700" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="700" y1="110" x2="250" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="110" x2="250" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="420" y="100" font-size="13" fill="#b5642e" text-anchor="middle" font-weight="400">负反馈：稳定输出</text>
  <line x1="700" y1="250" x2="840" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="840" y1="250" x2="840" y2="460" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="840" y1="460" x2="250" y2="460" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="460" x2="250" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="560" y="450" font-size="13" fill="#b5642e" text-anchor="middle" font-weight="400">正反馈：把负载电压的影响抬回来</text>
  <text x="40" y="495" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">平衡时输出电阻趋于无穷，I_L 与 RL 无关</text>
  <text x="40" y="520" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">1% 失配 -&gt; |Rout| 约 2R/δ，不再是理想电流源</text>
</svg>
