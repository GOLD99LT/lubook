<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="780" height="480" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- IC 外框 -->
  <rect x="160" y="70" width="460" height="340" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="390" y="55" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">NE555 内部框图</text>
  <!-- Vcc / GND -->
  <line x1="390" y1="70" x2="390" y2="30" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="24" font-size="16" fill="#2b3a4a" text-anchor="middle">8 Vcc</text>
  <line x1="390" y1="410" x2="390" y2="440" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="376" y1="440" x2="404" y2="440" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="381" y1="447" x2="399" y2="447" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="385" y1="454" x2="395" y2="454" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="418" y="446" font-size="16" fill="#2b3a4a">1 GND</text>
  <!-- 内部分压 -->
  <rect x="200" y="100" width="80" height="130" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="125" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">三分压</text>
  <text x="240" y="150" font-size="12" fill="#2b3a4a" text-anchor="middle">2/3 Vcc</text>
  <text x="240" y="172" font-size="12" fill="#2b3a4a" text-anchor="middle">1/3 Vcc</text>
  <text x="240" y="200" font-size="12" fill="#2b3a4a" text-anchor="middle">3×5kΩ</text>
  <!-- 上比较器 -->
  <polygon points="330,100 330,160 410,130" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="345" y="135" font-size="12" fill="#2b3a4a" font-weight="700">上比较</text>
  <!-- 下比较器 -->
  <polygon points="330,220 330,280 410,250" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="345" y="255" font-size="12" fill="#2b3a4a" font-weight="700">下比较</text>
  <!-- RS 触发器 -->
  <rect x="440" y="170" width="80" height="60" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="480" y="197" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">RS</text>
  <text x="480" y="216" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">触发器</text>
  <!-- 输出推挽 -->
  <rect x="545" y="185" width="60" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="575" y="205" font-size="12" fill="#2b3a4a" text-anchor="middle">推挽输出</text>
  <!-- 放电管 -->
  <circle cx="470" cy="330" r="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="470" y="335" font-size="11" fill="#2b3a4a" text-anchor="middle">放电管</text>
  <!-- 内部连线 -->
  <line x1="280" y1="130" x2="330" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="280" y1="250" x2="330" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="410" y1="130" x2="440" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="410" y1="250" x2="440" y2="215" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="520" y1="200" x2="545" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="480" y1="230" x2="480" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 左侧引脚 -->
  <line x1="160" y1="130" x2="120" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="160" y1="250" x2="120" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="160" y1="330" x2="120" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="112" y="135" font-size="15" fill="#2b3a4a" text-anchor="end">6 THRES</text>
  <text x="112" y="255" font-size="15" fill="#2b3a4a" text-anchor="end">2 TRIG</text>
  <text x="112" y="335" font-size="15" fill="#2b3a4a" text-anchor="end">7 DISCH</text>
  <line x1="330" y1="130" x2="160" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="250" x2="160" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="470" y1="350" x2="470" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="470" y1="380" x2="160" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="160" y1="380" x2="160" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 右侧引脚 -->
  <line x1="605" y1="200" x2="660" y2="200" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="668" y="205" font-size="15" fill="#2b3a4a">3 OUT</text>
  <line x1="280" y1="115" x2="620" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="115" x2="660" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="668" y="120" font-size="15" fill="#2b3a4a">5 CONT</text>
  <line x1="520" y1="225" x2="620" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="300" x2="660" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="668" y="305" font-size="15" fill="#2b3a4a">4 RESET</text>
</svg>
