<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">接地体系：单点（星形）接地 vs 地平面（多点）</text>

  <!-- 左：星形接地 -->
  <text x="60" y="66" font-size="14" fill="#1a4f8b" font-weight="700">单点/星形接地</text>
  <!-- 各模块到中心 -->
  <circle cx="220" cy="200" r="5" fill="#2b3a4a"/>
  <rect x="80" y="90" width="60" height="36" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="110" y="112" font-size="11" fill="#222a32" text-anchor="middle">模拟</text>
  <rect x="80" y="200" width="60" height="36" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="110" y="222" font-size="11" fill="#222a32" text-anchor="middle">数字</text>
  <rect x="80" y="290" width="60" height="36" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="110" y="312" font-size="11" fill="#222a32" text-anchor="middle">电源</text>
  <line x1="140" y1="108" x2="220" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="140" y1="218" x2="220" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="140" y1="308" x2="220" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="196" font-size="11" fill="#5c6772">单点汇合</text>

  <!-- 右：地平面 -->
  <text x="520" y="66" font-size="14" fill="#1a4f8b" font-weight="700">地平面（多层板）</text>
  <rect x="520" y="100" width="320" height="180" fill="#eef3f8" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="680" y="196" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">连续 GND 平面</text>
  <rect x="560" y="120" width="60" height="30" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="590" y="140" font-size="10" fill="#222a32" text-anchor="middle">模拟</text>
  <rect x="720" y="120" width="60" height="30" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="750" y="140" font-size="10" fill="#222a32" text-anchor="middle">数字</text>
  <rect x="640" y="230" width="60" height="30" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="670" y="250" font-size="10" fill="#222a32" text-anchor="middle">电源</text>

  <text x="30" y="330" font-size="13" fill="#222a32">低频/小信号：单点接地避免共阻；高速/数字：连续地平面把回流环路缩到最小</text>
</svg>
