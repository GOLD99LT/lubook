<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入线 + R1 -->
  <line x1="40" y1="150" x2="110" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="138" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="150" x2="300" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="128" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₁</text>
  <text x="40" y="135" font-size="20" fill="#2b3a4a">Vin</text>
  <!-- 运放三角形 -->
  <polygon points="300,80 300,220 450,150" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="142" font-size="24" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="196" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 同相端接地 -->
  <line x1="300" y1="185" x2="300" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="300" x2="314" y2="300" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="307" x2="309" y2="307" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="314" x2="305" y2="314" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 反馈路径 -->
  <line x1="270" y1="150" x2="270" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="55" x2="330" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="43" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="55" x2="510" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="510" y1="55" x2="510" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="33" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <text x="252" y="48" font-size="15" fill="#7a5fc0" text-anchor="end">反馈</text>
  <!-- 输出线 -->
  <line x1="450" y1="150" x2="600" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="612" y="156" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 节点圆点 -->
  <circle cx="270" cy="150" r="4.5" fill="#2b3a4a"/>
  <circle cx="510" cy="150" r="4.5" fill="#2b3a4a"/>
  <text x="264" y="190" font-size="16" fill="#b5642e" font-weight="700" text-anchor="end">N（虚地 ≈ 0V）</text>
</svg>
