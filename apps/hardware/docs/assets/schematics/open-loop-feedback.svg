<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- 求和节点 -->
  <circle cx="120" cy="160" r="20" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="106" y="152" font-size="14" fill="#2b3a4a" font-weight="700">+</text>
  <text x="112" y="180" font-size="14" fill="#2b3a4a" font-weight="700">−</text>
  <line x1="40" y1="160" x2="100" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrF)"/>
  <text x="40" y="150" font-size="16" fill="#2b3a4a">X(s) 输入</text>

  <!-- A(s) 放大级 -->
  <line x1="140" y1="160" x2="220" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="220" y="120" width="160" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="158" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">A(s)</text>
  <text x="300" y="182" font-size="12" fill="#5c6772" text-anchor="middle">运放开环增益</text>

  <!-- 输出 -->
  <line x1="380" y1="160" x2="600" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrF)"/>
  <text x="470" y="150" font-size="16" fill="#2b3a4a">Y(s) = A(s)·(X − βY)</text>
  <circle cx="560" cy="160" r="4.5" fill="#2b3a4a"/>

  <!-- 反馈支路 β -->
  <line x1="560" y1="160" x2="560" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="300" x2="270" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="170" y="270" width="100" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="305" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">β</text>
  <line x1="170" y1="300" x2="120" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="300" x2="120" y2="180" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrF)"/>
  <text x="360" y="325" font-size="13" fill="#5c6772">反馈网络：β 由外部电阻/分压决定</text>
</svg>
