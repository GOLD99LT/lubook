<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- IN / OUT 主线 -->
  <line x1="60" y1="180" x2="200" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="180" x2="660" y2="180" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="60" y="165" font-size="20" fill="#2b3a4a">IN</text>
  <text x="668" y="186" font-size="20" fill="#2b3a4a">OUT</text>
  <!-- 上分支：PMOS -->
  <line x1="200" y1="180" x2="200" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="90" x2="320" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="320" y="78" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="350" y="95" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">PMOS</text>
  <line x1="380" y1="90" x2="500" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="90" x2="500" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 下分支：NMOS -->
  <line x1="200" y1="180" x2="200" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="270" x2="320" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="320" y="258" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="350" y="275" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">NMOS</text>
  <line x1="380" y1="270" x2="500" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="270" x2="500" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 栅极控制 -->
  <line x1="350" y1="78" x2="350" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="46" font-size="16" fill="#b5642e" font-weight="700">/A</text>
  <line x1="350" y1="282" x2="350" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="316" font-size="16" fill="#b5642e" font-weight="700">A</text>
  <!-- 节点圆点 -->
  <circle cx="200" cy="180" r="4.5" fill="#2b3a4a"/>
  <circle cx="500" cy="180" r="4.5" fill="#2b3a4a"/>
</svg>
