<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">基本逻辑门符号 Standard Logic Gates</text>

  <!-- NOT gate -->
  <line x1="40" y1="95" x2="90" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="24" y="100" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <polygon points="90,75 90,115 135,95" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="142" cy="95" r="5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="147" y1="95" x2="180" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="186" y="100" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=¬A</text>
  <text x="90" y="150" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">NOT 非门</text>

  <!-- AND gate -->
  <line x1="260" y1="80" x2="300" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="244" y="85" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="260" y1="110" x2="300" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="244" y="115" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <path d="M300,65 L335,65 A25,25 0 0 1 335,115 L300,115 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="90" x2="400" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="406" y="95" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=A·B</text>
  <text x="320" y="150" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">AND 与门</text>

  <!-- OR gate -->
  <line x1="470" y1="80" x2="500" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="454" y="85" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="470" y1="110" x2="500" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="454" y="115" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <path d="M470,65 Q505,90 470,115 L540,90 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="90" x2="580" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="586" y="95" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=A+B</text>
  <text x="505" y="150" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">OR 或门</text>

  <!-- NAND gate -->
  <line x1="60" y1="250" x2="100" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="44" y="255" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="60" y1="280" x2="100" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="44" y="285" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <path d="M100,235 L135,235 A25,25 0 0 1 135,285 L100,285 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="142" cy="260" r="5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="147" y1="260" x2="185" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="191" y="265" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=¬(A·B)</text>
  <text x="120" y="320" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">NAND 与非门</text>

  <!-- NOR gate -->
  <line x1="280" y1="250" x2="310" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="264" y="255" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="280" y1="280" x2="310" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="264" y="285" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <path d="M280,235 Q315,260 280,285 L350,260 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="357" cy="260" r="5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="362" y1="260" x2="400" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="406" y="265" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=¬(A+B)</text>
  <text x="315" y="320" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">NOR 或非门</text>

  <!-- XOR gate -->
  <line x1="480" y1="250" x2="510" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="464" y="255" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="480" y1="280" x2="510" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="464" y="285" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <path d="M470,235 Q505,260 470,285 L545,260 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M462,235 Q497,260 462,285" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="545" y1="260" x2="585" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="591" y="265" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y=A⊕B</text>
  <text x="515" y="320" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">XOR 异或门</text>

  <text x="24" y="380" font-size="13" fill="#5a6672" text-anchor="start">小圆圈（bubble）= 取反；XOR 输入端多一条弧线 = "相异为 1"</text>
</svg>
