<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">UART TTL 经 MAX232 转 RS-232</text>

  <!-- MCU -->
  <rect x="60" y="120" width="130" height="160" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="125" y="150" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">MCU</text>
  <text x="125" y="200" font-size="12" fill="#222a32" text-anchor="middle">UART</text>
  <text x="200" y="190" font-size="12" fill="#5c6772">TXD(3.3V)</text>
  <text x="200" y="230" font-size="12" fill="#5c6772">RXD(3.3V)</text>

  <!-- MAX232 -->
  <rect x="330" y="100" width="170" height="200" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="415" y="130" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">MAX232</text>
  <text x="415" y="152" font-size="11" fill="#5c6772" text-anchor="middle">电平转换 + 电荷泵</text>
  <text x="415" y="172" font-size="11" fill="#5c6772" text-anchor="middle">3.3V ↔ ±电平</text>

  <!-- TXD 连 -->
  <line x1="190" y1="186" x2="330" y2="186" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- RXD 连 -->
  <line x1="190" y1="226" x2="330" y2="226" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 电荷泵电容示意 -->
  <line x1="380" y1="300" x2="380" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="362" y1="330" x2="398" y2="330" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="362" y1="350" x2="398" y2="350" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="405" y="346" font-size="11" fill="#1a4f8b">1µF 电荷泵电容</text>

  <!-- 到 DB9 -->
  <line x1="500" y1="186" x2="640" y2="186" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="226" x2="640" y2="226" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="540" y="178" font-size="11" fill="#b5642e">T2OUT(±)</text>
  <text x="540" y="244" font-size="11" fill="#b5642e">R2IN(±)</text>

  <!-- DB9 -->
  <rect x="640" y="160" width="120" height="90" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="700" y="195" font-size="13" fill="#222a32" text-anchor="middle">DB9</text>
  <text x="700" y="218" font-size="11" fill="#5c6772" text-anchor="middle">RS-232 口</text>

  <text x="120" y="400" font-size="13" fill="#7a5fc0">逻辑1=负电平、逻辑0=正电平（±5~15V），抗干扰强、可传 ~15m；TTL 直连只适合板内短距离</text>
</svg>
