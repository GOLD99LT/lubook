<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>8 通道 MUX 的 ADC 前端：源内阻 Rs、开关导通电阻 Ron、采样电容 CL 构成 RC 建立网络；关断通道经 Coff 把邻道信号耦合到公共节点</title>
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="100" y="120" width="140" height="270" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="250" font-size="16" fill="#222a32" text-anchor="middle" font-weight="700">8:1 MUX</text>
  <line x1="50" y1="150" x2="100" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="145" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH0</text>
  <line x1="50" y1="180" x2="100" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="175" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH1</text>
  <line x1="50" y1="210" x2="100" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="205" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH2</text>
  <line x1="50" y1="240" x2="100" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="235" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH3</text>
  <line x1="50" y1="270" x2="100" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="265" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH4</text>
  <line x1="50" y1="300" x2="100" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="295" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH5</text>
  <line x1="50" y1="330" x2="100" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="325" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH6</text>
  <line x1="50" y1="360" x2="100" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="52" y="355" font-size="12" fill="#222a32" text-anchor="start" font-weight="400">CH7</text>
  <line x1="240" y1="270" x2="290" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="290" y="259" width="60" height="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="258" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rs</text>
  <line x1="350" y1="270" x2="400" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="400" cy="270" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <circle cx="440" cy="270" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="404" y1="268" x2="438" y2="252" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="420" y="244" font-size="15" fill="#b5642e" text-anchor="middle" font-weight="700">Ron</text>
  <line x1="440" y1="270" x2="560" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="560" cy="270" r="4.5" fill="#2b3a4a"/>
  <line x1="560" y1="270" x2="560" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="544" y1="330" x2="576" y2="330" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="544" y1="346" x2="576" y2="346" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="586" y="343" font-size="17" fill="#1a4f8b" text-anchor="start" font-weight="700">C_L</text>
  <line x1="560" y1="346" x2="560" y2="400" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="400" x2="560" y2="406" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="546" y1="406" x2="574" y2="406" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="551" y1="413" x2="569" y2="413" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="555" y1="420" x2="565" y2="420" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="560" y1="270" x2="720" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="720" y="210" width="160" height="120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="800" y="276" font-size="17" fill="#222a32" text-anchor="middle" font-weight="700">ADC</text>
  <line x1="170" y1="390" x2="170" y2="430" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="455" font-size="14" fill="#b5642e" text-anchor="middle" font-weight="700">A0~A2</text>
  <text x="40" y="500" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">τ = (Rs + Ron)·CL；n 位建立需要 (n+1)ln2 个 τ</text>
  <text x="40" y="525" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">关断通道的 Coff 在公共节点上产生串扰：Vcross/Voff ≈ 2πf·Coff·Rs</text>
</svg>
