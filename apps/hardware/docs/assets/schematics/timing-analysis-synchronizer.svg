<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="280" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">两级触发器同步器（异步输入打两拍）2-FF Synchronizer</text>

  <!-- async input -->
  <text x="30" y="110" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">异步输入</text>
  <text x="30" y="128" font-size="12" fill="#5a6672" text-anchor="start">(按键/跨域)</text>
  <line x1="90" y1="114" x2="200" y2="114" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- FF1 -->
  <rect x="200" y="80" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="250" y="125" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF1</text>
  <text x="250" y="145" font-size="11" fill="#b5642e" text-anchor="middle" font-weight="700">可能亚稳</text>

  <!-- FF1.Q -> FF2.D -->
  <line x1="300" y1="125" x2="400" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="350" y="115" font-size="11" fill="#5a6672" text-anchor="middle" font-weight="700">等一拍稳定</text>

  <!-- FF2 -->
  <rect x="400" y="80" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="450" y="125" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF2</text>
  <text x="450" y="145" font-size="11" fill="#2a7a4a" text-anchor="middle" font-weight="700">输出合法</text>

  <!-- sync out -->
  <line x1="500" y1="125" x2="580" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="520" y="115" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">同步输出</text>

  <!-- CLK -->
  <text x="30" y="220" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">CLK(目标时钟域)</text>
  <line x1="160" y1="216" x2="450" y2="216" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="216" x2="250" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="216" x2="450" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="230,150 230,190 250,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="430,150 430,190 450,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
