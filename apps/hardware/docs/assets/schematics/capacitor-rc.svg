<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- 电池 -->
  <line x1="110" y1="110" x2="110" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="92" y1="160" x2="128" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="173" x2="120" y2="173" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="92" y1="186" x2="128" y2="186" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="199" x2="120" y2="199" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="110" y1="199" x2="110" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="80" y="170" font-size="17" fill="#b5642e" font-weight="700">+</text>
  <text x="82" y="200" font-size="17" fill="#2b3a4a" font-weight="700">−</text>
  <text x="60" y="186" font-size="15" fill="#1a4f8b" font-weight="700">Vs</text>
  <!-- 开关 S -->
  <line x1="110" y1="110" x2="170" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="170" cy="110" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="170" y1="110" x2="212" y2="92" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="216" cy="110" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="216" y1="110" x2="260" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="193" y="80" font-size="15" fill="#222a32" text-anchor="middle">S（t=0 闭合）</text>
  <!-- 电阻 R -->
  <rect x="260" y="98" width="100" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="110" x2="470" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="310" y="88" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <!-- 电容 C 竖直在右 -->
  <line x1="470" y1="110" x2="470" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="452" y1="160" x2="488" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="452" y1="176" x2="488" y2="176" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="470" y1="176" x2="470" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="172" font-size="17" fill="#1a4f8b" font-weight="700">C</text>
  <text x="500" y="200" font-size="14" fill="#b5642e">Vc</text>
  <!-- 下边线 -->
  <line x1="110" y1="260" x2="470" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="305" font-size="15" fill="#222a32" text-anchor="middle">RC 充电：t=0 合上开关，电容电压 Vc 按指数向 Vs 爬升，时间常数 τ = R·C</text>
</svg>
