<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>屏蔽效能预算：0.1mm 铜的材料屏蔽效能约 222dB，但一条 10mm 的缝把有效值限制在 43.5dB</title>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="30" y="32" font-size="20" font-weight="700" fill="#222a32">屏蔽效能预算：材料 222dB，一条 10mm 缝只剩 43.5dB</text>
  <text x="30" y="54" font-size="12.5" fill="#5c6772">SE = R + A + B；实际有效值取材料与缝隙中的较小者，短板通常不在材料</text>

  <!-- 左：屏蔽体剖面 -->
  <rect x="30" y="70" width="390" height="270" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="225" y="94" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">屏蔽体剖面（0.1mm 铜）</text>

  <!-- 墙体分两段，中间留 10mm 缝 -->
  <rect x="200" y="110" width="16" height="86" fill="#9aa7b4" stroke="#2b3a4a" stroke-width="1.4"/>
  <rect x="200" y="212" width="16" height="86" fill="#9aa7b4" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="208" y="205" font-size="10.5" fill="#b03a3a" text-anchor="middle">缝 10mm</text>

  <!-- 入射 -->
  <line x1="60" y1="130" x2="190" y2="130" stroke="#b5642e" stroke-width="2.2"/>
  <polygon points="190,130 178,124 178,136" fill="#b5642e"/>
  <line x1="60" y1="158" x2="190" y2="158" stroke="#b5642e" stroke-width="2.2"/>
  <polygon points="190,158 178,152 178,164" fill="#b5642e"/>
  <text x="70" y="120" font-size="11" fill="#b5642e">入射</text>

  <!-- 反射 -->
  <line x1="190" y1="240" x2="70" y2="240" stroke="#1a4f8b" stroke-width="2.2"/>
  <polygon points="70,240 82,234 82,246" fill="#1a4f8b"/>
  <line x1="190" y1="268" x2="70" y2="268" stroke="#1a4f8b" stroke-width="2.2"/>
  <polygon points="70,268 82,262 82,274" fill="#1a4f8b"/>
  <text x="76" y="230" font-size="11" fill="#1a4f8b">反射</text>

  <!-- 透射（经缝） -->
  <line x1="216" y1="199" x2="390" y2="199" stroke="#b03a3a" stroke-width="2.2"/>
  <polygon points="390,199 378,193 378,205" fill="#b03a3a"/>
  <text x="300" y="190" font-size="11" fill="#b03a3a">透射（经缝泄漏）</text>

  <!-- 地符号：28 / 18 / 10，间距 7 -->
  <line x1="208" y1="298" x2="208" y2="314" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="194" y1="314" x2="222" y2="314" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="199" y1="321" x2="217" y2="321" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="203" y1="328" x2="213" y2="328" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="240" y="322" font-size="10.5" fill="#5c6772">屏蔽体接地</text>

  <!-- 右：dB 预算 -->
  <rect x="430" y="70" width="400" height="270" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="630" y="94" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">100MHz 的屏蔽效能预算（dB）</text>

  <!-- 坐标基准线 -->
  <line x1="560" y1="106" x2="560" y2="286" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="560" y="300" font-size="10" fill="#5c6772" text-anchor="middle">0</text>
  <text x="680" y="300" font-size="10" fill="#5c6772" text-anchor="middle">120</text>
  <text x="800" y="300" font-size="10" fill="#5c6772" text-anchor="middle">240</text>

  <!-- 反射 91 -->
  <text x="470" y="122" font-size="11" fill="#222a32">反射 R</text>
  <rect x="560" y="110" width="91" height="18" fill="#1a4f8b"/>
  <text x="655" y="124" font-size="10.5" fill="#1a4f8b">91dB</text>

  <!-- 吸收 131 -->
  <text x="470" y="160" font-size="11" fill="#222a32">吸收 A</text>
  <rect x="560" y="148" width="131" height="18" fill="#2f6e4f"/>
  <text x="695" y="162" font-size="10.5" fill="#2f6e4f">131dB</text>

  <!-- 材料合计 222 -->
  <text x="470" y="198" font-size="11" fill="#222a32">材料合计</text>
  <rect x="560" y="186" width="222" height="18" fill="#5c6772"/>
  <text x="786" y="200" font-size="10.5" fill="#5c6772">222dB</text>

  <!-- 缝 43.5 -->
  <text x="470" y="236" font-size="11" fill="#b03a3a" font-weight="700">10mm 缝</text>
  <rect x="560" y="224" width="44" height="18" fill="#b03a3a"/>
  <text x="608" y="238" font-size="10.5" fill="#b03a3a">43.5dB</text>

  <!-- 实际有效 -->
  <line x1="470" y1="262" x2="810" y2="262" stroke="#b5642e" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="470" y="280" font-size="11" fill="#b5642e">实际有效 ≈ min(222, 43.5) = 43.5dB</text>

  <!-- 底部结论 -->
  <rect x="30" y="356" width="800" height="92" fill="#fdf7f0" stroke="#b5642e" stroke-width="1.6"/>
  <text x="50" y="382" font-size="12.5" fill="#222a32">δ(100MHz, 铜) = 66.1/10000 mm = 6.61µm；A = 8.686 × 0.1/0.00661 = 131dB；R = 91dB。</text>
  <text x="50" y="404" font-size="12.5" fill="#222a32">缝：SE = 20log10(λ/2L) = 20log10(3/0.02) = 43.5dB；30MHz 时 54dB，300MHz 时 34dB。</text>
  <text x="50" y="426" font-size="12.5" fill="#b5642e">屏蔽设计顺序是缝 → 接地 → 材料；材料再厚，也补不回一条长缝。</text>
</svg>
