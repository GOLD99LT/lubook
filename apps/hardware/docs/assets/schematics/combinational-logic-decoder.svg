  <text x="568" y="255" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Y5 (101)</text>
  <line x1="360" y1="280" x2="560" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
