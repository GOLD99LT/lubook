<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">3 线-8 线译码器 3-to-8 Decoder</text>

  <!-- inputs -->
  <text x="30" y="120" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A2</text>
  <line x1="60" y1="116" x2="200" y2="116" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="160" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A1</text>
  <line x1="60" y1="156" x2="200" y2="156" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="200" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A0</text>
  <line x1="60" y1="196" x2="200" y2="196" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="280" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">E(使能)</text>
  <line x1="80" y1="276" x2="200" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- decoder block -->
  <rect x="200" y="90" width="160" height="220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="280" y="200" font-size="16" fill="#2b3a4a" text-anchor="middle" font-weight="700">3-to-8</text>
  <text x="280" y="222" font-size="16" fill="#2b3a4a" text-anchor="middle" font-weight="700">Decoder</text>

  <!-- outputs Y0..Y7 -->
  <line x1="360" y1="100" x2="560" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="568" y="105" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Y0 (000)</text>
  <line x1="360" y1="130" x2="560" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="568" y="135" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Y1 (001)</text>
  <line x1="360" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="568" y="165" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Y2 (010)</text>
  <line x1="360" y1="190" x2="560" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="568" y="195" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Y3 (011)</text>
