<svg viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="240" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">电量计 Fuel Gauge：库仑计（Coulomb Counter）累计进出电量</text>

  <!-- 电池 -->
  <line x1="80" y1="90" x2="110" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="68" x2="110" y2="112" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="122" y1="78" x2="122" y2="102" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="134" y1="68" x2="134" y2="112" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="122" y="58" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">BAT+</text>

  <!-- 检测电阻 Rsns -->
  <line x1="134" y1="90" x2="180" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="180" y="78" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="210" y="95" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rsns</text>
  <line x1="240" y1="90" x2="380" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="80" font-size="12" fill="#5c6772">→ 系统负载 SYS</text>

  <!-- 电量计 IC -->
  <line x1="210" y1="102" x2="210" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="90" x2="120" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="150" y="140" width="160" height="70" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="230" y="170" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">电量计 IC</text>
  <text x="230" y="190" font-size="11" fill="#5c6772" text-anchor="middle">测 Rsns 压降积分数</text>

  <!-- I2C -->
  <line x1="310" y1="175" x2="450" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="380" y="168" font-size="12" fill="#5c6772">I²C/SMBus</text>
  <rect x="450" y="150" width="90" height="50" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="495" y="180" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">MCU</text>

  <text x="30" y="230" font-size="13" fill="#222a32">库仑计：$Q=\int I\,dt$ 累计充入/放出 mAh，比纯电压估算准；需定期满充校准、补偿自放电与库仑效率</text>
</svg>
