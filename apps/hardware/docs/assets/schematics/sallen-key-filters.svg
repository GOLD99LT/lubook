<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 信号通路：Vin - R1 - 节点A - R2 - (+) 输入 -->
  <line x1="40" y1="255" x2="90" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="90" y="243" width="90" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="255" x2="240" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="290" y="243" width="90" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="255" x2="430" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="135" y="233" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₁</text>
  <text x="335" y="233" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₂</text>
  <text x="40" y="240" font-size="20" fill="#2b3a4a">Vin</text>
  <!-- 运放三角形 -->
  <polygon points="430,150 430,290 580,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="448" y="188" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="448" y="262" font-size="22" fill="#2b3a4a" font-weight="700">+</text>
  <!-- C1：节点A 经反馈到输出 -->
  <line x1="240" y1="255" x2="240" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="80" x2="400" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="65" x2="400" y2="95" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="416" y1="65" x2="416" y2="95" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="416" y1="80" x2="660" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="660" y1="80" x2="660" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="408" y="60" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">C₁</text>
  <!-- C2：(+) 节点到地 -->
  <line x1="410" y1="255" x2="410" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="395" y1="290" x2="425" y2="290" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="395" y1="306" x2="425" y2="306" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="410" y1="306" x2="410" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="396" y1="360" x2="424" y2="360" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="401" y1="367" x2="419" y2="367" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="405" y1="374" x2="415" y2="374" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="438" y="302" font-size="18" fill="#1a4f8b" font-weight="700">C₂</text>
  <!-- Rb：输出到反相端 -->
  <line x1="430" y1="185" x2="380" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="185" x2="380" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="470" y="128" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="140" x2="470" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="590" y1="140" x2="660" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="660" y1="140" x2="660" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="530" y="122" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rb</text>
  <!-- Ra：反相端到地 -->
  <line x1="380" y1="185" x2="380" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="368" y="250" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="294" x2="380" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="366" y1="330" x2="394" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="371" y1="337" x2="389" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="375" y1="344" x2="385" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="358" y="278" font-size="18" fill="#1a4f8b" text-anchor="end" font-weight="700">Ra</text>
  <!-- 输出线 -->
  <line x1="580" y1="220" x2="690" y2="220" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="700" y="226" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 节点圆点 -->
  <circle cx="240" cy="255" r="4.5" fill="#2b3a4a"/>
  <circle cx="410" cy="255" r="4.5" fill="#2b3a4a"/>
  <circle cx="380" cy="185" r="4.5" fill="#2b3a4a"/>
  <circle cx="660" cy="220" r="4.5" fill="#2b3a4a"/>
</svg>
