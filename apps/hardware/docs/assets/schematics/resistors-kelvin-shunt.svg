<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>25mΩ 采样电阻的四线开尔文接法</title>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="28" font-size="17" fill="#222a32" text-anchor="start" font-weight="700">25mΩ 采样电阻的四线开尔文接法</text>

  <text x="40" y="114" font-size="15" fill="#b5642e" text-anchor="start" font-weight="700">I+ 2A</text>
  <line x1="100" y1="120" x2="240" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="240" y="108" width="30" height="24" fill="#dfe3e7" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="270" y="108" width="180" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="450" y="108" width="30" height="24" fill="#dfe3e7" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="480" y1="120" x2="640" y2="120" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="648" y="124" font-size="15" fill="#b5642e" text-anchor="start" font-weight="700">I- 2A</text>
  <text x="360" y="96" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rsense = 25mΩ</text>
  <text x="255" y="160" font-size="12" fill="#5c6772" text-anchor="middle">force 焊盘</text>
  <text x="465" y="160" font-size="12" fill="#5c6772" text-anchor="middle">force 焊盘</text>

  <circle cx="300" cy="132" r="4" fill="#1a4f8b"/>
  <circle cx="420" cy="132" r="4" fill="#1a4f8b"/>
  <line x1="300" y1="132" x2="300" y2="225" stroke="#1a4f8b" stroke-width="1.8"/>
  <line x1="300" y1="225" x2="470" y2="225" stroke="#1a4f8b" stroke-width="1.8"/>
  <line x1="420" y1="132" x2="420" y2="265" stroke="#1a4f8b" stroke-width="1.8"/>
  <line x1="420" y1="265" x2="470" y2="265" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="306" y="218" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">S+</text>
  <text x="426" y="258" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">S-</text>

  <rect x="470" y="205" width="110" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="525" y="238" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">差分放大器</text>
  <text x="525" y="260" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">G = 64</text>
  <line x1="580" y1="245" x2="660" y2="245" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="668" y="241" font-size="15" fill="#2b3a4a" text-anchor="start" font-weight="700">Vout</text>
  <text x="668" y="261" font-size="12" fill="#5c6772" text-anchor="start">3.2V @ 2A</text>

  <text x="536" y="300" font-size="12" fill="#5c6772" text-anchor="start">REF</text>
  <line x1="525" y1="285" x2="525" y2="335" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="513" y="335" width="24" height="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="546" y="357" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">Rg</text>
  <line x1="525" y1="369" x2="525" y2="381" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="511" y1="381" x2="539" y2="381" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="516" y1="388" x2="534" y2="388" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="520" y1="395" x2="530" y2="395" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="40" y="330" font-size="12.5" fill="#5c6772" text-anchor="start">Force 电流走两端大焊盘，Sense 从元件内侧引出</text>
  <text x="40" y="355" font-size="12.5" fill="#5c6772" text-anchor="start">Sense 线电流约 1µA，10Ω 走线只产生 10µV 压降</text>
  <text x="40" y="380" font-size="12.5" fill="#5c6772" text-anchor="start">走线电阻与焊点电阻不进入测量结果</text>
</svg>
