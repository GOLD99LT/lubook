<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="420" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">SAR ADC 采样-保持与转换结构</text>

  <!-- 外部信号源 -->
  <text x="40" y="150" font-size="13" fill="#b5642e">Vin</text>
  <circle cx="60" cy="170" r="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="60" y="176" font-size="12" fill="#222a32" text-anchor="middle">源</text>
  <line x1="82" y1="170" x2="140" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 源阻抗 -->
  <rect x="140" y="158" width="90" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="185" y="150" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rsource</text>
  <line x1="230" y1="170" x2="300" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 采样开关 -->
  <circle cx="300" cy="170" r="3.5" fill="#2b3a4a"/>
  <line x1="300" y1="170" x2="330" y2="158" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="145" font-size="11" fill="#7a5fc0">采样开关</text>
  <line x1="330" y1="170" x2="420" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="380" cy="170" r="4.5" fill="#2b3a4a"/>

  <!-- 采样保持电容 -->
  <line x1="380" y1="170" x2="380" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="362" y1="210" x2="398" y2="210" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="362" y1="230" x2="398" y2="230" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="380" y1="230" x2="380" y2="262" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="366" y1="262" x2="394" y2="262" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="371" y1="269" x2="389" y2="269" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="375" y1="276" x2="385" y2="276" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="406" y="226" font-size="12" fill="#1a4f8b" font-weight="700">Csh</text>

  <!-- SAR -->
  <line x1="420" y1="170" x2="520" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="520" y="120" width="160" height="110" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="600" y="150" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">SAR + 比较器</text>
  <text x="600" y="176" font-size="11" fill="#5c6772" text-anchor="middle">逐次逼近寄存器</text>
  <text x="600" y="196" font-size="11" fill="#5c6772" text-anchor="middle">D/A 反馈 + 比较</text>

  <!-- 数字输出 -->
  <line x1="680" y1="170" x2="760" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="700" y="158" font-size="12" fill="#2e7d4f">数字码 D[11:0]</text>

  <!-- Vref -->
  <line x1="600" y1="230" x2="600" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="610" y="256" font-size="12" fill="#b5642e">VREF+</text>

  <text x="120" y="340" font-size="13" fill="#7a5fc0">采样期：开关通，Vin 经 Rsource 给 Csh 充电；保持期：开关断，对 Csh 上电压做逐次比较</text>
</svg>
