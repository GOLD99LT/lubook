<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>上电无反应排查树：从电流、电压、复位、时钟逐层判断，任一层不通过就停在原地</title>
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="30" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">上电无反应排查树：每层一个判据，不通过就停在原地</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- 起点 -->
  <rect x="250" y="48" width="260" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
  <text x="380" y="74" font-size="14" fill="#c0392b" font-weight="700" text-anchor="middle">现象：上电无反应，指示灯不亮</text>
  <line x1="380" y1="90" x2="380" y2="108" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- ① 电流 -->
  <rect x="250" y="108" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="134" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">① 限流上电：总电流是否低于预期 10%</text>
  <line x1="510" y1="129" x2="546" y2="129" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="122" font-size="12" fill="#b5642e" text-anchor="middle">是</text>
  <rect x="548" y="108" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="126" font-size="12" fill="#2b3a4a" text-anchor="middle">查断路、反接、保险丝、</text>
  <text x="648" y="142" font-size="12" fill="#2b3a4a" text-anchor="middle">使能未拉高、线束</text>
  <line x1="380" y1="150" x2="380" y2="166" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="162" font-size="12" fill="#2f6e4f">否</text>

  <!-- ② 短路 -->
  <rect x="250" y="166" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="192" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">② 电流是否顶到限流点（如 240mA）</text>
  <line x1="510" y1="187" x2="546" y2="187" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="180" font-size="12" fill="#b5642e" text-anchor="middle">是</text>
  <rect x="548" y="166" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="184" font-size="12" fill="#2b3a4a" text-anchor="middle">短路：逐段断电，看总电流</text>
  <text x="648" y="200" font-size="12" fill="#2b3a4a" text-anchor="middle">回落在哪一段</text>
  <line x1="380" y1="208" x2="380" y2="224" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="220" font-size="12" fill="#2f6e4f">否</text>

  <!-- ③ 电压 -->
  <rect x="250" y="224" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="250" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">③ 各路电压是否在标称 ±5% 内</text>
  <line x1="510" y1="245" x2="546" y2="245" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="238" font-size="12" fill="#b5642e" text-anchor="middle">否</text>
  <rect x="548" y="224" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="242" font-size="12" fill="#2b3a4a" text-anchor="middle">电源级：输入压差、反馈分压、</text>
  <text x="648" y="258" font-size="12" fill="#2b3a4a" text-anchor="middle">使能、负载过重</text>
  <line x1="380" y1="266" x2="380" y2="282" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="278" font-size="12" fill="#2f6e4f">是</text>

  <!-- ④ 复位 -->
  <rect x="250" y="282" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="308" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">④ NRST 释放后是否高于 0.7×VDD</text>
  <line x1="510" y1="303" x2="546" y2="303" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="296" font-size="12" fill="#b5642e" text-anchor="middle">否</text>
  <rect x="548" y="282" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="300" font-size="12" fill="#2b3a4a" text-anchor="middle">复位：上拉、RC 时间常数、</text>
  <text x="648" y="316" font-size="12" fill="#2b3a4a" text-anchor="middle">复位 IC、按键、看门狗</text>
  <line x1="380" y1="324" x2="380" y2="340" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="336" font-size="12" fill="#2f6e4f">是</text>

  <!-- ⑤ 时钟 -->
  <rect x="250" y="340" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="366" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">⑤ 晶振是否起振（测 MCO，不点晶振脚）</text>
  <line x1="510" y1="361" x2="546" y2="361" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="354" font-size="12" fill="#b5642e" text-anchor="middle">否</text>
  <rect x="548" y="340" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="358" font-size="12" fill="#2b3a4a" text-anchor="middle">晶振：负载电容、ESD 损伤、</text>
  <text x="648" y="374" font-size="12" fill="#2b3a4a" text-anchor="middle">探头 10pF 导致停振</text>
  <line x1="380" y1="382" x2="380" y2="398" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="394" font-size="12" fill="#2f6e4f">是</text>

  <!-- ⑥ 固件 -->
  <rect x="250" y="398" width="260" height="42" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="380" y="424" font-size="13.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">⑥ BOOT 电平与下载口是否正常</text>
  <line x1="510" y1="419" x2="546" y2="419" stroke="#2b3a4a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="528" y="412" font-size="12" fill="#b5642e" text-anchor="middle">否</text>
  <rect x="548" y="398" width="200" height="42" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="648" y="416" font-size="12" fill="#2b3a4a" text-anchor="middle">BOOT 电阻、固件、下载线、</text>
  <text x="648" y="432" font-size="12" fill="#2b3a4a" text-anchor="middle">供电时序</text>
  <line x1="380" y1="440" x2="380" y2="458" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="394" y="454" font-size="12" fill="#2f6e4f">是</text>

  <!-- 终点 -->
  <rect x="250" y="458" width="260" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.6"/>
  <text x="380" y="478" font-size="13.5" fill="#2e7d32" font-weight="700" text-anchor="middle">进入功能调试：逐个外设加载</text>
  <text x="380" y="495" font-size="12" fill="#2b3a4a" text-anchor="middle">每加一个外设都回到①重测电流</text>

  <!-- 底部注 -->
  <rect x="40" y="528" width="680" height="52" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="60" y="550" font-size="12" fill="#222a32">判据先算再测：3.3V 轨 ±5% 即 3.135~3.465V；限流取预期电流 1.5~2 倍；</text>
  <text x="60" y="568" font-size="12" fill="#222a32">任何一层不通过就停在原地，不带着问题进入下一层。</text>
</svg>
