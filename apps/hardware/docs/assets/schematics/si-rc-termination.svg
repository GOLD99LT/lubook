<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：RC 端接（并联 RC）</text>

  <line x1="100" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="3"/>
  <text x="330" y="150" font-size="12" fill="#222a32" text-anchor="middle">传输线 Z₀</text>
  <circle cx="560" cy="160" r="4.5" fill="#2b3a4a"/>

  <!-- R 串 C 到 GND -->
  <line x1="560" y1="160" x2="560" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="548" y="190" width="24" height="40" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="585" y="215" font-size="12" fill="#1a4f8b">Rt≈Z₀</text>
  <line x1="560" y1="230" x2="560" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- C -->
  <line x1="545" y1="250" x2="575" y2="250" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="545" y1="262" x2="575" y2="262" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="585" y="260" font-size="12" fill="#1a4f8b">Ct</text>
  <line x1="560" y1="262" x2="560" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="546" y1="285" x2="574" y2="285" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="551" y1="292" x2="569" y2="292" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="555" y1="299" x2="565" y2="299" stroke="#2b3a4a" stroke-width="2.4"/>

  <rect x="60" y="315" width="720" height="35" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="80" y="338" font-size="12" fill="#222a32">机理：电容隔直，直流不耗电，交流瞬态经 Rt=Z₀ 吸收反射。适合单向、CMOS 总线；Ct 要选准（通常 100pF~1nF）。</text>
</svg>
