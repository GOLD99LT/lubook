<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">样机三阶段：EVT(功能) → DVT(设计验证) → PVT(量产验证)</text>
  <rect x="60" y="100" width="170" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/>
  <text x="145" y="130" font-size="14" fill="#c0392b" font-weight="700" text-anchor="middle">EVT</text>
  <text x="145" y="152" font-size="12" fill="#2b3a4a" text-anchor="middle">工程验证</text>
  <text x="145" y="172" font-size="11" fill="#7a5fc0" text-anchor="middle">功能跑通/不看外观</text>
  <line x1="230" y1="145" x2="260" y2="145" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="260" y="100" width="170" height="90" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.4"/>
  <text x="345" y="130" font-size="14" fill="#b5642e" font-weight="700" text-anchor="middle">DVT</text>
  <text x="345" y="152" font-size="12" fill="#2b3a4a" text-anchor="middle">设计验证</text>
  <text x="345" y="172" font-size="11" fill="#7a5fc0" text-anchor="middle">环境/EMC/可靠性</text>
  <line x1="430" y1="145" x2="460" y2="145" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="460" y="100" width="170" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.4"/>
  <text x="545" y="130" font-size="14" fill="#2e7d32" font-weight="700" text-anchor="middle">PVT</text>
  <text x="545" y="152" font-size="12" fill="#2b3a4a" text-anchor="middle">量产验证</text>
  <text x="545" y="172" font-size="11" fill="#7a5fc0" text-anchor="middle">产线试产/良率</text>
  <text x="360" y="235" font-size="13" fill="#7a5fc0" text-anchor="middle">每阶段目标不同：EVT 修功能，DVT 修可靠性，PVT 修可制造性</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
</svg>
