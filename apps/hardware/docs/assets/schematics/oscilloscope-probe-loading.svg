<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace" role="img">
  <title>10× 探头 10 pF 对 100 MHz 节点的负载：50 Ω 源衰减 4.6%，1 kΩ 源衰减 84.3%</title>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#1a4f8b">10× 探头的 10 pF 在 100 MHz 不是“高阻”</text>
  <text x="30" y="55" font-size="13" fill="#5c6772">探头电容 Cp 与源阻抗 Rs 构成低通：|Vp/Vs| = 1 / sqrt(1 + (2πf Rs Cp)^2)，f = 100 MHz，Cp = 10 pF</text>
  <!-- 左：50Ω 源 -->
  <text x="60" y="92" font-size="14" font-weight="700" fill="#1a4f8b">Rs = 50 Ω</text>
  <circle cx="85" cy="160" r="26" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="85" y="165" font-size="13" fill="#2b3a4a" text-anchor="middle">Vs</text>
  <line x1="111" y1="160" x2="160" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="160" y="148" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="190" y="140" font-size="12" fill="#1a4f8b" text-anchor="middle">50 Ω</text>
  <line x1="220" y1="160" x2="285" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="285" cy="160" r="4.5" fill="#2b3a4a"/>
  <text x="296" y="152" font-size="13" fill="#b5642e">Vp</text>
  <!-- 探头电容 -->
  <line x1="285" y1="160" x2="285" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="267" y1="190" x2="303" y2="190" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="267" y1="200" x2="303" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="285" y1="200" x2="285" y2="232" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="310" y="198" font-size="12" fill="#1a4f8b">Cp = 10 pF</text>
  <!-- 接地 28/18/10，间距 7 -->
  <line x1="271" y1="232" x2="299" y2="232" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="276" y1="239" x2="294" y2="239" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="280" y1="246" x2="290" y2="246" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="60" y="286" font-size="13" fill="#2e7d32" font-weight="700">|Vp/Vs| = 0.954</text>
  <text x="60" y="308" font-size="13" fill="#2e7d32">-0.41 dB，幅度误差 -4.6%</text>
  <text x="60" y="330" font-size="12" fill="#5c6772">τ = 50 Ω × 10 pF = 0.5 ns</text>
  <!-- 右：1kΩ 源 -->
  <text x="440" y="92" font-size="14" font-weight="700" fill="#1a4f8b">Rs = 1 kΩ</text>
  <circle cx="465" cy="160" r="26" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="465" y="165" font-size="13" fill="#2b3a4a" text-anchor="middle">Vs</text>
  <line x1="491" y1="160" x2="540" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="540" y="148" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="570" y="140" font-size="12" fill="#1a4f8b" text-anchor="middle">1 kΩ</text>
  <line x1="600" y1="160" x2="665" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="665" cy="160" r="4.5" fill="#2b3a4a"/>
  <text x="676" y="152" font-size="13" fill="#b5642e">Vp</text>
  <!-- 探头电容 -->
  <line x1="665" y1="160" x2="665" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="647" y1="190" x2="683" y2="190" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="647" y1="200" x2="683" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="665" y1="200" x2="665" y2="232" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="690" y="198" font-size="12" fill="#1a4f8b">Cp = 10 pF</text>
  <!-- 接地 28/18/10，间距 7 -->
  <line x1="651" y1="232" x2="679" y2="232" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="656" y1="239" x2="674" y2="239" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="660" y1="246" x2="670" y2="246" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="440" y="286" font-size="13" fill="#c0392b" font-weight="700">|Vp/Vs| = 0.157</text>
  <text x="440" y="308" font-size="13" fill="#c0392b">-16.1 dB，幅度误差 -84.3%</text>
  <text x="440" y="330" font-size="12" fill="#5c6772">τ = 1 kΩ × 10 pF = 10 ns，上升时间约 22 ns</text>
</svg>
