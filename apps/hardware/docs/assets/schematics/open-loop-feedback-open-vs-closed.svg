<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace"><rect width="900" height="600" fill="#ffffff"/><text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">开环零比较 vs 闭环放大 Open-Loop Comparator vs Closed-Loop</text><line x1="30" y1="46" x2="870" y2="46" stroke="#e3e0d7"/><text x="230" y="110" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">开环：过零比较器</text><polygon points="200,240 200,320 280,280" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/><text x="210" y="270" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">−</text><text x="210" y="302" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">+</text><line x1="150" y1="263" x2="200" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="150" y1="297" x2="200" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><line x1="280" y1="280" x2="320" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><text x="130" y="263" font-size="11" fill="#222a32" text-anchor="end" font-weight="700">V+</text><text x="130" y="297" font-size="11" fill="#222a32" text-anchor="end" font-weight="700">V−</text><line x1="280" y1="280" x2="330" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><circle cx="330" cy="280" r="4.5" fill="#2b3a4a"/><text x="345" y="285" font-size="12" fill="#222a32" text-anchor="start" font-weight="700">Vout=±轨</text><text x="230" y="380" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="400">无反馈 → 输出撞电源轨</text><text x="620" y="110" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">闭环：反相放大</text><polygon points="590,240 590,320 670,280" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/><text x="600" y="270" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">−</text><text x="600" y="302" font-size="20" fill="#222a32" text-anchor="start" font-weight="700">+</text><line x1="540" y1="263" x2="590" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="540" y1="297" x2="590" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><line x1="670" y1="280" x2="710" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><text x="470" y="297" font-size="12" fill="#222a32" text-anchor="end" font-weight="700">Vin</text><line x1="470" y1="297" x2="475" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><rect x="475" y="285" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/><line x1="535" y1="297" x2="540" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><text x="505" y="279" font-size="14" font-weight="700" fill="#1a4f8b" text-anchor="middle">R1</text><line x1="540" y1="297" x2="540" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="540" y1="297" x2="540" y2="297" stroke="#2b3a4a" stroke-width="2.2"/><line x1="540" y1="297" x2="540" y2="317" stroke="#2b3a4a" stroke-width="2.2"/><line x1="540" y1="317" x2="540" y2="340" stroke="#2b3a4a" stroke-width="2.2"/><line x1="540" y1="320" x2="540" y2="340" stroke="#2b3a4a" stroke-width="2.2"/><line x1="526" y1="340" x2="554" y2="340" stroke="#2b3a4a" stroke-width="2.4"/><line x1="531" y1="347" x2="549" y2="347" stroke="#2b3a4a" stroke-width="2.4"/><line x1="535" y1="354" x2="545" y2="354" stroke="#2b3a4a" stroke-width="2.4"/><line x1="670" y1="280" x2="720" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><circle cx="720" cy="280" r="4.5" fill="#2b3a4a"/><text x="735" y="285" font-size="12" fill="#222a32" text-anchor="start" font-weight="700">Vout</text><line x1="720" y1="280" x2="720" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><line x1="600" y1="263" x2="630" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><rect x="630" y="251" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/><line x1="690" y1="263" x2="720" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><text x="660" y="245" font-size="14" font-weight="700" fill="#1a4f8b" text-anchor="middle">Rf</text><line x1="600" y1="263" x2="540" y2="263" stroke="#2b3a4a" stroke-width="2.2"/><text x="620" y="380" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="400">有负反馈 → Vout=−(Rf/R1)Vin</text><text x="450" y="440" font-size="13" fill="#5c6772" text-anchor="start" font-weight="400">同一颗运放：开环是比较器（二值），闭环是放大器（连续、增益由电阻定）</text></svg>