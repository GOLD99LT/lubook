<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="660" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 回路：电池在左，电阻在上 -->
  <!-- 左边竖线 -->
  <line x1="130" y1="110" x2="130" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 电池（两组极板） -->
  <line x1="112" y1="175" x2="148" y2="175" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="120" y1="190" x2="140" y2="190" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="112" y1="205" x2="148" y2="205" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="120" y1="220" x2="140" y2="220" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="130" y1="220" x2="130" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="96" y="183" font-size="20" fill="#b5642e" font-weight="700">+</text>
  <text x="98" y="220" font-size="20" fill="#2b3a4a" font-weight="700">−</text>
  <text x="60" y="205" font-size="18" fill="#1a4f8b" font-weight="700" text-anchor="start">Vs</text>
  <!-- 上边线 + 电阻 -->
  <line x1="130" y1="110" x2="270" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="270" y="98" width="130" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="110" x2="530" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="335" y="88" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">R（负载）</text>
  <!-- 电流箭头（上边线向右） -->
  <line x1="180" y1="110" x2="240" y2="110" stroke="#b5642e" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="210" y="98" font-size="17" fill="#b5642e" font-weight="700" text-anchor="middle">I</text>
  <!-- 右边竖线 -->
  <line x1="530" y1="110" x2="530" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 下边线 -->
  <line x1="130" y1="290" x2="530" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 节点 -->
  <circle cx="130" cy="110" r="4.5" fill="#2b3a4a"/>
  <circle cx="530" cy="110" r="4.5" fill="#2b3a4a"/>
  <!-- 标注 -->
  <text x="335" y="330" font-size="16" fill="#222a32" text-anchor="middle">电池提供电压 Vs → 回路中产生电流 I → 电阻发热消耗功率 P</text>
  <text x="548" y="150" font-size="16" fill="#7a5fc0">电子实际反向流动</text>
  <text x="548" y="170" font-size="13" fill="#5c6772">（电流方向按惯例取正值方向）</text>
</svg>
