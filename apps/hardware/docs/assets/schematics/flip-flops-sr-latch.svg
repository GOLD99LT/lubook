<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">SR 锁存器（双或非门交叉耦合）SR Latch</text>

  <!-- NOR1 (top): output Q -->
  <text x="40" y="120" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">S</text>
  <line x1="65" y1="116" x2="180" y2="116" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="116" x2="65" y2="146" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="146" x2="180" y2="146" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="65" cy="116" r="4.5" fill="#2b3a4a"/>

  <path d="M180,100 Q215,130 180,160 L250,130 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="257" cy="130" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="261" y1="130" x2="400" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="408" y="135" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">Q</text>
  <circle cx="400" cy="130" r="4.5" fill="#2b3a4a"/>

  <!-- NOR2 (bottom): output Qbar -->
  <text x="40" y="250" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">R</text>
  <line x1="65" y1="246" x2="180" y2="246" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="246" x2="65" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="276" x2="180" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="65" cy="246" r="4.5" fill="#2b3a4a"/>

  <path d="M180,230 Q215,260 180,290 L250,260 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="257" cy="260" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="261" y1="260" x2="400" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="408" y="265" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">Q̅</text>
  <circle cx="400" cy="260" r="4.5" fill="#2b3a4a"/>

  <!-- feedback Q -> NOR2 lower input -->
  <line x1="400" y1="130" x2="400" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="320" x2="65" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="320" x2="65" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- feedback Qbar -> NOR1 lower input -->
  <line x1="400" y1="260" x2="460" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="260" x2="460" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="60" x2="65" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="65" y1="60" x2="65" y2="146" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
