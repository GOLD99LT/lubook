<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>阻塞赋值与非阻塞赋值的交换电路对比：写法 A 交换失败，写法 B 交换成功</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">阻塞与非阻塞：同一个交换意图，两种硬件</text>

  <!-- panel A -->
  <rect x="20" y="46" width="350" height="250" fill="#fdf7f4" stroke="#d8c2b4" stroke-width="1.6"/>
  <text x="40" y="72" font-size="13" fill="#b02a2a" text-anchor="start" font-weight="700">写法 A：阻塞赋值（错误）</text>
  <text x="40" y="96" font-size="12" fill="#2b3a4a" text-anchor="start">a = b;   b = a;   顺序执行</text>
  <rect x="40" y="120" width="90" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="85" y="145" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">寄存器 a</text>
  <text x="85" y="163" font-size="11" fill="#1a4f8b" text-anchor="middle">初值 1</text>
  <rect x="250" y="120" width="90" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="295" y="145" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">寄存器 b</text>
  <text x="295" y="163" font-size="11" fill="#1a4f8b" text-anchor="middle">初值 0</text>
  <line x1="130" y1="138" x2="250" y2="158" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="130" y1="158" x2="250" y2="138" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="190" cy="148" r="3.2" fill="#2b3a4a"/>
  <text x="180" y="118" font-size="10" fill="#5a6672" text-anchor="middle">同一时钟沿</text>
  <text x="40" y="205" font-size="12" fill="#b02a2a" text-anchor="start" font-weight="700">结果：a = 0，b = 0（交换失败）</text>
  <text x="40" y="228" font-size="11" fill="#5a6672" text-anchor="start">第二条语句读到的 a 已被第一条改写</text>
  <text x="40" y="250" font-size="11" fill="#5a6672" text-anchor="start">硬件上两个寄存器都接到 b 的旧值</text>

  <!-- panel B -->
  <rect x="390" y="46" width="350" height="250" fill="#f3faf5" stroke="#b9d8c4" stroke-width="1.6"/>
  <text x="410" y="72" font-size="13" fill="#2a7a4a" text-anchor="start" font-weight="700">写法 B：非阻塞赋值（正确）</text>
  <text x="410" y="96" font-size="12" fill="#2b3a4a" text-anchor="start">a &lt;= b;   b &lt;= a;   沿后同时更新</text>
  <rect x="410" y="120" width="90" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="455" y="145" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">寄存器 a</text>
  <text x="455" y="163" font-size="11" fill="#1a4f8b" text-anchor="middle">初值 1</text>
  <rect x="620" y="120" width="90" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="665" y="145" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">寄存器 b</text>
  <text x="665" y="163" font-size="11" fill="#1a4f8b" text-anchor="middle">初值 0</text>
  <line x1="500" y1="138" x2="620" y2="158" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="158" x2="620" y2="138" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="560" cy="148" r="3.2" fill="#2b3a4a"/>
  <text x="550" y="118" font-size="10" fill="#5a6672" text-anchor="middle">同一时钟沿</text>
  <text x="410" y="205" font-size="12" fill="#2a7a4a" text-anchor="start" font-weight="700">结果：a = 0，b = 1（交换成功）</text>
  <text x="410" y="228" font-size="11" fill="#5a6672" text-anchor="start">两条语句都采样时钟沿前的旧值</text>
  <text x="410" y="250" font-size="11" fill="#5a6672" text-anchor="start">硬件上是两个输入交叉相连的触发器</text>

  <text x="24" y="330" font-size="12" fill="#2b3a4a" text-anchor="start">规则：时序块一律用 &lt;=，组合块一律用 =；同一信号只在一个 always 块里赋值</text>
  <text x="24" y="352" font-size="12" fill="#5a6672" text-anchor="start">综合工具对两种写法都不报错，差异只体现在硬件结构与上板行为上，编译器帮不了你</text>
  <text x="24" y="386" font-size="12" fill="#1a4f8b" text-anchor="start" font-weight="700">验证手段：代码评审查赋值符号 → 仿真看交换结果 → 时序报告确认路径 → 上板用 ILA 抓波形</text>
</svg>
