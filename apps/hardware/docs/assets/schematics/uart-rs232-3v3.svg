<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace" role="img">
  <title>3.3V MCU 经 MAX3232 电平转换到 RS-232 DB9：电荷泵产生正负电源，四只 0.1 微法电容就近接地</title>
  <rect width="860" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">3.3V MCU 经 MAX3232 转 RS-232（电荷泵 4×0.1µF）</text>

  <!-- MCU -->
  <rect x="50" y="150" width="140" height="140" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="182" font-size="13" font-weight="700" fill="#1a4f8b" text-anchor="middle">MCU</text>
  <text x="120" y="204" font-size="11" fill="#5c6772" text-anchor="middle">VDD = 3.3V</text>
  <text x="196" y="224" font-size="11" fill="#5c6772">TXD</text>
  <text x="196" y="284" font-size="11" fill="#5c6772">RXD</text>

  <!-- MAX3232 -->
  <rect x="300" y="130" width="200" height="190" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="400" y="160" font-size="13" font-weight="700" fill="#1a4f8b" text-anchor="middle">MAX3232</text>
  <text x="400" y="182" font-size="11" fill="#5c6772" text-anchor="middle">VCC = 3.3V</text>
  <text x="400" y="203" font-size="11" fill="#b5642e" text-anchor="middle">V+ ≈ +5.5V</text>
  <text x="400" y="224" font-size="11" fill="#b5642e" text-anchor="middle">V− ≈ −5.5V</text>
  <text x="400" y="245" font-size="11" fill="#5c6772" text-anchor="middle">4×0.1µF 电荷泵</text>

  <!-- 信号线 -->
  <line x1="190" y1="230" x2="300" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="190" y1="290" x2="300" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="230" x2="630" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="290" x2="630" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="512" y="222" font-size="10" fill="#b5642e">T1OUT ±5.5V</text>
  <text x="512" y="308" font-size="10" fill="#b5642e">R1IN</text>

  <!-- 电荷泵电容 C1 -->
  <line x1="350" y1="320" x2="350" y2="342" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="332" y1="342" x2="368" y2="342" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="332" y1="356" x2="368" y2="356" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="350" y1="356" x2="350" y2="378" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="336" y1="378" x2="364" y2="378" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="341" y1="385" x2="359" y2="385" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="345" y1="392" x2="355" y2="392" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="376" y="352" font-size="10" fill="#1a4f8b">C1 0.1µF</text>

  <!-- 电荷泵电容 C2 -->
  <line x1="450" y1="320" x2="450" y2="342" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="432" y1="342" x2="468" y2="342" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="432" y1="356" x2="468" y2="356" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="450" y1="356" x2="450" y2="378" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="436" y1="378" x2="464" y2="378" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="441" y1="385" x2="459" y2="385" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="445" y1="392" x2="455" y2="392" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="476" y="352" font-size="10" fill="#1a4f8b">C2 0.1µF</text>

  <!-- VCC 去耦：从 VCC 引脚向左，经电容到地 -->
  <line x1="300" y1="150" x2="270" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="150" x2="270" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="252" y1="170" x2="288" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="252" y1="184" x2="288" y2="184" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="270" y1="184" x2="270" y2="204" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="256" y1="204" x2="284" y2="204" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="261" y1="211" x2="279" y2="211" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="265" y1="218" x2="275" y2="218" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="196" y="168" font-size="10" fill="#1a4f8b">0.1µF 去耦</text>

  <!-- DB9 -->
  <rect x="630" y="190" width="130" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="695" y="226" font-size="13" font-weight="700" fill="#222a32" text-anchor="middle">DB9</text>
  <text x="695" y="248" font-size="11" fill="#5c6772" text-anchor="middle">RS-232 口</text>
  <line x1="695" y1="290" x2="695" y2="312" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="681" y1="312" x2="709" y2="312" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="686" y1="319" x2="704" y2="319" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="690" y1="326" x2="700" y2="326" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="40" y="420" font-size="11" fill="#7a5fc0">MAX232 是 5V 器件，不能直接用在 3.3V；3.3V 系统选 MAX3232/SP3232。电荷泵电容按手册取 0.1µF 并就近接地。</text>
</svg>
