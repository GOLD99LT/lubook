<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">复位同步器：异步置位、同步释放 Reset Synchronizer</text>

  <!-- async reset in -->
  <text x="30" y="80" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">异步复位 /RST</text>
  <line x1="130" y1="76" x2="130" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="130" cy="76" r="4.5" fill="#2b3a4a"/>

  <!-- FF1 -->
  <rect x="200" y="90" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="250" y="140" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF1</text>
  <!-- /RST to async clear of FF1 (top) -->
  <line x1="130" y1="200" x2="130" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="130" y1="60" x2="250" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="60" x2="250" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="250" cy="94" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- FF1.Q -> FF2.D -->
  <line x1="300" y1="135" x2="400" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- FF2 -->
  <rect x="400" y="90" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="450" y="140" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF2</text>
  <!-- /RST also to FF2 async clear -->
  <line x1="130" y1="200" x2="450" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="200" x2="450" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="450" cy="94" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="130" cy="200" r="4.5" fill="#2b3a4a"/>

  <!-- internal reset out = FF2.Q (active: low until released synchronously) -->
  <line x1="500" y1="135" x2="580" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="510" y="125" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">内部复位(同步释放)</text>

  <!-- tie FF1.D high -->
  <text x="160" y="180" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">D=1</text>
  <line x1="180" y1="176" x2="200" y2="176" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="176" x2="200" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- CLK -->
  <text x="30" y="260" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">CLK</text>
  <line x1="70" y1="256" x2="450" y2="256" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="256" x2="250" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="256" x2="450" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
