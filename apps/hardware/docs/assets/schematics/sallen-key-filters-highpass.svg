<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>Sallen-Key 二阶高通：C1 与 C2 串联，R1 从节点 A 反馈到输出，R2 从同相端接地，运放增益 K=1+Rb/Ra</title>
  <rect width="760" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrowHP" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入与 C1 -->
  <text x="40" y="215" font-size="20" fill="#2b3a4a">Vin</text>
  <line x1="40" y1="230" x2="70" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="70" y1="230" x2="85" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="85" y1="214" x2="85" y2="246" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="93" y1="214" x2="93" y2="246" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="93" y1="230" x2="200" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="89" y="204" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">C1</text>
  <!-- 节点 A 与 C2 -->
  <circle cx="200" cy="230" r="4.5" fill="#2b3a4a"/>
  <line x1="200" y1="230" x2="245" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="245" y1="214" x2="245" y2="246" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="253" y1="214" x2="253" y2="246" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="253" y1="230" x2="360" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="249" y="204" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">C2</text>
  <!-- 节点 B 与同相输入 -->
  <circle cx="360" cy="230" r="4.5" fill="#2b3a4a"/>
  <line x1="360" y1="230" x2="360" y2="275" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="275" x2="400" y2="275" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="360" cy="275" r="4.5" fill="#2b3a4a"/>
  <!-- 运放 -->
  <polygon points="400,160 400,300 540,230" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="414" y="192" font-size="24" fill="#2b3a4a" font-weight="700">-</text>
  <text x="414" y="282" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <!-- R2 到地 -->
  <line x1="360" y1="230" x2="360" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="349" y="300" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="346" x2="360" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="346" y1="380" x2="374" y2="380" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="351" y1="387" x2="369" y2="387" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="355" y1="394" x2="365" y2="394" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="384" y="328" font-size="19" fill="#1a4f8b" font-weight="700">R2</text>
  <!-- R1 反馈：节点 A 到输出 -->
  <line x1="200" y1="230" x2="200" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="100" x2="230" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="230" y="89" width="100" height="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="100" x2="700" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="700" y1="100" x2="700" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="280" y="80" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1</text>
  <!-- 输出 -->
  <line x1="540" y1="230" x2="730" y2="230" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowHP)"/>
  <circle cx="620" cy="230" r="4.5" fill="#2b3a4a"/>
  <circle cx="700" cy="230" r="4.5" fill="#2b3a4a"/>
  <text x="738" y="236" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 反馈分压 Rb / Ra -->
  <line x1="620" y1="230" x2="620" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="609" y="255" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="301" x2="620" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="620" cy="330" r="4.5" fill="#2b3a4a"/>
  <line x1="620" y1="330" x2="380" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="330" x2="380" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="185" x2="400" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="330" x2="620" y2="355" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="609" y="355" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="401" x2="620" y2="430" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="606" y1="430" x2="634" y2="430" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="611" y1="437" x2="629" y2="437" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="615" y1="444" x2="625" y2="444" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="642" y="283" font-size="19" fill="#1a4f8b" font-weight="700">Rb</text>
  <text x="642" y="383" font-size="19" fill="#1a4f8b" font-weight="700">Ra</text>
</svg>
