<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>含受控源的单节点电路：12V 经 R1=4Ω 到节点 A，A 经 R2=4Ω 到地，同时接一个由 V_A 控制的电流源 i_d=0.25·V_A</title>
  <rect width="720" height="470" fill="#ffffff"/>

  <!-- 上轨与下轨 -->
  <line x1="110" y1="110" x2="540" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="320" x2="540" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 电源 12V -->
  <line x1="110" y1="110" x2="110" y2="196" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="92" y1="196" x2="128" y2="196" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="98" y1="206" x2="122" y2="206" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="92" y1="216" x2="128" y2="216" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="98" y1="226" x2="122" y2="226" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="110" y1="226" x2="110" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="134" y="200" font-size="16" fill="#b5642e" font-weight="700" text-anchor="start">+</text>
  <text x="136" y="232" font-size="16" fill="#2b3a4a" font-weight="700" text-anchor="start">−</text>
  <text x="86" y="216" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="end">12 V</text>

  <!-- R1 水平放置在上轨 -->
  <rect x="230" y="98" width="70" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="265" y="90" font-size="17" fill="#1a4f8b" font-weight="700" text-anchor="middle">R₁ = 4 Ω</text>

  <!-- 节点 A -->
  <circle cx="380" cy="110" r="5" fill="#2b3a4a"/>
  <text x="398" y="96" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="start">节点 A（V_A）</text>

  <!-- R2 竖直支路 -->
  <line x1="380" y1="110" x2="380" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="368" y="160" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="210" x2="380" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="356" y="190" font-size="17" fill="#1a4f8b" font-weight="700" text-anchor="end">R₂ = 4 Ω</text>

  <!-- 受控源 VCCS 支路 -->
  <line x1="380" y1="110" x2="540" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="110" x2="540" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="540,160 560,190 540,220 520,190" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="172" x2="540" y2="198" stroke="#b5642e" stroke-width="2.6"/>
  <polygon points="533,195 547,195 540,208" fill="#b5642e"/>
  <line x1="540" y1="220" x2="540" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="574" y="176" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="start">VCCS</text>
  <text x="574" y="200" font-size="15" fill="#b5642e" font-weight="700" text-anchor="start">i_d = g · V_A</text>
  <text x="574" y="224" font-size="15" fill="#222a32" text-anchor="start">g = 0.25 S</text>

  <!-- 接地 -->
  <line x1="380" y1="320" x2="380" y2="335" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="335" x2="400" y2="335" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="368" y1="342" x2="392" y2="342" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="374" y1="349" x2="386" y2="349" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="410" y="344" font-size="15" fill="#222a32" text-anchor="start">0 V（参考地）</text>

  <!-- 结论与方程 -->
  <text x="360" y="396" font-size="15" fill="#222a32" text-anchor="middle">KCL（流出 A 为正）：(V_A − 12)/4 + V_A/4 + i_d = 0</text>
  <text x="360" y="420" font-size="15" fill="#222a32" text-anchor="middle">控制方程：i_d = 0.25·V_A  →  3·V_A = 12  →  V_A = 4 V；2 A = 1 A + 1 A</text>
  <text x="360" y="444" font-size="15" fill="#222a32" text-anchor="middle">功率：12V 源发出 24 W = R₁ 16W + R₂ 4W + 受控源吸收 4W</text>
</svg>
