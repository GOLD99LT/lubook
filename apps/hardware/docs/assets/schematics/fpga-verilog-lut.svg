<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">4 输入 LUT = 16:1 MUX（配置位决定函数）LUT as MUX</text>

  <!-- config bits -->
  <rect x="80" y="70" width="200" height="180" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="180" y="95" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">16 个配置位</text>
  <text x="180" y="115" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">(上电时烧入)</text>
  <text x="100" y="150" font-size="12" fill="#5a6672" text-anchor="start">b0 b1 b2 b3 …</text>
  <text x="100" y="175" font-size="12" fill="#5a6672" text-anchor="start">b12 b13 b14 b15</text>

  <!-- mux -->
  <polygon points="320,100 320,240 420,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="175" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">16:1</text>
  <text x="360" y="193" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">MUX</text>
  <line x1="280" y1="160" x2="320" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="280" y1="190" x2="320" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- address select -->
  <text x="430" y="100" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">输入 A[3:0]</text>
  <line x1="430" y1="170" x2="420" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- output -->
  <line x1="420" y1="170" x2="540" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="548" y="175" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y(函数输出)</text>

  <text x="24" y="290" font-size="13" fill="#5a6672" text-anchor="start">A[3:0] 是 4 位输入，选中 16 个配置位中的一个输出；改配置位 = 改逻辑函数</text>
  <text x="24" y="315" font-size="13" fill="#5a6672" text-anchor="start">任意 4 输入组合逻辑都能用 1 个 LUT 实现——这就是 FPGA "可编程" 的本质</text>
</svg>
