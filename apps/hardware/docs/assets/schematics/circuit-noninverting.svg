<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="420" height="260" fill="#ffffff"/>
  <!-- Vin 到同相端 -->
  <text x="30" y="170" font-size="16" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="165" x2="230" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 运放 -->
  <polygon points="230,110 230,200 330,155" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="245" y="135" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="245" y="180" font-size="18" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 反相端节点 -->
  <circle cx="215" cy="130" r="4.5" fill="#2b3a4a"/>
  <line x1="215" y1="130" x2="215" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R1 下地 -->
  <rect x="203" y="200" width="24" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="235" y="225" font-size="15" fill="#1a4f8b" font-weight="700">R1</text>
  <line x1="215" y1="240" x2="215" y2="245" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="201" y1="245" x2="229" y2="245" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="206" y1="252" x2="224" y2="252" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 反馈 Rf -->
  <line x1="215" y1="130" x2="215" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="215" y1="70" x2="300" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="270" y="58" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="50" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <line x1="330" y1="70" x2="360" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="70" x2="360" y2="155" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 输出 -->
  <line x1="330" y1="155" x2="390" y2="155" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="398" y="161" font-size="16" fill="#1a4f8b" font-weight="700">Vout</text>
  <circle cx="360" cy="155" r="4.5" fill="#2b3a4a"/>
</svg>
