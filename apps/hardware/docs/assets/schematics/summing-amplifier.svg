<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- V1/R1 -->
  <line x1="40" y1="90" x2="110" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="78" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="190" y1="90" x2="240" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="78" font-size="18" fill="#2b3a4a">V₁</text>
  <text x="150" y="66" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₁</text>
  <!-- V2/R2 -->
  <line x1="40" y1="150" x2="110" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="138" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="190" y1="150" x2="240" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="138" font-size="18" fill="#2b3a4a">V₂</text>
  <text x="150" y="126" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₂</text>
  <!-- V3/R3 -->
  <line x1="40" y1="210" x2="110" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="198" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="190" y1="210" x2="240" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="198" font-size="18" fill="#2b3a4a">V₃</text>
  <text x="150" y="186" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₃</text>
  <!-- 垂直汇总母线 -->
  <line x1="240" y1="90" x2="240" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="240" cy="150" r="4.5" fill="#2b3a4a"/>
  <line x1="240" y1="150" x2="270" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 运放 -->
  <polygon points="300,80 300,220 450,150" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="142" font-size="24" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="196" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <line x1="270" y1="150" x2="300" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="270" cy="150" r="4.5" fill="#2b3a4a"/>
  <!-- 同相端接地 -->
  <line x1="300" y1="185" x2="300" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="240" x2="314" y2="240" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="247" x2="309" y2="247" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="254" x2="305" y2="254" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- Rf 反馈 -->
  <line x1="270" y1="150" x2="270" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="55" x2="330" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="43" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="55" x2="510" y2="55" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="510" y1="55" x2="510" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="33" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <!-- 输出 -->
  <line x1="450" y1="150" x2="620" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="630" y="156" font-size="19" fill="#2b3a4a">Vout</text>
  <circle cx="510" cy="150" r="4.5" fill="#2b3a4a"/>
</svg>
