<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：TVS 钳位 — 没保护 vs 有保护</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="280" x2="760" y2="280" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="80" y1="280" x2="80" y2="70" stroke="#2b3a4a" stroke-width="2"/>
  <text x="760" y="300" font-size="12" fill="#222a32" text-anchor="end">时间</text>

  <!-- 没保护：尖峰到 kV -->
  <path d="M120,280 L140,280 L148,90 L156,280 L700,280" fill="none" stroke="#b03a3a" stroke-width="2.6"/>
  <text x="160" y="100" font-size="12" fill="#b03a3a">没 TVS：kV 尖峰直接打向 IC</text>

  <!-- 有保护：钳到几V -->
  <path d="M350,280 L365,280 L372,200 L380,280 L700,280" fill="none" stroke="#2f6e4f" stroke-width="2.6"/>
  <text x="380" y="195" font-size="12" fill="#2f6e4f">有 TVS：钳位到 ~10V（IC 耐压内）</text>

  <!-- IC 耐压线 -->
  <line x1="80" y1="210" x2="760" y2="210" stroke="#1a4f8b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <text x="700" y="205" font-size="11.5" fill="#1a4f8b">IC 耐压(如 15V)</text>

  <text x="60" y="330" font-size="12.5" fill="#222a32">TVS 选型：反向工作电压 VRWM &gt; 正常信号电压；钳位电压 VC &lt; 被保护 IC 耐压；封装寄生电容别拖慢高速信号。</text>
</svg>
