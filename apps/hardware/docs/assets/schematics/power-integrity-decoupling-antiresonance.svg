<svg viewBox="0 0 820 230" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="230" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">电容并联反谐振（Anti-Resonance）：两容值间出现阻抗尖峰</text>

  <!-- 电源轨 -->
  <line x1="120" y1="90" x2="600" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="70" y="95" font-size="13" fill="#1a4f8b" font-weight="700">VCC</text>

  <!-- 大电容 -->
  <line x1="250" y1="90" x2="250" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="234" y1="120" x2="266" y2="120" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="234" y1="138" x2="266" y2="138" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="250" y1="138" x2="250" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="236" y1="180" x2="264" y2="180" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="250" y="205" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">C1=10µF (ESL)</text>

  <!-- 小电容 -->
  <line x1="430" y1="90" x2="430" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="416" y1="120" x2="444" y2="120" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="416" y1="134" x2="444" y2="134" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="430" y1="134" x2="430" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="416" y1="180" x2="444" y2="180" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="430" y="205" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">C2=0.1µF (ESL)</text>

  <text x="30" y="225" font-size="13" fill="#222a32">C1 在低频低阻、C2 在高频低阻；但在两容值自谐振频率之间，二者并联谐振出阻抗尖峰，需更多中间容值或选低 ESR 缓解</text>
</svg>
