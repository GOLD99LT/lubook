<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">稳压管、LED、TVS 电路符号</text>

  <!-- 稳压管 -->
  <line x1="60" y1="120" x2="110" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="110,102 110,138 142,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="142" y1="104" x2="142" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <path d="M142,104 q-8,3 -8,9 M142,136 q-8,-3 -8,-9" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="134" y1="120" x2="190" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="170" font-size="14" fill="#5c6772" text-anchor="middle">稳压管 Zener</text>

  <!-- LED -->
  <line x1="300" y1="120" x2="350" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="350,102 350,138 382,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="382" y1="104" x2="382" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="385" y1="99" x2="402" y2="82" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="402,82 393,83 399,91" fill="#4f9e63"/>
  <line x1="373" y1="97" x2="390" y2="80" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="390,80 381,81 387,89" fill="#4f9e63"/>
  <line x1="382" y1="120" x2="430" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="170" font-size="14" fill="#5c6772" text-anchor="middle">发光二极管 LED</text>

  <!-- TVS -->
  <line x1="490" y1="120" x2="540" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="540,102 540,138 572,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="572" y1="104" x2="572" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <path d="M572,104 q-8,3 -8,9 M572,136 q-8,-3 -8,-9" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="564" y1="120" x2="620" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="580" y="170" font-size="14" fill="#5c6772" text-anchor="middle">TVS 瞬态抑制</text>
</svg>
