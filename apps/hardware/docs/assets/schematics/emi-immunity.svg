<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：EMS 抗扰度测试（DPI / EFT / ESD）</text>

  <!-- EUT -->
  <rect x="320" y="130" width="180" height="100" fill="#eef4fb" stroke="#1a4f8b" stroke-width="2.2"/>
  <text x="410" y="175" font-size="13" fill="#1a4f8b" text-anchor="middle">被测设备 EUT</text>
  <text x="410" y="198" font-size="11.5" fill="#3a5a80" text-anchor="middle">你的板子</text>

  <!-- 注入源 -->
  <rect x="80" y="140" width="160" height="80" fill="#fdf3e7" stroke="#b5642e" stroke-width="2"/>
  <text x="160" y="172" font-size="12.5" fill="#b5642e" text-anchor="middle">噪声注入源</text>
  <text x="160" y="195" font-size="11" fill="#7a5a30" text-anchor="middle">EFT/ESD/DPI</text>
  <line x1="240" y1="180" x2="318" y2="180" stroke="#b03a3a" stroke-width="2.4" stroke-dasharray="6,4"/>
  <text x="279" y="172" font-size="11" fill="#b03a3a" text-anchor="middle">注入</text>

  <!-- 监测 -->
  <rect x="580" y="140" width="160" height="80" fill="#f0f8f0" stroke="#2f6e4f" stroke-width="2"/>
  <text x="660" y="172" font-size="12.5" fill="#2f6e4f" text-anchor="middle">监测</text>
  <text x="660" y="195" font-size="11" fill="#2f5a3f" text-anchor="middle">功能是否正常</text>
  <line x1="500" y1="180" x2="578" y2="180" stroke="#2f6e4f" stroke-width="2.2"/>

  <text x="60" y="290" font-size="12.5" fill="#222a32">EMS = 设备抗外部噪声的能力。常见标准：EFT 电快速瞬变脉冲群(IEC 61000-4-4)、</text>
  <text x="60" y="315" font-size="12.5" fill="#222a32">ESD 静电放电(IEC 61000-4-2)、DPI 直接功率注入(IEC 62132-4)。板子在这些干扰下不应复位/死机。</text>
  <text x="60" y="340" font-size="12.5" fill="#b5642e">AND8301-D：VIN/VOUT 加 1nF 去耦后，DPI 抗扰在对应频段提升 10–20 dBm。</text>
</svg>
