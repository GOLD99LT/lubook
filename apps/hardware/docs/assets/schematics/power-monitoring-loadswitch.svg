<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="860" height="300" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">电源监控 + 负载开关：上电时序、复位与受控供电</text>

  <!-- VIN -->
  <text x="40" y="100" font-size="14" fill="#1a4f8b" font-weight="700">VIN</text>
  <line x1="90" y1="96" x2="160" y2="96" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 负载开关（高侧 MOSFET + dVdt） -->
  <rect x="160" y="70" width="140" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="230" y="96" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">负载开关</text>
  <text x="230" y="114" font-size="10" fill="#5c6772" text-anchor="middle">高侧 MOS + dV/dt</text>
  <line x1="300" y1="96" x2="480" y2="96" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="480" cy="96" r="4.5" fill="#2b3a4a"/>
  <text x="490" y="100" font-size="14" fill="#1a4f8b" font-weight="700">VOUT→负载</text>

  <!-- 监控/复位 IC -->
  <rect x="360" y="170" width="180" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="450" y="200" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">电压监控/复位 IC</text>
  <text x="450" y="220" font-size="11" fill="#5c6772" text-anchor="middle">门槛检测+迟滞+延时</text>
  <line x1="480" y1="96" x2="480" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="490" y="140" font-size="11" fill="#5c6772">检测 VOUT</text>

  <!-- RESET -->
  <line x1="540" y1="210" x2="660" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="670" y="215" font-size="13" fill="#1a4f8b" font-weight="700">RESET→MCU</text>

  <!-- EN -->
  <line x1="230" y1="70" x2="230" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="180" y="44" font-size="12" fill="#5c6772">EN 使能（MCU 控制上电时序）</text>

  <text x="30" y="285" font-size="13" fill="#222a32">监控：电压跌落到门槛以下→拉低 RESET；负载开关：EN 控制导通斜率，抑制浪涌电流</text>
</svg>
