<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="400" height="220" fill="#ffffff"/>
  <!-- Vcc -->
  <text x="50" y="45" font-size="16" fill="#2b3a4a">Vcc</text>
  <line x1="85" y1="40" x2="150" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 上拉 R -->
  <rect x="138" y="50" width="24" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="75" font-size="14" fill="#1a4f8b" font-weight="700">R 10k</text>
  <!-- 节点 -->
  <line x1="150" y1="90" x2="150" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="150" cy="120" r="4.5" fill="#2b3a4a"/>
  <line x1="150" y1="120" x2="290" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="126" font-size="15" fill="#1a4f8b" font-weight="700">到 MCU IO</text>
  <!-- 按键 -->
  <line x1="150" y1="120" x2="150" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="135" y="150" width="30" height="14" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="150" y1="164" x2="150" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="136" y1="180" x2="164" y2="180" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="141" y1="187" x2="159" y2="187" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="145" y1="194" x2="155" y2="194" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 去抖电容 C -->
  <line x1="220" y1="120" x2="220" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="206" y1="145" x2="234" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="206" y1="157" x2="234" y2="157" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="240" y="155" font-size="14" fill="#1a4f8b" font-weight="700">C 100nF</text>
  <line x1="220" y1="157" x2="220" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
