<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>s 平面极点位置与二阶系统阶跃响应</title>
  <rect width="660" height="340" fill="#ffffff"/>

  <!-- 左：s 平面 -->
  <text x="60" y="42" font-size="15" fill="#222a32" font-weight="700">s 平面：极点位置</text>
  <rect x="70" y="70" width="120" height="230" fill="#f3f6fa"/>
  <line x1="70" y1="190" x2="330" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="190" y1="70" x2="190" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="330,190 320,185 320,195" fill="#2b3a4a"/>
  <polygon points="190,70 185,80 195,80" fill="#2b3a4a"/>
  <text x="334" y="195" font-size="13" fill="#222a32">σ</text>
  <text x="198" y="64" font-size="13" fill="#222a32">jω</text>
  <text x="78" y="84" font-size="12" fill="#2f7d4f">左半平面：稳定</text>
  <text x="206" y="84" font-size="12" fill="#b5642e">右半平面：发散</text>

  <!-- 一阶实极点 -->
  <line x1="93" y1="183" x2="107" y2="197" stroke="#b5642e" stroke-width="2.6"/>
  <line x1="93" y1="197" x2="107" y2="183" stroke="#b5642e" stroke-width="2.6"/>
  <text x="100" y="174" font-size="12" fill="#b5642e" text-anchor="middle">−ωp</text>

  <!-- 二阶共轭极点 -->
  <line x1="153" y1="123" x2="167" y2="137" stroke="#1a4f8b" stroke-width="2.6"/>
  <line x1="153" y1="137" x2="167" y2="123" stroke="#1a4f8b" stroke-width="2.6"/>
  <line x1="153" y1="243" x2="167" y2="257" stroke="#1a4f8b" stroke-width="2.6"/>
  <line x1="153" y1="257" x2="167" y2="243" stroke="#1a4f8b" stroke-width="2.6"/>
  <line x1="160" y1="130" x2="190" y2="130" stroke="#1a4f8b" stroke-width="1.4" stroke-dasharray="4,4"/>
  <line x1="160" y1="130" x2="160" y2="250" stroke="#1a4f8b" stroke-width="1.4" stroke-dasharray="4,4"/>
  <text x="154" y="206" font-size="12" fill="#1a4f8b" text-anchor="end">−ζωn</text>
  <text x="198" y="128" font-size="12" fill="#1a4f8b">+jωd</text>
  <text x="198" y="262" font-size="12" fill="#1a4f8b">−jωd</text>
  <text x="70" y="325" font-size="12" fill="#222a32">实部决定衰减快慢，虚部决定振荡频率</text>

  <!-- 右：阶跃响应 -->
  <text x="370" y="42" font-size="15" fill="#222a32" font-weight="700">阶跃响应（ωn = 2π × 1 kHz）</text>
  <line x1="380" y1="300" x2="610" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="380" y1="300" x2="380" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="610,300 600,295 600,305" fill="#2b3a4a"/>
  <polygon points="380,70 375,80 385,80" fill="#2b3a4a"/>
  <line x1="380" y1="165" x2="600" y2="165" stroke="#8a97a6" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="370" y="169" font-size="11" fill="#55616f" text-anchor="end">1.0</text>
  <text x="370" y="303" font-size="11" fill="#55616f" text-anchor="end">0</text>
  <text x="386" y="60" font-size="12" fill="#222a32">归一化输出 y(t)</text>
  <text x="495" y="336" font-size="12" fill="#222a32" text-anchor="middle">时间 t / ms</text>
  <text x="380" y="318" font-size="11" fill="#55616f" text-anchor="middle">0</text>
  <text x="424" y="318" font-size="11" fill="#55616f" text-anchor="middle">1</text>
  <text x="468" y="318" font-size="11" fill="#55616f" text-anchor="middle">2</text>
  <text x="512" y="318" font-size="11" fill="#55616f" text-anchor="middle">3</text>
  <text x="556" y="318" font-size="11" fill="#55616f" text-anchor="middle">4</text>
  <text x="600" y="318" font-size="11" fill="#55616f" text-anchor="middle">5</text>

  <polyline points="380,300 402,94 424,202 446,145 468,175 490,160 512,167 534,163 556,165 578,164 600,165"
            fill="none" stroke="#b5642e" stroke-width="2.4"/>
  <polyline points="380,300 402,168 424,163 446,165 468,165 490,165 512,165 534,165 556,165 578,165 600,165"
            fill="none" stroke="#1a4f8b" stroke-width="2.4"/>
  <polyline points="380,300 402,212 424,179 446,169 468,166 490,165 512,165 534,165 556,165 578,165 600,165"
            fill="none" stroke="#2f7d4f" stroke-width="2.4"/>
  <text x="410" y="90" font-size="11" fill="#b5642e">52.7%</text>
  <line x1="470" y1="80" x2="492" y2="80" stroke="#b5642e" stroke-width="2.4"/>
  <text x="498" y="84" font-size="12" fill="#222a32">ζ = 0.2</text>
  <line x1="470" y1="98" x2="492" y2="98" stroke="#1a4f8b" stroke-width="2.4"/>
  <text x="498" y="102" font-size="12" fill="#222a32">ζ = 0.707</text>
  <line x1="470" y1="116" x2="492" y2="116" stroke="#2f7d4f" stroke-width="2.4"/>
  <text x="498" y="120" font-size="12" fill="#222a32">ζ = 1.5</text>
</svg>
