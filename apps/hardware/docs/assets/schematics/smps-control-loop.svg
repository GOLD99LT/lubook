<svg viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="700" fill="#222a32">开关电源闭环：误差放大器 → 调制器 → 功率级 → 反馈</text>

  <!-- Vref -->
  <text x="34" y="180" font-size="15" fill="#1a4f8b" font-weight="700">Vref</text>
  <line x1="70" y1="176" x2="180" y2="176" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 误差放大器（补偿器）三角形 -->
  <polygon points="180,150 180,220 285,185" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="196" y="178" font-size="16" fill="#2b3a4a" font-weight="700">−</text>
  <text x="196" y="208" font-size="16" fill="#2b3a4a" font-weight="700">+</text>
  <text x="225" y="150" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">误差放大器/补偿器</text>
  <line x1="285" y1="185" x2="330" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="176" font-size="12" fill="#5c6772">vc</text>

  <!-- PWM 调制器 -->
  <rect x="330" y="160" width="90" height="50" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="375" y="190" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">PWM 调制</text>
  <line x1="420" y1="185" x2="460" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 功率级 -->
  <rect x="460" y="150" width="150" height="70" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="535" y="180" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">功率级 Gvd(s)</text>
  <text x="535" y="202" font-size="12" fill="#5c6772" text-anchor="middle">开关+LC/变压器</text>
  <line x1="610" y1="185" x2="720" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- Vout -->
  <circle cx="720" cy="185" r="4.5" fill="#2b3a4a"/>
  <text x="730" y="180" font-size="16" fill="#1a4f8b" font-weight="700">Vout</text>
  <line x1="720" y1="185" x2="860" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 反馈支路 -->
  <line x1="720" y1="185" x2="720" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="200" x2="180" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="290" x2="720" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 反馈分压 H -->
  <rect x="420" y="270" width="130" height="40" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="485" y="295" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">反馈分压 H</text>
  <line x1="485" y1="310" x2="485" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="471" y1="330" x2="499" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="476" y1="337" x2="494" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="480" y1="344" x2="490" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="460" y="120" font-size="14" fill="#222a32">环路增益 T(s) = Gc(s) · Gpwm · Gvd(s) · H；穿越 0dB 处相位裕度 PM 应 &gt; 45°</text>
</svg>
