<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="400" height="240" fill="#ffffff"/>
  <!-- Vcc 顶部 -->
  <text x="60" y="45" font-size="17" fill="#2b3a4a">Vcc</text>
  <line x1="90" y1="40" x2="200" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 上拉电阻 Rpu -->
  <rect x="188" y="50" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="40" x2="200" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="228" y="80" font-size="16" fill="#1a4f8b" font-weight="700">Rpu (10k)</text>
  <!-- 节点 SDA/信号 -->
  <line x1="200" y1="100" x2="200" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="200" cy="120" r="4.5" fill="#2b3a4a"/>
  <line x1="200" y1="120" x2="320" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="330" y="126" font-size="16" fill="#1a4f8b" font-weight="700">信号/IO</text>
  <!-- 按键到 GND -->
  <line x1="200" y1="140" x2="200" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="185" y="170" width="30" height="16" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="230" y="183" font-size="14" fill="#2b3a4a">按键/开漏</text>
  <line x1="200" y1="186" x2="200" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="186" y1="200" x2="214" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="191" y1="207" x2="209" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="195" y1="214" x2="205" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
