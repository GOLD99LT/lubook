<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">上升沿 D 触发器 Positive-Edge D Flip-Flop</text>

  <!-- FF block -->
  <rect x="220" y="90" width="180" height="200" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="310" y="195" font-size="16" fill="#2b3a4a" text-anchor="middle" font-weight="700">D Flip-Flop</text>

  <!-- D input left -->
  <text x="60" y="160" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">D</text>
  <line x1="90" y1="156" x2="220" y2="156" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- CLK input bottom-left with edge triangle -->
  <text x="60" y="320" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">CLK</text>
  <line x1="100" y1="316" x2="220" y2="316" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="220,296 220,336 250,316" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- Q output right top -->
  <line x1="400" y1="156" x2="540" y2="156" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="548" y="161" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">Q</text>

  <!-- Qbar output right bottom -->
  <line x1="400" y1="220" x2="540" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="548" y="225" font-size="15" fill="#1a4f8b" text-anchor="start" font-weight="700">Q̅</text>

  <!-- async Preset (top) -->
  <text x="250" y="70" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">/Preset(异步置1)</text>
  <line x1="280" y1="74" x2="280" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="280" cy="94" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- async Clear (bottom) -->
  <text x="250" y="330" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">/Clear(异步清0)</text>
  <line x1="340" y1="336" x2="340" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="340" cy="294" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="24" y="365" font-size="13" fill="#5a6672" text-anchor="start">CLK 端三角 = 上升沿触发；小圆圈 = 低电平有效</text>
</svg>
