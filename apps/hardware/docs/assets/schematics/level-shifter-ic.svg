<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">专用双向电平转换 IC（如 TXB0108）Level Shifter IC</text>

  <!-- IC block -->
  <rect x="200" y="90" width="240" height="140" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="320" y="150" font-size="15" fill="#2b3a4a" text-anchor="middle" font-weight="700">Level Shifter</text>
  <text x="320" y="172" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">8-bit 双向</text>

  <!-- A side -->
  <text x="60" y="120" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A1~A8 (1.8V)</text>
  <line x1="150" y1="116" x2="200" y2="116" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="150" y1="140" x2="200" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="150" y1="164" x2="200" y2="164" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- B side -->
  <text x="460" y="120" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B1~B8 (3.3V)</text>
  <line x1="440" y1="116" x2="530" y2="116" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="140" x2="530" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="164" x2="530" y2="164" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- power -->
  <text x="220" y="260" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">VCCA=1.8V</text>
  <line x1="260" y1="256" x2="260" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="260" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">VCCB=3.3V</text>
  <line x1="400" y1="256" x2="400" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="24" y="300" font-size="13" fill="#5a6672" text-anchor="start">两路独立供电，方向自动感应，高速、多通道，直接替换分立方案</text>
</svg>
