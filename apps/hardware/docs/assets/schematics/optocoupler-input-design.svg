<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>24V 输入、5V 输出的光耦隔离输入电路：限流电阻、上拉电阻与隔离边界</title>
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="30" y="30" font-size="19" font-weight="700" fill="#222a32">光耦隔离输入：24V 侧到 5V 逻辑侧</text>

  <!-- 隔离边界 -->
  <line x1="380" y1="48" x2="380" y2="340" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="380" y="42" font-size="12" fill="#9aa7b4" text-anchor="middle">电气隔离边界</text>

  <!-- 24V 输入与限流电阻 -->
  <text x="40" y="86" font-size="14" fill="#2b3a4a">+24V</text>
  <line x1="40" y1="100" x2="110" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="88" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="150" y="80" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1 2.2k</text>
  <text x="150" y="130" font-size="11" fill="#5c6772" text-anchor="middle">IF≈10mA</text>
  <line x1="190" y1="100" x2="300" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 光耦封装 -->
  <rect x="300" y="70" width="120" height="120" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="64" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">PC817 类</text>

  <!-- 原边 LED -->
  <line x1="300" y1="100" x2="320" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="320,88 320,112 345,100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="345" y1="88" x2="345" y2="112" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="345" y1="100" x2="345" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="345" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="321" y="128" font-size="11" fill="#5c6772" text-anchor="middle">LED</text>

  <!-- 光 -->
  <line x1="350" y1="108" x2="372" y2="122" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="372,122 363,121 367,113" fill="#4f9e63"/>
  <line x1="350" y1="132" x2="372" y2="146" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="372,146 363,145 367,137" fill="#4f9e63"/>

  <!-- 副边光敏管 -->
  <line x1="390" y1="80" x2="390" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="100" x2="390" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="375" y1="130" x2="390" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="160" x2="390" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="382,166 390,174 377,178" fill="#2b3a4a"/>
  <line x1="390" y1="80" x2="420" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="190" x2="420" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="402" y="148" font-size="11" fill="#5c6772">VT</text>

  <!-- 原边地 -->
  <line x1="300" y1="160" x2="300" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="40" y1="300" x2="300" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="156" y1="300" x2="184" y2="300" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="161" y1="307" x2="179" y2="307" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="165" y1="314" x2="175" y2="314" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="170" y="336" font-size="12" fill="#5c6772" text-anchor="middle">AGND（24V 侧地）</text>

  <!-- 副边 +5V 与上拉 -->
  <text x="620" y="52" font-size="14" fill="#2b3a4a">+5V</text>
  <line x1="620" y1="60" x2="620" y2="68" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="540" y="68" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="580" y="62" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">R2 3.3k</text>
  <line x1="540" y1="80" x2="420" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="500" cy="80" r="3.5" fill="#2b3a4a"/>
  <line x1="500" y1="80" x2="500" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="130" x2="580" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="588" y="134" font-size="13" fill="#2b3a4a">Vout 5V</text>

  <!-- 副边地 -->
  <line x1="420" y1="190" x2="420" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="406" y1="300" x2="434" y2="300" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="411" y1="307" x2="429" y2="307" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="415" y1="314" x2="425" y2="314" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="420" y="336" font-size="12" fill="#5c6772" text-anchor="middle">IGND（5V 侧地）</text>

  <!-- 设计注记 -->
  <text x="30" y="366" font-size="12" fill="#5c6772">CTR 按最小 50% × 老化 0.5 = 25%；R2=3.3k 时 18V 输入仍有 1.37 倍余量。</text>
</svg>
