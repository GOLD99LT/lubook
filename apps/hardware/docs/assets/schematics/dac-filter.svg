<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">DAC/PWM 输出 RC 重建滤波</text>

  <rect x="60" y="100" width="100" height="50" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="110" y="130" font-size="12" fill="#222a32" text-anchor="middle">DAC/PWM</text>
  <line x1="160" y1="125" x2="230" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R -->
  <rect x="230" y="113" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="270" y="105" font-size="12" fill="#1a4f8b" text-anchor="middle">R 1kΩ</text>
  <line x1="310" y1="125" x2="450" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="380" cy="125" r="4.5" fill="#2b3a4a"/>

  <!-- C -->
  <line x1="380" y1="125" x2="380" y2="155" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="362" y1="155" x2="398" y2="155" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="362" y1="175" x2="398" y2="175" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="380" y1="175" x2="380" y2="205" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="366" y1="205" x2="394" y2="205" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="371" y1="212" x2="389" y2="212" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="375" y1="219" x2="385" y2="219" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="406" y="171" font-size="12" fill="#1a4f8b">C 1µF</text>

  <text x="460" y="130" font-size="13" fill="#2e7d4f">平滑 Vout</text>

  <text x="120" y="248" font-size="12" fill="#7a5fc0">fc = 1/(2πRC) ≈ 160Hz，滤除量化台阶/载波纹波，保留目标带宽内的信号</text>
</svg>
