<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">LTspice 典型仿真电路：RC 低通，源经 R 到节点 Vout，C 下地</text>
  <!-- 电压源 -->
  <circle cx="110" cy="180" r="28" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="110" y="176" font-size="15" fill="#2b3a4a" text-anchor="middle" font-weight="700">V1</text>
  <text x="110" y="194" font-size="13" fill="#b5642e" text-anchor="middle">PULSE</text>
  <line x1="110" y1="152" x2="110" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="110" x2="240" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R -->
  <rect x="240" y="98" width="110" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="295" y="90" font-size="15" fill="#1a4f8b" font-weight="700" text-anchor="middle">R=1k</text>
  <line x1="350" y1="110" x2="480" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Vout 节点 -->
  <circle cx="480" cy="110" r="4.5" fill="#2b3a4a"/>
  <text x="490" y="100" font-size="15" fill="#1a4f8b" font-weight="700">Vout</text>
  <!-- C 下地 -->
  <line x1="480" y1="110" x2="480" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="462" y1="180" x2="498" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="462" y1="192" x2="498" y2="192" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="510" y="190" font-size="15" fill="#1a4f8b" font-weight="700">C=1µF</text>
  <line x1="480" y1="192" x2="480" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- V1 下地 -->
  <line x1="110" y1="208" x2="110" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="96" y1="250" x2="124" y2="250" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="101" y1="257" x2="119" y2="257" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="105" y1="264" x2="115" y2="264" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- C 地 -->
  <line x1="466" y1="230" x2="494" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="471" y1="237" x2="489" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="475" y1="244" x2="485" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="360" y="320" font-size="13" fill="#7a5fc0" text-anchor="middle">网表关键行：V1 N001 0 PULSE(0 5 0 1u 1u 5m 10m) R1 N001 Vout 1k C1 Vout 0 1u</text>
</svg>
