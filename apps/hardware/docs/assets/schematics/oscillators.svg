<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 运放三角形 -->
  <polygon points="400,140 400,300 560,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="418" y="197" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="418" y="262" font-size="22" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 反相端节点 -->
  <line x1="400" y1="195" x2="350" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Ra：反相端到地 -->
  <line x1="350" y1="195" x2="350" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="338" y="260" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="304" x2="350" y2="350" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="336" y1="350" x2="364" y2="350" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="341" y1="357" x2="359" y2="357" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="345" y1="364" x2="355" y2="364" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="330" y="284" font-size="17" fill="#1a4f8b" text-anchor="end" font-weight="700">Ra</text>
  <!-- Rb：反相端到输出 -->
  <line x1="350" y1="195" x2="500" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="500" y="183" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="580" y1="195" x2="640" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="640" y1="195" x2="640" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="540" y="178" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rb</text>
  <!-- 同相端节点 P -->
  <line x1="400" y1="255" x2="180" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 串联臂：输出上引 -> Rs -> Cs -> P -->
  <line x1="560" y1="220" x2="560" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="70" x2="360" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="280" y="58" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="280" y1="70" x2="180" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="70" x2="180" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="165" y1="120" x2="195" y2="120" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="165" y1="136" x2="195" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="180" y1="136" x2="180" y2="255" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="52" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rs</text>
  <text x="158" y="132" font-size="17" fill="#1a4f8b" text-anchor="end" font-weight="700">Cs</text>
  <!-- 并联臂：P 经 Rp、Cp 到地 -->
  <line x1="180" y1="255" x2="180" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="168" y="300" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="344" x2="180" y2="390" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="166" y1="390" x2="194" y2="390" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="171" y1="397" x2="189" y2="397" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="175" y1="404" x2="185" y2="404" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="160" y="326" font-size="17" fill="#1a4f8b" text-anchor="end" font-weight="700">Rp</text>
  <line x1="300" y1="255" x2="300" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="285" y1="290" x2="315" y2="290" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="285" y1="306" x2="315" y2="306" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="306" x2="300" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="360" x2="314" y2="360" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="367" x2="309" y2="367" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="374" x2="305" y2="374" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="322" y="302" font-size="17" fill="#1a4f8b" font-weight="700">Cp</text>
  <!-- 输出线 -->
  <line x1="560" y1="220" x2="690" y2="220" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="700" y="226" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 节点圆点 -->
  <circle cx="350" cy="195" r="4.5" fill="#2b3a4a"/>
  <circle cx="180" cy="255" r="4.5" fill="#2b3a4a"/>
  <circle cx="300" cy="255" r="4.5" fill="#2b3a4a"/>
  <circle cx="640" cy="220" r="4.5" fill="#2b3a4a"/>
</svg>
