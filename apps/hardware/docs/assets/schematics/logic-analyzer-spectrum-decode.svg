<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">I2C 总线解码：SCL/SDA 两线 + 共地，逻辑分析仪抓取时序</text>
  <!-- 主机 -->
  <rect x="60" y="110" width="120" height="80" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="145" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">I2C 主机</text>
  <text x="120" y="165" font-size="12" fill="#b5642e" text-anchor="middle">开漏+上拉</text>
  <!-- 从机 -->
  <rect x="540" y="110" width="120" height="80" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="600" y="145" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">I2C 从机</text>
  <text x="600" y="165" font-size="12" fill="#b5642e" text-anchor="middle">传感器/EEPROM</text>
  <!-- SCL / SDA -->
  <line x1="180" y1="135" x2="540" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="165" x2="540" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="128" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">SCL</text>
  <text x="360" y="182" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">SDA</text>
  <!-- 上拉 -->
  <line x1="300" y1="135" x2="300" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="285" y="70" width="30" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="62" font-size="12" fill="#7a5fc0" text-anchor="middle">4.7kΩ</text>
  <line x1="300" y1="70" x2="300" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="44" font-size="12" fill="#b5642e" text-anchor="middle">3.3V</text>
  <!-- LA 探头 -->
  <circle cx="360" cy="135" r="4.5" fill="#c0392b"/>
  <circle cx="360" cy="165" r="4.5" fill="#c0392b"/>
  <line x1="360" y1="135" x2="360" y2="230" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="4,3"/>
  <text x="380" y="245" font-size="12" fill="#c0392b">逻辑分析仪 CH0/CH1 抓取</text>
</svg>
