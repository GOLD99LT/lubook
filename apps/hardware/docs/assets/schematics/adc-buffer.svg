<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">高阻传感器 + 运放缓冲后送 ADC</text>

  <!-- 高阻源 -->
  <text x="40" y="150" font-size="12" fill="#b5642e">高阻传感器</text>
  <text x="40" y="168" font-size="11" fill="#5c6772">(内阻百 kΩ~MΩ)</text>
  <line x1="150" y1="160" x2="230" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 运放跟随器 -->
  <polygon points="230,110 230,210 360,160" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="245" y="152" font-size="18" fill="#2b3a4a">+</text>
  <text x="245" y="192" font-size="18" fill="#2b3a4a">−</text>
  <!-- 反馈：输出接回反相端 -->
  <line x1="360" y1="160" x2="430" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="160" x2="430" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="190" x2="230" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="330" y="220" font-size="11" fill="#7a5fc0">电压跟随器（缓冲）</text>

  <!-- 到 ADC -->
  <circle cx="430" cy="160" r="4.5" fill="#2b3a4a"/>
  <line x1="430" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="560" y="130" width="110" height="60" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="615" y="165" font-size="13" fill="#222a32" text-anchor="middle">MCU ADC</text>

  <text x="120" y="270" font-size="12" fill="#7a5fc0">运放输入电流≈0，采样电容充得上；输出低阻，驱动 Csh 无压降</text>
</svg>
