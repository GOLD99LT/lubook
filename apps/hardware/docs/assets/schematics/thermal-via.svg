<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="thermalViaTitle">
  <title id="thermalViaTitle">散热过孔阵列剖面：0.3 毫米钻孔、25 微米镀铜、填孔盖帽</title>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">散热过孔（Thermal Via）剖面与热阻</text>

  <rect x="300" y="62" width="300" height="56" fill="#fde2e2" stroke="#b03a3a" stroke-width="2.2"/>
  <text x="450" y="86" font-size="13" font-weight="700" fill="#b03a3a" text-anchor="middle">功率器件</text>
  <text x="450" y="105" font-size="11.5" fill="#b03a3a" text-anchor="middle">热量从结传到裸露焊盘 EP</text>

  <rect x="340" y="118" width="220" height="18" fill="#d9d4c7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="570" y="132" font-size="11.5" fill="#7a6a3a">EP 焊盘 / 顶层铜</text>

  <rect x="250" y="136" width="400" height="220" fill="#f6f1e6" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="270" y="158" font-size="11.5" fill="#5c6772">FR4 板厚 1.6 mm</text>

  <rect x="250" y="206" width="400" height="12" fill="#c9a46a" stroke="#7a6a3a" stroke-width="1"/>
  <text x="660" y="216" font-size="11.5" fill="#7a6a3a">内层地平面 1</text>
  <rect x="250" y="292" width="400" height="12" fill="#c9a46a" stroke="#7a6a3a" stroke-width="1"/>
  <text x="660" y="302" font-size="11.5" fill="#7a6a3a">内层地平面 2</text>

  <g stroke="#b5642e" stroke-width="5" fill="none">
    <line x1="330" y1="136" x2="330" y2="356"/>
    <line x1="390" y1="136" x2="390" y2="356"/>
    <line x1="450" y1="136" x2="450" y2="356"/>
    <line x1="510" y1="136" x2="510" y2="356"/>
    <line x1="570" y1="136" x2="570" y2="356"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.4" fill="none">
    <line x1="330" y1="136" x2="330" y2="356"/>
    <line x1="390" y1="136" x2="390" y2="356"/>
    <line x1="450" y1="136" x2="450" y2="356"/>
    <line x1="510" y1="136" x2="510" y2="356"/>
    <line x1="570" y1="136" x2="570" y2="356"/>
  </g>

  <rect x="250" y="356" width="400" height="16" fill="#d9d4c7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="660" y="369" font-size="11.5" fill="#7a6a3a">底层铜箔（散热面）</text>

  <line x1="330" y1="386" x2="330" y2="416" stroke="#2b3a4a" stroke-width="1.2"/>
  <line x1="390" y1="386" x2="390" y2="416" stroke="#2b3a4a" stroke-width="1.2"/>
  <text x="360" y="432" font-size="11.5" fill="#222a32" text-anchor="middle">5 × 5 = 25 个过孔，间距 1.0 mm</text>

  <text x="60" y="462" font-size="12.5" fill="#222a32">单孔：A = π/4 × (0.35² - 0.30²) = 0.0255 mm²；R = 1.6 mm / (385 W/(m·K) × 0.0255 mm²) = 162.8 K/W。</text>
  <text x="60" y="484" font-size="12.5" fill="#b5642e">25 孔并联 6.51 K/W；2 W 时过孔两端温差 13.0 K。焊盘内过孔必须填孔并盖帽，按 IPC-4761 Type VII。</text>
</svg>
