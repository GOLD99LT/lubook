<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">SPI 接 NOR Flash</text>

  <!-- MCU -->
  <rect x="80" y="90" width="130" height="140" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="145" y="115" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">MCU</text>
  <text x="215" y="130" font-size="11" fill="#5c6772">SCK</text>
  <text x="215" y="160" font-size="11" fill="#5c6772">MOSI</text>
  <text x="215" y="190" font-size="11" fill="#5c6772">MISO</text>
  <text x="215" y="220" font-size="11" fill="#5c6772">CS#</text>

  <!-- Flash -->
  <rect x="480" y="90" width="150" height="140" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="555" y="115" font-size="12" fill="#222a32" text-anchor="middle">NOR Flash</text>
  <text x="440" y="130" font-size="11" fill="#5c6772">CLK</text>
  <text x="440" y="160" font-size="11" fill="#5c6772">DI(MOSI)</text>
  <text x="440" y="190" font-size="11" fill="#5c6772">DO(MISO)</text>
  <text x="440" y="220" font-size="11" fill="#5c6772">CS#</text>

  <!-- 连线 -->
  <line x1="210" y1="126" x2="480" y2="126" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="210" y1="156" x2="480" y2="156" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="210" y1="186" x2="480" y2="186" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="210" y1="216" x2="480" y2="216" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="180" y="270" font-size="12" fill="#7a5fc0">SCK/MOSI/MISO 共用，CS# 选中目标从机；未选中的从机 MISO 高阻，不干扰总线</text>
</svg>
