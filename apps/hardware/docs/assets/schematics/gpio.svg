<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="480" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">GPIO 推挽输出级（Totem Pole）</text>

  <!-- MCU 内框 -->
  <rect x="180" y="60" width="300" height="360" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="330" y="84" font-size="13" fill="#5c6772" text-anchor="middle">MCU GPIO 端口</text>

  <!-- VDD -->
  <line x1="260" y1="100" x2="400" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="408" y="104" font-size="13" fill="#b5642e">VDD(3.3V)</text>

  <!-- PMOS -->
  <line x1="330" y1="100" x2="330" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="115" x2="330" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="310" y1="128" x2="310" y2="172" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="150" x2="310" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="305" cy="150" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="250" y="142" font-size="12" fill="#1a4f8b">PMOS</text>

  <!-- 输出节点 -->
  <line x1="330" y1="185" x2="330" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="330" cy="250" r="4.5" fill="#2b3a4a"/>

  <!-- NMOS -->
  <line x1="330" y1="250" x2="330" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="285" x2="330" y2="355" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="310" y1="298" x2="310" y2="342" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="320" x2="310" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="250" y="312" font-size="12" fill="#1a4f8b">NMOS</text>

  <!-- GND -->
  <line x1="330" y1="355" x2="330" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="316" y1="380" x2="344" y2="380" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="321" y1="387" x2="339" y2="387" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="325" y1="394" x2="335" y2="394" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="352" y="388" font-size="12" fill="#5c6772">VSS</text>

  <!-- 控制逻辑 -->
  <rect x="200" y="190" width="70" height="120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="235" y="240" font-size="11" fill="#222a32" text-anchor="middle">输出</text>
  <text x="235" y="258" font-size="11" fill="#222a32" text-anchor="middle">控制</text>
  <text x="235" y="276" font-size="11" fill="#5c6772" text-anchor="middle">(死区)</text>

  <!-- 输出引脚到外部 -->
  <line x1="330" y1="250" x2="560" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="575" y="256" font-size="14" fill="#b5642e">PA0 → 外部</text>

  <!-- 工作状态说明 -->
  <text x="490" y="130" font-size="12" fill="#2e7d4f">输出1：PMOS通、NMOS断</text>
  <text x="490" y="150" font-size="12" fill="#2e7d4f">引脚≈VDD</text>
  <text x="490" y="320" font-size="12" fill="#b5642e">输出0：NMOS通、PMOS断</text>
  <text x="490" y="340" font-size="12" fill="#b5642e">引脚≈VSS</text>
</svg>
