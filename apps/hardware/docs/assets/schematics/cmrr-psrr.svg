<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 共模电压源 -->
  <circle cx="120" cy="160" r="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="166" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Vcm</text>
  <line x1="140" y1="160" x2="200" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 分两路到两输入端 -->
  <line x1="200" y1="160" x2="200" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="130" x2="300" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="160" x2="200" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="190" x2="300" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="200" cy="160" r="4.5" fill="#2b3a4a"/>
  <!-- 运放 -->
  <polygon points="300,90 300,230 450,160" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="142" font-size="24" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="196" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 输出 -->
  <line x1="450" y1="160" x2="600" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="608" y="166" font-size="18" fill="#2b3a4a">Vout</text>
  <text x="300" y="270" font-size="15" fill="#7a5fc0">理想：两输入端同为 Vcm 时 Vout=0；实际因 CMRR 产生等效输入失调</text>
</svg>
