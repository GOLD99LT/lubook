  <text x="110" y="127" font-size="11" fill="#b5642e">隔离极点 f_p = 1.06 kHz</text>
  <text x="110" y="144" font-size="11" fill="#b5642e">隔离零点 f_z = 1.59 kHz</text>
  <circle cx="414.7" cy="265.6" r="4.5" fill="#1a4f8b"/>
  <circle cx="414.7" cy="578.9" r="4.5" fill="#1a4f8b"/>
  <text x="408.7" y="285" font-size="11" fill="#1a4f8b" font-weight="700" text-anchor="end">f_c = 17.70 kHz</text>
  <circle cx="495.4" cy="265.6" r="4.5" fill="#b5642e"/>
  <circle cx="495.4" cy="508.4" r="4.5" fill="#b5642e"/>
  <text x="501.4" y="296" font-size="11" fill="#b5642e" font-weight="700">f_c = 66.68 kHz</text>
  <text x="110" y="452" font-size="11" fill="#222a32">相位裕度 = 180° + ∠T(f_c)：无补偿 10.2°，加 100 Ω 隔离 89.6°</text>
  <line x1="686" y1="100" x2="716" y2="100" stroke="#9aa7b4" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="724" y="104" font-size="12" fill="#222a32">无负载（单极点参考）</text>
  <line x1="686" y1="126" x2="716" y2="126" stroke="#1a4f8b" stroke-width="3"/>
  <text x="724" y="130" font-size="12" fill="#222a32">1 µF，无隔离电阻</text>
  <line x1="686" y1="152" x2="716" y2="152" stroke="#b5642e" stroke-width="2.4" stroke-dasharray="9,3,2,3"/>
  <text x="724" y="156" font-size="12" fill="#222a32">1 µF + 100 Ω 隔离</text>
  <line x1="686" y1="176" x2="956" y2="176" stroke="#e3e0d7"/>
  <text x="686" y="202" font-size="11.5" fill="#222a32">无负载：f_c = 100.0 kHz，PM = 90.0°</text>
  <text x="686" y="228" font-size="11.5" fill="#1a4f8b">1 µF：f_p2 = 1/(2πR_oC_L) = 3.18 kHz</text>
  <text x="686" y="254" font-size="11.5" fill="#1a4f8b">　　　f_c = 17.70 kHz，PM = 10.2°</text>
  <text x="686" y="280" font-size="11.5" fill="#b5642e">1 µF + 100 Ω：f_p = 1.06 kHz</text>
  <text x="686" y="306" font-size="11.5" fill="#b5642e">　　　f_z = 1.59 kHz，f_c = 66.68 kHz</text>
  <text x="686" y="332" font-size="11.5" fill="#b5642e">　　　PM = 89.6°，高频环路增益 0.667</text>
  <line x1="686" y1="366" x2="956" y2="366" stroke="#e3e0d7"/>
  <text x="686" y="390" font-size="11.5" fill="#222a32">PM = 180° + ∠T(f_c)</text>
  <text x="686" y="414" font-size="11.5" fill="#1a4f8b">无补偿：180° − 169.8° = 10.2°</text>
  <text x="686" y="438" font-size="11.5" fill="#b5642e">加隔离：零点把相位拉回 −90°，</text>
  <text x="686" y="462" font-size="11.5" fill="#b5642e">　　　　PM = 180° − 90.4° = 89.6°</text>
  <text x="686" y="510" font-size="11.5" fill="#5c6772">f_p2/f_c = 3183/17.7 = 180</text>
  <text x="686" y="534" font-size="11.5" fill="#5c6772">第二极点离穿越频率越近，</text>
  <text x="686" y="558" font-size="11.5" fill="#5c6772">相位越往 −90° 下面凹，PM 越小</text>
  <text x="24" y="650" font-size="10.5" fill="#5c6772">R_out,OL 与 C_L 取典型量级，以数据手册为准；曲线按 |T| 与 ∠T 的解析式逐点计算，与正文算例的数值一致。</text>
</svg>
