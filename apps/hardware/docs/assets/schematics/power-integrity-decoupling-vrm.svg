<svg viewBox="0 0 820 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="220" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">目标阻抗：VRM 负责低频，电容负责中高频</text>

  <!-- VRM -->
  <rect x="100" y="80" width="120" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="160" y="105" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">VRM/稳压</text>
  <text x="160" y="124" font-size="10" fill="#5c6772" text-anchor="middle">&lt;1~10kHz</text>

  <!-- 电容群 -->
  <rect x="320" y="80" width="160" height="60" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="400" y="105" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">去耦电容群</text>
  <text x="400" y="124" font-size="10" fill="#5c6772" text-anchor="middle">10kHz~100MHz</text>

  <!-- 芯片 -->
  <rect x="580" y="80" width="120" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="640" y="105" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">IC 负载</text>
  <text x="640" y="124" font-size="10" fill="#5c6772" text-anchor="middle">瞬态 di/dt</text>

  <line x1="220" y1="110" x2="320" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="480" y1="110" x2="580" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="30" y="190" font-size="13" fill="#222a32">目标阻抗 Z = ΔV_allow/ΔI：全频段把电源阻抗压到目标线以下；VRM 响应慢，高频瞬态靠本地电容</text>
</svg>
