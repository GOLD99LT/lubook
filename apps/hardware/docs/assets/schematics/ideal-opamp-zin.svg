<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>三种运放拓扑的输入阻抗：反相等于 R1，同相与跟随器等于共模输入电阻 R_icm，同样目标增益 10 时相差约 10 万倍</title>
  <rect width="960" height="400" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#222a32">三种拓扑的输入阻抗 Input Impedance by Topology</text>
  <text x="30" y="60" font-size="12.5" fill="#5c6772">同样目标增益 10：反相输入阻抗 = R1；同相与跟随器 = 共模输入电阻 R_icm；两者相差约 10 万倍</text>
  <line x1="30" y1="76" x2="930" y2="76" stroke="#e3e0d7"/>
  <line x1="340" y1="92" x2="340" y2="360" stroke="#e3e0d7" stroke-dasharray="4,5"/>
  <line x1="690" y1="92" x2="690" y2="360" stroke="#e3e0d7" stroke-dasharray="4,5"/>

  <!-- ============ 反相 ============ -->
  <polygon points="140,100 140,240 240,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="152" y="132" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="152" y="222" font-size="18" fill="#2b3a4a" font-weight="700">+</text>

  <!-- R1: Vin 到反相端 -->
  <line x1="45" y1="125" x2="60" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="60" y="115" width="45" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="105" y1="125" x2="140" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="42" y="120" font-size="12" fill="#222a32" text-anchor="end" font-weight="700">Vin</text>
  <text x="82" y="108" font-size="11" fill="#5c6772" text-anchor="middle">R1 10k</text>

  <!-- 同相端接地 -->
  <line x1="120" y1="215" x2="140" y2="215" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="215" x2="120" y2="227" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="106" y1="227" x2="134" y2="227" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="111" y1="234" x2="129" y2="234" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="115" y1="241" x2="125" y2="241" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- Rf: 反相端到输出 -->
  <line x1="140" y1="125" x2="140" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="140" y1="80" x2="170" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="170" y="70" width="70" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="80" x2="290" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="290" y1="80" x2="290" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="170" x2="300" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="290" cy="170" r="4" fill="#2b3a4a"/>
  <text x="205" y="62" font-size="11" fill="#5c6772" text-anchor="middle">Rf 100k</text>
  <text x="306" y="175" font-size="12" fill="#222a32" font-weight="700">Vout</text>

  <text x="190" y="290" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">反相 Inverting</text>
  <text x="190" y="315" font-size="13" fill="#b5642e" text-anchor="middle" font-weight="700">Zin = R1 = 10.001 kΩ</text>
  <text x="190" y="338" font-size="11.5" fill="#5c6772" text-anchor="middle">源 10kΩ 时增益 −10 → −5</text>

  <!-- ============ 同相 ============ -->
  <polygon points="470,100 470,240 570,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="482" y="132" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="482" y="222" font-size="18" fill="#2b3a4a" font-weight="700">+</text>

  <!-- 同相端输入 -->
  <line x1="400" y1="215" x2="470" y2="215" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="396" y="220" font-size="12" fill="#222a32" text-anchor="end" font-weight="700">Vin</text>

  <!-- R1: 反相端到地 -->
  <line x1="420" y1="125" x2="470" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="125" x2="420" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="410" y="130" width="20" height="45" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="175" x2="420" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="406" y1="185" x2="434" y2="185" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="411" y1="192" x2="429" y2="192" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="415" y1="199" x2="425" y2="199" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="404" y="148" font-size="11" fill="#5c6772" text-anchor="end">R1</text>
  <text x="404" y="163" font-size="11" fill="#5c6772" text-anchor="end">10k</text>

  <!-- Rf: 反相端到输出 -->
  <line x1="420" y1="125" x2="420" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="80" x2="450" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="450" y="70" width="70" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="520" y1="80" x2="620" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="80" x2="620" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="570" y1="170" x2="700" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="620" cy="170" r="4" fill="#2b3a4a"/>
  <text x="485" y="62" font-size="11" fill="#5c6772" text-anchor="middle">Rf 90k</text>
  <text x="706" y="175" font-size="12" fill="#222a32" font-weight="700">Vout</text>

  <text x="520" y="290" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">同相 Non-inverting</text>
  <text x="520" y="315" font-size="13" fill="#2f7d4f" text-anchor="middle" font-weight="700">Zin = R_icm = 1 GΩ</text>
  <text x="520" y="338" font-size="11.5" fill="#5c6772" text-anchor="middle">源 10kΩ 分压误差 0.001%</text>

  <!-- ============ 跟随器 ============ -->
  <polygon points="790,100 790,240 880,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="802" y="132" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="802" y="222" font-size="18" fill="#2b3a4a" font-weight="700">+</text>

  <line x1="730" y1="215" x2="790" y2="215" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="726" y="220" font-size="12" fill="#222a32" text-anchor="end" font-weight="700">Vin</text>

  <!-- 输出直接接回反相端 -->
  <line x1="750" y1="125" x2="790" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="750" y1="60" x2="750" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="750" y1="60" x2="930" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="930" y1="60" x2="930" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="880" y1="170" x2="930" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="930" cy="170" r="4" fill="#2b3a4a"/>
  <text x="905" y="160" font-size="12" fill="#222a32" text-anchor="middle" font-weight="700">Vout</text>

  <text x="840" y="290" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">跟随器 Follower</text>
  <text x="840" y="315" font-size="13" fill="#2f7d4f" text-anchor="middle" font-weight="700">Zin = 1 GΩ，G = 1</text>
  <text x="840" y="338" font-size="11.5" fill="#5c6772" text-anchor="middle">高阻源的缓冲级</text>

  <text x="30" y="382" font-size="12" fill="#5c6772">反相端的虚地使输入阻抗等于 R1；同相端的输入阻抗是运放的共模输入电阻，与反馈网络无关。</text>
</svg>
