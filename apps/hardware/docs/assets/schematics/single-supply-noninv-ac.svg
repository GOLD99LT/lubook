<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>单电源同相交流放大：输入经 Cin 耦合到同相端，Rb 与 Rg 都接低阻抗 Vref，输出静态等于 Vref，交流增益 1+Rf/Rg</title>
  <rect width="920" height="560" fill="#ffffff"/>
  <polygon points="460,240 460,400 610,320" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="474" y="279" font-size="22" fill="#2b3a4a" text-anchor="start" font-weight="700">−</text>
  <text x="474" y="367" font-size="22" fill="#2b3a4a" text-anchor="start" font-weight="700">+</text>
  <line x1="60" y1="355" x2="142" y2="355" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="142" y1="339" x2="142" y2="371" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="158" y1="339" x2="158" y2="371" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="158" y1="355" x2="460" y2="355" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="42" y="350" font-size="18" fill="#222a32" text-anchor="start" font-weight="400">Vin</text>
  <text x="150" y="325" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">Cin</text>
  <line x1="300" y1="355" x2="300" y2="470" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="300" cy="355" r="4.5" fill="#2b3a4a"/>
  <rect x="289" y="387" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="316" y="416" font-size="17" fill="#1a4f8b" text-anchor="start" font-weight="700">Rb</text>
  <circle cx="300" cy="478" r="4" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="300" y="505" font-size="15" fill="#b5642e" text-anchor="middle" font-weight="700">Vref</text>
  <line x1="460" y1="285" x2="420" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="420" cy="285" r="4.5" fill="#2b3a4a"/>
  <line x1="420" y1="285" x2="400" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="285" x2="400" y2="208" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="389" y="223" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="388" y="252" font-size="17" fill="#1a4f8b" text-anchor="end" font-weight="700">Rg</text>
  <circle cx="400" cy="200" r="4" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="388" y="196" font-size="15" fill="#b5642e" text-anchor="end" font-weight="700">Vref</text>
  <line x1="420" y1="285" x2="420" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="170" x2="520" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="520" y="159" width="60" height="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="550" y="158" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <line x1="580" y1="170" x2="700" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="700" y1="170" x2="700" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="700" cy="320" r="4.5" fill="#2b3a4a"/>
  <line x1="610" y1="320" x2="700" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="700" y1="320" x2="800" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="812" y="326" font-size="18" fill="#222a32" text-anchor="start" font-weight="400">Vout</text>
  <text x="40" y="70" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">Rb 与 Rg 都接同一个 Vref：Rg 上的交流电流 V_in,pk/Rg 全部流入 Vref</text>
  <text x="40" y="95" font-size="13" fill="#b5642e" text-anchor="start" font-weight="400">所以该拓扑的 Vref 必须低阻抗；接法 C 把 Rg 经 Cg 接地，才能用裸分压</text>
</svg>
