<svg viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="280" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">有源钳位复位（Active Clamp）：用小 MOSFET+电容回收漏感能量</text>

  <!-- 原边绕组 -->
  <line x1="120" y1="90" x2="180" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M180,90 q10,-20 20,0 q10,20 20,0 q10,-20 20,0 q10,20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="90" x2="320" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="66" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">Np</text>
  <circle cx="320" cy="90" r="4.5" fill="#2b3a4a"/>

  <!-- 主开关 Q1 -->
  <line x1="320" y1="90" x2="320" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="295" y="160" width="50" height="60" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="195" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q1 主开关</text>
  <line x1="320" y1="220" x2="320" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 有源钳位支路：Q2 + Cc 从漏极到 Vbulk+ -->
  <line x1="320" y1="90" x2="440" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="400" y="120" width="50" height="50" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="425" y="150" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q2 钳位</text>
  <line x1="440" y1="90" x2="425" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="425" y1="90" x2="425" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="425" y1="170" x2="425" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Cc -->
  <line x1="440" y1="90" x2="500" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="90" x2="500" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="484" y1="120" x2="516" y2="120" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="484" y1="138" x2="516" y2="138" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="500" y1="138" x2="500" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="524" y="132" font-size="12" fill="#1a4f8b" font-weight="700">Cc</text>
  <line x1="425" y1="200" x2="500" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="90" x2="120" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="250" x2="500" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="30" y="270" font-size="13" fill="#222a32">优势：漏感能量回馈、可实现 ZVS、效率高、EMI 低；代价：需额外驱动（Q2 与 Q1 反相），电路复杂</text>
</svg>
