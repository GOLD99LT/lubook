<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入源 -->
  <text x="60" y="166" font-size="18" fill="#2b3a4a">Vcm</text>
  <line x1="90" y1="160" x2="184" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 输入失调电压源 Vos -->
  <circle cx="200" cy="160" r="18" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="166" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Vos</text>
  <line x1="218" y1="160" x2="260" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="160" x2="260" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="200" x2="320" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 运放 -->
  <polygon points="320,110 320,250 470,180" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="340" y="166" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="340" y="214" font-size="22" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 偏置电流箭头（流入反相端） -->
  <line x1="270" y1="160" x2="316" y2="160" stroke="#b5642e" stroke-width="1.8" marker-end="url(#arrowR)"/>
  <text x="270" y="148" font-size="14" fill="#b5642e">I_B</text>
  <!-- 输出 -->
  <line x1="470" y1="180" x2="610" y2="180" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="618" y="186" font-size="18" fill="#2b3a4a">Vout</text>
  <text x="320" y="285" font-size="15" fill="#7a5fc0">等效输入失调电压 Vos 与偏置电流 I_B，经噪声增益放大后表现为输出零点偏移</text>
</svg>
