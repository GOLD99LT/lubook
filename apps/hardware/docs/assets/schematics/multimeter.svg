<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="380" fill="#ffffff"/>
  <!-- 回路：Vbat 经 Rload -->
  <line x1="90" y1="160" x2="90" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="90" x2="300" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="300" y="78" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="90" x2="560" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="90" x2="560" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="290" x2="90" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="290" x2="90" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Vbat 圆 -->
  <circle cx="90" cy="190" r="30" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="90" y="186" font-size="16" fill="#2b3a4a" text-anchor="middle" font-weight="700">+</text>
  <text x="90" y="204" font-size="18" fill="#2b3a4a" text-anchor="middle">−</text>
  <text x="55" y="196" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="end">Vbat</text>
  <text x="360" y="68" font-size="18" fill="#1a4f8b" font-weight="700" text-anchor="middle">Rload</text>
  <!-- DMM 并联在 Rload 两端 -->
  <line x1="300" y1="90" x2="300" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="200" x2="350" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="90" x2="420" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="200" x2="430" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="350" y="200" width="80" height="60" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="390" y="228" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">DMM</text>
  <text x="390" y="248" font-size="14" fill="#b5642e" text-anchor="middle">V 档（并联）</text>
  <circle cx="300" cy="90" r="4.5" fill="#2b3a4a"/>
  <circle cx="420" cy="90" r="4.5" fill="#2b3a4a"/>
  <!-- 接地 -->
  <line x1="200" y1="290" x2="200" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="186" y1="290" x2="214" y2="290" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="191" y1="297" x2="209" y2="297" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="195" y1="304" x2="205" y2="304" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="600" y="86" font-size="15" fill="#7a5fc0">测电压：并接在被测两点之间</text>
