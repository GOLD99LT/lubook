<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- 放大块 -->
  <rect x="280" y="130" width="160" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="172" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">A（放大器）</text>
  <text x="360" y="198" font-size="12.5" fill="#5c6772" text-anchor="middle">输入：串联/并联　输出：取样电压/电流</text>

  <!-- 输入侧 -->
  <line x1="60" y1="175" x2="280" y2="175" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrT)"/>
  <text x="60" y="160" font-size="15" fill="#2b3a4a">输入 X</text>
  <text x="150" y="120" font-size="13.5" fill="#b5642e">输入端比较：串联=电压相加 · 并联=电流相加</text>

  <!-- 输出侧 -->
  <line x1="440" y1="175" x2="660" y2="175" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrT)"/>
  <text x="560" y="160" font-size="15" fill="#2b3a4a">输出 Y</text>
  <circle cx="560" cy="175" r="4.5" fill="#2b3a4a"/>
  <text x="470" y="120" font-size="13.5" fill="#b5642e">输出端取样：并联=取输出电压 · 串联=取输出电流</text>

  <!-- 反馈网络 -->
  <line x1="560" y1="175" x2="560" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="310" x2="200" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="120" y="280" width="80" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="160" y="315" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">β</text>
  <line x1="120" y1="310" x2="80" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="80" y1="310" x2="80" y2="175" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrT)"/>
  <text x="300" y="360" font-size="13.5" fill="#5c6772" text-anchor="middle">环路增益 T = A·β；四种组合对应四种反馈拓扑</text>
</svg>
