<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">半桥：互补 PWM + 死区（防直通）</text>

  <!-- VM -->
  <text x="300" y="60" font-size="13" fill="#b5642e">+VM</text>
  <line x1="330" y1="65" x2="330" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 上管 Q1 -->
  <line x1="330" y1="90" x2="330" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="310" y1="105" x2="310" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="120" x2="310" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="124" font-size="11" fill="#1a4f8b">PWM_H</text>
  <text x="345" y="125" font-size="11" fill="#222a32">Q1 上管</text>

  <!-- 中点 -->
  <circle cx="330" cy="190" r="4.5" fill="#2b3a4a"/>
  <line x1="330" y1="150" x2="330" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="190" x2="500" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="510" y="195" font-size="12" fill="#2e7d4f">→ 负载(电机/LC)</text>

  <!-- 下管 Q2 -->
  <line x1="330" y1="190" x2="330" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="230" x2="330" y2="290" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="310" y1="245" x2="310" y2="275" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="260" x2="310" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="195" y="264" font-size="11" fill="#1a4f8b">PWM_L</text>
  <text x="345" y="265" font-size="11" fill="#222a32">Q2 下管</text>
  <line x1="330" y1="290" x2="330" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="316" y1="310" x2="344" y2="310" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="321" y1="317" x2="339" y2="317" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="325" y1="324" x2="335" y2="324" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="120" y="348" font-size="12" fill="#7a5fc0">两管互补但插入死区：一关再开另一，避免上下管同时导通把 VM 对地短路（直通）</text>
</svg>
