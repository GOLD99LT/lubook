<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="340" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">有限状态机状态图（Moore 型）FSM State Diagram</text>

  <!-- S0 -->
  <circle cx="120" cy="170" r="45" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="165" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">S0</text>
  <text x="120" y="185" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">idle</text>

  <!-- S1 -->
  <circle cx="330" cy="100" r="45" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="330" y="95" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">S1</text>
  <text x="330" y="115" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">run</text>

  <!-- S2 -->
  <circle cx="330" cy="250" r="45" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="330" y="245" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">S2</text>
  <text x="330" y="265" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">done</text>

  <!-- S0 -> S1 (start=1) -->
  <line x1="155" y1="145" x2="295" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="210" y="120" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="700">start=1</text>

  <!-- S1 -> S2 (cnt==3) -->
  <line x1="330" y1="145" x2="330" y2="205" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="180" font-size="12" fill="#b5642e" text-anchor="start" font-weight="700">cnt==3</text>

  <!-- S2 -> S0 (ack) -->
  <line x1="295" y1="265" x2="155" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="210" y="255" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="700">ack=1</text>

  <text x="24" y="310" font-size="13" fill="#5a6672" text-anchor="start">Moore：输出只由当前状态决定；Mealy：输出由状态+当前输入共同决定</text>
</svg>
