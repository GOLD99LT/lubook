<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- 本体 -->
  <rect x="170" y="70" width="140" height="160" rx="4" fill="#f2efe6" stroke="#2b3a4a" stroke-width="2.6"/>
  <!-- Pin 1 标记 -->
  <circle cx="185" cy="85" r="4.5" fill="#2b3a4a"/>
  <!-- 左侧 4 引脚 -->
  <rect x="140" y="100" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="140" y="128" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="140" y="190" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="140" y="218" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 右侧 4 引脚 -->
  <rect x="310" y="100" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="310" y="128" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="310" y="190" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="310" y="218" width="30" height="12" fill="#e8eef5" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 引脚号 -->
  <text x="125" y="110" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">1</text>
  <text x="125" y="228" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">4</text>
  <text x="355" y="110" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">8</text>
  <text x="355" y="228" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">5</text>
  <!-- 尺寸 -->
  <line x1="170" y1="50" x2="310" y2="50" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="240" y="42" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">≈4.9mm</text>
  <text x="240" y="265" font-size="15" fill="#2b3a4a" text-anchor="middle">SOIC-8 顶视图（宽体/窄体，鸥翼引脚，1.27mm 脚距）</text>
</svg>
