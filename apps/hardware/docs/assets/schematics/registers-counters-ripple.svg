<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">4 位行波计数器 Ripple Counter（异步时钟）</text>

  <!-- FF0 -->
  <rect x="80" y="130" width="80" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="180" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF0</text>
  <line x1="120" y1="130" x2="120" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q0</text>
  <!-- external CLK into FF0 -->
  <text x="30" y="260" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">CLK</text>
  <line x1="70" y1="256" x2="120" y2="256" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="256" x2="120" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="100,200 100,240 120,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- FF1 -->
  <rect x="250" y="130" width="80" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="290" y="180" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF1</text>
  <line x1="290" y1="130" x2="290" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="290" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q1</text>

  <!-- Q0 clocks FF1 -->
  <line x1="120" y1="90" x2="120" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="60" x2="290" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="290" y1="60" x2="290" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="270,200 270,240 290,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="120" cy="90" r="4.5" fill="#2b3a4a"/>

  <!-- FF2 -->
  <rect x="420" y="130" width="80" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="460" y="180" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF2</text>
  <line x1="460" y1="130" x2="460" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="460" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q2</text>
  <line x1="290" y1="90" x2="290" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="290" y1="40" x2="460" y2="40" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="40" x2="460" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="440,200 440,240 460,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="290" cy="90" r="4.5" fill="#2b3a4a"/>

  <!-- FF3 -->
  <rect x="590" y="130" width="80" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="630" y="180" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">FF3</text>
  <line x1="630" y1="130" x2="630" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="630" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q3</text>
  <line x1="460" y1="90" x2="460" y2="30" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="30" x2="630" y2="30" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="630" y1="30" x2="630" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="610,200 610,240 630,220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="460" cy="90" r="4.5" fill="#2b3a4a"/>

  <text x="24" y="330" font-size="13" fill="#5a6672" text-anchor="start">前一级 Q 当后一级时钟：Q0 是 CLK/2，Q1 是 CLK/4，Q2 是 CLK/8，Q3 是 CLK/16；延迟逐位累积</text>
</svg>
