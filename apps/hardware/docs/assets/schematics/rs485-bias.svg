<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">RS-485 故障保护偏置（Fail-safe Bias）</text>

  <!-- A/B 总线 -->
  <line x1="120" y1="130" x2="600" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="180" x2="600" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="610" y="134" font-size="12" fill="#1a4f8b">A</text>
  <text x="610" y="184" font-size="12" fill="#1a4f8b">B</text>

  <!-- A 上拉 -->
  <line x1="300" y1="130" x2="300" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="292" y="50" width="16" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="316" y="76" font-size="11" fill="#1a4f8b">560Ω</text>
  <line x1="300" y1="50" x2="300" y2="35" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="316" y="40" font-size="12" fill="#b5642e">+5V</text>

  <!-- B 下拉 -->
  <line x1="300" y1="180" x2="300" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="292" y="210" width="16" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="316" y="236" font-size="11" fill="#1a4f8b">560Ω</text>
  <line x1="300" y1="250" x2="300" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="265" x2="314" y2="265" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="272" x2="309" y2="272" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="279" x2="305" y2="279" stroke="#2b3a4a" stroke-width="2.4"/>

  <circle cx="300" cy="130" r="4.5" fill="#2b3a4a"/>
  <circle cx="300" cy="180" r="4.5" fill="#2b3a4a"/>

  <text x="120" y="295" font-size="12" fill="#7a5fc0">空闲时把差分电压偏到 &gt;+200mV，让接收方确定收到"空闲/1"，避免输出不定</text>
</svg>
