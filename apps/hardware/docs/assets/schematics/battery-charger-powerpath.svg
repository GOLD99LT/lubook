<svg viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="240" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">Power Path 电源路径管理：USB 与电池无缝切换，支持 OTG 反向放电</text>

  <!-- VIN -->
  <text x="40" y="90" font-size="13" fill="#1a4f8b" font-weight="700">USB VIN</text>
  <line x1="110" y1="86" x2="180" y2="86" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="180" y="62" width="120" height="48" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="240" y="90" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">电源路径 IC</text>

  <!-- 系统 -->
  <line x1="300" y1="86" x2="460" y2="86" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="470" y="90" font-size="13" fill="#1a4f8b" font-weight="700">SYS 系统</text>

  <!-- 电池 -->
  <line x1="240" y1="110" x2="240" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="160" x2="240" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="224" y1="180" x2="256" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="224" y1="196" x2="256" y2="196" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="240" y1="196" x2="240" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="226" y1="210" x2="254" y2="210" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="270" y="195" font-size="13" fill="#1a4f8b" font-weight="700">BAT</text>

  <text x="30" y="230" font-size="13" fill="#222a32">插 USB：VIN 供系统并充电池；拔 USB：电池无缝供系统；OTG 模式：电池升压反向给外设供电</text>
</svg>
