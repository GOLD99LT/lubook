<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">扩展：半波倍压（电压翻倍）Voltage Doubler</text>

  <!-- AC 源 -->
  <circle cx="60" cy="130" r="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="60" y="136" font-size="15" fill="#2b3a4a" text-anchor="middle">~</text>
  <line x1="84" y1="130" x2="140" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- C1 串联 -->
  <line x1="140" y1="115" x2="140" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="156" y1="115" x2="156" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="156" y1="130" x2="260" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="148" y="104" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">C1</text>

  <!-- 节点 A -->
  <circle cx="260" cy="130" r="4.5" fill="#2b3a4a"/>
  <text x="252" y="118" font-size="13" fill="#b5642e" font-weight="700">A</text>

  <!-- D1：阴极在 A，负半周导通给 C1 充电 -->
  <line x1="260" y1="130" x2="260" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="170" x2="274" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="246,172 274,172 260,200" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="200" x2="260" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="282" y="188" font-size="13" fill="#1a4f8b" font-weight="700">D1</text>

  <!-- D2：A -> B，正半周导通 -->
  <line x1="260" y1="130" x2="320" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="320,112 320,148 350,130" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="114" x2="350" y2="146" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="350" y1="130" x2="470" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="335" y="106" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">D2</text>

  <!-- B 节点 + C2 输出 -->
  <circle cx="470" cy="130" r="4.5" fill="#2b3a4a"/>
  <line x1="470" y1="130" x2="470" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="452" y1="175" x2="488" y2="175" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="452" y1="195" x2="488" y2="195" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="470" y1="195" x2="470" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="496" y="190" font-size="13" fill="#1a4f8b" font-weight="700">C2</text>
  <text x="478" y="118" font-size="14" fill="#1a4f8b" font-weight="700">Vout ≈ 2Vp</text>

  <!-- 地 -->
  <line x1="60" y1="154" x2="60" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="60" y1="240" x2="470" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="240" x2="200" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="186" y1="260" x2="214" y2="260" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="191" y1="267" x2="209" y2="267" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="195" y1="274" x2="205" y2="274" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
