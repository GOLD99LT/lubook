<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">DAC 经缓冲驱动低阻负载</text>

  <!-- DAC -->
  <rect x="60" y="100" width="110" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="115" y="140" font-size="13" fill="#222a32" text-anchor="middle">MCU DAC</text>
  <line x1="170" y1="135" x2="240" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 运放跟随 -->
  <polygon points="240,90 240,180 350,135" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="255" y="128" font-size="16" fill="#2b3a4a">+</text>
  <text x="255" y="162" font-size="16" fill="#2b3a4a">−</text>
  <line x1="350" y1="135" x2="430" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="135" x2="400" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="165" x2="240" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 负载 -->
  <circle cx="430" cy="135" r="4.5" fill="#2b3a4a"/>
  <line x1="430" y1="135" x2="430" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="422" y="175" width="16" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="215" x2="430" y2="235" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="416" y1="235" x2="444" y2="235" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="421" y1="242" x2="439" y2="242" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="425" y1="249" x2="435" y2="249" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="450" y="200" font-size="12" fill="#1a4f8b">RL(如 1kΩ)</text>

  <text x="120" y="265" font-size="12" fill="#7a5fc0">DAC 直接驱动低阻负载会压垮输出；运放缓冲提供低阻大电流，负载不影响输出电压</text>
</svg>
