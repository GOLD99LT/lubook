<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="440" height="220" fill="#ffffff"/>
  <!-- AC 输入 -->
  <text x="30" y="100" font-size="15" fill="#2b3a4a">AC in</text>
  <line x1="70" y1="95" x2="120" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 整流桥（简化两个二极管） -->
  <polygon points="120,85 140,95 120,105" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="140" y1="85" x2="140" y2="105" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="140" y1="95" x2="200" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="160" y="80" font-size="13" fill="#1a4f8b" font-weight="700">整流</text>
  <!-- 滤波电容 -->
  <circle cx="230" cy="95" r="4.5" fill="#2b3a4a"/>
  <line x1="230" y1="95" x2="230" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="212" y1="125" x2="248" y2="125" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="212" y1="137" x2="248" y2="137" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="255" y="135" font-size="14" fill="#1a4f8b" font-weight="700">C 100µF</text>
  <line x1="230" y1="137" x2="230" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="216" y1="170" x2="244" y2="170" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="221" y1="177" x2="239" y2="177" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="225" y1="184" x2="235" y2="184" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 输出 -->
  <line x1="230" y1="95" x2="380" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="388" y="101" font-size="15" fill="#1a4f8b" font-weight="700">Vout (DC)</text>
  <!-- 负载 Rl -->
  <line x1="320" y1="95" x2="320" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="308" y="130" width="24" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="340" y="150" font-size="13" fill="#1a4f8b" font-weight="700">Rl</text>
  <line x1="320" y1="160" x2="320" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
