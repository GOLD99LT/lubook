<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="860" height="460" fill="#ffffff"/>
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">原理图符号（Symbol）↔ 封装（Footprint）↔ 实物</text>

  <!-- 左：原理图符号 -->
  <rect x="40" y="80" width="240" height="220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="160" y="108" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">原理图符号 Symbol</text>
  <!-- 方框代表芯片 -->
  <rect x="100" y="140" width="120" height="120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="160" y="205" font-size="13" fill="#222a32" text-anchor="middle">U1 (MCU)</text>
  <!-- 引脚线 -->
  <line x1="70" y1="160" x2="100" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="66" y="164" font-size="11" fill="#1a4f8b" text-anchor="end">VCC</text>
  <line x1="70" y1="200" x2="100" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="66" y="204" font-size="11" fill="#1a4f8b" text-anchor="end">GND</text>
  <line x1="70" y1="240" x2="100" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="66" y="244" font-size="11" fill="#1a4f8b" text-anchor="end">PA0</text>
  <line x1="220" y1="180" x2="250" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="254" y="184" font-size="11" fill="#1a4f8b">PA1</text>

  <!-- 中：关联映射 -->
  <line x1="280" y1="190" x2="360" y2="190" stroke="#b5642e" stroke-width="2.2" marker-end="url(#ar2)"/>
  <text x="320" y="178" font-size="12.5" fill="#b5642e" text-anchor="middle">关联</text>
  <text x="320" y="212" font-size="11.5" fill="#5c6772" text-anchor="middle">pin map</text>

  <!-- 右：封装 -->
  <rect x="360" y="80" width="240" height="220" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="480" y="108" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">PCB 封装 Footprint</text>
  <!-- QFP 焊盘 -->
  <rect x="430" y="150" width="100" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.6"/>
  <!-- 焊盘脚 -->
  <g fill="#2b3a4a">
    <rect x="415" y="158" width="12" height="5"/>
    <rect x="415" y="178" width="12" height="5"/>
    <rect x="415" y="198" width="12" height="5"/>
    <rect x="415" y="218" width="12" height="5"/>
    <rect x="533" y="158" width="12" height="5"/>
    <rect x="533" y="178" width="12" height="5"/>
    <rect x="533" y="198" width="12" height="5"/>
    <rect x="533" y="218" width="12" height="5"/>
  </g>
  <text x="480" y="278" font-size="12" fill="#5c6772" text-anchor="middle">QFP-48  Land Pattern</text>

  <!-- 箭头到实物 -->
  <line x1="600" y1="190" x2="660" y2="190" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar2)"/>
  <rect x="660" y="130" width="150" height="120" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="735" y="170" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">实物芯片</text>
  <text x="735" y="196" font-size="12" fill="#222a32" text-anchor="middle">焊接到焊盘上</text>

  <rect x="40" y="340" width="770" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="60" y="368" font-size="13" fill="#1a4f8b" font-weight="700">要点：</text>
  <text x="60" y="392" font-size="13" fill="#222a32">符号只管"逻辑长相"（引脚名/功能），封装只管"物理长相"（焊盘尺寸/间距），两者通过 pin map 一一对应。</text>
  <text x="60" y="414" font-size="13" fill="#222a32">同一个符号可挂多个封装（0805/0603）；封装尺寸错 0.1 mm 就可能焊不上——必须严格按数据手册 land pattern 画。</text>
</svg>
