<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="460" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">串扰：攻击线与受害线（容性/感性耦合）</text>

  <!-- 攻击线 -->
  <line x1="80" y1="150" x2="740" y2="150" stroke="#b03a3a" stroke-width="4"/>
  <text x="80" y="138" font-size="13" fill="#b03a3a" font-weight="700">攻击线 Aggressor（跳变）</text>

  <!-- 受害线 -->
  <line x1="80" y1="230" x2="740" y2="230" stroke="#1a4f8b" stroke-width="4"/>
  <text x="80" y="255" font-size="13" fill="#1a4f8b" font-weight="700">受害线 Victim（原本安静）</text>

  <!-- 间距 S -->
  <line x1="760" y1="150" x2="760" y2="230" stroke="#2b3a4a" stroke-width="1.4"/>
  <line x1="754" y1="150" x2="766" y2="150" stroke="#2b3a4a" stroke-width="1.4"/>
  <line x1="754" y1="230" x2="766" y2="230" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="770" y="195" font-size="13" fill="#222a32">间距 S</text>

  <!-- 耦合示意 -->
  <path d="M200,155 Q240,190 200,225" fill="none" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="5,4"/>
  <path d="M400,155 Q440,190 400,225" fill="none" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="5,4"/>
  <path d="M600,155 Q640,190 600,225" fill="none" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="5,4"/>

  <!-- 近端/远端标注 -->
  <text x="80" y="290" font-size="12.5" fill="#2f6e4f">← 近端 NEXT（与驱动端同侧）</text>
  <text x="560" y="290" font-size="12.5" fill="#7a5fc0">远端 FEXT →</text>

  <rect x="60" y="320" width="740" height="120" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="80" y="348" font-size="13" fill="#1a4f8b" font-weight="700">机理：</text>
  <text x="80" y="372" font-size="12.5" fill="#222a32">两线靠近时，攻击线跳变经寄生电容（电场）与互感（磁场）在受害线上感应出噪声。</text>
  <text x="80" y="394" font-size="12.5" fill="#222a32">间距加倍，串扰约降为 1/4；平行长度越长，串扰越大。受害线若高阻（如 CMOS 输入），噪声更明显。</text>
  <text x="80" y="416" font-size="12.5" fill="#b5642e">经验：关键信号间距 ≥ 3 倍线宽（3W 规则），串扰降到 ~5% 以下。</text>
</svg>
