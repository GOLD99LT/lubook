<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>用注入法在 LTspice 里测 Buck 环路增益：AC 源串在分压点与 FB 之间，画 V(div)/V(fb) 读穿越频率与相位裕度</title>
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="380" y="28" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">注入法测环路增益：AC 源串在分压点与 FB 之间，直流仍由 R1/R2 闭合</text>

  <!-- 输入源 -->
  <circle cx="85" cy="150" r="26" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="85" y="146" font-size="14" fill="#2b3a4a" text-anchor="middle" font-weight="700">V1</text>
  <text x="85" y="164" font-size="12" fill="#b5642e" text-anchor="middle">12V</text>
  <line x1="85" y1="124" x2="85" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="85" y1="100" x2="200" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 功率级 + 补偿器 -->
  <rect x="200" y="85" width="300" height="130" rx="4" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="350" y="126" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">Buck 功率级 + 补偿器</text>
  <text x="350" y="150" font-size="12" fill="#2b3a4a" text-anchor="middle">X1 BUCK_LOOP IN OUT FB</text>
  <text x="350" y="170" font-size="12" fill="#7a5fc0" text-anchor="middle">换厂商平均模型或自建模型</text>
  <text x="212" y="96" font-size="11" fill="#b5642e">IN</text>
  <text x="488" y="106" font-size="11" fill="#b5642e" text-anchor="end">OUT</text>
  <text x="466" y="209" font-size="11" fill="#b5642e">FB</text>

  <!-- 输出节点 -->
  <line x1="500" y1="110" x2="640" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="560" cy="110" r="4.5" fill="#2b3a4a"/>
  <text x="596" y="100" font-size="13" fill="#1a4f8b" font-weight="700">Vout=5V</text>

  <!-- 输出电容 -->
  <line x1="640" y1="110" x2="640" y2="225" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="225" x2="660" y2="225" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="620" y1="237" x2="660" y2="237" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="668" y="236" font-size="12" fill="#1a4f8b">Cout</text>
  <line x1="640" y1="237" x2="640" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Cout 地：28/18/10，间距 7 -->
  <line x1="626" y1="265" x2="654" y2="265" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="631" y1="272" x2="649" y2="272" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="635" y1="279" x2="645" y2="279" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 反馈分压 -->
  <line x1="560" y1="110" x2="560" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="551" y="165" width="18" height="42" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="578" y="192" font-size="12" fill="#1a4f8b">R1 84k</text>
  <line x1="560" y1="207" x2="560" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="560" cy="222" r="4.5" fill="#2b3a4a"/>
  <text x="578" y="218" font-size="12" fill="#1a4f8b">div</text>
  <rect x="551" y="222" width="18" height="42" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="578" y="249" font-size="12" fill="#1a4f8b">R2 16k</text>
  <line x1="560" y1="264" x2="560" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 分压地：28/18/10，间距 7 -->
  <line x1="546" y1="285" x2="574" y2="285" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="551" y1="292" x2="569" y2="292" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="555" y1="299" x2="565" y2="299" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 注入源 -->
  <line x1="560" y1="222" x2="532" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="516" cy="222" r="14" fill="#fff8e1" stroke="#b5642e" stroke-width="2.4"/>
  <text x="516" y="227" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="700">AC</text>
  <line x1="502" y1="222" x2="478" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="478" y1="222" x2="478" y2="215" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="516" y="196" font-size="12" fill="#b5642e" text-anchor="middle">Vinj div fb AC 1</text>

  <!-- V1 地：28/18/10，间距 7 -->
  <line x1="85" y1="176" x2="85" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="71" y1="250" x2="99" y2="250" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="76" y1="257" x2="94" y2="257" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="80" y1="264" x2="90" y2="264" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 底部说明 -->
  <rect x="30" y="318" width="700" height="94" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="48" y="342" font-size="12.5" fill="#222a32">T(s) = V(div)/V(fb)：注入源把 FB 抬起 v_inj，环路在 div 上"还回来"T 倍，比值即环路增益。</text>
  <text x="48" y="366" font-size="12.5" fill="#222a32">扫频 .ac dec 200 10 1Meg，在 |T|=1 处读相位 ∠T，相位裕度 PM = 180° + ∠T。</text>
  <text x="48" y="390" font-size="12.5" fill="#7a5fc0">手算校验：50kHz 处 18.2 × 0.344 × 0.16 ≈ 1.00，∠T ≈ −119°，PM ≈ 61°。</text>
</svg>
