<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="340" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">Boost 升压功率级：L + 开关 + 二极管 + Cout</text>

  <!-- Vin -->
  <text x="36" y="156" font-size="16" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="160" x2="130" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 电感 -->
  <path d="M130,160 q12,-24 24,0 q12,24 24,0 q12,-24 24,0 q12,24 24,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="226" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="178" y="136" font-size="15" fill="#1a4f8b" font-weight="700" text-anchor="middle">L=15µH</text>

  <!-- SW 节点 -->
  <circle cx="300" cy="160" r="4.5" fill="#2b3a4a"/>
  <text x="292" y="148" font-size="14" fill="#1a4f8b" font-weight="700">SW</text>

  <!-- 开关 MOS：SW -> 地 -->
  <line x1="300" y1="160" x2="300" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="288" y="200" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="230" font-size="12.5" fill="#1a4f8b" font-weight="700">Q 开关</text>
  <line x1="300" y1="250" x2="300" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 二极管：SW -> Vout（阳极在 SW，阴极在输出） -->
  <line x1="300" y1="160" x2="360" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="360,142 360,178 390,160" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="144" x2="390" y2="176" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="390" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="375" y="134" font-size="12.5" fill="#5c6772" text-anchor="middle">D</text>

  <!-- Vout -->
  <circle cx="520" cy="160" r="4.5" fill="#2b3a4a"/>
  <text x="568" y="166" font-size="16" fill="#1a4f8b" font-weight="700">Vout=12V</text>

  <!-- Cout -->
  <line x1="520" y1="160" x2="520" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="502" y1="200" x2="538" y2="200" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="502" y1="220" x2="538" y2="220" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="520" y1="220" x2="520" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="546" y="215" font-size="13.5" fill="#1a4f8b" font-weight="700">Cout</text>

  <!-- 地 -->
  <line x1="300" y1="290" x2="520" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="290" x2="400" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="386" y1="310" x2="414" y2="310" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="391" y1="317" x2="409" y2="317" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="395" y1="324" x2="405" y2="324" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
