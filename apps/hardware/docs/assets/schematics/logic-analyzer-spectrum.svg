<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="380" fill="#ffffff"/>
  <!-- DUT MCU -->
  <rect x="60" y="120" width="140" height="120" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="130" y="150" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">被测 MCU/FPGA</text>
  <text x="130" y="180" font-size="12" fill="#2b3a4a" text-anchor="middle">CLK MOSI MISO CS</text>
  <!-- 逻辑分析仪 -->
  <rect x="360" y="110" width="160" height="80" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="440" y="140" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">逻辑分析仪</text>
  <text x="440" y="162" font-size="12" fill="#b5642e" text-anchor="middle">多通道采样 0/1</text>
  <!-- 飞线夹持 -->
  <line x1="200" y1="150" x2="360" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="170" x2="360" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="190" x2="360" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="210" x2="360" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="280" y="120" font-size="12" fill="#7a5fc0">飞线夹接数字信号线</text>
  <!-- USB 到 PC -->
  <line x1="520" y1="150" x2="620" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="620" y="125" width="100" height="50" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="670" y="155" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">PC 解析</text>
  <text x="380" y="250" font-size="13" fill="#7a5fc0" text-anchor="middle">逻辑分析仪只看高低电平(时间域)，配合 sigrok/PulseView 解码 I2C/SPI/UART</text>
  <!-- 频谱仪小框 -->
  <rect x="360" y="280" width="160" height="70" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="440" y="308" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">频谱仪</text>
  <text x="440" y="328" font-size="12" fill="#b5642e" text-anchor="middle">频率域：看谐波/噪声/EMI</text>
</svg>
