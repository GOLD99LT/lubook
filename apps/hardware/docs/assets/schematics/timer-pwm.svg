<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">定时器计数与 PWM 生成结构</text>

  <!-- 时钟 -->
  <text x="50" y="120" font-size="12" fill="#b5642e">内部时钟 CK</text>
  <line x1="50" y1="130" x2="110" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="115" width="80" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="150" y="135" font-size="12" fill="#222a32" text-anchor="middle">预分频 PSC</text>
  <line x1="190" y1="130" x2="250" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 计数器 -->
  <rect x="250" y="100" width="130" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="315" y="130" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">向上计数 CNT</text>
  <text x="315" y="152" font-size="11" fill="#5c6772" text-anchor="middle">0 → ARR → 溢出</text>

  <!-- ARR / CCR -->
  <rect x="250" y="200" width="130" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="315" y="225" font-size="12" fill="#222a32" text-anchor="middle">ARR（周期）</text>
  <line x1="315" y1="200" x2="315" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>

  <rect x="430" y="100" width="130" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="495" y="122" font-size="12" fill="#222a32" text-anchor="middle">比较器</text>
  <text x="495" y="140" font-size="11" fill="#5c6772" text-anchor="middle">CNT vs CCR</text>
  <line x1="380" y1="135" x2="430" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>

  <rect x="430" y="180" width="130" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="495" y="205" font-size="12" fill="#222a32" text-anchor="middle">CCR（占空比）</text>
  <line x1="495" y1="180" x2="495" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 输出 -->
  <line x1="560" y1="125" x2="660" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="670" y="130" font-size="13" fill="#2e7d4f">PWM 输出</text>

  <text x="120" y="300" font-size="13" fill="#7a5fc0">周期 T=(ARR+1)×PSC 个时钟；CNT&lt;CCR 为高、CNT≥CCR 为低 → 占空比=CCR/ARR</text>
</svg>
