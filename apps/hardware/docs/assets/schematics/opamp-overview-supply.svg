<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>单电源与双电源下的运放输出摆幅：双电源 ±15V 时典型可用 ±13V，5V 单电源下轨到轨与非轨到轨的输出范围差异</title>
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="700" fill="#222a32">单电源与双电源的输出摆幅 Output Swing vs Rails</text>
  <text x="30" y="62" font-size="12.5" fill="#5c6772">双电源 ±15V 时典型可用 ±13V；5V 单电源下轨到轨与非轨到轨的输出范围差异（典型量级，以数据手册为准）</text>
  <line x1="30" y1="76" x2="930" y2="76" stroke="#e3e0d7"/>

  <!-- ============ 左：双电源 ±15V ============ -->
  <text x="205" y="104" font-size="15" font-weight="700" fill="#222a32" text-anchor="middle">双电源 ±15 V</text>

  <!-- 可用区间 -->
  <rect x="110" y="144" width="190" height="312" fill="#e8f0f9"/>
  <line x1="110" y1="144" x2="300" y2="144" stroke="#5b8fc4" stroke-width="1.4" stroke-dasharray="5,4"/>
  <line x1="110" y1="456" x2="300" y2="456" stroke="#5b8fc4" stroke-width="1.4" stroke-dasharray="5,4"/>

  <!-- 电源轨 -->
  <line x1="110" y1="120" x2="300" y2="120" stroke="#1a4f8b" stroke-width="3.4"/>
  <line x1="110" y1="480" x2="300" y2="480" stroke="#1a4f8b" stroke-width="3.4"/>
  <text x="102" y="125" font-size="13" fill="#1a4f8b" text-anchor="end" font-weight="700">+15 V</text>
  <text x="102" y="485" font-size="13" fill="#1a4f8b" text-anchor="end" font-weight="700">−15 V</text>
  <text x="308" y="125" font-size="12" fill="#5c6772">V+ 轨</text>
  <text x="308" y="485" font-size="12" fill="#5c6772">V− 轨</text>
  <text x="308" y="153" font-size="12" fill="#2f7d4f">+13 V 输出上限</text>
  <text x="308" y="466" font-size="12" fill="#2f7d4f">−13 V 输出下限</text>

  <text x="205" y="285" font-size="15" font-weight="700" fill="#222a32" text-anchor="middle">输出摆幅 ±13 V</text>
  <text x="205" y="308" font-size="12" fill="#5c6772" text-anchor="middle">峰峰值 26 V，每侧余量 2 V</text>
  <text x="205" y="332" font-size="12" fill="#5c6772" text-anchor="middle">0 V 是中间参考（信号地）</text>

  <!-- ============ 右：单电源 5V ============ -->
  <text x="750" y="104" font-size="15" font-weight="700" fill="#222a32" text-anchor="middle">单电源 5 V</text>

  <line x1="600" y1="140" x2="880" y2="140" stroke="#1a4f8b" stroke-width="3.4"/>
  <line x1="600" y1="460" x2="880" y2="460" stroke="#2b3a4a" stroke-width="3.4"/>
  <text x="592" y="145" font-size="13" fill="#1a4f8b" text-anchor="end" font-weight="700">5 V（V+）</text>
  <text x="592" y="465" font-size="12.5" fill="#2b3a4a" text-anchor="end" font-weight="700">0 V（V−/GND）</text>

  <!-- 接地符号：28/18/10，间距 7 -->
  <circle cx="620" cy="460" r="4" fill="#2b3a4a"/>
  <line x1="620" y1="460" x2="620" y2="470" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="606" y1="470" x2="634" y2="470" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="611" y1="477" x2="629" y2="477" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="615" y1="484" x2="625" y2="484" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 三种输出范围 -->
  <line x1="670" y1="143.2" x2="670" y2="456.8" stroke="#2f7d4f" stroke-width="3"/>
  <line x1="665" y1="143.2" x2="675" y2="143.2" stroke="#2f7d4f" stroke-width="2.4"/>
  <line x1="665" y1="456.8" x2="675" y2="456.8" stroke="#2f7d4f" stroke-width="2.4"/>

  <line x1="700" y1="159.2" x2="700" y2="440.8" stroke="#b5642e" stroke-width="3"/>
  <line x1="695" y1="159.2" x2="705" y2="159.2" stroke="#b5642e" stroke-width="2.4"/>
  <line x1="695" y1="440.8" x2="705" y2="440.8" stroke="#b5642e" stroke-width="2.4"/>

  <line x1="730" y1="236" x2="730" y2="421.6" stroke="#cc5a47" stroke-width="3"/>
  <line x1="725" y1="236" x2="735" y2="236" stroke="#cc5a47" stroke-width="2.4"/>
  <line x1="725" y1="421.6" x2="735" y2="421.6" stroke="#cc5a47" stroke-width="2.4"/>

  <text x="745" y="148" font-size="12" fill="#2f7d4f" font-weight="700">轨到轨（轻载）</text>
  <text x="745" y="164" font-size="12" fill="#2f7d4f">0.05 ~ 4.95 V</text>
  <text x="745" y="190" font-size="12" fill="#b5642e" font-weight="700">轨到轨（10 mA）</text>
  <text x="745" y="206" font-size="12" fill="#b5642e">0.3 ~ 4.7 V</text>
  <text x="745" y="252" font-size="12" fill="#cc5a47" font-weight="700">非轨到轨</text>
  <text x="745" y="268" font-size="12" fill="#cc5a47">0.6 ~ 3.5 V</text>

  <text x="600" y="500" font-size="12" fill="#5c6772">信号峰值必须落进彩色区间，越界即削顶</text>

  <text x="30" y="540" font-size="12" fill="#5c6772">注：输出摆幅随负载电流、温度、电源电压变化；具体数值以数据手册 Output Voltage Swing 表（含测试条件）为准。</text>
</svg>
