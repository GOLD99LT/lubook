<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">半波整流与电容滤波</text>

  <!-- 交流输入 -->
  <circle cx="60" cy="120" r="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M48,120 q6,-12 12,0 q6,12 12,0" fill="none" stroke="#2b3a4a" stroke-width="2"/>
  <text x="60" y="160" font-size="13" fill="#5c6772" text-anchor="middle">AC 9V</text>
  <line x1="80" y1="120" x2="140" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 二极管 -->
  <polygon points="140,102 140,138 172,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="172" y1="104" x2="172" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="172" y1="120" x2="300" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 输出节点 + 电容滤波 -->
  <circle cx="300" cy="120" r="4.5" fill="#2b3a4a"/>
  <line x1="300" y1="120" x2="480" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="490" y="126" font-size="16" fill="#2b3a4a">+Vout(直流)</text>

  <line x1="300" y1="120" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="282" y1="160" x2="318" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="282" y1="180" x2="318" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="326" y="174" font-size="14" fill="#1a4f8b" font-weight="700">2200µF</text>

  <!-- 回路地 -->
  <line x1="60" y1="140" x2="60" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="60" y1="220" x2="300" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="220" x2="180" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="166" y1="240" x2="194" y2="240" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="171" y1="247" x2="189" y2="247" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="175" y1="254" x2="185" y2="254" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
