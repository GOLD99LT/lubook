<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">NPN 低边开关驱动继电器</text>

  <!-- MCU GPIO -->
  <text x="40" y="110" font-size="15" fill="#2b3a4a">MCU GPIO</text>
  <line x1="40" y1="120" x2="110" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 基极电阻 -->
  <rect x="110" y="108" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="150" y="98" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rb=470Ω</text>
  <line x1="190" y1="120" x2="300" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- NPN -->
  <circle cx="330" cy="150" r="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="132" x2="300" y2="168" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="136" x2="350" y2="108" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="164" x2="350" y2="192" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="338,182 346,190 332,196" fill="#2b3a4a"/>
  <text x="330" y="154" font-size="13" fill="#5c6772" text-anchor="middle">Q1</text>

  <!-- 集电极到继电器/电源 -->
  <line x1="350" y1="108" x2="430" y2="108" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="430" cy="108" r="4.5" fill="#2b3a4a"/>
  <!-- 继电器线圈 -->
  <path d="M430,108 q10,-20 20,0 q10,20 20,0 q10,-20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="490" y1="108" x2="560" y2="108" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="460" y="86" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">继电器线圈 5V</text>

  <!-- 续流二极管（反并在线圈两端，阴极接+） -->
  <line x1="430" y1="108" x2="430" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="412,150 448,150 430,178" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="412" y1="180" x2="448" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="430" y1="180" x2="430" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="456" y="168" font-size="13" fill="#5c6772">续流二极管</text>

  <!-- 发射极接地 -->
  <line x1="350" y1="192" x2="350" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="230" x2="430" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="230" x2="390" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="376" y1="250" x2="404" y2="250" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="381" y1="257" x2="399" y2="257" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="385" y1="264" x2="395" y2="264" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
