<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">VBAT 后备电池供电切换</text>

  <!-- VDD 支路 D1 -->
  <text x="80" y="92" font-size="13" fill="#b5642e">+3V3 主电源</text>
  <line x1="120" y1="100" x2="120" y2="128" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="105,128 135,128 120,158" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="108" y1="160" x2="132" y2="160" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="142" y="148" font-size="11" fill="#1a4f8b">D1 肖特基</text>
  <line x1="120" y1="162" x2="120" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="210" x2="360" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 纽扣电池支路 D2 -->
  <text x="430" y="92" font-size="13" fill="#b5642e">CR2032 3V</text>
  <line x1="470" y1="100" x2="470" y2="128" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="455,128 485,128 470,158" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="458" y1="160" x2="482" y2="160" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="490" y="148" font-size="11" fill="#1a4f8b">D2 肖特基</text>
  <line x1="470" y1="162" x2="470" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- VBAT 节点 -->
  <circle cx="360" cy="210" r="4.5" fill="#2b3a4a"/>
  <circle cx="470" cy="210" r="4.5" fill="#2b3a4a"/>
  <!-- 去耦 -->
  <line x1="360" y1="210" x2="360" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="342" y1="240" x2="378" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="342" y1="260" x2="378" y2="260" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="360" y1="260" x2="360" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="346" y1="290" x2="374" y2="290" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="351" y1="297" x2="369" y2="297" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="355" y1="304" x2="365" y2="304" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="385" y="256" font-size="11" fill="#1a4f8b" font-weight="700">100nF</text>

  <!-- 到 MCU VBAT -->
  <line x1="470" y1="210" x2="620" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="620" y="188" width="110" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="675" y="215" font-size="13" fill="#222a32" text-anchor="middle">MCU VBAT</text>
</svg>
