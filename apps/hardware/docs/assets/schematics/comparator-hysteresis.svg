<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- Vin -> 反相端 -->
  <line x1="40" y1="170" x2="300" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="155" font-size="20" fill="#2b3a4a">Vin</text>
  <!-- 运放三角形 -->
  <polygon points="300,100 300,260 450,185" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="162" font-size="24" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="232" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 同相端节点 -->
  <line x1="300" y1="220" x2="220" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R1：+节点 -> Vref -->
  <line x1="220" y1="220" x2="170" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="90" y="208" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="220" x2="60" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="200" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₁</text>
  <text x="40" y="205" font-size="18" fill="#2b3a4a">Vref</text>
  <!-- Rf：+节点 -> 输出 -->
  <line x1="220" y1="220" x2="220" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="220" y1="60" x2="380" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="380" y="48" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="500" y1="60" x2="560" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="60" x2="560" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="440" y="40" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <!-- 输出线 -->
  <line x1="450" y1="185" x2="620" y2="185" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="632" y="191" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 节点圆点 -->
  <circle cx="300" cy="170" r="4.5" fill="#2b3a4a"/>
  <circle cx="220" cy="220" r="4.5" fill="#2b3a4a"/>
  <circle cx="560" cy="185" r="4.5" fill="#2b3a4a"/>
</svg>
