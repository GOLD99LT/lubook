<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>阻抗三角形与 R、L、C 在复平面上的方向</title>
  <desc>左图按 R=100 欧、X=-96.3 欧画出的阻抗三角形，|Z|=138.9 欧、相角 -43.9 度；右图给出电阻沿实轴、电感沿 +j、电容沿 -j 的方向</desc>
  <defs>
    <marker id="imp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="30" y="34" font-size="14" fill="#1a4f8b" font-weight="700">① 阻抗三角形（R = 100 Ω，X = −96.3 Ω）</text>
  <text x="380" y="34" font-size="14" fill="#1a4f8b" font-weight="700">② 三个元件在复平面上的方向</text>
  <line x1="360" y1="48" x2="360" y2="310" stroke="#dde4ec" stroke-width="1.4" stroke-dasharray="5 5"/>
  <!-- 左图：阻抗三角形 -->
  <line x1="130" y1="120" x2="290" y2="120" stroke="#2b3a4a" stroke-width="2.6" marker-end="url(#imp-arrow)"/>
  <line x1="290" y1="120" x2="290" y2="274" stroke="#b5642e" stroke-width="2.6" marker-end="url(#imp-arrow)"/>
  <line x1="130" y1="120" x2="290" y2="274" stroke="#1a4f8b" stroke-width="2.6"/>
  <line x1="130" y1="120" x2="130" y2="274" stroke="#c9d3de" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="130" y1="274" x2="290" y2="274" stroke="#c9d3de" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M200,120 A70,70 0 0 1 180.4,168.5" fill="none" stroke="#2b3a4a" stroke-width="1.6"/>
  <circle cx="130" cy="120" r="4" fill="#2b3a4a"/>
  <text x="210" y="112" font-size="14" fill="#1a4f8b" text-anchor="middle">R = 100 Ω</text>
  <text x="200" y="146" font-size="13" fill="#222a32" text-anchor="middle">φ = −43.9°</text>
  <text x="300" y="202" font-size="14" fill="#b5642e">X = −96.3 Ω</text>
  <text x="300" y="220" font-size="12" fill="#222a32">（容性，指向 −j）</text>
  <text x="168" y="238" font-size="14" fill="#1a4f8b" text-anchor="middle">|Z| = 138.9 Ω</text>
  <text x="130" y="292" font-size="12" fill="#222a32" text-anchor="middle">原点</text>
  <!-- 右图：R / L / C 的方向 -->
  <line x1="520" y1="190" x2="626" y2="190" stroke="#1a4f8b" stroke-width="2.6" marker-end="url(#imp-arrow)"/>
  <line x1="520" y1="190" x2="520" y2="96" stroke="#3f7d3f" stroke-width="2.6" marker-end="url(#imp-arrow)"/>
  <line x1="520" y1="190" x2="520" y2="284" stroke="#b5642e" stroke-width="2.6" marker-end="url(#imp-arrow)"/>
  <line x1="440" y1="190" x2="610" y2="190" stroke="#c9d3de" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="520" y1="70" x2="520" y2="300" stroke="#c9d3de" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="520" cy="190" r="4" fill="#2b3a4a"/>
  <text x="600" y="180" font-size="14" fill="#1a4f8b">R</text>
  <text x="532" y="94" font-size="14" fill="#3f7d3f">jωL（感性，+j）</text>
  <text x="532" y="300" font-size="14" fill="#b5642e">−j/(ωC)（容性，−j）</text>
  <text x="512" y="206" font-size="12" fill="#222a32" text-anchor="end">+Re</text>
  <text x="330" y="330" font-size="13" fill="#222a32" text-anchor="middle">阻抗的实部消耗功率，虚部只在电源与储能元件之间来回交换</text>
</svg>
