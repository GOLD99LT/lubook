<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="300" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">RCC 自激振荡反激：辅助绕组反馈自激，无需 PWM 控制器</text>

  <!-- 原边绕组 -->
  <line x1="120" y1="90" x2="180" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M180,90 q10,-20 20,0 q10,20 20,0 q10,-20 20,0 q10,20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="90" x2="320" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="66" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">Np</text>

  <!-- 铁芯 -->
  <line x1="340" y1="60" x2="340" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="356" y1="60" x2="356" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>

  <!-- BJT 主开关 -->
  <line x1="320" y1="90" x2="320" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="320" cy="180" r="26" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="206" x2="320" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="180" x2="260" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="210" y="168" width="50" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="235" y="185" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rb</text>
  <text x="360" y="185" font-size="12" fill="#5c6772">BJT 自激开关</text>

  <!-- 辅助绕组供基极 -->
  <line x1="380" y1="90" x2="400" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M400,90 q8,-16 16,0 q8,16 16,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="424" y="66" font-size="12" fill="#1a4f8b" font-weight="700">辅助绕组(基极驱动)</text>

  <!-- 副边 -->
  <line x1="470" y1="90" x2="490" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M490,90 q10,-20 20,0 q10,20 20,0 q10,-20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="570" y1="90" x2="620" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="620,76 620,104 648,90" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="648" y1="76" x2="648" y2="104" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="648" y1="90" x2="720" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="730" y="95" font-size="13" fill="#1a4f8b" font-weight="700">Vout</text>

  <text x="30" y="280" font-size="13" fill="#222a32">特点：电路极简单、成本低，手机充电器/小功率电源；频率随负载变、效率低、EMI 差，现多用于 &lt;5W</text>
</svg>
