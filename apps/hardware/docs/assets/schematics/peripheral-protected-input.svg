<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace" role="img">
  <title>MCU 经 10 米电缆接 5V 传感器：连接器处 TVS 钳位，100 欧姆限流，10k 与 20k 分压到 3.3V，100nF 滤波</title>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">10m 电缆接 5V 传感器：TVS + 限流 + 分压 + 滤波</text>

  <!-- 传感器 -->
  <rect x="40" y="170" width="130" height="100" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="105" y="202" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="middle">5V 传感器</text>
  <text x="105" y="224" font-size="10" fill="#5c6772" text-anchor="middle">推挽输出</text>
  <text x="105" y="244" font-size="10" fill="#5c6772" text-anchor="middle">VOH ≈ 5V</text>

  <!-- 电缆 -->
  <line x1="170" y1="210" x2="400" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="170" y1="250" x2="400" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="190" y="148" font-size="11" fill="#7a5fc0">10m 电缆，24AWG，约 50pF/m</text>

  <!-- 连接器 -->
  <rect x="400" y="180" width="50" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="425" y="226" font-size="11" fill="#222a32" text-anchor="middle">J1</text>
  <text x="425" y="244" font-size="9" fill="#5c6772" text-anchor="middle">连接器</text>

  <!-- 信号地 -->
  <line x1="400" y1="250" x2="400" y2="270" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="386" y1="270" x2="414" y2="270" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="391" y1="277" x2="409" y2="277" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="395" y1="284" x2="405" y2="284" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="420" y="278" font-size="10" fill="#5c6772">信号地</text>

  <!-- 入口与 TVS -->
  <line x1="450" y1="210" x2="480" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="480" y1="210" x2="480" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="470,250 490,250 480,268" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="470" y1="268" x2="490" y2="268" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="480" y1="268" x2="480" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="466" y1="285" x2="494" y2="285" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="471" y1="292" x2="489" y2="292" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="475" y1="299" x2="485" y2="299" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="497" y="250" font-size="10" fill="#1a4f8b">TVS 5V</text>

  <!-- 限流电阻 -->
  <line x1="480" y1="210" x2="520" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="520" y="198" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="580" y1="210" x2="600" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="550" y="190" font-size="10" fill="#1a4f8b" text-anchor="middle">100Ω</text>

  <!-- 分压 R1 -->
  <line x1="600" y1="210" x2="600" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="592" y="230" width="16" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="600" y1="280" x2="600" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="614" y="258" font-size="10" fill="#1a4f8b">10k</text>

  <!-- 分压 R2 -->
  <line x1="600" y1="300" x2="600" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="592" y="320" width="16" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="600" y1="370" x2="600" y2="390" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="586" y1="390" x2="614" y2="390" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="591" y1="397" x2="609" y2="397" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="595" y1="404" x2="605" y2="404" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="614" y="348" font-size="10" fill="#1a4f8b">20k</text>

  <!-- 输出与滤波 -->
  <line x1="600" y1="300" x2="760" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="600" cy="300" r="4.5" fill="#2b3a4a"/>
  <line x1="690" y1="300" x2="690" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="672" y1="330" x2="708" y2="330" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="672" y1="344" x2="708" y2="344" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="690" y1="344" x2="690" y2="364" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="676" y1="364" x2="704" y2="364" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="681" y1="371" x2="699" y2="371" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="685" y1="378" x2="695" y2="378" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="712" y="340" font-size="10" fill="#1a4f8b">100nF</text>

  <!-- MCU -->
  <rect x="760" y="260" width="110" height="80" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="815" y="292" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="middle">MCU</text>
  <text x="815" y="314" font-size="10" fill="#5c6772" text-anchor="middle">3.3V GPIO</text>

  <text x="40" y="420" font-size="11" fill="#7a5fc0">TVS 放在连接器入口先钳位；100Ω 与分压网络限制进入 GPIO 的浪涌电流。</text>
  <text x="40" y="442" font-size="11" fill="#7a5fc0">Vout = 5V × 20k/(10k+20k) = 3.33V；Rth = 10k ∥ 20k = 6.67kΩ。</text>
</svg>
