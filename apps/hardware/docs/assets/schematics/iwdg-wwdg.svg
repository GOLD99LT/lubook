<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">独立看门狗 IWDG vs 窗口看门狗 WWDG</text>

  <!-- IWDG -->
  <text x="60" y="80" font-size="13" fill="#1a4f8b" font-weight="700">IWDG：只要在溢出前喂狗即可</text>
  <line x1="60" y1="110" x2="340" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="60" y1="100" x2="60" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="340" y1="100" x2="340" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="60" y="140" font-size="11" fill="#2e7d4f">喂狗点(任意时刻)</text>
  <text x="250" y="140" font-size="11" fill="#b5642e">溢出→复位</text>

  <!-- WWDG -->
  <text x="60" y="190" font-size="13" fill="#b5642e" font-weight="700">WWDG：必须在窗口内喂，太早太晚都复位</text>
  <line x1="60" y1="220" x2="340" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="60" y1="210" x2="60" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="340" y1="210" x2="340" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 窗口 -->
  <line x1="150" y1="210" x2="150" y2="230" stroke="#b5642e" stroke-width="2.2"/>
  <line x1="260" y1="210" x2="260" y2="230" stroke="#b5642e" stroke-width="2.2"/>
  <text x="80" y="250" font-size="10" fill="#b5642e">太早喂→复位</text>
  <text x="160" y="250" font-size="10" fill="#2e7d4f">允许喂狗窗口</text>
  <text x="270" y="250" font-size="10" fill="#b5642e">太晚→复位</text>

  <text x="380" y="110" font-size="12" fill="#7a5fc0">IWDG 防程序跑飞；</text>
  <text x="380" y="135" font-size="12" fill="#7a5fc0">WWDG 还能抓"主循环过快"</text>
  <text x="380" y="160" font-size="12" fill="#7a5fc0">（时序错乱）</text>
</svg>
