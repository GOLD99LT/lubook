<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="34" font-size="17" fill="#1a4f8b" font-weight="700" text-anchor="middle">案例分析四步法：现象 → 定位 → 根因 → 解决</text>
  <rect x="40" y="110" width="140" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
  <text x="110" y="145" font-size="14" fill="#c0392b" font-weight="700" text-anchor="middle">现象</text>
  <text x="110" y="168" font-size="12" fill="#2b3a4a" text-anchor="middle">客观描述症状</text>
  <line x1="180" y1="150" x2="220" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="220" y="110" width="140" height="80" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.6"/>
  <text x="290" y="145" font-size="14" fill="#b5642e" font-weight="700" text-anchor="middle">定位</text>
  <text x="290" y="168" font-size="12" fill="#2b3a4a" text-anchor="middle">测量缩小范围</text>
  <line x1="360" y1="150" x2="400" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="400" y="110" width="140" height="80" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.6"/>
  <text x="470" y="145" font-size="14" fill="#3949ab" font-weight="700" text-anchor="middle">根因</text>
  <text x="470" y="168" font-size="12" fill="#2b3a4a" text-anchor="middle">为什么会这样</text>
  <line x1="540" y1="150" x2="580" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="580" y="110" width="110" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.6"/>
  <text x="635" y="145" font-size="14" fill="#2e7d32" font-weight="700" text-anchor="middle">解决</text>
  <text x="635" y="168" font-size="12" fill="#2b3a4a" text-anchor="middle">验证修复</text>
  <text x="360" y="240" font-size="13" fill="#7a5fc0" text-anchor="middle">每个案例都按这四步写清楚，尤其"根因"要挖到物理本质，不停在表面</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
</svg>
