<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">MAX232 电荷泵电容接法（4×1µF）</text>

  <!-- MAX232 -->
  <rect x="260" y="90" width="200" height="180" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="120" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">MAX232</text>

  <!-- VCC -->
  <text x="120" y="120" font-size="12" fill="#b5642e">VCC 3.3V</text>
  <line x1="200" y1="116" x2="260" y2="116" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="116" x2="230" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="212" y1="140" x2="248" y2="140" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="212" y1="160" x2="248" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="230" y1="160" x2="230" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="216" y1="190" x2="244" y2="190" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="221" y1="197" x2="239" y2="197" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="225" y1="204" x2="235" y2="204" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="120" y="155" font-size="11" fill="#1a4f8b">0.1µF 去耦</text>

  <!-- C1 (C1+/C1-) -->
  <line x1="320" y1="270" x2="320" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="302" y1="300" x2="338" y2="300" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="302" y1="320" x2="338" y2="320" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="345" y="316" font-size="11" fill="#1a4f8b">1µF (C1+/C1−)</text>

  <!-- C2 (V+/V-) -->
  <line x1="420" y1="270" x2="420" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="402" y1="300" x2="438" y2="300" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="402" y1="320" x2="438" y2="320" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="445" y="316" font-size="11" fill="#1a4f8b">1µF (V+/V−)</text>

  <text x="120" y="345" font-size="12" fill="#7a5fc0">电荷泵把 3.3V 倍压/反相出 ±电源，供 RS-232 输出级；电容必须按手册值就近接</text>
</svg>
