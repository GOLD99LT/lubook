<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>带通的两级级联：一阶高通与一阶低通串联，峰值在 f0 等于 fL 与 fH 的几何平均，带宽由两个转折频率之差决定</title>
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrowCC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入与第一级 -->
  <text x="24" y="146" font-size="20" fill="#2b3a4a">Vin</text>
  <line x1="70" y1="160" x2="120" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowCC)"/>
  <rect x="120" y="110" width="160" height="100" rx="8" fill="#f7fbff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="150" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">一阶高通</text>
  <text x="200" y="180" font-size="17" fill="#2b3a4a" text-anchor="middle">fL</text>
  <line x1="280" y1="160" x2="400" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowCC)"/>
  <!-- 第二级 -->
  <rect x="400" y="110" width="160" height="100" rx="8" fill="#f7fbff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="480" y="150" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">一阶低通</text>
  <text x="480" y="180" font-size="17" fill="#2b3a4a" text-anchor="middle">fH</text>
  <line x1="560" y1="160" x2="660" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowCC)"/>
  <text x="668" y="166" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 下方归一化响应示意 -->
  <line x1="80" y1="350" x2="700" y2="350" stroke="#2b3a4a" stroke-width="1.8"/>
  <line x1="80" y1="350" x2="80" y2="240" stroke="#2b3a4a" stroke-width="1.8"/>
  <polyline points="100,350 220,280 460,280 600,350" fill="none" stroke="#1a4f8b" stroke-width="2.8"/>
  <text x="66" y="252" font-size="16" fill="#2b3a4a">dB</text>
  <text x="700" y="368" font-size="16" fill="#2b3a4a">f</text>
  <text x="220" y="370" font-size="16" fill="#2b3a4a" text-anchor="middle">fL</text>
  <text x="340" y="370" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">f0</text>
  <text x="460" y="370" font-size="16" fill="#2b3a4a" text-anchor="middle">fH</text>
  <text x="106" y="300" font-size="16" fill="#2b3a4a">Q 小于等于 0.5</text>
</svg>
