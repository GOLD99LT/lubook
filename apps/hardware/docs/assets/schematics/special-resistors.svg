<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">特殊电阻电路符号</text>

  <!-- NTC -->
  <line x1="50" y1="100" x2="90" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="90" y="88" width="70" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="94" y1="110" x2="156" y2="90" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="160" y1="100" x2="200" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="125" y="80" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">NTC −t°</text>
  <text x="125" y="135" font-size="13" fill="#5c6772" text-anchor="middle">热敏(负温度系数)</text>

  <!-- PTC -->
  <line x1="290" y1="100" x2="330" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="88" width="70" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="334" y1="90" x2="396" y2="110" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="400" y1="100" x2="440" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="365" y="80" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">PTC +t°</text>
  <text x="365" y="135" font-size="13" fill="#5c6772" text-anchor="middle">热敏(正温度系数)</text>

  <!-- MOV -->
  <line x1="530" y1="100" x2="570" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="570" y="88" width="70" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="574" y1="110" x2="636" y2="90" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="574" y1="90" x2="636" y2="110" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="640" y1="100" x2="680" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="605" y="80" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">MOV</text>
  <text x="605" y="135" font-size="13" fill="#5c6772" text-anchor="middle">压敏电阻</text>

  <!-- LDR -->
  <circle cx="125" cy="230" r="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="100" y1="230" x2="112" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="112" y="222" width="26" height="16" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="138" y1="230" x2="150" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="108" y1="184" x2="120" y2="200" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="120,200 111,199 117,191" fill="#4f9e63"/>
  <line x1="142" y1="184" x2="130" y2="200" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="130,200 139,199 133,191" fill="#4f9e63"/>
  <text x="125" y="290" font-size="13" fill="#5c6772" text-anchor="middle">光敏电阻 LDR</text>

  <!-- 电位器 -->
  <line x1="360" y1="230" x2="400" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="400" y="218" width="90" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="490" y1="230" x2="530" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="445" y1="200" x2="445" y2="218" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="206" x2="445" y2="206" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="445,218 439,210 451,210" fill="#2b3a4a"/>
  <text x="445" y="190" font-size="13" fill="#5c6772" text-anchor="middle">电位器 Potentiometer</text>
</svg>
