<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 左边竖线 + 电池 -->
  <line x1="120" y1="120" x2="120" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="102" y1="185" x2="138" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="110" y1="200" x2="130" y2="200" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="102" y1="215" x2="138" y2="215" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="110" y1="230" x2="130" y2="230" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="120" y1="230" x2="120" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="86" y="193" font-size="19" fill="#b5642e" font-weight="700">+</text>
  <text x="88" y="230" font-size="19" fill="#2b3a4a" font-weight="700">−</text>
  <text x="62" y="212" font-size="17" fill="#1a4f8b" font-weight="700">Vs</text>
  <!-- 上边线：电流表 A + 电阻 R -->
  <line x1="120" y1="120" x2="212" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="235" cy="120" r="23" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="235" y="128" font-size="20" fill="#1a4f8b" text-anchor="middle" font-weight="700">A</text>
  <line x1="258" y1="120" x2="330" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="108" width="110" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="120" x2="560" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="385" y="98" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <!-- 电流箭头 -->
  <line x1="150" y1="120" x2="200" y2="120" stroke="#b5642e" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="175" y="108" font-size="16" fill="#b5642e" font-weight="700" text-anchor="middle">I</text>
  <!-- 右边竖线 / 下边线 -->
  <line x1="560" y1="120" x2="560" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="310" x2="560" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 电压表 V 并联在 R 两端 -->
  <line x1="330" y1="120" x2="330" y2="205" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="205" x2="363" y2="205" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="386" cy="205" r="23" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="386" y="213" font-size="20" fill="#1a4f8b" text-anchor="middle" font-weight="700">V</text>
  <line x1="409" y1="205" x2="440" y2="205" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="205" x2="440" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 节点 -->
  <circle cx="330" cy="120" r="4.5" fill="#2b3a4a"/>
  <circle cx="440" cy="120" r="4.5" fill="#2b3a4a"/>
  <!-- 标注 -->
  <text x="340" y="350" font-size="16" fill="#222a32" text-anchor="middle">电流表 A 串在回路里测 I；电压表 V 并在 R 两端测 V；V = I × R</text>
</svg>
