<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrI" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- 运放三角 -->
  <polygon points="300,110 300,290 520,200" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="168" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="244" font-size="22" fill="#2b3a4a" font-weight="700">+</text>

  <!-- 输入 -->
  <line x1="120" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="240" x2="300" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="150" font-size="16" fill="#b5642e" font-weight="700">V−</text>
  <text x="120" y="232" font-size="16" fill="#b5642e" font-weight="700">V+</text>
  <text x="200" y="152" font-size="13" fill="#5c6772">I− = 0</text>
  <text x="200" y="232" font-size="13" fill="#5c6772">I+ = 0</text>

  <!-- 输出 -->
  <line x1="520" y1="200" x2="640" y2="200" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrI)"/>
  <text x="648" y="206" font-size="16" fill="#2b3a4a">Vout</text>

  <!-- 电源脚 -->
  <line x1="390" y1="110" x2="390" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="70" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">+Vcc</text>
  <line x1="390" y1="290" x2="390" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="340" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">−Vee</text>

  <!-- 两条金律 -->
  <text x="350" y="380" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">负反馈成立时：V+ = V−（虚短） 且 I+ = I− = 0（虚断）</text>
</svg>
