<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="380" height="320" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">NMOS 场效应管符号</text>

  <!-- 栅极输入线 -->
  <line x1="40" y1="160" x2="120" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 栅极竖线（与沟道绝缘） -->
  <line x1="120" y1="110" x2="120" y2="210" stroke="#2b3a4a" stroke-width="2.6"/>
  <!-- 沟道竖线 -->
  <line x1="160" y1="110" x2="160" y2="210" stroke="#2b3a4a" stroke-width="2.6"/>
  <!-- 漏极 -->
  <line x1="160" y1="110" x2="160" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 源极 -->
  <line x1="160" y1="210" x2="160" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 源极箭头（指向沟道） -->
  <polygon points="160,210 148,216 160,222" fill="#2b3a4a"/>

  <text x="112" y="156" font-size="15" fill="#1a4f8b" text-anchor="end" font-weight="700">G 栅极</text>
  <text x="172" y="76" font-size="15" fill="#1a4f8b" font-weight="700">D 漏极</text>
  <text x="172" y="256" font-size="15" fill="#1a4f8b" font-weight="700">S 源极</text>
</svg>
