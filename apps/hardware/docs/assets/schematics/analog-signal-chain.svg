<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <defs>
    <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 信号链四级框图 -->
  <rect x="30" y="100" width="120" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="90" y="132" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">传感器</text>
  <text x="90" y="156" font-size="12" fill="#5c6772" text-anchor="middle">Sensor</text>
  <text x="90" y="196" font-size="12.5" fill="#2b3a4a" text-anchor="middle">mV 级微弱信号</text>

  <rect x="200" y="100" width="130" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="265" y="126" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">信号调理</text>
  <text x="265" y="148" font-size="12" fill="#5c6772" text-anchor="middle">放大 · 偏置 · 阻抗变换</text>
  <text x="265" y="166" font-size="12" fill="#5c6772" text-anchor="middle">Signal Conditioning</text>

  <rect x="380" y="100" width="110" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="435" y="132" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">滤波</text>
  <text x="435" y="156" font-size="12" fill="#5c6772" text-anchor="middle">Filter · 去噪</text>

  <rect x="540" y="100" width="150" height="80" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="615" y="126" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">ADC → MCU</text>
  <text x="615" y="148" font-size="12" fill="#5c6772" text-anchor="middle">采样量化 · 数字处理</text>
  <text x="615" y="166" font-size="12" fill="#5c6772" text-anchor="middle">Digital Domain</text>

  <!-- 箭头 -->
  <line x1="150" y1="140" x2="196" y2="140" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrS)"/>
  <line x1="330" y1="140" x2="376" y2="140" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrS)"/>
  <line x1="490" y1="140" x2="536" y2="140" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrS)"/>

  <!-- 噪声与干扰标注 -->
  <text x="360" y="230" font-size="13.5" fill="#b5642e" text-anchor="middle">沿途拾取：50Hz 工频 · 开关电源尖峰 · 射频干扰 · 阻抗分压损失</text>
  <line x1="30" y1="60" x2="690" y2="60" stroke="#e3e0d7" stroke-width="1.5"/>
  <text x="30" y="45" font-size="15" fill="#1a4f8b" font-weight="700">一条典型模拟信号链：物理量 → 电压 → 数字量</text>
</svg>
