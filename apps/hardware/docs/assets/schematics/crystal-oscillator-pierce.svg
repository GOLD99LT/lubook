<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">Pierce 晶振振荡电路</text>

  <!-- MCU 框 -->
  <rect x="80" y="80" width="120" height="120" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="140" y="145" font-size="14" fill="#222a32" text-anchor="middle">MCU</text>
  <text x="205" y="115" font-size="13" fill="#5c6772">OSCIN</text>
  <text x="205" y="185" font-size="13" fill="#5c6772">OSCOUT</text>

  <!-- OSCIN -> 晶振左端 -->
  <line x1="200" y1="110" x2="330" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="330" cy="110" r="4.5" fill="#2b3a4a"/>

  <!-- 晶振 -->
  <rect x="330" y="90" width="120" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="90" x2="360" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="90" x2="420" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="80" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">8MHz</text>

  <!-- 晶振右端 -> OSCOUT -->
  <line x1="450" y1="110" x2="450" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="450" cy="180" r="4.5" fill="#2b3a4a"/>
  <line x1="450" y1="180" x2="200" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 左负载电容 C1 到地 -->
  <line x1="330" y1="110" x2="330" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="312" y1="170" x2="348" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="312" y1="190" x2="348" y2="190" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="330" y1="190" x2="330" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="356" y="185" font-size="13" fill="#1a4f8b" font-weight="700">C1=22pF</text>

  <!-- 右负载电容 C2 到地 -->
  <line x1="450" y1="180" x2="450" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="432" y1="200" x2="468" y2="200" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="432" y1="220" x2="468" y2="220" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="450" y1="220" x2="450" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="476" y="215" font-size="13" fill="#1a4f8b" font-weight="700">C2=22pF</text>

  <!-- 公共地 -->
  <line x1="330" y1="240" x2="450" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="240" x2="390" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="376" y1="250" x2="404" y2="250" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="381" y1="257" x2="399" y2="257" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="385" y1="264" x2="395" y2="264" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
