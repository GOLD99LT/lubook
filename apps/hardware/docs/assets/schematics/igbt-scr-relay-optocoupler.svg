<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">IGBT / SCR / 继电器 / 光耦 符号</text>

  <!-- IGBT -->
  <line x1="40" y1="120" x2="80" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="80" y1="95" x2="80" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="95" x2="100" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="100" y1="95" x2="100" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="100" y1="145" x2="100" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="100,145 90,151 100,157" fill="#2b3a4a"/>
  <text x="70" y="116" font-size="12" fill="#5c6772" text-anchor="end">G</text>
  <text x="108" y="76" font-size="12" fill="#5c6772">C</text>
  <text x="108" y="180" font-size="12" fill="#5c6772">E</text>
  <text x="90" y="210" font-size="13" fill="#5c6772" text-anchor="middle">IGBT</text>

  <!-- SCR -->
  <line x1="200" y1="120" x2="240" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="240,102 240,138 272,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="272" y1="104" x2="272" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="272" y1="120" x2="310" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="272" y1="136" x2="290" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="296" y="165" font-size="12" fill="#5c6772">G</text>
  <text x="255" y="210" font-size="13" fill="#5c6772" text-anchor="middle">SCR 可控硅</text>

  <!-- 继电器（线圈+触点） -->
  <line x1="360" y1="120" x2="390" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M390,120 q8,-18 16,0 q8,18 16,0 q8,-18 16,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="438" y1="120" x2="460" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="390" cy="80" r="3" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="390" y1="80" x2="425" y2="62" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="428" cy="80" r="3" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="415" y="210" font-size="13" fill="#5c6772" text-anchor="middle">继电器 Relay</text>

  <!-- 光耦 -->
  <rect x="520" y="70" width="150" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="540,105 540,135 562,120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="562" y1="107" x2="562" y2="133" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="120" x2="520" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="562" y1="120" x2="585" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 光箭头 -->
  <line x1="590" y1="108" x2="605" y2="108" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="605,108 596,104 596,112" fill="#4f9e63"/>
  <line x1="590" y1="132" x2="605" y2="132" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="605,132 596,128 596,136" fill="#4f9e63"/>
  <!-- 光敏管 -->
  <line x1="620" y1="95" x2="620" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="95" x2="620" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="145" x2="620" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="595" y="210" font-size="13" fill="#5c6772" text-anchor="middle">光耦 Optocoupler</text>
</svg>
