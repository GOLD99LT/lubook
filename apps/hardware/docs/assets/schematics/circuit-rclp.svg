  <rect x="130" y="58" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="50" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <line x1="210" y1="70" x2="280" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- Vout -->
  <circle cx="250" cy="70" r="4.5" fill="#2b3a4a"/>
