  <line x1="250" y1="132" x2="250" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="236" y1="160" x2="264" y2="160" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="241" y1="167" x2="259" y2="167" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="245" y1="174" x2="255" y2="174" stroke="#2b3a4a" stroke-width="2.4"/>
