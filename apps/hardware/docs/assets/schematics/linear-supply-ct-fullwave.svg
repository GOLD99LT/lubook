<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="320" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">扩展：中心抽头全波整流（两只二极管）Center-Tapped Full-Wave</text>

  <!-- 变压器副边（带中心抽头） -->
  <text x="60" y="120" font-size="13" fill="#5c6772">副边</text>
  <path d="M120,90 q-16,14 0,28 q16,14 0,28 q-16,14 0,28 q16,14 0,28" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M120,206 q-16,14 0,28 q16,14 0,28 q-16,14 0,28 q16,14 0,28" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 中心抽头 -->
  <circle cx="120" cy="198" r="4.5" fill="#2b3a4a"/>
  <text x="70" y="202" font-size="12.5" fill="#b5642e" font-weight="700">中心抽头</text>

  <!-- 上端 -> D1 -> +rail -->
  <line x1="120" y1="90" x2="200" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="200,72 200,108 230,90" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="74" x2="230" y2="106" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="230" y1="90" x2="430" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="215" y="66" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">D1</text>

  <!-- 下端 -> D2 -> +rail -->
  <line x1="120" y1="318" x2="120" y2="302" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="318" x2="200" y2="318" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="318" x2="200" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="200,212 200,248 230,230" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="230" y1="214" x2="230" y2="246" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="230" y1="230" x2="430" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="215" y="206" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">D2</text>

  <!-- +rail 汇合 -->
  <circle cx="430" cy="90" r="4.5" fill="#2b3a4a"/>
  <circle cx="430" cy="230" r="4.5" fill="#2b3a4a"/>
  <line x1="430" y1="90" x2="430" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="230" x2="430" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="150" x2="560" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="490" y="138" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">Vout（经滤波）</text>

  <!-- 中心抽头接地 -->
  <line x1="120" y1="198" x2="120" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="106" y1="250" x2="134" y2="250" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="111" y1="257" x2="129" y2="257" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="115" y1="264" x2="125" y2="264" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
