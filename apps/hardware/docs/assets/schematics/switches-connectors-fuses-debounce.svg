<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">按键输入与 RC 消抖</text>

  <!-- VCC 上拉 -->
  <text x="120" y="70" font-size="16" fill="#2b3a4a">+3.3V</text>
  <line x1="150" y1="80" x2="150" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="138" y="110" width="24" height="60" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="145" font-size="14" fill="#1a4f8b" font-weight="700">R=10kΩ(上拉)</text>
  <line x1="150" y1="170" x2="150" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- IO 节点 -->
  <circle cx="150" cy="200" r="4.5" fill="#2b3a4a"/>
  <line x1="150" y1="200" x2="430" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="440" y="206" font-size="16" fill="#2b3a4a">→MCU GPIO</text>

  <!-- 按键到地 -->
  <line x1="150" y1="200" x2="150" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="150" cy="220" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="150" y1="220" x2="188" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="192" cy="220" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="192" y1="220" x2="192" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="178" y1="240" x2="206" y2="240" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="183" y1="247" x2="201" y2="247" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="187" y1="254" x2="197" y2="254" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="210" y="235" font-size="13" fill="#5c6772">按键(按下接地)</text>

  <!-- 消抖电容到地 -->
  <line x1="330" y1="200" x2="330" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="312" y1="160" x2="348" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="312" y1="140" x2="348" y2="140" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="330" y1="140" x2="330" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="356" y="155" font-size="13" fill="#1a4f8b" font-weight="700">C=0.1µF(消抖)</text>
</svg>
