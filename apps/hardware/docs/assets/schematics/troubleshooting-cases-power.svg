<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="32" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">案例：3.3V 电源纹波大 → 输出电容 ESR/去耦不足</text>
  <!-- 电源芯片 -->
  <rect x="80" y="110" width="130" height="70" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="145" y="140" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">DC-DC/LDO</text>
  <text x="145" y="160" font-size="12" fill="#b5642e" text-anchor="middle">3.3V 输出</text>
  <!-- 输出电容 -->
  <line x1="210" y1="145" x2="330" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="120" x2="330" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="330" y="112" font-size="12" fill="#c0392b" text-anchor="middle">输出电容 ESR 大</text>
  <line x1="330" y1="170" x2="330" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="316" y1="200" x2="344" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="321" y1="207" x2="339" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="325" y1="214" x2="335" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 负载 -->
  <line x1="330" y1="145" x2="480" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="480" y="115" width="130" height="60" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="545" y="150" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">MCU/负载</text>
  <text x="360" y="255" font-size="13" fill="#2e7d32" text-anchor="middle">解决：换低 ESR 陶瓷电容 + 就近加 0.1µF 去耦，纹波从 120mV 降到 20mV</text>
</svg>
