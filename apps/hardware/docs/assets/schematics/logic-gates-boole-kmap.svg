<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kmapTitle kmapDesc" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title id="kmapTitle">四变量卡诺图：F(A,B,C,D)=Σm(0,2,5,7,8,10,13,15)</title>
  <desc id="kmapDesc">四角圈组得到 B 非 D 非，中央二乘二圈组得到 BD，最简式为 F = B非 D非 + BD</desc>
  <rect width="720" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" fill="#222a32" font-weight="700">四变量卡诺图 Four-Variable K-Map</text>
  <text x="30" y="58" font-size="13" fill="#5a6672">行 AB、列 CD 均按格雷码 00,01,11,10 排列；相邻格只差一位，边缘与四角可回卷</text>

  <!-- column headers -->
  <text x="150" y="92" font-size="13" fill="#5a6672">CD=</text>
  <text x="195" y="92" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">00</text>
  <text x="285" y="92" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">01</text>
  <text x="375" y="92" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">11</text>
  <text x="465" y="92" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">10</text>

  <!-- row headers -->
  <text x="132" y="150" font-size="13" fill="#5a6672" text-anchor="end">AB=00</text>
  <text x="132" y="220" font-size="13" fill="#5a6672" text-anchor="end">AB=01</text>
  <text x="132" y="290" font-size="13" fill="#5a6672" text-anchor="end">AB=11</text>
  <text x="132" y="360" font-size="13" fill="#5a6672" text-anchor="end">AB=10</text>

  <!-- cells row AB=00 -->
  <rect x="150" y="110" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="158" y="128" font-size="11" fill="#8a6a4a">m0</text>
  <text x="195" y="158" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="240" y="110" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="248" y="128" font-size="11" fill="#8a9aa8">m1</text>
  <text x="285" y="158" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="330" y="110" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="338" y="128" font-size="11" fill="#8a9aa8">m3</text>
  <text x="375" y="158" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="420" y="110" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="428" y="128" font-size="11" fill="#8a6a4a">m2</text>
  <text x="465" y="158" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>

  <!-- cells row AB=01 -->
  <rect x="150" y="180" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="158" y="198" font-size="11" fill="#8a9aa8">m4</text>
  <text x="195" y="228" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="240" y="180" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="248" y="198" font-size="11" fill="#8a6a4a">m5</text>
  <text x="285" y="228" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="330" y="180" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="338" y="198" font-size="11" fill="#8a6a4a">m7</text>
  <text x="375" y="228" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="420" y="180" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="428" y="198" font-size="11" fill="#8a9aa8">m6</text>
  <text x="465" y="228" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>

  <!-- cells row AB=11 -->
  <rect x="150" y="250" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="158" y="268" font-size="11" fill="#8a9aa8">m12</text>
  <text x="195" y="298" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="240" y="250" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="248" y="268" font-size="11" fill="#8a6a4a">m13</text>
  <text x="285" y="298" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="330" y="250" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="338" y="268" font-size="11" fill="#8a6a4a">m15</text>
  <text x="375" y="298" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="420" y="250" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="428" y="268" font-size="11" fill="#8a9aa8">m14</text>
  <text x="465" y="298" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>

  <!-- cells row AB=10 -->
  <rect x="150" y="320" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="158" y="338" font-size="11" fill="#8a6a4a">m8</text>
  <text x="195" y="368" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>
  <rect x="240" y="320" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="248" y="338" font-size="11" fill="#8a9aa8">m9</text>
  <text x="285" y="368" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="330" y="320" width="90" height="70" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="338" y="338" font-size="11" fill="#8a9aa8">m11</text>
  <text x="375" y="368" font-size="22" fill="#5a6672" text-anchor="middle" font-weight="700">0</text>
  <rect x="420" y="320" width="90" height="70" fill="#fdf3e7" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="428" y="338" font-size="11" fill="#8a6a4a">m10</text>
  <text x="465" y="368" font-size="22" fill="#b5642e" text-anchor="middle" font-weight="700">1</text>

  <!-- group 1: four corners -->
  <rect x="154" y="114" width="82" height="62" fill="none" stroke="#1a4f8b" stroke-width="3.2" rx="8"/>
  <rect x="424" y="114" width="82" height="62" fill="none" stroke="#1a4f8b" stroke-width="3.2" rx="8"/>
  <rect x="154" y="324" width="82" height="62" fill="none" stroke="#1a4f8b" stroke-width="3.2" rx="8"/>
  <rect x="424" y="324" width="82" height="62" fill="none" stroke="#1a4f8b" stroke-width="3.2" rx="8"/>
  <text x="30" y="432" font-size="14" fill="#1a4f8b" font-weight="700">圈组 1：四角 4 格，A、C 变化，B=0、D=0 不变 → B'D'</text>

  <!-- group 2: center 2x2 -->
  <rect x="244" y="184" width="172" height="132" fill="none" stroke="#b5642e" stroke-width="3.2" rx="8"/>
  <text x="30" y="458" font-size="14" fill="#b5642e" font-weight="700">圈组 2：中央 2×2，A、C 变化，B=1、D=1 不变 → BD</text>
  <text x="30" y="492" font-size="16" fill="#222a32" font-weight="700">最简式：F = B'D' + BD = (B ⊕ D)'</text>
</svg>
