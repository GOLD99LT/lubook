<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="660" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- Vin -> R1 -->
  <line x1="40" y1="150" x2="140" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="140" y="138" width="110" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="150" x2="360" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="195" y="128" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1（限流）</text>
  <text x="40" y="135" font-size="17" fill="#2b3a4a">Vin</text>

  <!-- 节点 N = Vref -->
  <circle cx="360" cy="150" r="4.5" fill="#2b3a4a"/>
  <text x="360" y="132" font-size="16" fill="#b5642e" text-anchor="middle" font-weight="700">Vref（稳压输出）</text>

  <!-- Zener 向下到地（阴极向上） -->
  <line x1="360" y1="150" x2="360" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="348" y1="190" x2="372" y2="190" stroke="#2b3a4a" stroke-width="2.6"/>
  <path d="M348,190 q-7,0 -7,9" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M372,190 q7,0 7,9" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="360,192 348,214 372,214" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="214" x2="360" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="382" y="206" font-size="15" fill="#1a4f8b" font-weight="700">Dz</text>

  <!-- R_load 向下 -->
  <line x1="360" y1="150" x2="560" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="560" cy="150" r="4.5" fill="#2b3a4a"/>
  <line x1="560" y1="150" x2="560" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="548" y="180" width="24" height="70" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="250" x2="560" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="585" y="220" font-size="15" fill="#1a4f8b" font-weight="700">RL（负载）</text>

  <!-- 接地 -->
  <line x1="360" y1="300" x2="360" y2="315" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="346" y1="315" x2="374" y2="315" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="351" y1="322" x2="369" y2="322" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="355" y1="329" x2="365" y2="329" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="560" y1="330" x2="560" y2="345" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="546" y1="345" x2="574" y2="345" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="551" y1="352" x2="569" y2="352" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="555" y1="359" x2="565" y2="359" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
