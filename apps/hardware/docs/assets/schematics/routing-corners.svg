<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="380" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：走线拐角 — 90° / 45° / 圆弧</text>

  <!-- 90度 -->
  <rect x="50" y="70" width="220" height="200" fill="#fdf0f0" stroke="#b03a3a" stroke-width="2"/>
  <text x="160" y="98" font-size="14" fill="#b03a3a" font-weight="700" text-anchor="middle">✗ 90° 直角</text>
  <path d="M80,180 L160,180 L160,130" fill="none" stroke="#2b3a4a" stroke-width="5"/>
  <text x="160" y="240" font-size="12" fill="#b03a3a" text-anchor="middle">高频处线宽突变</text>
  <text x="160" y="260" font-size="12" fill="#b03a3a" text-anchor="middle">→ 反射、阻抗不连续</text>

  <!-- 45度 -->
  <rect x="300" y="70" width="220" height="200" fill="#f0f8f0" stroke="#2f6e4f" stroke-width="2"/>
  <text x="410" y="98" font-size="14" fill="#2f6e4f" font-weight="700" text-anchor="middle">✓ 45° 斜角</text>
  <path d="M330,180 L410,180 L470,130" fill="none" stroke="#2b3a4a" stroke-width="5"/>
  <text x="410" y="240" font-size="12" fill="#2f6e4f" text-anchor="middle">平滑过渡</text>
  <text x="410" y="260" font-size="12" fill="#2f6e4f" text-anchor="middle">最常用、易加工</text>

  <!-- 圆弧 -->
  <rect x="550" y="70" width="220" height="200" fill="#eef4fb" stroke="#1a4f8b" stroke-width="2"/>
  <text x="660" y="98" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">✓ 圆弧（高速）</text>
  <path d="M580,180 L640,180 Q700,180 700,120" fill="none" stroke="#2b3a4a" stroke-width="5"/>
  <text x="660" y="240" font-size="12" fill="#1a4f8b" text-anchor="middle">最平滑、阻抗连续</text>
  <text x="660" y="260" font-size="12" fill="#1a4f8b" text-anchor="middle">高速板首选</text>

  <text x="50" y="320" font-size="12.5" fill="#222a32">规则：低速板 45° 足够；高速/受控阻抗线用圆弧或多段 45° 逼近圆弧；避免任何 90° 尖角。</text>
  <text x="50" y="345" font-size="12.5" fill="#5c6772">AND8301-D：拐角用 &lt;45° 或圆弧，避免 90°（高频反射、波形畸变）。</text>
</svg>
