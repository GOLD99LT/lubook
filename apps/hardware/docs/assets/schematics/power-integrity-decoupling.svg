<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">去耦体系：从 VRM 到芯片引脚的多级电容</text>

  <!-- 电源轨 -->
  <line x1="80" y1="120" x2="820" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="125" font-size="14" fill="#1a4f8b" font-weight="700">VCC</text>

  <!-- VRM -->
  <rect x="80" y="90" width="80" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="125" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">VRM</text>

  <!-- Bulk 电解 -->
  <line x1="240" y1="120" x2="240" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="220" y1="160" x2="260" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="220" y1="178" x2="260" y2="178" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="240" y1="178" x2="240" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="226" y1="210" x2="254" y2="210" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="231" y1="217" x2="249" y2="217" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="240" y="245" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">电解 100µF（低频）</text>

  <!-- 10µF -->
  <line x1="420" y1="120" x2="420" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="404" y1="160" x2="436" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="404" y1="176" x2="436" y2="176" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="420" y1="176" x2="420" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="406" y1="210" x2="434" y2="210" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="411" y1="217" x2="429" y2="217" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="420" y="245" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">10µF（中频）</text>

  <!-- 0.1µF -->
  <line x1="600" y1="120" x2="600" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="586" y1="160" x2="614" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="586" y1="174" x2="614" y2="174" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="600" y1="174" x2="600" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="586" y1="210" x2="614" y2="210" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="591" y1="217" x2="609" y2="217" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="600" y="245" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">0.1µF（高频，最近引脚）</text>

  <!-- 芯片 -->
  <rect x="780" y="90" width="80" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="820" y="125" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">IC VCC</text>

  <text x="30" y="285" font-size="13" fill="#222a32">大电容在远、小电容在近；每种电容覆盖一段频段，互补把目标阻抗压到全频段</text>
</svg>
