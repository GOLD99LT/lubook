<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>双 T 陷波网络：上支路 R-R 与并联 2C 构成一个 T，下支路 C-C 与并联 R/2 构成另一个 T，两个 T 并在输入与输出之间</title>
  <rect width="880" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arrowTT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入节点与上支路 -->
  <text x="30" y="126" font-size="20" fill="#2b3a4a">Vin</text>
  <line x1="40" y1="140" x2="70" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="70" y="129" width="50" height="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="120" y1="140" x2="260" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="95" y="122" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <circle cx="260" cy="140" r="4.5" fill="#2b3a4a"/>
  <line x1="260" y1="140" x2="300" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="300" y="129" width="50" height="22" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="140" x2="650" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="325" y="122" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <circle cx="650" cy="140" r="4.5" fill="#2b3a4a"/>
  <line x1="650" y1="140" x2="720" y2="140" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowTT)"/>
  <text x="730" y="146" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 上支路并联 2C，接地在上方 -->
  <line x1="260" y1="140" x2="260" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="90" x2="274" y2="90" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="246" y1="82" x2="274" y2="82" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="260" y1="82" x2="260" y2="54" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="54" x2="274" y2="54" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="251" y1="47" x2="269" y2="47" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="255" y1="40" x2="265" y2="40" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="284" y="82" font-size="19" fill="#1a4f8b" font-weight="700">2C</text>
  <!-- 输入节点向下，下支路 -->
  <line x1="40" y1="140" x2="40" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="40" y1="380" x2="70" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="70" y1="380" x2="85" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="85" y1="364" x2="85" y2="396" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="93" y1="364" x2="93" y2="396" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="93" y1="380" x2="260" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="89" y="354" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">C</text>
  <circle cx="260" cy="380" r="4.5" fill="#2b3a4a"/>
  <line x1="260" y1="380" x2="305" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="305" y1="364" x2="305" y2="396" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="313" y1="364" x2="313" y2="396" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="313" y1="380" x2="650" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="309" y="354" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">C</text>
  <line x1="650" y1="380" x2="650" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 下支路并联 R/2，接地在下方 -->
  <line x1="260" y1="380" x2="260" y2="420" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="249" y="420" width="22" height="46" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="466" x2="260" y2="480" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="480" x2="274" y2="480" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="251" y1="487" x2="269" y2="487" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="255" y1="494" x2="265" y2="494" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="282" y="449" font-size="19" fill="#1a4f8b" font-weight="700">R/2</text>
</svg>
