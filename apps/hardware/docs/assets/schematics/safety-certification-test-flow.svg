<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">认证流程：设计预留 → 预测试 → 送测 → 拿证 → 工厂审查</text>
  <rect x="40" y="80" width="110" height="50" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="95" y="110" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">设计预留</text>
  <line x1="150" y1="105" x2="180" y2="105" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="180" y="80" width="110" height="50" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="235" y="110" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">预测试</text>
  <line x1="290" y1="105" x2="320" y2="105" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="320" y="80" width="110" height="50" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="375" y="110" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">送实验室</text>
  <line x1="430" y1="105" x2="460" y2="105" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="460" y="80" width="100" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="510" y="110" font-size="12" fill="#2e7d32" font-weight="700" text-anchor="middle">拿证</text>
  <line x1="560" y1="105" x2="590" y2="105" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="590" y="80" width="100" height="50" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="640" y="105" font-size="12" fill="#b5642e" font-weight="700" text-anchor="middle">工厂审查</text>
  <text x="360" y="170" font-size="13" fill="#7a5fc0" text-anchor="middle">设计阶段就按标准留裕量，能避免后期大改板、节省认证周期</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
</svg>
