<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">Buck 降压功率级（异步：高侧开关 + 续流二极管 + L + Cout）</text>

  <!-- Vin -->
  <text x="36" y="96" font-size="16" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="100" x2="140" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 高侧开关管 -->
  <circle cx="140" cy="100" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="140" y1="100" x2="180" y2="78" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="184" cy="100" r="3.5" fill="#fff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="184" y1="100" x2="260" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="160" y="66" font-size="12.5" fill="#5c6772" text-anchor="middle">高侧开关管 Q1</text>

  <!-- SW 节点 -->
  <circle cx="260" cy="100" r="4.5" fill="#2b3a4a"/>
  <text x="252" y="88" font-size="14" fill="#1a4f8b" font-weight="700">SW</text>

  <!-- 续流二极管：阴极向上接 SW，阳极向下接地（Q1 关断时导通续流） -->
  <line x1="260" y1="100" x2="260" y2="148" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="242" y1="150" x2="278" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="242,180 278,180 260,152" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="180" x2="260" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="288" y="168" font-size="12.5" fill="#5c6772">续流二极管 D</text>

  <!-- 电感 L：SW -> Vout -->
  <line x1="260" y1="100" x2="330" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M330,100 q12,-24 24,0 q12,24 24,0 q12,-24 24,0 q12,24 24,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="426" y1="100" x2="560" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="378" y="76" font-size="15" fill="#1a4f8b" font-weight="700" text-anchor="middle">L=22µH</text>

  <!-- Vout 节点 -->
  <circle cx="560" cy="100" r="4.5" fill="#2b3a4a"/>
  <line x1="560" y1="100" x2="680" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="690" y="106" font-size="16" fill="#1a4f8b" font-weight="700">Vout</text>

  <!-- Cout -->
  <line x1="560" y1="100" x2="560" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="542" y1="150" x2="578" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="542" y1="170" x2="578" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="560" y1="170" x2="560" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="586" y="165" font-size="13.5" fill="#1a4f8b" font-weight="700">Cout</text>

  <!-- 反馈分压 R1/R2 -->
  <line x1="620" y1="100" x2="620" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="608" y="140" width="24" height="45" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="640" y="166" font-size="12.5" fill="#1a4f8b" font-weight="700">R1</text>
  <circle cx="620" cy="205" r="4.5" fill="#2b3a4a"/>
  <text x="632" y="209" font-size="12" fill="#b5642e" font-weight="700">FB</text>
  <line x1="620" y1="205" x2="620" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="608" y="220" width="24" height="45" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="640" y="246" font-size="12.5" fill="#1a4f8b" font-weight="700">R2</text>
  <line x1="620" y1="265" x2="620" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 地总线 -->
  <line x1="260" y1="300" x2="620" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="300" x2="400" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="386" y1="320" x2="414" y2="320" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="391" y1="327" x2="409" y2="327" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="395" y1="334" x2="405" y2="334" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
