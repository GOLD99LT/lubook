<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="260" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">双输出反激：一个原边、两组副边绕组给出两路电压</text>

  <!-- 原边 -->
  <line x1="80" y1="90" x2="130" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M130,90 q10,-20 20,0 q10,20 20,0 q10,-20 20,0 q10,20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="210" y1="90" x2="240" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="170" y="66" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">Np</text>
  <line x1="240" y1="90" x2="240" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="215" y="180" width="50" height="50" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="210" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q</text>

  <!-- 铁芯 -->
  <line x1="300" y1="55" x2="300" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="316" y1="55" x2="316" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>

  <!-- 副边1 -->
  <line x1="340" y1="90" x2="360" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M360,90 q8,-16 16,0 q8,16 16,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="392" y1="90" x2="430" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="430,78 430,102 454,90" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="454" y1="78" x2="454" y2="102" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="454" y1="90" x2="540" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="550" y="95" font-size="13" fill="#1a4f8b" font-weight="700">+12V</text>
  <text x="376" y="66" font-size="11" fill="#5c6772">Ns1</text>

  <!-- 副边2 -->
  <line x1="340" y1="180" x2="360" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M360,180 q8,-16 16,0 q8,16 16,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="392" y1="180" x2="430" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="430,168 430,192 454,180" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="454" y1="168" x2="454" y2="192" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="454" y1="180" x2="540" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="550" y="185" font-size="13" fill="#1a4f8b" font-weight="700">+5V</text>
  <text x="376" y="156" font-size="11" fill="#5c6772">Ns2</text>

  <text x="30" y="245" font-size="13" fill="#222a32">两路输出靠各自匝比设定；主输出（重载）用反馈闭环，副输出靠耦合精度，交叉调整率有限</text>
</svg>
