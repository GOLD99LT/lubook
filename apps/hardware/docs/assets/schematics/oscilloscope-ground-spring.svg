<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" font-size="17" fill="#1a4f8b" font-weight="700" text-anchor="middle">接地环路面积对比：长鳄鱼夹 vs 接地弹簧</text>
  <!-- 左：长夹大环路 -->
  <rect x="60" y="80" width="160" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="140" y="120" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">长鳄鱼夹地</text>
  <text x="140" y="142" font-size="13" fill="#b5642e" text-anchor="middle">环路面积大 → 振铃/过冲</text>
  <line x1="220" y1="110" x2="300" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M300,110 L300,250 L120,250 L120,170" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,4"/>
  <text x="210" y="268" font-size="13" fill="#c0392b" text-anchor="middle">大环路（红色虚线）</text>
  <!-- 右：弹簧短环路 -->
  <rect x="420" y="80" width="160" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="500" y="120" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">接地弹簧</text>
  <text x="500" y="142" font-size="13" fill="#2e7d32" text-anchor="middle">环路极小 → 干净边沿</text>
  <line x1="580" y1="110" x2="640" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M640,110 L640,150 L560,150 L560,170" fill="none" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="600" y="190" font-size="13" fill="#2e7d32" text-anchor="middle">紧贴 TP 的小环路</text>
  <!-- DUT GND 符号 -->
  <line x1="120" y1="170" x2="120" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="106" y1="200" x2="134" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="111" y1="207" x2="129" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="115" y1="214" x2="125" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
