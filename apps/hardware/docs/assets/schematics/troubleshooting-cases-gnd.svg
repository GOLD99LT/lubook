<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="360" y="32" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">案例：数字电路误触发 → 地弹/接地环路噪声</text>
  <!-- 数字返回路径 -->
  <rect x="100" y="110" width="120" height="70" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="160" y="140" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">驱动门</text>
  <text x="160" y="160" font-size="12" fill="#b5642e" text-anchor="middle">大 di/dt</text>
  <line x1="220" y1="145" x2="400" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="400" y="110" width="120" height="70" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="460" y="140" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="middle">接收门</text>
  <text x="460" y="160" font-size="12" fill="#c0392b" text-anchor="middle">误触发</text>
  <!-- 共地阻抗 -->
  <line x1="160" y1="180" x2="160" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="180" x2="460" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="160" y="215" width="300" height="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
  <text x="310" y="250" font-size="12" fill="#c0392b" text-anchor="middle">共地阻抗 L·di/dt → 地弹，抬升接收端参考地</text>
  <text x="600" y="150" font-size="12" fill="#2e7d32">解决：减小地回路电感、就近去耦、分区单点接地</text>
</svg>
