<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 电池 -->
  <line x1="110" y1="110" x2="110" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="92" y1="160" x2="128" y2="160" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="173" x2="120" y2="173" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="92" y1="186" x2="128" y2="186" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="100" y1="199" x2="120" y2="199" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="110" y1="199" x2="110" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="80" y="170" font-size="17" fill="#b5642e" font-weight="700">+</text>
  <text x="82" y="200" font-size="17" fill="#2b3a4a" font-weight="700">−</text>
  <text x="60" y="186" font-size="15" fill="#1a4f8b" font-weight="700">Vs</text>
  <!-- 开关 -->
  <line x1="110" y1="110" x2="160" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="160" cy="110" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="160" y1="110" x2="202" y2="92" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="206" cy="110" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="206" y1="110" x2="240" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 电阻 R -->
  <rect x="240" y="98" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="110" x2="470" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="280" y="88" font-size="17" fill="#1a4f8b" text-anchor="middle" font-weight="700">R</text>
  <!-- 电感 L 竖直（q 弧线） -->
  <line x1="470" y1="110" x2="470" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M470,140 q20,10 0,20 q-20,10 0,20 q20,10 0,20 q-20,10 0,20" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="470" y1="220" x2="470" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="185" font-size="17" fill="#1a4f8b" font-weight="700">L</text>
  <!-- 下边线 -->
  <line x1="110" y1="260" x2="470" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 电流箭头 -->
  <line x1="340" y1="110" x2="400" y2="110" stroke="#b5642e" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="370" y="98" font-size="15" fill="#b5642e" font-weight="700" text-anchor="middle">I</text>
  <text x="320" y="300" font-size="15" fill="#222a32" text-anchor="middle">RL 通电：电流不能突变，按指数上升到稳态 I∞=Vs/R；时间常数 τ = L/R</text>
</svg>
