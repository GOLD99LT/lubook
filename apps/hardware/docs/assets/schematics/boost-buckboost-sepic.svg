<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="640" height="300" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">扩展：SEPIC（非反相升降压，输出与输入同极性）</text>
  <text x="36" y="96" font-size="15" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="100" x2="110" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- L1 -->
  <path d="M110,100 q10,-20 20,0 q10,20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="150" y1="100" x2="200" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="84" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">L1</text>
  <!-- 耦合电容 Cc -->
  <line x1="200" y1="88" x2="200" y2="112" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="214" y1="88" x2="214" y2="112" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="214" y1="100" x2="300" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="207" y="78" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">Cc</text>
  <!-- SW 节点 -->
  <circle cx="300" cy="100" r="4.5" fill="#2b3a4a"/>
  <text x="292" y="88" font-size="13" fill="#1a4f8b" font-weight="700">SW</text>
  <!-- L2 到地 -->
  <line x1="300" y1="100" x2="300" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M300,140 q-14,10 0,20 q14,10 0,20" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="180" x2="300" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="168" font-size="12" fill="#1a4f8b" font-weight="700">L2</text>
  <!-- 开关 SW->地 -->
  <rect x="288" y="200" width="24" height="0" fill="#fff"/>
  <!-- 二极管 SW->Vout -->
  <line x1="300" y1="100" x2="380" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="380,82 380,118 410,100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="410" y1="84" x2="410" y2="116" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="410" y1="100" x2="540" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="480" cy="100" r="4.5" fill="#2b3a4a"/>
  <text x="548" y="105" font-size="14" fill="#1a4f8b" font-weight="700">Vout</text>
  <line x1="480" y1="100" x2="480" y2="145" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="462" y1="145" x2="498" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="462" y1="165" x2="498" y2="165" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="480" y1="165" x2="480" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="506" y="160" font-size="12.5" fill="#1a4f8b" font-weight="700">Cout</text>
  <line x1="300" y1="240" x2="480" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="390" y1="240" x2="390" y2="258" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="376" y1="258" x2="404" y2="258" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="381" y1="265" x2="399" y2="265" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="385" y1="272" x2="395" y2="272" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
