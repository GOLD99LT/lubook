<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">GPIO 低边驱动 LED</text>

  <text x="60" y="165" font-size="13" fill="#b5642e">GPIO</text>
  <line x1="100" y1="160" x2="180" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 限流电阻 -->
  <rect x="180" y="148" width="90" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="225" y="140" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">R 330Ω</text>
  <line x1="270" y1="160" x2="340" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- LED -->
  <polygon points="340,145 340,175 375,160" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="378" y1="145" x2="378" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="130" x2="365" y2="118" stroke="#b5642e" stroke-width="1.8"/>
  <line x1="365" y1="130" x2="380" y2="118" stroke="#b5642e" stroke-width="1.8"/>
  <text x="358" y="108" font-size="12" fill="#b5642e">LED</text>

  <line x1="378" y1="160" x2="480" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="480" y1="160" x2="480" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="466" y1="200" x2="494" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="471" y1="207" x2="489" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="475" y1="214" x2="485" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="120" y="260" font-size="13" fill="#222a32">I = (3.3 − Vf) / R = (3.3−2.0)/330 ≈ 4mA</text>
</svg>
