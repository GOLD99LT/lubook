<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="250" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">锂电保护板：保护 IC（DW01）+ 双 MOSFET（8205A）</text>

  <!-- 电池 -->
  <text x="40" y="100" font-size="13" fill="#1a4f8b" font-weight="700">BAT+</text>
  <line x1="90" y1="96" x2="160" y2="96" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 双 MOSFET 保护 -->
  <rect x="160" y="70" width="120" height="52" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="100" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">双 N-MOS 8205A</text>
  <line x1="280" y1="96" x2="420" y2="96" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="430" y="100" font-size="13" fill="#1a4f8b" font-weight="700">→ 系统/充电</text>

  <!-- 保护 IC -->
  <rect x="150" y="160" width="140" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="220" y="188" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">保护 IC DW01</text>
  <text x="220" y="206" font-size="10" fill="#5c6772" text-anchor="middle">过充/过放/过流/短路</text>
  <line x1="220" y1="122" x2="220" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- BAT- -->
  <line x1="90" y1="140" x2="90" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="145" font-size="12" fill="#5c6772">BAT-</text>

  <text x="30" y="240" font-size="13" fill="#222a32">保护功能：过充~4.28V 切断充电、过放~2.5V 切断放电、过流/短路关断 MOS；每块锂电必备</text>
</svg>
