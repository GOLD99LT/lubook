<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">PWM 经 MOSFET 低边驱动电机</text>

  <!-- PWM -->
  <text x="50" y="180" font-size="13" fill="#b5642e">PWM</text>
  <line x1="90" y1="180" x2="160" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 栅极电阻 -->
  <rect x="160" y="168" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="190" y="160" font-size="11" fill="#1a4f8b" text-anchor="middle">10~100Ω</text>
  <line x1="220" y1="180" x2="300" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- NMOS -->
  <line x1="300" y1="180" x2="300" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="120" x2="320" y2="240" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="140" x2="300" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="335" y="185" font-size="12" fill="#1a4f8b">Q1 N-MOS</text>

  <!-- 漏极 = 电机节点 -->
  <line x1="320" y1="120" x2="320" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="320" cy="120" r="4.5" fill="#2b3a4a"/>
  <!-- 电机到 V+ -->
  <line x1="320" y1="120" x2="320" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="290" y="40" width="60" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="60" font-size="12" fill="#222a32" text-anchor="middle">电机</text>
  <line x1="320" y1="40" x2="320" y2="25" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="335" y="30" font-size="12" fill="#b5642e">+VM</text>

  <!-- 续流二极管 -->
  <line x1="320" y1="120" x2="430" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="120" x2="430" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="415,120 445,120 430,92" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2" transform="rotate(180 430 106)"/>
  <line x1="418" y1="70" x2="442" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="448" y="100" font-size="11" fill="#1a4f8b">续流二极管</text>
  <line x1="430" y1="70" x2="320" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 源极下地 -->
  <line x1="320" y1="240" x2="320" y2="280" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="306" y1="280" x2="334" y2="280" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="311" y1="287" x2="329" y2="287" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="315" y1="294" x2="325" y2="294" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="120" y="325" font-size="12" fill="#7a5fc0">PWM 高→Q1 通→电机得电；PWM 低→Q1 关→电感经续流二极管续流，占空比调速</text>
</svg>
