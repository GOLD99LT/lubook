<svg viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>3.3V LVCMOS 驱动 5V TTL 的三种接法：直连、开漏加上拉、5V 缓冲</title>
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="24" y="30" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">3.3V LVCMOS 驱动 5V TTL 的三种接法（TTL 输入门槛 VIH&#8805;2.0V）</text>

  <!-- row 1: direct -->
  <text x="24" y="62" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">1 直连：VOH 2.4V - VIH 2.0V = 0.4V 噪声容限</text>
  <rect x="60" y="80" width="140" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="130" y="105" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">3.3V LVCMOS</text>
  <text x="130" y="123" font-size="12" fill="#1a4f8b" text-anchor="middle">VOH &gt;= 2.4V</text>
  <line x1="200" y1="110" x2="330" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="80" width="140" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="400" y="105" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">5V TTL 输入</text>
  <text x="400" y="123" font-size="12" fill="#1a4f8b" text-anchor="middle">VIH &gt;= 2.0V</text>
  <text x="500" y="105" font-size="12" fill="#2a7a4a" text-anchor="start" font-weight="700">0.4V 余量，可用</text>
  <text x="500" y="123" font-size="12" fill="#5a6672" text-anchor="start">接收端须为 TTL 门槛</text>
  <line x1="130" y1="140" x2="130" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="116" y1="160" x2="144" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="121" y1="167" x2="139" y2="167" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="125" y1="174" x2="135" y2="174" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- row 2: open-drain + pull-up -->
  <line x1="24" y1="206" x2="736" y2="206" stroke="#d6dde5" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="24" y="236" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">2 开漏 + 10k 上拉到 5V：高电平 4.79V，上升时间 440ns</text>
  <line x1="360" y1="250" x2="360" y2="266" stroke="#b5642e" stroke-width="2.2"/>
  <line x1="300" y1="250" x2="420" y2="250" stroke="#b5642e" stroke-width="2.2"/>
  <text x="360" y="244" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="700">+5V</text>
  <rect x="352" y="266" width="16" height="34" fill="#fbfdff" stroke="#b5642e" stroke-width="2.2"/>
  <text x="378" y="288" font-size="12" fill="#b5642e" text-anchor="start" font-weight="700">10k</text>
  <rect x="60" y="290" width="150" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="135" y="315" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">3.3V 开漏输出</text>
  <text x="135" y="333" font-size="12" fill="#1a4f8b" text-anchor="middle">VOL &lt;= 0.4V</text>
  <line x1="210" y1="320" x2="500" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="300" x2="360" y2="320" stroke="#b5642e" stroke-width="2.2"/>
  <circle cx="360" cy="320" r="4.5" fill="#2b3a4a"/>
  <rect x="500" y="290" width="150" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="575" y="315" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">5V TTL 输入</text>
  <text x="575" y="333" font-size="12" fill="#1a4f8b" text-anchor="middle">VH = 4.79V</text>
  <line x1="135" y1="350" x2="135" y2="370" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="121" y1="370" x2="149" y2="370" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="126" y1="377" x2="144" y2="377" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="130" y1="384" x2="140" y2="384" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- row 3: 74HCT buffer -->
  <line x1="24" y1="404" x2="736" y2="404" stroke="#d6dde5" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="24" y="432" font-size="13" fill="#1a4f8b" text-anchor="start" font-weight="700">3 5V 缓冲器 74HCT245：门槛 2.0V，输出满幅 4.4V</text>
  <rect x="60" y="446" width="120" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="120" y="470" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">3.3V 输出</text>
  <text x="120" y="488" font-size="12" fill="#1a4f8b" text-anchor="middle">2.4V</text>
  <line x1="180" y1="474" x2="250" y2="474" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="250" y="446" width="150" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="325" y="470" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">74HCT245</text>
  <text x="325" y="488" font-size="12" fill="#1a4f8b" text-anchor="middle">VCC = 5V</text>
  <line x1="400" y1="474" x2="470" y2="474" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="470" y="446" width="140" height="56" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="540" y="470" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">5V TTL 输入</text>
  <text x="540" y="488" font-size="12" fill="#1a4f8b" text-anchor="middle">4.4V</text>
  <line x1="325" y1="502" x2="325" y2="520" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="311" y1="520" x2="339" y2="520" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="316" y1="527" x2="334" y2="527" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="534" x2="330" y2="534" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
