<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="460" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">中断控制器（NVIC）硬件路径</text>

  <!-- 中断源 -->
  <rect x="60" y="80" width="140" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="107" font-size="13" fill="#222a32" text-anchor="middle">GPIO EXTI</text>
  <rect x="60" y="150" width="140" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="177" font-size="13" fill="#222a32" text-anchor="middle">定时器</text>
  <rect x="60" y="220" width="140" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="247" font-size="13" fill="#222a32" text-anchor="middle">ADC</text>
  <rect x="60" y="290" width="140" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="317" font-size="13" fill="#222a32" text-anchor="middle">UART</text>

  <!-- NVIC -->
  <rect x="300" y="100" width="180" height="240" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="390" y="130" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">NVIC</text>
  <text x="390" y="158" font-size="11" fill="#5c6772" text-anchor="middle">优先级仲裁</text>
  <text x="390" y="180" font-size="11" fill="#5c6772" text-anchor="middle">向量取址</text>
  <text x="390" y="202" font-size="11" fill="#5c6772" text-anchor="middle">自动压栈/出栈</text>

  <!-- 连线 -->
  <line x1="200" y1="102" x2="300" y2="102" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="172" x2="300" y2="172" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="242" x2="300" y2="242" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="312" x2="300" y2="312" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- CPU -->
  <rect x="560" y="140" width="200" height="160" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="660" y="175" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">CPU 内核</text>
  <text x="660" y="205" font-size="11" fill="#5c6772" text-anchor="middle">挂起当前指令</text>
  <text x="660" y="227" font-size="11" fill="#5c6772" text-anchor="middle">硬件压栈 xPSR/PC/R0~R3</text>
  <text x="660" y="249" font-size="11" fill="#5c6772" text-anchor="middle">从向量表取 ISR 地址</text>
  <text x="660" y="271" font-size="11" fill="#5c6772" text-anchor="middle">执行 ISR → 出栈返回</text>

  <line x1="480" y1="220" x2="560" y2="220" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/></marker></defs>

  <!-- 栈 -->
  <rect x="560" y="330" width="200" height="60" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="660" y="366" font-size="12" fill="#222a32" text-anchor="middle">当前栈（SP）自动保存现场</text>
  <line x1="660" y1="300" x2="660" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
