<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="420" height="260" fill="#ffffff"/>
  <!-- Vin + R1 -->
  <text x="30" y="120" font-size="16" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="115" x2="110" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="103" width="70" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="145" y="95" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1</text>
  <line x1="180" y1="115" x2="230" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 运放三角 -->
  <polygon points="230,70 230,190 330,130" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="245" y="120" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="245" y="165" font-size="18" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 同相端接地 -->
  <line x1="230" y1="160" x2="230" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="216" y1="210" x2="244" y2="210" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="221" y1="217" x2="239" y2="217" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="225" y1="224" x2="235" y2="224" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 反馈 Rf -->
  <line x1="215" y1="115" x2="215" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="215" y1="50" x2="270" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="270" y="38" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="300" y="30" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <line x1="330" y1="50" x2="360" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="50" x2="360" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 输出 -->
  <line x1="330" y1="130" x2="390" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="398" y="136" font-size="16" fill="#1a4f8b" font-weight="700">Vout</text>
  <circle cx="215" cy="115" r="4.5" fill="#2b3a4a"/>
  <circle cx="360" cy="130" r="4.5" fill="#2b3a4a"/>
</svg>
