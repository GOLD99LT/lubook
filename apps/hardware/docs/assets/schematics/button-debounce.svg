<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">按键 RC 消抖 + 上拉</text>

  <!-- VCC -->
  <text x="100" y="70" font-size="12" fill="#b5642e">+3V3</text>
  <line x1="130" y1="76" x2="130" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 上拉电阻 -->
  <rect x="122" y="100" width="16" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="146" y="125" font-size="11" fill="#1a4f8b">10k 上拉</text>
  <line x1="130" y1="140" x2="130" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="130" cy="180" r="4.5" fill="#2b3a4a"/>

  <!-- 按键到地 -->
  <line x1="130" y1="180" x2="220" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="220" y1="180" x2="238" y2="172" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="220" y1="180" x2="220" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="206" y1="230" x2="234" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="211" y1="237" x2="229" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="215" y1="244" x2="225" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="245" y="176" font-size="11" fill="#222a32">按键</text>

  <!-- RC 滤波到 MCU -->
  <line x1="130" y1="180" x2="320" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="320" y="168" width="50" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="345" y="160" font-size="11" fill="#1a4f8b" text-anchor="middle">10k</text>
  <line x1="370" y1="180" x2="450" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="400" cy="180" r="4.5" fill="#2b3a4a"/>
  <!-- 滤波电容 -->
  <line x1="400" y1="180" x2="400" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="382" y1="210" x2="418" y2="210" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="382" y1="230" x2="418" y2="230" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="400" y1="230" x2="400" y2="260" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="386" y1="260" x2="414" y2="260" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="391" y1="267" x2="409" y2="267" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="395" y1="274" x2="405" y2="274" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="420" y="226" font-size="11" fill="#1a4f8b">1µF</text>

  <rect x="450" y="155" width="100" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="185" font-size="12" fill="#222a32" text-anchor="middle">MCU 输入</text>
</svg>
