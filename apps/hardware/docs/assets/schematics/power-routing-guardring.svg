<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="400" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：保护环 Guard Ring（包围高阻敏感节点）</text>

  <!-- 保护环框 -->
  <rect x="180" y="90" width="460" height="220" fill="none" stroke="#2f6e4f" stroke-width="4"/>
  <text x="410" y="80" font-size="13" fill="#2f6e4f" text-anchor="middle">保护环（接同电位地）</text>

  <!-- 高阻节点：运放同相端 -->
  <polygon points="300,180 300,260 430,220" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="215" font-size="14" fill="#2b3a4a" font-weight="700">+</text>
  <text x="320" y="245" font-size="14" fill="#2b3a4a" font-weight="700">−</text>
  <!-- 输入高阻走线 -->
  <line x1="120" y1="200" x2="300" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="190" font-size="12" fill="#1a4f8b">高阻输入</text>
  <circle cx="300" cy="200" r="4.5" fill="#2b3a4a"/>
  <!-- 输出 -->
  <line x1="430" y1="220" x2="560" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 保护环接地 -->
  <line x1="410" y1="310" x2="410" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="396" y1="330" x2="424" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="401" y1="337" x2="419" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="405" y1="344" x2="415" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="60" y="375" font-size="12.5" fill="#222a32">原理：高阻节点周围一圈保护环接"同电位"（同相端接输出、反相端接 AGND），把表面漏电流/耦合噪声导走，不进高阻节点。</text>
</svg>
