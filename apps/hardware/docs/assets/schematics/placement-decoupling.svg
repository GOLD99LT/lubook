<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">扩展：去耦电容摆放 — 对 vs 错</text>

  <!-- 错：电容远 -->
  <rect x="50" y="80" width="340" height="280" fill="#fdf0f0" stroke="#b03a3a" stroke-width="2"/>
  <text x="220" y="108" font-size="15" fill="#b03a3a" font-weight="700" text-anchor="middle">✗ 错：电容离引脚远</text>
  <!-- IC -->
  <rect x="90" y="150" width="80" height="120" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="130" y="215" font-size="12" fill="#222a32" text-anchor="middle">IC</text>
  <!-- VCC pin -->
  <line x1="170" y1="170" x2="230" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="180" y="162" font-size="11" fill="#1a4f8b">VCC</text>
  <!-- 远电容 -->
  <line x1="230" y1="170" x2="290" y2="170" stroke="#b03a3a" stroke-width="2.2" stroke-dasharray="5,4"/>
  <line x1="290" y1="155" x2="290" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="304" y1="155" x2="304" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="304" y1="170" x2="330" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="297" y1="185" x2="297" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="283" y1="230" x2="311" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="288" y1="237" x2="306" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="292" y1="244" x2="302" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="220" y="320" font-size="12.5" fill="#b03a3a" text-anchor="middle">引线长 → 寄生电感大 → 高频去耦失效</text>

  <!-- 对：电容近 -->
  <rect x="430" y="80" width="340" height="280" fill="#f0f8f0" stroke="#2f6e4f" stroke-width="2"/>
  <text x="600" y="108" font-size="15" fill="#2f6e4f" font-weight="700" text-anchor="middle">✓ 对：电容紧贴引脚</text>
  <rect x="470" y="150" width="80" height="120" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="510" y="215" font-size="12" fill="#222a32" text-anchor="middle">IC</text>
  <line x1="550" y1="170" x2="585" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="556" y="162" font-size="11" fill="#1a4f8b">VCC</text>
  <!-- 紧贴电容 -->
  <line x1="585" y1="155" x2="585" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="599" y1="155" x2="599" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="599" y1="170" x2="620" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="592" y1="185" x2="592" y2="225" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="578" y1="225" x2="606" y2="225" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="583" y1="232" x2="601" y2="232" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="587" y1="239" x2="597" y2="239" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="600" y="320" font-size="12.5" fill="#2f6e4f" text-anchor="middle">引线 &lt; 1mm → 寄生电感小 → 高频去耦有效</text>

  <text x="50" y="400" font-size="12.5" fill="#222a32">规则：小电容(0.01µF)最贴引脚，大电容(10µF)稍远；先放电容再布电源线，别让走线绕远。</text>
</svg>
