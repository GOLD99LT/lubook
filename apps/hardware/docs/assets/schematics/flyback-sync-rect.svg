<svg viewBox="0 0 820 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="820" height="260" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">副边同步整流（SR）：用 MOSFET 替代肖特基，降导通损耗</text>

  <!-- 副边绕组 -->
  <line x1="120" y1="90" x2="160" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M160,90 q10,-20 20,0 q10,20 20,0 q10,-20 20,0 q10,20 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="90" x2="300" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="66" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">Ns</text>

  <!-- SR MOSFET（低边，替代二极管） -->
  <line x1="300" y1="90" x2="360" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="360" cy="90" r="4.5" fill="#2b3a4a"/>
  <line x1="360" y1="90" x2="360" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="335" y="150" width="50" height="60" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="185" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">Q_SR</text>
  <line x1="360" y1="210" x2="360" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="346" y1="230" x2="374" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="351" y1="237" x2="369" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 输出节点 -->
  <line x1="360" y1="90" x2="520" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="530" y="95" font-size="14" fill="#1a4f8b" font-weight="700">Vout</text>
  <line x1="440" y1="90" x2="440" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="424" y1="140" x2="456" y2="140" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="424" y1="158" x2="456" y2="158" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="440" y1="158" x2="440" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="464" y="152" font-size="12" fill="#1a4f8b" font-weight="700">Cout</text>

  <!-- SR 驱动 -->
  <line x1="335" y1="180" x2="240" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="185" font-size="12" fill="#b5642e">SR 控制器驱动</text>

  <text x="30" y="250" font-size="13" fill="#222a32">优势：MOSFET 导通压降远小于肖特基 VF(~0.5V)，大电流低压输出效率显著提升；需 SR 控制器精确同步开关</text>
</svg>
