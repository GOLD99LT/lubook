<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">隔离型 RS-485/CAN 收发</text>

  <!-- 隔离 barrier -->
  <line x1="360" y1="60" x2="360" y2="260" stroke="#b5642e" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="360" y="55" font-size="11" fill="#b5642e" text-anchor="middle">隔离屏障</text>

  <!-- MCU 侧 -->
  <rect x="80" y="110" width="120" height="80" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="140" y="155" font-size="12" fill="#222a32" text-anchor="middle">MCU 侧 3.3V</text>
  <line x1="200" y1="150" x2="300" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 隔离收发器 -->
  <rect x="300" y="110" width="120" height="80" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="145" font-size="11" fill="#1a4f8b" text-anchor="middle" font-weight="700">隔离收发器</text>
  <text x="360" y="165" font-size="10" fill="#5c6772" text-anchor="middle">信号隔离</text>

  <!-- 总线侧 -->
  <line x1="420" y1="140" x2="560" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="570" y="144" font-size="12" fill="#2e7d4f">A/CAN_H</text>
  <text x="570" y="164" font-size="12" fill="#2e7d4f">B/CAN_L</text>

  <!-- 隔离电源 -->
  <rect x="240" y="210" width="160" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="240" font-size="11" fill="#222a32" text-anchor="middle">隔离 DC/DC（总线侧供电）</text>

  <text x="120" y="290" font-size="12" fill="#7a5fc0">跨地电位大的长线必须隔离：信号隔离+隔离电源，切断地环路、保护 MCU</text>
</svg>
