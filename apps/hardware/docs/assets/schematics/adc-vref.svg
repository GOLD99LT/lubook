<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">外部低噪声基准源驱动 VREF+</text>

  <!-- 基准 IC -->
  <rect x="280" y="90" width="160" height="120" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="125" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">REF30xx / ADR45xx</text>
  <text x="360" y="150" font-size="11" fill="#5c6772" text-anchor="middle">带隙基准</text>
  <text x="360" y="172" font-size="11" fill="#5c6772" text-anchor="middle">Vout=2.5/3.0V 低漂移</text>

  <!-- VDD 输入 -->
  <text x="120" y="120" font-size="12" fill="#b5642e">+3.3V</text>
  <line x1="160" y1="120" x2="280" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="120" x2="200" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="182" y1="150" x2="218" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="182" y1="170" x2="218" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="200" y1="170" x2="200" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="186" y1="200" x2="214" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="191" y1="207" x2="209" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="195" y1="214" x2="205" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 输出到 VREF+ -->
  <line x1="440" y1="150" x2="560" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="490" cy="150" r="4.5" fill="#2b3a4a"/>
  <line x1="490" y1="150" x2="490" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="472" y1="185" x2="508" y2="185" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="472" y1="205" x2="508" y2="205" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="490" y1="205" x2="490" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="476" y1="240" x2="504" y2="240" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="481" y1="247" x2="499" y2="247" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="485" y1="254" x2="495" y2="254" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="512" y="200" font-size="11" fill="#1a4f8b" font-weight="700">100nF C0G+1µF</text>

  <rect x="560" y="125" width="110" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="615" y="155" font-size="12" fill="#222a32" text-anchor="middle">MCU VREF+</text>

  <text x="120" y="290" font-size="12" fill="#7a5fc0">别直接用 3.3V 电源当 Vref——电源纹波/漂移直接进读数</text>
</svg>
