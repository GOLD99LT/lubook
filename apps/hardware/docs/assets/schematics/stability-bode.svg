<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrSt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- Vin -> R1 -->
  <line x1="40" y1="160" x2="110" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="110" y="148" width="110" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="220" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="145" font-size="16" fill="#2b3a4a">Vin</text>
  <text x="165" y="138" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1</text>

  <!-- 运放 -->
  <polygon points="300,90 300,230 450,160" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="150" font-size="20" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="196" font-size="20" fill="#2b3a4a" font-weight="700">+</text>
  <line x1="300" y1="195" x2="300" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="300" x2="314" y2="300" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="307" x2="309" y2="307" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="314" x2="305" y2="314" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 输出 -->
  <line x1="450" y1="160" x2="620" y2="160" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrSt)"/>
  <text x="628" y="166" font-size="16" fill="#2b3a4a">Vout</text>

  <!-- 反馈上轨 Rf -->
  <line x1="270" y1="160" x2="270" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="60" x2="330" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="48" width="110" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="60" x2="510" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="510" y1="60" x2="510" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="385" y="38" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>

  <!-- 反馈下轨 Cf 并联 -->
  <line x1="270" y1="110" x2="360" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="95" x2="360" y2="125" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="376" y1="95" x2="376" y2="125" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="376" y1="110" x2="510" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="400" y="105" font-size="15" fill="#1a4f8b" font-weight="700">Cf</text>

  <!-- 节点 -->
  <circle cx="270" cy="160" r="4.5" fill="#2b3a4a"/>
  <circle cx="510" cy="160" r="4.5" fill="#2b3a4a"/>
  <text x="252" y="200" font-size="14" fill="#b5642e" font-weight="700" text-anchor="end">N 节点</text>
  <text x="360" y="360" font-size="14" fill="#5c6772" text-anchor="middle">并联补偿：Cf 在高频把反馈相位"拉回"，抬高相位裕度</text>
</svg>
