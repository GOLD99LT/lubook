<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="40" y="34" font-size="19" font-weight="700" fill="#222a32">MCU 片上系统（SoC）硬件框图</text>

  <!-- 外层 IC 框 -->
  <rect x="40" y="56" width="840" height="470" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>

  <!-- 上层：Flash / SRAM / CPU -->
  <rect x="90" y="90" width="180" height="76" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="180" y="122" font-size="15" fill="#222a32" text-anchor="middle">Flash</text>
  <text x="180" y="144" font-size="12" fill="#5c6772" text-anchor="middle">程序存储器 / Code</text>

  <rect x="90" y="190" width="180" height="64" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="180" y="218" font-size="15" fill="#222a32" text-anchor="middle">SRAM</text>
  <text x="180" y="238" font-size="12" fill="#5c6772" text-anchor="middle">数据存储器 / RAM</text>

  <rect x="380" y="100" width="200" height="90" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="480" y="138" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">CPU 内核</text>
  <text x="480" y="160" font-size="12" fill="#5c6772" text-anchor="middle">ALU / 寄存器 / 中断控制器</text>
  <text x="480" y="178" font-size="12" fill="#5c6772" text-anchor="middle">(ARM Cortex-M 类)</text>

  <!-- 内部总线 -->
  <line x1="120" y1="330" x2="820" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="826" y="334" font-size="13" fill="#7a5fc0">内部总线</text>

  <!-- CPU 下挂总线 -->
  <line x1="480" y1="190" x2="480" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="480" cy="330" r="4.5" fill="#2b3a4a"/>
  <!-- Flash/SRAM 汇总到总线 -->
  <line x1="180" y1="254" x2="180" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="300" x2="300" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="300" x2="300" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="300" cy="330" r="4.5" fill="#2b3a4a"/>

  <!-- 下层外设 -->
  <rect x="120" y="380" width="110" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="175" y="414" font-size="14" fill="#222a32" text-anchor="middle">GPIO</text>
  <line x1="175" y1="330" x2="175" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="175" cy="330" r="4.5" fill="#2b3a4a"/>

  <rect x="270" y="380" width="110" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="325" y="414" font-size="14" fill="#222a32" text-anchor="middle">定时器/PWM</text>
  <line x1="325" y1="330" x2="325" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="325" cy="330" r="4.5" fill="#2b3a4a"/>

  <rect x="420" y="380" width="110" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="475" y="406" font-size="14" fill="#222a32" text-anchor="middle">ADC / DAC</text>
  <text x="475" y="424" font-size="11" fill="#5c6772" text-anchor="middle">模拟前端</text>
  <line x1="475" y1="330" x2="475" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>

  <rect x="570" y="380" width="110" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="625" y="406" font-size="14" fill="#222a32" text-anchor="middle">UART/SPI</text>
  <text x="625" y="424" font-size="11" fill="#5c6772" text-anchor="middle">I²C/CAN</text>
  <line x1="625" y1="330" x2="625" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="625" cy="330" r="4.5" fill="#2b3a4a"/>

  <rect x="720" y="380" width="110" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="775" y="414" font-size="14" fill="#222a32" text-anchor="middle">看门狗/RTC</text>
  <line x1="775" y1="330" x2="775" y2="380" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="775" cy="330" r="4.5" fill="#2b3a4a"/>

  <!-- 时钟与复位 -->
  <rect x="120" y="460" width="300" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="270" y="487" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">时钟树 + 上电复位/POR + 调试 SWD</text>

  <!-- 对外引脚 -->
  <text x="46" y="130" font-size="12" fill="#b5642e">VDD/VSS</text>
  <text x="46" y="414" font-size="12" fill="#b5642e">IO 引脚 → 外部世界</text>
</svg>
