<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- 交流源 -->
  <circle cx="90" cy="240" r="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="90" y="248" font-size="20" fill="#2b3a4a" text-anchor="middle">~</text>
  <text x="90" y="330" font-size="15" fill="#1a4f8b" text-anchor="middle" font-weight="700">Vin(AC)</text>
  <line x1="90" y1="216" x2="90" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="180" x2="200" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="264" x2="90" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="300" x2="320" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 上下输出轨 -->
  <line x1="200" y1="120" x2="660" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="360" x2="660" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- x=200 支路：D1(上,阴极向上) + D3(下,阴极向上朝A) -->
  <line x1="200" y1="120" x2="200" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="188" y1="150" x2="212" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="200,150 188,172 212,172" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="172" x2="200" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="180" x2="200" y2="206" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="188" y1="206" x2="212" y2="206" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="200,206 188,228 212,228" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="228" x2="200" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- x=320 支路：D2(上) + D4(下) -->
  <line x1="320" y1="120" x2="320" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="308" y1="150" x2="332" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="320,150 308,172 332,172" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="172" x2="320" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="300" x2="320" y2="326" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="308" y1="326" x2="332" y2="326" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="320,326 308,348 332,348" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="348" x2="320" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 滤波电容 C1（x=600） -->
  <line x1="600" y1="120" x2="600" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="588" y1="180" x2="612" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="588" y1="196" x2="612" y2="196" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="600" y1="196" x2="600" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 负载电阻 RL（x=660） -->
  <line x1="660" y1="120" x2="660" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="648" y="160" width="24" height="70" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="660" y1="230" x2="660" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 接地（输出负端） -->
  <line x1="380" y1="360" x2="380" y2="375" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="366" y1="375" x2="394" y2="375" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="371" y1="382" x2="389" y2="382" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="375" y1="389" x2="385" y2="389" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 节点 -->
  <circle cx="200" cy="180" r="4.5" fill="#2b3a4a"/>
  <circle cx="320" cy="300" r="4.5" fill="#2b3a4a"/>
  <circle cx="600" cy="120" r="4.5" fill="#2b3a4a"/>
  <circle cx="600" cy="360" r="4.5" fill="#2b3a4a"/>

  <!-- 标号 -->
  <text x="182" y="166" font-size="15" fill="#1a4f8b" text-anchor="end" font-weight="700">D1</text>
  <text x="182" y="222" font-size="15" fill="#1a4f8b" text-anchor="end" font-weight="700">D3</text>
  <text x="338" y="166" font-size="15" fill="#1a4f8b" font-weight="700">D2</text>
  <text x="338" y="342" font-size="15" fill="#1a4f8b" font-weight="700">D4</text>
  <text x="618" y="195" font-size="15" fill="#1a4f8b" font-weight="700">C1</text>
  <text x="676" y="200" font-size="15" fill="#1a4f8b" font-weight="700">RL</text>
  <text x="560" y="108" font-size="16" fill="#b5642e" font-weight="700">+ Vout</text>
</svg>
