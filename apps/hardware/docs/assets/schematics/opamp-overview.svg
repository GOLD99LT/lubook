<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="680" height="480" fill="#ffffff"/>

  <!-- DIP-8 封装 -->
  <rect x="220" y="150" width="240" height="180" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <path d="M320,150 a20,14 0 0 1 40,0" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 左排引脚 -->
  <line x1="180" y1="175" x2="220" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="220" x2="220" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="265" x2="220" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="310" x2="220" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 右排引脚 -->
  <line x1="460" y1="175" x2="500" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="220" x2="500" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="265" x2="500" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="310" x2="500" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 引脚号 -->
  <text x="168" y="179" font-size="13" fill="#2b3a4a" text-anchor="end">1</text>
  <text x="168" y="224" font-size="13" fill="#2b3a4a" text-anchor="end">2</text>
  <text x="168" y="269" font-size="13" fill="#2b3a4a" text-anchor="end">3</text>
  <text x="168" y="314" font-size="13" fill="#2b3a4a" text-anchor="end">4</text>
  <text x="512" y="179" font-size="13" fill="#2b3a4a">8</text>
  <text x="512" y="224" font-size="13" fill="#2b3a4a">7</text>
  <text x="512" y="269" font-size="13" fill="#2b3a4a">6</text>
  <text x="512" y="314" font-size="13" fill="#2b3a4a">5</text>

  <!-- 引脚功能标注 -->
  <text x="160" y="179" font-size="14" fill="#1a4f8b" text-anchor="end" font-weight="700">OFFSET 调零</text>
  <text x="160" y="224" font-size="15" fill="#b5642e" text-anchor="end" font-weight="700">−IN 反相输入</text>
  <text x="160" y="269" font-size="15" fill="#b5642e" text-anchor="end" font-weight="700">+IN 同相输入</text>
  <text x="160" y="314" font-size="14" fill="#1a4f8b" text-anchor="end" font-weight="700">VEE（负电源/地）</text>

  <text x="520" y="179" font-size="14" fill="#1a4f8b" font-weight="700">NC 空脚</text>
  <text x="520" y="224" font-size="14" fill="#1a4f8b" font-weight="700">VCC（正电源）</text>
  <text x="520" y="269" font-size="15" fill="#b5642e" font-weight="700">OUT 输出</text>
  <text x="520" y="314" font-size="14" fill="#1a4f8b" font-weight="700">OFFSET 调零</text>

  <!-- 芯片内部示意 -->
  <polygon points="300,215 300,275 400,245" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="312" y="238" font-size="16" fill="#2b3a4a" font-weight="700">−</text>
  <text x="312" y="266" font-size="16" fill="#2b3a4a" font-weight="700">+</text>
  <text x="340" y="360" font-size="15" fill="#222a32" text-anchor="middle">uA741 / LM358 / TL072 等通用运放 · DIP-8 顶视图</text>
  <text x="340" y="385" font-size="13" fill="#5c6772" text-anchor="middle">半圆缺口为引脚 1 定位标记</text>
</svg>
