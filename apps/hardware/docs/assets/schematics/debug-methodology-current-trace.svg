<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">电流追踪法：逐段断电/拔模块，看总电流变化定位短路源</text>
  <!-- 电源轨 -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="50" y="115" font-size="14" fill="#1a4f8b" text-anchor="end">3.3V 轨</text>
  <!-- 各模块 -->
  <rect x="120" y="140" width="90" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="165" y="170" font-size="13" fill="#1a4f8b" text-anchor="middle">MCU</text>
  <rect x="260" y="140" width="90" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="305" y="170" font-size="13" fill="#1a4f8b" text-anchor="middle">传感器</text>
  <rect x="400" y="140" width="90" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="445" y="170" font-size="13" fill="#1a4f8b" text-anchor="middle">无线模块</text>
  <rect x="540" y="140" width="90" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="585" y="170" font-size="13" fill="#1a4f8b" text-anchor="middle">外设</text>
  <!-- 支路 -->
  <line x1="165" y1="120" x2="165" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="305" y1="120" x2="305" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="445" y1="120" x2="445" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="585" y1="120" x2="585" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 拔掉传感器后电流下降 -->
  <line x1="305" y1="190" x2="305" y2="230" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="5,4"/>
  <text x="360" y="250" font-size="13" fill="#c0392b" text-anchor="middle">拔掉传感器后总电流从 800mA 降到 120mA → 短路/过流点在传感器支路</text>
  <text x="360" y="285" font-size="13" fill="#7a5fc0" text-anchor="middle">配合限流电源：电流大就逐段断负载，电流回落到正常的那段就是元凶</text>
</svg>
