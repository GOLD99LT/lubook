<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="900" height="360" fill="#ffffff"/>

  <!-- 左：冯诺依曼 -->
  <text x="40" y="34" font-size="17" font-weight="700" fill="#222a32">冯·诺依曼（Von Neumann）：单一共享总线</text>
  <rect x="60" y="80" width="120" height="70" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="120" y="122" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">CPU</text>
  <line x1="180" y1="115" x2="260" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="105" font-size="12" fill="#7a5fc0" text-anchor="middle">指令+数据 共用</text>
  <rect x="260" y="80" width="150" height="150" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="335" y="140" font-size="13" fill="#222a32" text-anchor="middle">统一存储器</text>
  <text x="335" y="162" font-size="12" fill="#5c6772" text-anchor="middle">代码与数据</text>
  <text x="335" y="182" font-size="12" fill="#5c6772" text-anchor="middle">存于同一 RAM</text>
  <text x="60" y="270" font-size="12" fill="#b5642e">代表：经典 8051、小型软核</text>
  <text x="60" y="292" font-size="12" fill="#b5642e">取指与取数争抢同一总线</text>

  <!-- 右：哈佛 -->
  <text x="470" y="34" font-size="17" font-weight="700" fill="#222a32">哈佛（Harvard）：指令/数据 双总线</text>
  <rect x="490" y="80" width="120" height="120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="550" y="135" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">CPU</text>
  <text x="550" y="158" font-size="11" fill="#5c6772" text-anchor="middle">两套地址/数据</text>
  <!-- 上：指令总线 -->
  <line x1="610" y1="115" x2="690" y2="115" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="690" y="90" width="150" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="765" y="124" font-size="13" fill="#222a32" text-anchor="middle">Flash（取指）</text>
  <!-- 下：数据总线 -->
  <line x1="610" y1="165" x2="690" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="690" y="150" width="150" height="56" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="765" y="184" font-size="13" fill="#222a32" text-anchor="middle">SRAM（取数）</text>
  <text x="490" y="270" font-size="12" fill="#b5642e">代表：STM32 / ESP32 / 多数现代 MCU</text>
  <text x="490" y="292" font-size="12" fill="#b5642e">取指与取数并行，CISC/DSP 可单周期完成</text>
</svg>
