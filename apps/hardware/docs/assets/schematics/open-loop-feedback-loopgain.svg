<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>环路增益的注入测量：在运放输出与反馈网络之间串入交流注入源 V_inj，测放大器侧 V_out 与反馈侧 V_fb，得到 T = −V_out/V_fb；注入源对直流短路，直流工作点不变</title>
  <rect width="960" height="480" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">环路增益的注入测量 Loop-Gain Injection</text>
  <text x="30" y="58" font-size="12.5" fill="#5c6772">在输出与反馈网络之间串入只加交流的 V_inj，测两侧电压；扫频得到 |T(f)| 与 ∠T(f)</text>
  <line x1="30" y1="72" x2="930" y2="72" stroke="#e3e0d7"/>

  <!-- 运放 -->
  <polygon points="360,160 360,320 510,240" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="374" y="192" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="374" y="312" font-size="18" fill="#2b3a4a" font-weight="700">+</text>

  <!-- 输入源与 R1 -->
  <circle cx="120" cy="180" r="18" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="187" font-size="17" fill="#2b3a4a" text-anchor="middle">~</text>
  <text x="120" y="150" font-size="12" fill="#222a32" text-anchor="middle" font-weight="700">Vin</text>
  <line x1="138" y1="180" x2="170" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="170" y="170" width="70" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="180" x2="360" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="205" y="162" font-size="11" fill="#5c6772" text-anchor="middle">R1 10k</text>
  <line x1="120" y1="198" x2="120" y2="242" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="106" y1="242" x2="134" y2="242" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="111" y1="249" x2="129" y2="249" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="115" y1="256" x2="125" y2="256" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 同相端接地 -->
  <line x1="320" y1="300" x2="360" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="300" x2="320" y2="312" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="306" y1="312" x2="334" y2="312" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="311" y1="319" x2="329" y2="319" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="315" y1="326" x2="325" y2="326" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 反馈网络：反相端 → 上绕 → Rf → 注入源 → 输出 -->
  <line x1="340" y1="180" x2="360" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="340" y1="120" x2="340" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="340" y1="120" x2="400" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="400" y="110" width="70" height="20" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="470" y1="120" x2="680" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="680" y1="120" x2="680" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="435" y="102" font-size="11" fill="#5c6772" text-anchor="middle">Rf 100k</text>
  <circle cx="340" cy="180" r="4" fill="#2b3a4a"/>

  <!-- 输出与注入源 -->
  <line x1="510" y1="240" x2="600" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="640" cy="240" r="16" fill="#ffffff" stroke="#b5642e" stroke-width="2.4"/>
  <text x="640" y="245" font-size="11" fill="#b5642e" text-anchor="middle" font-weight="700">~</text>
  <line x1="600" y1="240" x2="624" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="656" y1="240" x2="680" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="600" cy="240" r="4" fill="#2b3a4a"/>
  <circle cx="680" cy="240" r="4" fill="#2b3a4a"/>
  <text x="640" y="212" font-size="12" fill="#b5642e" text-anchor="middle" font-weight="700">V_inj</text>
  <text x="600" y="268" font-size="12" fill="#222a32" text-anchor="middle" font-weight="700">V_out</text>
  <text x="690" y="268" font-size="12" fill="#222a32" text-anchor="middle" font-weight="700">V_fb</text>
  <text x="640" y="292" font-size="11" fill="#5c6772" text-anchor="middle">环在此处断开</text>

  <!-- 右侧公式与说明 -->
  <text x="720" y="104" font-size="14" fill="#1a4f8b" font-weight="700">T = −V_out / V_fb</text>
  <text x="720" y="128" font-size="12" fill="#222a32">|T| = |V_out| / |V_fb|</text>
  <text x="720" y="152" font-size="12" fill="#222a32">∠T = ∠V_out − ∠V_fb + 180°</text>
  <text x="720" y="186" font-size="12" fill="#5c6772">注入源对直流短路（变压器</text>
  <text x="720" y="206" font-size="12" fill="#5c6772">次级 / AC 源），直流工作点不变</text>
  <text x="720" y="238" font-size="12" fill="#5c6772">注入幅度 0.1~1V（按摆幅选），</text>
  <text x="720" y="258" font-size="12" fill="#5c6772">避免把运放推进非线性</text>
  <text x="720" y="284" font-size="12" fill="#5c6772">V_fb 比 V_out 小 |T| 倍，</text>
  <text x="720" y="304" font-size="12" fill="#5c6772">需网络分析仪 / 锁相测量</text>
  <text x="720" y="334" font-size="12" fill="#b5642e">|T| = 1 处读 PM；</text>
  <text x="720" y="354" font-size="12" fill="#b5642e">∠T = −180° 处读 GM</text>

  <text x="30" y="420" font-size="12" fill="#5c6772">注入点选在低阻节点（运放输出端）；若在反馈电阻中间注入，寄生电容会污染测量结果。</text>
</svg>
