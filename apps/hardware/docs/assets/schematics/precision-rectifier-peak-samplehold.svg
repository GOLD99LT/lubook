<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- Vin -> 同相端 -->
  <line x1="40" y1="220" x2="300" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="205" font-size="20" fill="#2b3a4a">Vin</text>
  <!-- 运放三角形 -->
  <polygon points="300,100 300,260 450,180" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="162" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="232" font-size="22" fill="#2b3a4a" font-weight="700">+</text>
  <!-- D1：输出到 Vout -->
  <line x1="450" y1="180" x2="470" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="470,166 470,194 494,180" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="494" y1="164" x2="494" y2="196" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="494" y1="180" x2="540" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="482" y="155" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">D1</text>
  <!-- 输出线 -->
  <line x1="540" y1="180" x2="620" y2="180" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="632" y="186" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- Rf：Vout 反馈到反相端 -->
  <line x1="540" y1="180" x2="540" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="60" x2="430" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="350" y="48" width="80" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="60" x2="250" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="60" x2="250" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="42" font-size="18" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <!-- 反相端节点 -->
  <line x1="250" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R1：反相端到地 -->
  <line x1="250" y1="160" x2="250" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="238" y="220" width="24" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="264" x2="250" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="236" y1="320" x2="264" y2="320" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="241" y1="327" x2="259" y2="327" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="245" y1="334" x2="255" y2="334" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="232" y="248" font-size="18" fill="#1a4f8b" text-anchor="end" font-weight="700">R₁</text>
  <!-- 节点圆点 -->
  <circle cx="540" cy="180" r="4.5" fill="#2b3a4a"/>
  <circle cx="250" cy="160" r="4.5" fill="#2b3a4a"/>
</svg>
