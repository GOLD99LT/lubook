<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>5V 单电源、Vref=2.5V 时 ICMR 与输出摆幅对最大输入幅度的限制：G=11 时输出先受限，G=2 时 ICMR 先受限</title>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">ICMR 与输出摆幅：两条独立的输入幅度边界 ICMR vs Output Swing</text>
  <text x="30" y="58" font-size="12.5" fill="#5c6772">条件：V+ = 5 V、V− = 0 V、Vref = 2.5 V、ICMR 1.5~3.5 V、输出摆幅 0.2~4.8 V；输入信号以 Vref 为中心</text>
  <line x1="30" y1="72" x2="930" y2="72" stroke="#e3e0d7"/>

  <!-- 图例 -->
  <rect x="640" y="84" width="14" height="10" fill="#1a4f8b" opacity="0.35"/>
  <text x="660" y="93" font-size="12" fill="#1a4f8b">ICMR</text>
  <rect x="720" y="84" width="14" height="10" fill="#b5642e" opacity="0.35"/>
  <text x="740" y="93" font-size="12" fill="#b5642e">输出摆幅</text>
  <rect x="820" y="84" width="14" height="10" fill="#2f7d4f" opacity="0.55"/>
  <text x="840" y="93" font-size="12" fill="#2f7d4f">信号</text>

  <!-- 电压轴 -->
  <line x1="80" y1="80" x2="80" y2="400" stroke="#2b3a4a" stroke-width="1.8"/>
  <line x1="80" y1="80" x2="88" y2="80" stroke="#2b3a4a" stroke-width="1.8"/>
  <line x1="80" y1="240" x2="88" y2="240" stroke="#2b3a4a" stroke-width="1.8"/>
  <line x1="80" y1="400" x2="88" y2="400" stroke="#2b3a4a" stroke-width="1.8"/>
  <text x="74" y="85" font-size="12" fill="#222a32" text-anchor="end">5.0 V</text>
  <text x="74" y="245" font-size="12" fill="#222a32" text-anchor="end">2.5 V</text>
  <text x="74" y="405" font-size="12" fill="#222a32" text-anchor="end">0 V</text>

  <!-- Vref 参考线 -->
  <line x1="90" y1="240" x2="930" y2="240" stroke="#9aa4ad" stroke-width="1.2" stroke-dasharray="5,5"/>
  <text x="905" y="232" font-size="11" fill="#5c6772" text-anchor="end">Vref = 2.5 V</text>

  <!-- 左panel：G = 11 -->
  <text x="100" y="112" font-size="15" font-weight="700" fill="#222a32">G = 11：输出摆幅先受限</text>

  <!-- ICMR 条 -->
  <rect x="150" y="176" width="70" height="128" fill="#1a4f8b" opacity="0.14"/>
  <rect x="150" y="176" width="70" height="128" fill="none" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="185" y="170" font-size="11.5" fill="#1a4f8b" text-anchor="middle">ICMR 1.5~3.5 V</text>

  <!-- 输出摆幅条 -->
  <rect x="270" y="92.8" width="70" height="294.4" fill="#b5642e" opacity="0.12"/>
  <rect x="270" y="92.8" width="70" height="294.4" fill="none" stroke="#b5642e" stroke-width="1.6"/>

  <!-- 输入信号 ±0.2V -->
  <rect x="150" y="227.2" width="70" height="25.6" fill="#2f7d4f" opacity="0.55"/>
  <text x="185" y="218" font-size="11.5" fill="#2f7d4f" text-anchor="middle">输入 ±0.2 V</text>

  <!-- 输出信号 ±2.2V -->
  <rect x="270" y="99.2" width="70" height="281.6" fill="#2f7d4f" opacity="0.22"/>
  <text x="305" y="405" font-size="11.5" fill="#222a32" text-anchor="middle">输出摆幅 0.2~4.8 V</text>
  <text x="305" y="425" font-size="11.5" fill="#2f7d4f" text-anchor="middle">信号 0.3~4.7 V</text>

  <!-- 注释 -->
  <text x="150" y="450" font-size="12" fill="#222a32">输出上限 4.8 V → |vin| ≤ (4.8 − 2.5) / 11 = 0.209 V</text>
  <text x="150" y="472" font-size="12" fill="#5c6772">ICMR 上限 3.5 V → |vin| ≤ 3.5 − 2.5 = 1.0 V；本例输出先卡住</text>

  <!-- 右panel：G = 2 -->
  <text x="540" y="112" font-size="15" font-weight="700" fill="#222a32">G = 2：ICMR 先受限</text>

  <rect x="590" y="176" width="70" height="128" fill="#1a4f8b" opacity="0.14"/>
  <rect x="590" y="176" width="70" height="128" fill="none" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="625" y="170" font-size="11.5" fill="#1a4f8b" text-anchor="middle">ICMR 1.5~3.5 V</text>

  <rect x="710" y="92.8" width="70" height="294.4" fill="#b5642e" opacity="0.12"/>
  <rect x="710" y="92.8" width="70" height="294.4" fill="none" stroke="#b5642e" stroke-width="1.6"/>

  <!-- 输入信号 ±1.0V（顶到 ICMR） -->
  <rect x="590" y="176" width="70" height="128" fill="#2f7d4f" opacity="0.50"/>
  <text x="625" y="218" font-size="11.5" fill="#2f7d4f" text-anchor="middle">输入 ±1.0 V</text>

  <!-- 输出信号 ±2.0V -->
  <rect x="710" y="112" width="70" height="256" fill="#2f7d4f" opacity="0.22"/>
  <text x="745" y="405" font-size="11.5" fill="#222a32" text-anchor="middle">输出摆幅 0.2~4.8 V</text>
  <text x="745" y="425" font-size="11.5" fill="#2f7d4f" text-anchor="middle">信号 0.5~4.5 V</text>

  <text x="590" y="450" font-size="12" fill="#222a32">ICMR 上限 3.5 V → |vin| ≤ 1.0 V；输出只需 ±2.0 V</text>
  <text x="590" y="472" font-size="12" fill="#5c6772">交点 G = 2.3：低增益 ICMR 先卡，高增益输出先卡</text>

  <!-- 接地符号：28/18/10，间距 7 -->
  <line x1="30" y1="400" x2="30" y2="420" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="16" y1="420" x2="44" y2="420" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="21" y1="427" x2="39" y2="427" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="25" y1="434" x2="35" y2="434" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="30" y="452" font-size="10.5" fill="#5c6772" text-anchor="middle">GND</text>
</svg>
