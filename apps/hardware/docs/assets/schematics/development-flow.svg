<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="220" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">硬件开发主流程：需求 → 方案 → 设计 → 验证 → 量产</text>
  <rect x="30" y="90" width="100" height="56" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="80" y="115" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">需求规格</text>
  <text x="80" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">PRD</text>
  <line x1="130" y1="118" x2="150" y2="118" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="150" y="90" width="100" height="56" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="115" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">方案选型</text>
  <text x="200" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">器件/架构</text>
  <line x1="250" y1="118" x2="270" y2="118" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="270" y="90" width="100" height="56" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="115" font-size="12" fill="#1a4f8b" font-weight="700" text-anchor="middle">原理图/PCB</text>
  <text x="320" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">设计输出</text>
  <line x1="370" y1="118" x2="390" y2="118" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="390" y="90" width="100" height="56" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="440" y="115" font-size="12" fill="#b5642e" font-weight="700" text-anchor="middle">样机验证</text>
  <text x="440" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">EVT/DVT</text>
  <line x1="490" y1="118" x2="510" y2="118" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="510" y="90" width="100" height="56" rx="6" fill="#fff8e1" stroke="#b5642e" stroke-width="2.2"/>
  <text x="560" y="115" font-size="12" fill="#b5642e" font-weight="700" text-anchor="middle">认证/试产</text>
  <text x="560" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">PVT</text>
  <line x1="610" y1="118" x2="630" y2="118" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="630" y="90" width="100" height="56" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.2"/>
  <text x="680" y="115" font-size="12" fill="#2e7d32" font-weight="700" text-anchor="middle">量产</text>
  <text x="680" y="133" font-size="11" fill="#7a5fc0" text-anchor="middle">MP</text>
  <text x="380" y="180" font-size="13" fill="#7a5fc0" text-anchor="middle">每阶段有阶段门(gate)评审，不通过不进入下一阶段</text>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
</svg>
