<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 530" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="530" fill="#ffffff"/>
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>

  <!-- Vcc 轨 -->
  <line x1="120" y1="70" x2="560" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="55" font-size="16" fill="#b5642e" font-weight="700">+Vcc</text>

  <!-- Rc -->
  <line x1="518" y1="70" x2="518" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="506" y="100" width="24" height="60" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="518" y1="160" x2="518" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="545" y="135" font-size="15" fill="#1a4f8b" font-weight="700">Rc</text>

  <!-- R1（上偏置） -->
  <line x1="300" y1="70" x2="300" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="288" y="100" width="24" height="60" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="160" x2="300" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="332" y="135" font-size="15" fill="#1a4f8b" font-weight="700">R1</text>

  <!-- R2（下偏置） -->
  <line x1="300" y1="290" x2="300" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="288" y="320" width="24" height="55" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="375" x2="300" y2="480" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="332" y="352" font-size="15" fill="#1a4f8b" font-weight="700">R2</text>

  <!-- Q1 NPN -->
  <circle cx="510" cy="290" r="34" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="476" y1="272" x2="476" y2="308" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="476" y1="276" x2="518" y2="246" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="518" y1="246" x2="518" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="476" y1="304" x2="518" y2="334" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="505,326 513,318 516,329" fill="#2b3a4a"/>
  <line x1="518" y1="334" x2="518" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="448" y="300" font-size="15" fill="#1a4f8b" text-anchor="end" font-weight="700">Q1</text>

  <!-- Re -->
  <line x1="518" y1="360" x2="518" y2="390" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="506" y="390" width="24" height="55" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="518" y1="445" x2="518" y2="480" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="545" y="422" font-size="15" fill="#1a4f8b" font-weight="700">Re</text>

  <!-- 输入：Vin -> Cin -> 基极节点 -->
  <line x1="40" y1="290" x2="110" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="275" x2="110" y2="305" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="126" y1="275" x2="126" y2="305" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="126" y1="290" x2="300" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="40" y="275" font-size="16" fill="#2b3a4a">Vin</text>
  <text x="118" y="268" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Cin</text>

  <!-- 基极连线 -->
  <line x1="300" y1="290" x2="476" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="300" cy="290" r="4.5" fill="#2b3a4a"/>

  <!-- 输出：Cout -> Vout -->
  <circle cx="518" cy="210" r="4.5" fill="#2b3a4a"/>
  <line x1="518" y1="210" x2="600" y2="210" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="600" y1="195" x2="600" y2="225" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="616" y1="195" x2="616" y2="225" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="616" y1="210" x2="660" y2="210" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrB)"/>
  <text x="608" y="188" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">Cout</text>
  <text x="668" y="216" font-size="16" fill="#2b3a4a">Vout</text>

  <!-- 接地 -->
  <line x1="300" y1="480" x2="300" y2="493" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="493" x2="314" y2="493" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="500" x2="309" y2="500" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="507" x2="305" y2="507" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="518" y1="480" x2="518" y2="493" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="504" y1="493" x2="532" y2="493" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="509" y1="500" x2="527" y2="500" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="513" y1="507" x2="523" y2="507" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
