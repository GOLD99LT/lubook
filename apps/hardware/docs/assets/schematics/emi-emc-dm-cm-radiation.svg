<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>两种天线模型：差模电流环用小环公式，共模电缆用短导线公式，两者常数不同不能混用</title>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#222a32">两种天线：差模环路 vs 共模电缆</text>
  <text x="30" y="56" font-size="12.5" fill="#5c6772">差模看面积 A 与频率平方；共模看长度 L 与频率一次方。两个常数都含地面镜像，但不能互换</text>

  <!-- 左：差模环路 -->
  <rect x="30" y="70" width="390" height="270" fill="#eef4fb" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="225" y="96" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">差模 DM：小环天线</text>

  <rect x="105" y="130" width="190" height="86" fill="none" stroke="#b03a3a" stroke-width="2.8"/>
  <text x="200" y="180" font-size="13" fill="#b03a3a" text-anchor="middle" font-weight="700">A</text>

  <!-- 电流箭头：上边向右，下边向左 -->
  <line x1="125" y1="130" x2="245" y2="130" stroke="#b03a3a" stroke-width="2.4"/>
  <polygon points="245,130 235,125 235,135" fill="#b03a3a"/>
  <text x="258" y="126" font-size="11.5" fill="#b03a3a">I</text>
  <line x1="275" y1="216" x2="155" y2="216" stroke="#b03a3a" stroke-width="2.4"/>
  <polygon points="155,216 165,211 165,221" fill="#b03a3a"/>
  <text x="140" y="234" font-size="11.5" fill="#b03a3a">I</text>

  <!-- 尺寸标注 -->
  <line x1="105" y1="246" x2="295" y2="246" stroke="#1a4f8b" stroke-width="1.4"/>
  <line x1="105" y1="240" x2="105" y2="252" stroke="#1a4f8b" stroke-width="1.4"/>
  <line x1="295" y1="240" x2="295" y2="252" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="200" y="264" font-size="11.5" fill="#1a4f8b" text-anchor="middle">w</text>
  <line x1="310" y1="130" x2="310" y2="216" stroke="#1a4f8b" stroke-width="1.4"/>
  <line x1="304" y1="130" x2="316" y2="130" stroke="#1a4f8b" stroke-width="1.4"/>
  <line x1="304" y1="216" x2="316" y2="216" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="326" y="178" font-size="11.5" fill="#1a4f8b">h</text>

  <text x="45" y="292" font-size="12.5" fill="#222a32">E = 2.63 × 10<tspan baseline-shift="super" font-size="9">-14</tspan> · f<tspan baseline-shift="super" font-size="9">2</tspan> · A · I / r</text>
  <text x="45" y="316" font-size="11.5" fill="#3a5a80">20cm²、9.4mA、30MHz、3m → 43.5 dBµV/m</text>
  <text x="45" y="334" font-size="11.5" fill="#3a5a80">（限值 40.5，超标 3.0dB）</text>

  <!-- 右：共模电缆 -->
  <rect x="440" y="70" width="390" height="270" fill="#fdf3e7" stroke="#b5642e" stroke-width="1.8"/>
  <text x="635" y="96" font-size="14" fill="#b5642e" font-weight="700" text-anchor="middle">共模 CM：短电缆/长导线</text>

  <!-- 地平面 -->
  <rect x="470" y="256" width="330" height="9" fill="#b5642e"/>
  <text x="490" y="288" font-size="11" fill="#7a5a30">参考地平面（镜像 ×2）</text>

  <!-- 电缆 -->
  <line x1="480" y1="160" x2="790" y2="160" stroke="#2b3a4a" stroke-width="3"/>
  <line x1="480" y1="160" x2="535" y2="160" stroke="#b03a3a" stroke-width="3"/>
  <polygon points="535,160 525,155 525,165" fill="#b03a3a"/>
  <text x="545" y="152" font-size="11.5" fill="#b03a3a">I_cm</text>
  <line x1="600" y1="160" x2="655" y2="160" stroke="#b03a3a" stroke-width="3"/>
  <polygon points="655,160 645,155 645,165" fill="#b03a3a"/>
  <text x="665" y="152" font-size="11.5" fill="#b03a3a">I_cm</text>

  <!-- 长度标注 -->
  <line x1="480" y1="132" x2="790" y2="132" stroke="#7a5a30" stroke-width="1.3"/>
  <line x1="480" y1="126" x2="480" y2="138" stroke="#7a5a30" stroke-width="1.3"/>
  <line x1="790" y1="126" x2="790" y2="138" stroke="#7a5a30" stroke-width="1.3"/>
  <text x="635" y="124" font-size="11.5" fill="#7a5a30" text-anchor="middle">L = 1m（L 远小于波长）</text>

  <!-- 高度标注 -->
  <line x1="800" y1="160" x2="800" y2="256" stroke="#7a5a30" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="806" y="210" font-size="11" fill="#7a5a30">h</text>

  <!-- 地符号：28 / 18 / 10，间距 7 -->
  <line x1="790" y1="265" x2="790" y2="302" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="776" y1="302" x2="804" y2="302" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="781" y1="309" x2="799" y2="309" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="785" y1="316" x2="795" y2="316" stroke="#2b3a4a" stroke-width="2.4"/>

  <text x="455" y="292" font-size="12.5" fill="#222a32">E = 1.26 × 10<tspan baseline-shift="super" font-size="9">-6</tspan> · I · f · L / r</text>
  <text x="455" y="316" font-size="11.5" fill="#7a5a30">1m、10µA、30MHz、3m → 42.0 dBµV/m</text>
  <text x="455" y="334" font-size="11.5" fill="#7a5a30">（限值 40.5，超标 1.5dB）</text>

  <!-- 结论 -->
  <rect x="30" y="356" width="800" height="86" fill="#fbfdff" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="50" y="382" font-size="12.5" fill="#222a32">读图要点：差模电流在环内一进一出，磁场局限在环附近，辐射 ∝ A；共模电流在多条线上同相流动，</text>
  <text x="50" y="404" font-size="12.5" fill="#222a32">经对地电容返回，环路面积等于电缆长度乘高度，辐射 ∝ L。两个常数的量纲不同（面积对长度、f² 对 f），</text>
  <text x="50" y="426" font-size="12.5" fill="#222a32">把面积代进长度公式（或反过来）会得到完全错误的量级，是 EMC 估算最常见的错误之一。</text>
</svg>
