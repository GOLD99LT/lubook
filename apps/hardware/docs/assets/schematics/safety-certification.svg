<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="34" font-size="16" fill="#1a4f8b" font-weight="700" text-anchor="middle">主流市场安规/EMC 认证体系</text>
  <!-- 中心产品 -->
  <rect x="300" y="150" width="120" height="60" rx="6" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="185" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">电子产品</text>
  <!-- 四个认证 -->
  <rect x="80" y="80" width="130" height="56" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="145" y="105" font-size="14" fill="#c0392b" font-weight="700" text-anchor="middle">CCC (中国)</text>
  <text x="145" y="125" font-size="11" fill="#7a5fc0" text-anchor="middle">强制安全+EMC</text>
  <line x1="210" y1="108" x2="300" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="510" y="80" width="130" height="56" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="575" y="105" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="middle">CE (欧盟)</text>
  <text x="575" y="125" font-size="11" fill="#7a5fc0" text-anchor="middle">LVD安全+EMC+RED</text>
  <line x1="510" y1="108" x2="420" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="80" y="230" width="130" height="56" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="145" y="255" font-size="14" fill="#b5642e" font-weight="700" text-anchor="middle">FCC (美国)</text>
  <text x="145" y="275" font-size="11" fill="#7a5fc0" text-anchor="middle">Part 15 EMC 为主</text>
  <line x1="210" y1="258" x2="300" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="510" y="230" width="130" height="56" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="575" y="255" font-size="14" fill="#2e7d32" font-weight="700" text-anchor="middle">UL (美国)</text>
  <text x="575" y="275" font-size="11" fill="#7a5fc0" text-anchor="middle">安全认证(自愿常见)</text>
  <line x1="510" y1="258" x2="420" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="360" y="330" font-size="13" fill="#7a5fc0" text-anchor="middle">基础安全标准 IEC 62368-1（音视频/IT 设备）替代旧 60950/60065</text>
</svg>
