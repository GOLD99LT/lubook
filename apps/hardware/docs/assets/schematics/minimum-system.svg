<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#222a32">MCU 最小系统完整接线</text>

  <!-- ===== MCU 主框 ===== -->
  <rect x="370" y="140" width="260" height="330" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="500" y="120" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">MCU (3.3V)</text>

  <!-- 左：电源 -->
  <text x="330" y="193" font-size="12" fill="#5c6772">VDD</text>
  <text x="330" y="243" font-size="12" fill="#5c6772">VDDA</text>
  <text x="330" y="303" font-size="12" fill="#5c6772">VSSA</text>
  <text x="330" y="363" font-size="12" fill="#5c6772">VSS</text>

  <!-- VDD 主供电线 -->
  <line x1="370" y1="190" x2="140" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="184" font-size="13" fill="#b5642e">+3V3</text>
  <circle cx="260" cy="190" r="4.5" fill="#2b3a4a"/>
  <!-- 100nF 去耦（紧贴 MCU） -->
  <line x1="260" y1="190" x2="260" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="242" y1="222" x2="278" y2="222" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="242" y1="242" x2="278" y2="242" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="260" y1="242" x2="260" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="285" x2="274" y2="285" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="251" y1="292" x2="269" y2="292" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="255" y1="299" x2="265" y2="299" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="285" y="238" font-size="12" fill="#1a4f8b" font-weight="700">100nF</text>
  <!-- 10µF 储能（入口） -->
  <line x1="140" y1="190" x2="140" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="122" y1="222" x2="158" y2="222" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="122" y1="242" x2="158" y2="242" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="140" y1="242" x2="140" y2="285" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="126" y1="285" x2="154" y2="285" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="131" y1="292" x2="149" y2="292" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="135" y1="299" x2="145" y2="299" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="96" y="238" font-size="12" fill="#1a4f8b" font-weight="700">10µF</text>

  <!-- VDDA 磁珠 + 滤波 -->
  <line x1="370" y1="240" x2="330" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="290" y="228" width="40" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="310" y="245" font-size="11" fill="#1a4f8b" text-anchor="middle">FB</text>
  <line x1="290" y1="240" x2="250" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="250" cy="240" r="4.5" fill="#2b3a4a"/>
  <line x1="250" y1="240" x2="250" y2="268" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="232" y1="268" x2="268" y2="268" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="232" y1="288" x2="268" y2="288" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="250" y1="288" x2="250" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="236" y1="320" x2="264" y2="320" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="241" y1="327" x2="259" y2="327" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="245" y1="334" x2="255" y2="334" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="200" y="284" font-size="11" fill="#1a4f8b" font-weight="700">100nF+1µF</text>

  <!-- VSSA / VSS 下地 -->
  <line x1="370" y1="300" x2="330" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="330" y1="300" x2="330" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="316" y1="330" x2="344" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="321" y1="337" x2="339" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="325" y1="344" x2="335" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="370" y1="360" x2="300" y2="360" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="360" x2="300" y2="390" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="286" y1="390" x2="314" y2="390" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="291" y1="397" x2="309" y2="397" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="295" y1="404" x2="305" y2="404" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- ===== 顶部晶振 ===== -->
  <line x1="450" y1="140" x2="450" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="550" y1="140" x2="550" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="420" y1="95" x2="490" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="510" y1="95" x2="580" y2="95" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="450" cy="95" r="4.5" fill="#2b3a4a"/>
  <circle cx="550" cy="95" r="4.5" fill="#2b3a4a"/>
  <rect x="490" y="80" width="20" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="494" y1="82" x2="494" y2="108" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="506" y1="82" x2="506" y2="108" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="66" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">8MHz 晶振</text>
  <!-- C1 -->
  <line x1="420" y1="95" x2="420" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="402" y1="125" x2="438" y2="125" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="402" y1="145" x2="438" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="420" y1="145" x2="420" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="406" y1="175" x2="434" y2="175" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="411" y1="182" x2="429" y2="182" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="415" y1="189" x2="425" y2="189" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="372" y="140" font-size="12" fill="#1a4f8b" font-weight="700">C1</text>
  <!-- C2 -->
  <line x1="580" y1="95" x2="580" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="562" y1="125" x2="598" y2="125" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="562" y1="145" x2="598" y2="145" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="580" y1="145" x2="580" y2="175" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="566" y1="175" x2="594" y2="175" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="571" y1="182" x2="589" y2="182" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="575" y1="189" x2="585" y2="189" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="606" y="140" font-size="12" fill="#1a4f8b" font-weight="700">C2</text>

  <!-- ===== 右：NRST / BOOT0 / SWD ===== -->
  <text x="636" y="183" font-size="12" fill="#5c6772">NRST</text>
  <line x1="630" y1="180" x2="720" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="720" cy="180" r="4.5" fill="#2b3a4a"/>
  <!-- NRST 100nF -->
  <line x1="720" y1="180" x2="720" y2="212" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="702" y1="212" x2="738" y2="212" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="702" y1="232" x2="738" y2="232" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="720" y1="232" x2="720" y2="262" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="706" y1="262" x2="734" y2="262" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="711" y1="269" x2="729" y2="269" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="715" y1="276" x2="725" y2="276" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="744" y="228" font-size="11" fill="#1a4f8b" font-weight="700">100nF</text>
  <!-- NRST 按键到地 -->
  <line x1="720" y1="180" x2="770" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="770" y1="180" x2="788" y2="172" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="770" y1="180" x2="770" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="756" y1="230" x2="784" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="761" y1="237" x2="779" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="765" y1="244" x2="775" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="792" y="176" font-size="11" fill="#2b3a4a">复位键</text>

  <!-- BOOT0 下拉 -->
  <text x="636" y="243" font-size="12" fill="#5c6772">BOOT0</text>
  <line x1="630" y1="240" x2="720" y2="240" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="720" cy="240" r="4.5" fill="#2b3a4a"/>
  <line x1="720" y1="240" x2="720" y2="258" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="712" y="258" width="16" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="720" y1="288" x2="720" y2="316" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="706" y1="316" x2="734" y2="316" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="711" y1="323" x2="729" y2="323" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="715" y1="330" x2="725" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="740" y="278" font-size="11" fill="#1a4f8b" font-weight="700">10k 下拉</text>

  <!-- SWD 排针 -->
  <text x="636" y="303" font-size="12" fill="#5c6772">SWDIO</text>
  <text x="636" y="353" font-size="12" fill="#5c6772">SWCLK</text>
  <line x1="630" y1="300" x2="800" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="630" y1="350" x2="800" y2="350" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="800" y="280" width="90" height="120" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="845" y="305" font-size="11" fill="#222a32" text-anchor="middle">3V3</text>
  <text x="845" y="330" font-size="11" fill="#222a32" text-anchor="middle">SWDIO</text>
  <text x="845" y="355" font-size="11" fill="#222a32" text-anchor="middle">SWCLK</text>
  <text x="845" y="380" font-size="11" fill="#222a32" text-anchor="middle">GND</text>
</svg>
