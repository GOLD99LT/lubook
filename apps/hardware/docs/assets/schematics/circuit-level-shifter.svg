<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 240" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="420" height="240" fill="#ffffff"/>
  <!-- A 侧（低压） -->
  <text x="30" y="55" font-size="15" fill="#2b3a4a">A侧 3.3V</text>
  <line x1="90" y1="50" x2="200" y2="50" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="140" cy="50" r="4.5" fill="#2b3a4a"/>
  <!-- R1 上拉到 A 侧 -->
  <rect x="130" y="20" width="20" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="160" y="36" font-size="13" fill="#1a4f8b" font-weight="700">R1 10k</text>
  <!-- MOSFET 漏源 -->
  <line x1="140" y1="50" x2="140" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="125" y="100" width="30" height="40" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="140" y="95" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">BSS138</text>
  <!-- 栅极接 A 侧地 -->
  <line x1="125" y1="120" x2="80" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="80" y1="120" x2="80" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="66" y1="150" x2="94" y2="150" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="71" y1="157" x2="89" y2="157" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="75" y1="164" x2="85" y2="164" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- B 侧（高压） -->
  <line x1="140" y1="130" x2="280" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="200" cy="130" r="4.5" fill="#2b3a4a"/>
  <text x="290" y="136" font-size="15" fill="#2b3a4a">B侧 5V</text>
  <!-- R2 上拉到 B 侧 -->
  <rect x="190" y="90" width="20" height="30" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="220" y="110" font-size="13" fill="#1a4f8b" font-weight="700">R2 10k</text>
  <line x1="200" y1="90" x2="200" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="200" y="50" font-size="13" fill="#2b3a4a" text-anchor="middle">B侧 Vcc</text>
</svg>
