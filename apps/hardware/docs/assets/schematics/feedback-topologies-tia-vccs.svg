<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 980 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>跨阻放大与压控电流源对照：左图 TIA 的反馈电阻并在输出与反相端之间取样电压、光电流在反相端并联求和；右图 VCCS 的取样电阻串在输出回路中取样电流、反馈电压与输入电压串联比较</title>
  <rect width="980" height="470" fill="#ffffff"/>

  <text x="24" y="30" font-size="18" font-weight="700" fill="#222a32">跨阻放大（电压并联）与压控电流源（电流串联）</text>
  <line x1="24" y1="42" x2="956" y2="42" stroke="#e3e0d7"/>

  <!-- ================= 左：TIA ================= -->
  <text x="205" y="64" font-size="13" font-weight="700" fill="#1a4f8b" text-anchor="middle">电压并联：取样电压 · 反相端电流求和</text>

  <polygon points="190,215 190,285 260,250" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="203" y="232" font-size="17" fill="#2b3a4a" font-weight="700">−</text>
  <text x="203" y="280" font-size="17" fill="#2b3a4a" font-weight="700">+</text>

  <!-- 反相端节点 -->
  <line x1="110" y1="228" x2="190" y2="228" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="110" cy="228" r="4.5" fill="#2b3a4a"/>

  <!-- 同相端接地 -->
  <line x1="150" y1="272" x2="190" y2="272" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="150" y1="272" x2="150" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="136" y1="330" x2="164" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="141" y1="337" x2="159" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="145" y1="344" x2="155" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>

  <!-- 光电二极管：阴极接反相端 -->
  <line x1="110" y1="228" x2="110" y2="286" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="96" y1="286" x2="124" y2="286" stroke="#2b3a4a" stroke-width="2.6"/>
  <polygon points="96,310 124,310 110,286" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="310" x2="110" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="84" y1="330" x2="112" y2="330" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="89" y1="337" x2="107" y2="337" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="93" y1="344" x2="103" y2="344" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="68" y1="276" x2="90" y2="288" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="90,288 81,285 85,279" fill="#4f9e63"/>
  <line x1="74" y1="266" x2="96" y2="278" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="96,278 87,275 91,269" fill="#4f9e63"/>
  <text x="128" y="300" font-size="12" fill="#222a32">I_ph</text>

  <!-- 反馈 Rf 与 Cf -->
  <line x1="110" y1="228" x2="110" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="110" y1="150" x2="170" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="170" y="138" width="64" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="234" y1="150" x2="300" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="202" y="130" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="middle">R_f = 100 kΩ</text>

  <line x1="110" y1="185" x2="212" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="212" y1="172" x2="212" y2="198" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="228" y1="172" x2="228" y2="198" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="228" y1="185" x2="300" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="196" y="176" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="end">C_f = 4 pF</text>
  <circle cx="110" cy="185" r="4.5" fill="#2b3a4a"/>
  <circle cx="300" cy="185" r="4.5" fill="#2b3a4a"/>

  <!-- 输出 -->
  <line x1="260" y1="250" x2="300" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="150" x2="300" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="300" y1="250" x2="352" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="300" cy="250" r="4.5" fill="#2b3a4a"/>
  <text x="358" y="255" font-size="13" fill="#222a32" font-weight="700">V_out</text>
  <text x="358" y="272" font-size="11" fill="#5c6772">= −I_ph · R_f</text>

  <text x="150" y="392" font-size="12" fill="#222a32" text-anchor="middle">虚地节点：</text>
  <text x="150" y="408" font-size="11" fill="#5c6772" text-anchor="middle">全电路最怕寄生电容</text>

  <line x1="490" y1="60" x2="490" y2="424" stroke="#e3e0d7" stroke-dasharray="6,6"/>

  <!-- ================= 右：VCCS ================= -->
  <text x="720" y="64" font-size="13" font-weight="700" fill="#b5642e" text-anchor="middle">电流串联：取样电流 · 电压串联求和</text>

  <polygon points="640,215 640,285 710,250" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="653" y="232" font-size="17" fill="#2b3a4a" font-weight="700">−</text>
  <text x="653" y="280" font-size="17" fill="#2b3a4a" font-weight="700">+</text>

  <line x1="556" y1="272" x2="640" y2="272" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="548" y="277" font-size="13" fill="#222a32" font-weight="700" text-anchor="end">V_in</text>

  <!-- 输出 -> R_L -> 取样节点 -> R_s -> 地 -->
  <line x1="710" y1="250" x2="744" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="744" y="238" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="804" y1="250" x2="838" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="774" y="230" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="middle">R_L = 100 Ω</text>

  <circle cx="838" cy="250" r="4.5" fill="#2b3a4a"/>
  <line x1="838" y1="250" x2="876" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="876" y="238" width="60" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="936" y1="250" x2="952" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="952" y1="250" x2="952" y2="306" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="938" y1="306" x2="966" y2="306" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="943" y1="313" x2="961" y2="313" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="947" y1="320" x2="957" y2="320" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="906" y="230" font-size="12" font-weight="700" fill="#1a4f8b" text-anchor="middle">R_s = 100 Ω</text>

  <!-- 反馈回路 -->
  <line x1="838" y1="250" x2="838" y2="176" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="838" y1="176" x2="618" y2="176" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="618" y1="176" x2="618" y2="228" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="618" y1="228" x2="640" y2="228" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="725" y="168" font-size="11" fill="#5c6772" text-anchor="middle">反馈电压 = I_out · R_s</text>

  <!-- 电流方向 -->
  <line x1="744" y1="272" x2="812" y2="272" stroke="#4f9e63" stroke-width="2"/>
  <polygon points="812,272 803,267 803,277" fill="#4f9e63"/>
  <text x="778" y="290" font-size="11" fill="#4f9e63" text-anchor="middle">I_out</text>

  <text x="720" y="392" font-size="12" fill="#222a32" text-anchor="middle">负载电流全部流过取样电阻：</text>
  <text x="720" y="408" font-size="11" fill="#5c6772" text-anchor="middle">输出阻抗升到 R_s(1+A_OL)</text>

  <text x="24" y="452" font-size="11" fill="#5c6772">同一只运放（A_OL0 = 10^5、GBW = 1 MHz、R_out,OL = 50 Ω）；器件参数为典型量级，以数据手册为准。</text>
</svg>
