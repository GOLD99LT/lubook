<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 390" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>变压器：匝比、电流比、阻抗变换与同名端</title>
  <rect width="700" height="390" fill="#ffffff"/>
  <text x="24" y="34" font-size="16" fill="#222a32" font-weight="700">变压器：匝比、电流比与阻抗变换</text>
  <text x="430" y="42" font-size="12" fill="#b5642e">同名端：电压同相</text>

  <!-- 原边回路 -->
  <circle cx="90" cy="215" r="26" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M74,215 q8,-12 16,0 q8,12 16,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="189" x2="90" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="140" x2="170" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M170,140 q10,-18 20,0 q10,18 20,0 q10,-18 20,0 q10,18 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="250" y1="140" x2="270" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="140" x2="270" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="241" x2="90" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="90" y1="290" x2="270" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="170" cy="128" r="4.5" fill="#b5642e"/>
  <text x="140" y="126" font-size="12" fill="#1a4f8b">Ip</text>
  <text x="48" y="206" font-size="13" fill="#1a4f8b" font-weight="700">Vp</text>

  <!-- 铁芯与磁通 -->
  <line x1="300" y1="100" x2="300" y2="330" stroke="#2b3a4a" stroke-width="3"/>
  <line x1="316" y1="100" x2="316" y2="330" stroke="#2b3a4a" stroke-width="3"/>
  <line x1="308" y1="272" x2="308" y2="152" stroke="#b5642e" stroke-width="2"/>
  <polygon points="308,150 302,162 314,162" fill="#b5642e"/>
  <text x="308" y="66" font-size="12" fill="#222a32" text-anchor="middle">铁芯</text>
  <text x="322" y="214" font-size="13" fill="#b5642e">Φ</text>

  <!-- 副边回路 -->
  <line x1="350" y1="140" x2="350" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M350,140 q10,-18 20,0 q10,18 20,0 q10,-18 20,0 q10,18 20,0" fill="none" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="140" x2="560" y2="140" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="140" x2="560" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="548" y="170" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="560" y1="220" x2="560" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="350" y1="290" x2="560" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="350" cy="128" r="4.5" fill="#b5642e"/>
  <text x="470" y="126" font-size="12" fill="#1a4f8b">Is</text>
  <text x="600" y="134" font-size="13" fill="#1a4f8b" font-weight="700">Vs</text>
  <text x="596" y="200" font-size="13" fill="#1a4f8b" font-weight="700">R_L</text>

  <!-- 绕组标注 -->
  <text x="210" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">原边 Np 匝</text>
  <text x="390" y="82" font-size="14" fill="#1a4f8b" text-anchor="middle" font-weight="700">副边 Ns 匝</text>

  <!-- 公式 -->
  <text x="24" y="352" font-size="13" fill="#222a32">匝比：Vs / Vp = Ns / Np        电流比：Is / Ip = Np / Ns</text>
  <text x="24" y="374" font-size="13" fill="#222a32">阻抗变换：Zin = (Np / Ns)² × ZL        理想功率：Vp · Ip = Vs · Is</text>
</svg>
