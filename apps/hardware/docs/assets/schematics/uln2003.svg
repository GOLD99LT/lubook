<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">达林顿阵列（ULN2003）驱动数码管</text>

  <!-- MCU -->
  <rect x="60" y="100" width="100" height="100" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="110" y="155" font-size="12" fill="#222a32" text-anchor="middle">MCU GPIO</text>

  <!-- ULN2003 -->
  <line x1="160" y1="130" x2="260" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="160" y1="155" x2="260" y2="155" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="160" y1="180" x2="260" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="260" y="100" width="140" height="110" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="330" y="140" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">ULN2003</text>
  <text x="330" y="162" font-size="10" fill="#5c6772" text-anchor="middle">7 路达林顿灌电流</text>
  <text x="330" y="182" font-size="10" fill="#5c6772" text-anchor="middle">内含续流二极管</text>

  <!-- 数码管 -->
  <line x1="400" y1="130" x2="540" y2="130" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="155" x2="540" y2="155" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="400" y1="180" x2="540" y2="180" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="540" y="105" width="120" height="100" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="600" y="150" font-size="12" fill="#222a32" text-anchor="middle">共阳数码管</text>
  <text x="600" y="172" font-size="10" fill="#5c6772" text-anchor="middle">段脚</text>

  <text x="120" y="260" font-size="12" fill="#7a5fc0">GPIO 小电流经 ULN2003 放大灌电流驱动段；共阳接 VCC，段被拉低即点亮</text>
</svg>
