<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="560" height="280" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">扩展：反馈前馈电容 Cff（改善瞬态）</text>
  <!-- Vout 上 rail -->
  <line x1="120" y1="90" x2="440" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="100" y="95" font-size="14" fill="#1a4f8b" font-weight="700" text-anchor="end">Vout</text>
  <!-- R1 + Cff 并联 -->
  <line x1="240" y1="90" x2="240" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="228" y="120" width="24" height="55" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="262" y="152" font-size="12.5" fill="#1a4f8b" font-weight="700">R1</text>
  <!-- Cff 并联在 R1 旁 -->
  <line x1="300" y1="90" x2="300" y2="128" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="288" y1="128" x2="312" y2="128" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="288" y1="144" x2="312" y2="144" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="144" x2="300" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="320" y="142" font-size="12.5" fill="#b5642e" font-weight="700">Cff</text>
  <!-- FB 节点 + R2 -->
  <circle cx="240" cy="195" r="4.5" fill="#2b3a4a"/>
  <line x1="240" y1="195" x2="240" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="195" x2="300" y2="195" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="252" y="190" font-size="12.5" fill="#b5642e" font-weight="700">FB</text>
  <rect x="228" y="200" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="262" y="228" font-size="12.5" fill="#1a4f8b" font-weight="700">R2</text>
  <line x1="240" y1="250" x2="240" y2="262" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="226" y1="262" x2="254" y2="262" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="231" y1="269" x2="249" y2="269" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="235" y1="276" x2="245" y2="276" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
