<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 输入到同相端(+) -->
  <line x1="60" y1="185" x2="300" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="60" y="172" font-size="20" fill="#2b3a4a">Vin</text>
  <!-- 运放三角形 -->
  <polygon points="300,80 300,220 450,150" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="322" y="142" font-size="24" fill="#2b3a4a" font-weight="700">−</text>
  <text x="322" y="196" font-size="24" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 反相端节点 N -->
  <line x1="300" y1="150" x2="270" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- R1 垂直下地 -->
  <line x1="270" y1="150" x2="270" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="258" y="200" width="24" height="60" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="260" x2="270" y2="290" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="292" y="237" font-size="19" fill="#1a4f8b" font-weight="700">R₁</text>
  <!-- 接地 -->
  <line x1="256" y1="290" x2="284" y2="290" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="261" y1="297" x2="279" y2="297" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="265" y1="304" x2="275" y2="304" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- Rf 反馈（顶部横走） -->
  <line x1="270" y1="150" x2="270" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="270" y1="60" x2="330" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="330" y="48" width="120" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="450" y1="60" x2="510" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="510" y1="60" x2="510" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="390" y="38" font-size="19" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <!-- 输出线 -->
  <line x1="450" y1="150" x2="620" y2="150" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="630" y="156" font-size="20" fill="#2b3a4a">Vout</text>
  <!-- 节点 -->
  <circle cx="270" cy="150" r="4.5" fill="#2b3a4a"/>
  <circle cx="510" cy="150" r="4.5" fill="#2b3a4a"/>
  <text x="264" y="140" font-size="15" fill="#b5642e" font-weight="700" text-anchor="end">N</text>
</svg>
