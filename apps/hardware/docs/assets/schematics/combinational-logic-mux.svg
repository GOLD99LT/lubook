<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">4 选 1 多路选择器 4-to-1 MUX</text>

  <!-- D0..D3 -->
  <text x="30" y="100" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">D0</text>
  <line x1="60" y1="96" x2="280" y2="96" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="160" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">D1</text>
  <line x1="60" y1="156" x2="280" y2="156" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="220" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">D2</text>
  <line x1="60" y1="216" x2="280" y2="216" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="280" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">D3</text>
  <line x1="60" y1="276" x2="280" y2="276" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- mux block (trapezoid: wide left, narrow right) -->
  <polygon points="280,70 440,170 440,210 280,300" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="350" y="195" font-size="15" fill="#2b3a4a" text-anchor="middle" font-weight="700">MUX</text>

  <!-- select inputs bottom -->
  <text x="120" y="360" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">S1 S0</text>
  <line x1="170" y1="356" x2="360" y2="356" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="360" y1="356" x2="360" y2="300" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- output -->
  <line x1="440" y1="190" x2="560" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="568" y="195" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">Y</text>
</svg>
