<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="680" height="280" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">正交编码器输入（定时器编码器模式）</text>

  <!-- 编码器 -->
  <rect x="80" y="100" width="140" height="90" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="150" y="135" font-size="13" fill="#222a32" text-anchor="middle">正交编码器</text>
  <text x="150" y="158" font-size="11" fill="#5c6772" text-anchor="middle">A / B 两相 90°</text>

  <!-- A/B -->
  <line x1="220" y1="125" x2="400" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="118" font-size="12" fill="#1a4f8b">A</text>
  <line x1="220" y1="165" x2="400" y2="165" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="240" y="158" font-size="12" fill="#1a4f8b">B</text>

  <!-- 定时器 -->
  <rect x="400" y="100" width="180" height="90" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="490" y="135" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">定时器编码器模式</text>
  <text x="490" y="158" font-size="11" fill="#5c6772" text-anchor="middle">A 沿 + B 电平→加/减计数</text>

  <text x="120" y="240" font-size="12" fill="#7a5fc0">A 超前 B 则正转加计数，B 超前 A 则反转减计数，自动判断方向无需 CPU 干预</text>
</svg>
