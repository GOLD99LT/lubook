<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">用与非门 NAND 实现 NOT / AND / OR（通用性）</text>

  <!-- NOT from NAND: tie inputs -->
  <text x="30" y="90" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="55" y1="86" x2="120" y2="86" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="86" x2="55" y2="106" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="106" x2="120" y2="106" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="55" cy="86" r="4.5" fill="#2b3a4a"/>
  <path d="M120,72 L150,72 A14,14 0 0 1 150,100 L120,100 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="155" cy="86" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="159" y1="86" x2="200" y2="86" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="206" y="91" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">=¬A (NOT)</text>

  <!-- AND = NAND + NOT -->
  <text x="30" y="180" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="55" y1="176" x2="120" y2="176" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="30" y="210" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <line x1="55" y1="206" x2="120" y2="206" stroke="#2b3a4a" stroke-width="2.2"/>
  <path d="M120,162 L150,162 A14,14 0 0 1 150,208 L120,208 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="155" cy="185" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="159" y1="185" x2="185" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="185,173 185,197 210,185" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="210" y1="185" x2="250" y2="185" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="256" y="190" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">=A·B (AND)</text>

  <!-- OR = 3 NAND (De Morgan) -->
  <text x="30" y="300" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A</text>
  <line x1="55" y1="296" x2="90" y2="296" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="296" x2="55" y2="316" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="316" x2="90" y2="316" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="55" cy="296" r="4.5" fill="#2b3a4a"/>
  <path d="M90,282 L118,282 A13,13 0 0 1 118,310 L90,310 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="122" cy="296" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="125" y1="296" x2="200" y2="296" stroke="#2b3a4a" stroke-width="2.2"/>

  <text x="30" y="350" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B</text>
  <line x1="55" y1="346" x2="90" y2="346" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="346" x2="55" y2="366" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="55" y1="366" x2="90" y2="366" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="55" cy="346" r="4.5" fill="#2b3a4a"/>
  <path d="M90,332 L118,332 A13,13 0 0 1 118,360 L90,360 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="122" cy="346" r="3.5" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="125" y1="346" x2="200" y2="346" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- final NAND combines ¬A and ¬B -->
  <path d="M200,282 L232,282 A14,14 0 0 1 232,358 L200,358 Z" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="237" cy="320" r="4" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="241" y1="320" x2="285" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="291" y="325" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">=A+B (OR)</text>
</svg>
