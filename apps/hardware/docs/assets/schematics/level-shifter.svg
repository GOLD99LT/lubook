<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="16" fill="#222a32" text-anchor="start" font-weight="700">MOSFET 双向电平转换（BSS138 风格）Bidirectional Level Shifter</text>

  <!-- A side (1.8V) -->
  <text x="40" y="100" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">A侧 1.8V</text>
  <line x1="120" y1="160" x2="280" y2="160" stroke="#2b3a4a" stroke-width="2.4"/>
  <circle cx="200" cy="160" r="4.5" fill="#2b3a4a"/>
  <!-- A pull-up to VCCA -->
  <line x1="120" y1="160" x2="120" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="108" y="90" width="24" height="36" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="140" y="112" font-size="12" fill="#1a4f8b" text-anchor="start" font-weight="700">R_A</text>
  <line x1="120" y1="90" x2="120" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="105" y="54" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">VCCA(1.8V)</text>

  <!-- MOSFET -->
  <!-- gate tied to VCCA -->
  <line x1="200" y1="160" x2="200" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="230" x2="240" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="230" x2="240" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="240" y1="160" x2="280" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- MOSFET channel vertical between source(=A) and drain(=B) -->
  <line x1="280" y1="140" x2="280" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="290" y="120" font-size="12" fill="#b5642e" text-anchor="start" font-weight="700">Q1(NMOS)</text>
  <text x="290" y="135" font-size="11" fill="#5a6672" text-anchor="start" font-weight="700">G=VCCA</text>

  <!-- B side (3.3V) -->
  <text x="500" y="100" font-size="14" fill="#1a4f8b" text-anchor="start" font-weight="700">B侧 3.3V</text>
  <line x1="280" y1="160" x2="560" y2="160" stroke="#2b3a4a" stroke-width="2.4"/>
  <circle cx="440" cy="160" r="4.5" fill="#2b3a4a"/>
  <!-- B pull-up to VCCB -->
  <line x1="440" y1="160" x2="440" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="428" y="90" width="24" height="36" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="460" y="112" font-size="12" fill="#1a4f8b" text-anchor="start" font-weight="700">R_B</text>
  <line x1="440" y1="90" x2="440" y2="60" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="425" y="54" font-size="12" fill="#1a4f8b" text-anchor="middle" font-weight="700">VCCB(3.3V)</text>

  <text x="24" y="310" font-size="13" fill="#5a6672" text-anchor="start">A侧拉低时 NMOS 导通把 B 侧也拉低；B侧拉高时体二极管反偏、NMOS 截止，A侧被上拉到 1.8V</text>
  <text x="24" y="335" font-size="13" fill="#5a6672" text-anchor="start">天然双向、方向自适应，常用于 I²C/SDA 跨电压</text>
</svg>
