<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="600" height="280" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="700" fill="#222a32">扩展：外接调整管扩流 External Pass Transistor</text>
  <!-- Vin rail -->
  <text x="36" y="96" font-size="15" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="90" x2="180" y2="90" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="180" cy="90" r="4.5" fill="#2b3a4a"/>
  <!-- 外部 PNP：发射极在 Vin，集电极出 Vout -->
  <line x1="180" y1="90" x2="180" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="180" cy="160" r="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="146" y1="140" x2="146" y2="180" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="146" y1="146" x2="178" y2="122" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="146" y1="174" x2="178" y2="198" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="160,190 168,184 171,195" fill="#2b3a4a"/>
  <line x1="180" y1="198" x2="180" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="130" font-size="12.5" fill="#1a4f8b" font-weight="700" text-anchor="middle">外部 PNP</text>
  <!-- Vout -->
  <line x1="180" y1="230" x2="480" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="490" y="235" font-size="15" fill="#1a4f8b" font-weight="700">Vout</text>
  <!-- LDO 小电流驱动基极 -->
  <rect x="300" y="120" width="120" height="60" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="360" y="146" font-size="13" fill="#2b3a4a" text-anchor="middle" font-weight="700">LDO（小电流）</text>
  <text x="360" y="166" font-size="11" fill="#5c6772" text-anchor="middle">驱动基极</text>
  <line x1="300" y1="150" x2="180" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
</svg>
