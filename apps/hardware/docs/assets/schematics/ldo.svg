<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">LDO 内部结构：调整管 + 误差放大器 + 基准 + 反馈分压</text>

  <!-- Vin -> PASS -->
  <text x="36" y="116" font-size="16" fill="#2b3a4a">Vin</text>
  <line x1="60" y1="110" x2="150" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="150" y="85" width="100" height="50" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="200" y="115" font-size="13.5" fill="#2b3a4a" text-anchor="middle" font-weight="700">PASS 调整管</text>
  <line x1="250" y1="110" x2="600" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="330" cy="110" r="4.5" fill="#2b3a4a"/>
  <text x="560" y="98" font-size="16" fill="#1a4f8b" font-weight="700">Vout</text>

  <!-- Cout -->
  <line x1="330" y1="110" x2="330" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="312" y1="150" x2="348" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="312" y1="170" x2="348" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="330" y1="170" x2="330" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="356" y="165" font-size="13" fill="#1a4f8b" font-weight="700">Cout</text>

  <!-- 反馈分压 R1/R2 -->
  <line x1="600" y1="110" x2="600" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="588" y="150" width="24" height="55" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="620" y="182" font-size="13" fill="#1a4f8b" font-weight="700">R1</text>
  <circle cx="600" cy="230" r="4.5" fill="#2b3a4a"/>
  <text x="612" y="234" font-size="13" fill="#b5642e" font-weight="700">FB</text>
  <line x1="600" y1="230" x2="600" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="588" y="250" width="24" height="55" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="620" y="282" font-size="13" fill="#1a4f8b" font-weight="700">R2</text>
  <line x1="600" y1="305" x2="600" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 误差放大器 -->
  <polygon points="380,200 380,300 480,250" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="396" y="232" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="396" y="278" font-size="18" fill="#2b3a4a" font-weight="700">+</text>
  <text x="410" y="256" font-size="11.5" fill="#5c6772">EA</text>
  <!-- FB -> -输入 -->
  <line x1="600" y1="230" x2="540" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="540" y1="230" x2="380" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- EA 输出 -> PASS 栅极 -->
  <line x1="480" y1="250" x2="200" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="200" y1="250" x2="200" y2="135" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 基准 Vref -->
  <line x1="380" y1="278" x2="320" y2="278" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="278" x2="320" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="270" y="255" width="50" height="30" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="295" y="275" font-size="12.5" fill="#1a4f8b" text-anchor="middle" font-weight="700">Vref</text>

  <!-- 地总线 -->
  <line x1="330" y1="320" x2="600" y2="320" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="430" y1="320" x2="430" y2="340" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="416" y1="340" x2="444" y2="340" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="421" y1="347" x2="439" y2="347" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="425" y1="354" x2="435" y2="354" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
