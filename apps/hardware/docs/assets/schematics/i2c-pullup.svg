<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">I²C 上拉电阻与总线电容 RC</text>

  <!-- SDA 线 -->
  <line x1="120" y1="120" x2="600" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="610" y="124" font-size="12" fill="#1a4f8b">SDA/SCL</text>

  <!-- 上拉 R -->
  <line x1="250" y1="120" x2="250" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="242" y="48" width="16" height="32" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="266" y="70" font-size="11" fill="#1a4f8b">Rp 上拉</text>
  <line x1="250" y1="48" x2="250" y2="36" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="266" y="40" font-size="11" fill="#b5642e">+VCC</text>
  <circle cx="250" cy="120" r="4.5" fill="#2b3a4a"/>

  <!-- 总线电容 -->
  <line x1="450" y1="120" x2="450" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="432" y1="150" x2="468" y2="150" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="432" y1="170" x2="468" y2="170" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="450" y1="170" x2="450" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="436" y1="200" x2="464" y2="200" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="441" y1="207" x2="459" y2="207" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="445" y1="214" x2="455" y2="214" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="478" y="166" font-size="11" fill="#1a4f8b">Cbus≈100~400pF</text>
  <circle cx="450" cy="120" r="4.5" fill="#2b3a4a"/>

  <text x="120" y="245" font-size="12" fill="#7a5fc0">上升沿 tr≈0.847·Rp·Cbus；Rp 太大上升沿慢、限制速率，太小灌电流大</text>
</svg>
