<svg viewBox="0 0 780 356" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="780" height="356" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#222a32">Type III 补偿网络（一个积分极点 + 两个零点 + 两个极点）</text>

  <!-- 误差放大器 -->
  <polygon points="320,120 320,220 440,170" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="336" y="152" font-size="15" fill="#2b3a4a" font-weight="700">−</text>
  <text x="336" y="200" font-size="15" fill="#2b3a4a" font-weight="700">+</text>
  <text x="380" y="248" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">误差放大器</text>
  <line x1="320" y1="190" x2="250" y2="190" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="190" y="195" font-size="13" fill="#1a4f8b" font-weight="700">Vref</text>

  <!-- 输入 R1 -->
  <text x="50" y="145" font-size="13" fill="#1a4f8b" font-weight="700">FB（分压）</text>
  <line x1="110" y1="150" x2="170" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="170" y="138" width="50" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="195" y="155" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">R1</text>
  <line x1="220" y1="150" x2="320" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="320" cy="150" r="4.5" fill="#2b3a4a"/>

  <!-- 输出 COMP -->
  <line x1="440" y1="170" x2="560" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="570" y="175" font-size="13" fill="#1a4f8b" font-weight="700">COMP→PWM</text>

  <!-- 串联反馈 Rc+Cc -->
  <line x1="320" y1="150" x2="320" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="80" x2="360" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="360" y="68" width="50" height="24" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="385" y="85" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rc</text>
  <line x1="410" y1="80" x2="460" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="80" x2="460" y2="118" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="444" y1="118" x2="476" y2="118" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="444" y1="136" x2="476" y2="136" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="460" y1="136" x2="460" y2="170" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="460" cy="170" r="4.5" fill="#2b3a4a"/>
  <text x="486" y="132" font-size="13" fill="#1a4f8b" font-weight="700">Cc</text>

  <!-- 并联高频 Cp -->
  <line x1="320" y1="150" x2="320" y2="42" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="320" y1="42" x2="460" y2="42" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="460" y1="42" x2="460" y2="56" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="444" y1="56" x2="476" y2="56" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="444" y1="72" x2="476" y2="72" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="460" y1="72" x2="460" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="486" y="66" font-size="13" fill="#1a4f8b" font-weight="700">Cp</text>

  <!-- N 到地 R2+C2 支路 -->
  <line x1="320" y1="150" x2="260" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="150" x2="260" y2="250" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="248" y="250" width="24" height="40" fill="#fff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="232" y="274" font-size="13" fill="#1a4f8b" font-weight="700" text-anchor="end">R2</text>
  <line x1="260" y1="290" x2="260" y2="304" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="244" y1="304" x2="276" y2="304" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="244" y1="320" x2="276" y2="320" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="260" y1="320" x2="260" y2="334" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="246" y1="334" x2="274" y2="334" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="251" y1="341" x2="269" y2="341" stroke="#2b3a4a" stroke-width="2.4"/>
  <text x="282" y="318" font-size="13" fill="#1a4f8b" font-weight="700">C2</text>

  <text x="30" y="325" font-size="13" fill="#222a32">双零点 fz1≈fz2≈f0（抵消 LC 双极点）；双极点 fp,ESR≈339kHz、fp,sw/2≈250kHz；用于电压模式 buck</text>
</svg>
