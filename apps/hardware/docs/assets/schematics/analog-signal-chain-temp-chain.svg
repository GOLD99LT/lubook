<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace"><rect width="900" height="600" fill="#ffffff"/><text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">温度测量完整信号链 Temperature Measurement Chain</text><line x1="30" y1="46" x2="870" y2="46" stroke="#e3e0d7"/><rect x="60" y="235" width="120" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/><text x="120" y="275" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">NTC/热电偶</text><text x="120" y="296" font-size="11" fill="#5c6772" text-anchor="middle" font-weight="400">mV 级输出</text><line x1="180" y1="280" x2="240" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><polygon points="248,280 238.99,284.339 238.99,275.661" fill="#2b3a4a"/><rect x="250" y="235" width="120" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/><text x="310" y="275" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">PGA 仪表放大</text><text x="310" y="296" font-size="11" fill="#5c6772" text-anchor="middle" font-weight="400">G=10~1000</text><line x1="370" y1="280" x2="420" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><polygon points="428,280 418.99,284.339 418.99,275.661" fill="#2b3a4a"/><rect x="430" y="235" width="120" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/><text x="490" y="275" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">RC 抗混叠</text><text x="490" y="296" font-size="11" fill="#5c6772" text-anchor="middle" font-weight="400">fc=fs/2.4</text><line x1="550" y1="280" x2="600" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><polygon points="608,280 598.99,284.339 598.99,275.661" fill="#2b3a4a"/><rect x="610" y="235" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/><text x="660" y="275" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">ADC</text><text x="660" y="296" font-size="11" fill="#5c6772" text-anchor="middle" font-weight="400">12~16 bit</text><line x1="710" y1="280" x2="750" y2="280" stroke="#2b3a4a" stroke-width="2.2"/><polygon points="758,280 748.99,284.339 748.99,275.661" fill="#2b3a4a"/><rect x="760" y="235" width="100" height="90" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.2"/><text x="810" y="275" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">MCU</text><text x="810" y="296" font-size="11" fill="#5c6772" text-anchor="middle" font-weight="400">数字滤波</text><text x="120" y="350" font-size="12" fill="#5c6772" text-anchor="middle" font-weight="400">① 信号源</text><text x="310" y="350" font-size="12" fill="#5c6772" text-anchor="middle" font-weight="400">② 调理放大</text><text x="490" y="350" font-size="12" fill="#5c6772" text-anchor="middle" font-weight="400">③ 抗混叠</text><text x="660" y="350" font-size="12" fill="#5c6772" text-anchor="middle" font-weight="400">④ 采样</text><text x="810" y="350" font-size="12" fill="#5c6772" text-anchor="middle" font-weight="400">⑤ 处理</text><text x="300" y="120" font-size="13" fill="#5c6772" text-anchor="start" font-weight="400">温度测量完整信号链：传感器内阻 Rs → PGA 高阻输入 → RC 限带 → ADC 满幅采样 → MCU</text><text x="300" y="150" font-size="13" fill="#5c6772" text-anchor="start" font-weight="400">关键：每级输入阻抗 ≥ 100× 前级输出阻抗；RC 截止频率设为采样率的 1/2.4 附近</text></svg>