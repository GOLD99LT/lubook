<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="700" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- 线性区阴影带 -->
  <rect x="180" y="90" width="440" height="200" fill="#eef4fb" stroke="none"/>
  <!-- 供电轨 -->
  <line x1="180" y1="70" x2="620" y2="70" stroke="#b5642e" stroke-width="2.2" stroke-dasharray="8,5"/>
  <text x="180" y="60" font-size="18" fill="#b5642e" font-weight="700">+Vs（正电源轨）</text>
  <line x1="180" y1="310" x2="620" y2="310" stroke="#b5642e" stroke-width="2.2" stroke-dasharray="8,5"/>
  <text x="180" y="332" font-size="18" fill="#b5642e" font-weight="700">−Vs（负电源轨 / 地）</text>
  <!-- 运放 -->
  <polygon points="280,110 280,250 430,180" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="298" y="166" font-size="22" fill="#2b3a4a" font-weight="700">−</text>
  <text x="298" y="214" font-size="22" fill="#2b3a4a" font-weight="700">+</text>
  <!-- 输入 -->
  <line x1="120" y1="200" x2="280" y2="200" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="120" y="188" font-size="18" fill="#2b3a4a">Vin</text>
  <line x1="280" y1="160" x2="250" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <!-- 输出 -->
  <line x1="430" y1="180" x2="600" y2="180" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="608" y="186" font-size="18" fill="#2b3a4a">Vout</text>
  <!-- 头room注释 -->
  <line x1="560" y1="70" x2="560" y2="180" stroke="#7a5fc0" stroke-width="1.6"/>
  <line x1="552" y1="70" x2="568" y2="70" stroke="#7a5fc0" stroke-width="1.6"/>
  <line x1="552" y1="180" x2="568" y2="180" stroke="#7a5fc0" stroke-width="1.6"/>
  <text x="572" y="128" font-size="15" fill="#7a5fc0">输出摆幅到轨的距离（Headroom）</text>
</svg>
