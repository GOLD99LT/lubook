  <rect x="380" y="298" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="310" x2="490" y2="310" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="490" y1="310" x2="490" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="490" y1="265" x2="520" y2="265" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="410" y="288" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">R₂</text>
  <circle cx="490" cy="265" r="4.5" fill="#2b3a4a"/>
