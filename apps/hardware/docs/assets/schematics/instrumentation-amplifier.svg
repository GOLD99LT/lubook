<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <!-- A1 输入级 -->
  <polygon points="200,70 200,150 300,110" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
  <text x="212" y="100" font-size="18" fill="#2b3a4a" font-weight="700">−</text>
  <text x="212" y="132" font-size="18" fill="#2b3a4a" font-weight="700">+</text>
  <text x="250" y="62" font-size="16" fill="#1a4f8b" font-weight="700">A₁</text>
  <!-- A2 输入级 -->
  <polygon points="200,270 200,350 300,310" fill="#fbfdff" stroke="#2b3a4a" stroke-width="2.6"/>
