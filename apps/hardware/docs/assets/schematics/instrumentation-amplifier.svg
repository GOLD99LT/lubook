  <text x="212" y="332" font-size="18" fill="#2b3a4a" font-weight="700">+</text>
  <text x="250" y="368" font-size="16" fill="#1a4f8b" font-weight="700">A₂</text>
  <!-- Vin+/Vin- -->
  <line x1="60" y1="125" x2="200" y2="125" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="60" y="113" font-size="18" fill="#2b3a4a">Vin+</text>
