  <rect x="380" y="98" width="60" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="440" y1="110" x2="470" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>
