  <line x1="620" y1="150" x2="680" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="680" y1="150" x2="680" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="580" y="128" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">Rf</text>
  <circle cx="680" cy="230" r="4.5" fill="#2b3a4a"/>
  <!-- Rg3 下地 -->
  <line x1="490" y1="265" x2="490" y2="330" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="478" y="330" width="24" height="50" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="490" y1="380" x2="490" y2="405" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="506" y="360" font-size="16" fill="#1a4f8b" font-weight="700">Rg</text>
  <line x1="476" y1="405" x2="504" y2="405" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="481" y1="412" x2="499" y2="412" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="485" y1="419" x2="495" y2="419" stroke="#2b3a4a" stroke-width="2.4"/>
  <!-- 输出 -->
  <line x1="640" y1="230" x2="720" y2="230" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#arrowR)"/>
  <text x="728" y="236" font-size="18" fill="#2b3a4a">Vout</text>
</svg>
