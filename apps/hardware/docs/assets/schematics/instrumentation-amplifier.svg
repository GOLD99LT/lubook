  <circle cx="330" cy="110" r="4.5" fill="#2b3a4a"/>
  <!-- Rf2 反馈 -->
  <line x1="170" y1="295" x2="170" y2="385" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="170" y1="385" x2="210" y2="385" stroke="#2b3a4a" stroke-width="2.2"/>
