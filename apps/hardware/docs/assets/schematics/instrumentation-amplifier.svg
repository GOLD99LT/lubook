  <line x1="170" y1="230" x2="170" y2="295" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="186" y="205" font-size="17" fill="#1a4f8b" font-weight="700">Rg</text>
  <circle cx="170" cy="95" r="4.5" fill="#2b3a4a"/>
  <circle cx="170" cy="295" r="4.5" fill="#2b3a4a"/>
  <!-- Rf1 反馈 -->
  <line x1="170" y1="95" x2="170" y2="35" stroke="#2b3a4a" stroke-width="2.2"/>
