<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 490" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <title>触电回路与剩余电流保护：L 经绝缘失效点、设备外壳、人体与 PE 流入大地，RCD 检测 L 与 N 的电流差</title>
  <desc>市电 L/N 经两级 RCD 与保险丝给设备供电；设备外壳接 PE 并经接地电阻 R_E 入地；人体触摸外壳时，故障电流在 PE 与人体之间分流，剩余电流为 L 与 N 电流之差。</desc>
  <defs>
    <marker id="arwR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cc5a47"/>
    </marker>
    <marker id="arwB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a4f8b"/>
    </marker>
  </defs>
  <rect width="900" height="490" fill="#ffffff"/>

  <!-- 电源 -->
  <rect x="30" y="55" width="100" height="130" rx="6" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="80" y="88" font-size="14" fill="#222a32" text-anchor="middle" font-weight="700">市电</text>
  <text x="80" y="110" font-size="12" fill="#2b3a4a" text-anchor="middle">220V / 50Hz</text>
  <text x="80" y="140" font-size="12" fill="#6b7a88" text-anchor="middle">L / N</text>

  <!-- L / N 母线 -->
  <line x1="130" y1="80" x2="760" y2="80" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="130" y1="160" x2="760" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="140" y="72" font-size="13" fill="#b5642e" font-weight="700">L</text>
  <text x="140" y="152" font-size="13" fill="#2b3a4a" font-weight="700">N</text>
  <line x1="196" y1="80" x2="228" y2="80" stroke="#1a4f8b" stroke-width="2.2" marker-end="url(#arwB)"/>
  <text x="212" y="70" font-size="11" fill="#1a4f8b" text-anchor="middle">I<tspan font-size="8" dy="3">L</tspan></text>
  <line x1="196" y1="160" x2="228" y2="160" stroke="#1a4f8b" stroke-width="2.2" marker-end="url(#arwB)"/>
  <text x="212" y="180" font-size="11" fill="#1a4f8b" text-anchor="middle">I<tspan font-size="8" dy="3">N</tspan></text>

  <!-- RCD -->
  <rect x="300" y="62" width="90" height="116" fill="none" stroke="#1a4f8b" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
  <text x="345" y="52" font-size="13" fill="#1a4f8b" text-anchor="middle" font-weight="700">RCD 2P</text>
  <text x="345" y="200" font-size="12" fill="#1a4f8b" text-anchor="middle">I&#916; = |I<tspan font-size="9" dy="3">L</tspan><tspan dy="-3"> &#8722; I</tspan><tspan font-size="9" dy="3">N</tspan><tspan dy="-3">|</tspan></text>

  <!-- 保险丝 -->
  <rect x="420" y="68" width="64" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="452" y="58" font-size="12" fill="#2b3a4a" text-anchor="middle" font-weight="700">FUSE</text>

  <!-- 负载 -->
  <line x1="690" y1="80" x2="690" y2="100" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="674" y="100" width="32" height="44" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="690" y1="144" x2="690" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="690" y="182" font-size="12" fill="#2b3a4a" text-anchor="middle">负载</text>

  <!-- 绝缘失效支路 -->
  <line x1="726" y1="80" x2="726" y2="240" stroke="#cc5a47" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="712" y="148" width="28" height="36" fill="#ffffff" stroke="#cc5a47" stroke-width="1.8"/>
  <text x="748" y="164" font-size="12" fill="#cc5a47" font-weight="700">R_f</text>
  <text x="748" y="182" font-size="11" fill="#cc5a47">绝缘失效</text>

  <!-- 设备外壳 -->
  <rect x="560" y="240" width="200" height="90" rx="4" fill="#f5f8fb" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="660" y="290" font-size="13" fill="#222a32" text-anchor="middle" font-weight="700">设备外壳（可触及金属）</text>

  <!-- PE 与接地电阻 -->
  <line x1="580" y1="330" x2="580" y2="420" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="566" y="350" width="28" height="36" fill="#ffffff" stroke="#2b3a4a" stroke-width="1.8"/>
  <text x="604" y="370" font-size="12" fill="#2b3a4a" font-weight="700">R_E</text>
  <text x="604" y="386" font-size="11" fill="#6b7a88">接地电阻</text>
  <text x="556" y="344" font-size="12" fill="#2b3a4a" text-anchor="end" font-weight="700">PE</text>

  <!-- 大地 -->
  <line x1="500" y1="420" x2="860" y2="420" stroke="#4f9e63" stroke-width="2.4"/>
  <line x1="520" y1="420" x2="510" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="560" y1="420" x2="550" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="600" y1="420" x2="590" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="640" y1="420" x2="630" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="680" y1="420" x2="670" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="720" y1="420" x2="710" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="760" y1="420" x2="750" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="800" y1="420" x2="790" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <line x1="840" y1="420" x2="830" y2="432" stroke="#4f9e63" stroke-width="1.6"/>
  <text x="700" y="452" font-size="12" fill="#4f9e63" text-anchor="middle">大地</text>

  <!-- 人体 -->
  <circle cx="800" cy="250" r="14" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="800" y1="264" x2="800" y2="318" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="800" y1="274" x2="760" y2="288" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="800" y1="318" x2="780" y2="370" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="800" y1="318" x2="820" y2="370" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="780" y1="370" x2="780" y2="420" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="820" y1="370" x2="820" y2="420" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="838" y="250" font-size="12" fill="#2b3a4a" font-weight="700">人体</text>
  <text x="838" y="268" font-size="12" fill="#2b3a4a">Z<tspan font-size="9" dy="3">b</tspan></text>

  <!-- 剩余电流路径：故障点 -> 人体 -> 大地 -> 电源中性点 -->
  <line x1="726" y1="240" x2="760" y2="288" stroke="#cc5a47" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arwR)"/>
  <line x1="780" y1="420" x2="600" y2="420" stroke="#cc5a47" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="520" y1="420" x2="150" y2="420" stroke="#cc5a47" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="150" y1="420" x2="150" y2="160" stroke="#cc5a47" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arwR)"/>
  <text x="330" y="440" font-size="11" fill="#cc5a47" text-anchor="middle">剩余电流经大地返回电源中性点</text>

  <!-- 结论标注 -->
  <text x="450" y="478" font-size="12" fill="#222a32" text-anchor="middle">I&#916; &#8805; I&#916;n 时 RCD 跳闸；I&#916; &lt; I&#916;n 时人体持续带电，RCD 不会动作</text>
</svg>
