<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="700" fill="#222a32">开漏线与（Wired-AND）：多节点共享一条线</text>

  <!-- 共享总线 -->
  <line x1="120" y1="110" x2="600" y2="110" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 上拉 -->
  <line x1="600" y1="110" x2="600" y2="70" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="592" y="34" width="16" height="36" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="600" y1="34" x2="600" y2="24" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="616" y="30" font-size="12" fill="#b5642e">+3V3</text>
  <text x="616" y="56" font-size="11" fill="#1a4f8b">4.7k</text>

  <!-- 三个开漏节点 -->
  <g>
    <line x1="180" y1="110" x2="180" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
    <circle cx="180" cy="110" r="4.5" fill="#2b3a4a"/>
    <rect x="160" y="150" width="40" height="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
    <text x="180" y="172" font-size="11" fill="#222a32" text-anchor="middle">OD</text>
    <line x1="180" y1="184" x2="180" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
    <line x1="166" y1="230" x2="194" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="171" y1="237" x2="189" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="175" y1="244" x2="185" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
    <text x="180" y="266" font-size="11" fill="#5c6772" text-anchor="middle">MCU-A</text>
  </g>
  <g>
    <line x1="360" y1="110" x2="360" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
    <circle cx="360" cy="110" r="4.5" fill="#2b3a4a"/>
    <rect x="340" y="150" width="40" height="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
    <text x="360" y="172" font-size="11" fill="#222a32" text-anchor="middle">OD</text>
    <line x1="360" y1="184" x2="360" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
    <line x1="346" y1="230" x2="374" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="351" y1="237" x2="369" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="355" y1="244" x2="365" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
    <text x="360" y="266" font-size="11" fill="#5c6772" text-anchor="middle">MCU-B</text>
  </g>
  <g>
    <line x1="500" y1="110" x2="500" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
    <circle cx="500" cy="110" r="4.5" fill="#2b3a4a"/>
    <rect x="480" y="150" width="40" height="34" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
    <text x="500" y="172" font-size="11" fill="#222a32" text-anchor="middle">OD</text>
    <line x1="500" y1="184" x2="500" y2="230" stroke="#2b3a4a" stroke-width="2.2"/>
    <line x1="486" y1="230" x2="514" y2="230" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="491" y1="237" x2="509" y2="237" stroke="#2b3a4a" stroke-width="2.4"/>
    <line x1="495" y1="244" x2="505" y2="244" stroke="#2b3a4a" stroke-width="2.4"/>
    <text x="500" y="266" font-size="11" fill="#5c6772" text-anchor="middle">MCU-C</text>
  </g>

  <text x="120" y="305" font-size="12" fill="#7a5fc0">任一节点拉低则总线为低；全部释放才被上拉拉高（逻辑与，省一根线）</text>
</svg>
