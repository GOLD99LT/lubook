<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace">
  <rect width="720" height="280" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#222a32">稳压管并联稳压电路</text>

  <!-- Vin -->
  <text x="40" y="110" font-size="18" fill="#2b3a4a">Vin(12V)</text>
  <line x1="40" y1="120" x2="160" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>

  <!-- 限流电阻 R -->
  <rect x="160" y="108" width="100" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="260" y1="120" x2="380" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="210" y="98" font-size="16" fill="#1a4f8b" text-anchor="middle" font-weight="700">R=470Ω</text>

  <!-- 输出节点 -->
  <circle cx="380" cy="120" r="4.5" fill="#2b3a4a"/>
  <line x1="380" y1="120" x2="600" y2="120" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="610" y="126" font-size="16" fill="#2b3a4a">Vout=VZ(5.1V)</text>

  <!-- 稳压管反向接地（阴极向上） -->
  <line x1="380" y1="120" x2="380" y2="150" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="362,180 398,180 380,150" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="362" y1="182" x2="398" y2="182" stroke="#2b3a4a" stroke-width="2.6"/>
  <path d="M398,182 q8,-3 8,-9 M398,150 q8,3 8,9" fill="none" stroke="#2b3a4a" stroke-width="2"/>
  <line x1="380" y1="182" x2="380" y2="220" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="410" y="170" font-size="14" fill="#1a4f8b" font-weight="700">1N4733 (5.1V)</text>

  <!-- 地 -->
  <line x1="380" y1="220" x2="380" y2="232" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="366" y1="232" x2="394" y2="232" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="371" y1="239" x2="389" y2="239" stroke="#2b3a4a" stroke-width="2.4"/>
  <line x1="375" y1="246" x2="385" y2="246" stroke="#2b3a4a" stroke-width="2.4"/>
</svg>
