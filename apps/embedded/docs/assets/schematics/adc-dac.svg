<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Noto Sans SC',monospace" role="img">
  <title>SAR ADC 采样网络与 DAC 重建链路：Rs、Cext、Rsw、Csh 构成采样 RC，比较器与 SAR 逻辑逐位逼近；DAC 输出经缓冲与 R1C1 低通重建</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="30" font-size="19" font-weight="700" fill="#222a32">ADC 采样网络与 DAC 重建链路</text>
  <text x="24" y="50" font-size="13" fill="#5c6772">12 位 · V_REF = 3.3 V · 10 kSPS · 采样窗口 1 µs · 图中数值与正文算例一致</text>
  <line x1="24" y1="60" x2="736" y2="60" stroke="#e3e0d7"/>

  <text x="24" y="84" font-size="15" font-weight="700" fill="#1a4f8b">① 采样保持与逐次逼近</text>

  <circle cx="52" cy="160" r="15" fill="#ffffff" stroke="#2b3a4a" stroke-width="2"/>
  <text x="52" y="154" font-size="14" fill="#2b3a4a" text-anchor="middle">+</text>
  <text x="52" y="172" font-size="14" fill="#2b3a4a" text-anchor="middle">−</text>
  <text x="52" y="194" font-size="13" fill="#1a4f8b" text-anchor="middle">V_s</text>

  <line x1="67" y1="160" x2="96" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="96" y="148" width="56" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="124" y="142" font-size="14" fill="#1a4f8b" text-anchor="middle">R_s</text>
  <text x="124" y="188" font-size="13" fill="#5c6772" text-anchor="middle">10 kΩ</text>

  <line x1="152" y1="160" x2="186" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="186" cy="160" r="4" fill="#2b3a4a"/>
  <line x1="186" y1="160" x2="186" y2="194" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="174" y1="194" x2="198" y2="194" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="174" y1="202" x2="198" y2="202" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="186" y1="202" x2="186" y2="212" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="176" y1="212" x2="196" y2="212" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="180" y1="217" x2="192" y2="217" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="184" y1="222" x2="188" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="202" y="194" font-size="13" fill="#1a4f8b">C_ext</text>
  <text x="202" y="210" font-size="13" fill="#5c6772">4.7 nF</text>

  <line x1="186" y1="160" x2="222" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="222" y="148" width="48" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="246" y="142" font-size="14" fill="#1a4f8b" text-anchor="middle">R_sw</text>
  <text x="246" y="188" font-size="13" fill="#5c6772" text-anchor="middle">200 Ω</text>

  <line x1="270" y1="160" x2="300" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="300" cy="160" r="4" fill="#2b3a4a"/>
