  <line x1="288" y1="202" x2="312" y2="202" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="300" y1="202" x2="300" y2="212" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="290" y1="212" x2="310" y2="212" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="294" y1="217" x2="306" y2="217" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="298" y1="222" x2="302" y2="222" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="316" y="194" font-size="13" fill="#1a4f8b">C_sh</text>
  <text x="316" y="210" font-size="13" fill="#5c6772">8 pF</text>

  <line x1="300" y1="160" x2="332" y2="160" stroke="#2b3a4a" stroke-width="2.2"/>
  <polygon points="332,138 332,182 374,160" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="352" y="165" font-size="13" fill="#2b3a4a" text-anchor="middle">CMP</text>
  <path d="M374,160 H404 V274 H354" fill="none" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>

  <rect x="150" y="248" width="200" height="54" fill="#f7f5ef" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="250" y="270" font-size="14" fill="#222a32" text-anchor="middle">SAR 逻辑 · 逐次逼近</text>
  <text x="250" y="290" font-size="13" fill="#5c6772" text-anchor="middle">12 bit / 1 MSPS</text>
  <path d="M350,248 V206 H272 V176" fill="none" stroke="#b5642e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="282" y="222" font-size="13" fill="#b5642e">开关控制</text>
  <text x="150" y="322" font-size="13" fill="#5c6772">V_REF = 3.3 V，满量程 0 至 V_REF</text>

  <text x="470" y="84" font-size="15" font-weight="700" fill="#1a4f8b">② DAC 与重建滤波</text>
  <rect x="486" y="104" width="110" height="40" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="541" y="129" font-size="14" fill="#222a32" text-anchor="middle">D[11:0]</text>
  <line x1="596" y1="124" x2="614" y2="124" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="620" y="102" width="100" height="44" fill="#f7f5ef" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="670" y="121" font-size="14" fill="#222a32" text-anchor="middle">DAC</text>
  <text x="670" y="138" font-size="13" fill="#5c6772" text-anchor="middle">12 bit</text>
  <path d="M670,146 V170 H486 V192" fill="none" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <polygon points="486,172 486,212 526,192" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="500" y="197" font-size="13" fill="#2b3a4a" text-anchor="middle">BUF</text>
  <line x1="526" y1="192" x2="556" y2="192" stroke="#2b3a4a" stroke-width="2.2"/>
  <rect x="556" y="180" width="50" height="24" fill="#ffffff" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="581" y="174" font-size="14" fill="#1a4f8b" text-anchor="middle">R1</text>
  <line x1="606" y1="192" x2="626" y2="192" stroke="#2b3a4a" stroke-width="2.2"/>
  <circle cx="626" cy="192" r="4" fill="#2b3a4a"/>
  <line x1="626" y1="192" x2="626" y2="226" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="614" y1="226" x2="638" y2="226" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="614" y1="234" x2="638" y2="234" stroke="#2b3a4a" stroke-width="2.6"/>
  <line x1="626" y1="234" x2="626" y2="244" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="616" y1="244" x2="636" y2="244" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="620" y1="249" x2="632" y2="249" stroke="#2b3a4a" stroke-width="2.2"/>
  <line x1="624" y1="254" x2="628" y2="254" stroke="#2b3a4a" stroke-width="2.2"/>
  <text x="643" y="226" font-size="13" fill="#1a4f8b">C1</text>
  <text x="643" y="242" font-size="13" fill="#5c6772">f_c 1.5 kHz</text>
  <line x1="626" y1="192" x2="690" y2="192" stroke="#2b3a4a" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="696" y="186" font-size="13" fill="#222a32">V_out</text>

  <line x1="24" y1="330" x2="736" y2="330" stroke="#e3e0d7"/>
  <rect x="30" y="338" width="240" height="86" fill="#fbfaf6" stroke="#e3e0d7"/>
  <line x1="44" y1="414" x2="44" y2="352" stroke="#5c6772" stroke-width="1.6"/>
  <line x1="44" y1="414" x2="258" y2="414" stroke="#5c6772" stroke-width="1.6"/>
  <path d="M44,414 C 86,368 140,362 256,361" fill="none" stroke="#b5642e" stroke-width="2.4"/>
  <line x1="96" y1="357" x2="256" y2="357" stroke="#4f9e63" stroke-width="1.6" stroke-dasharray="5 4"/>
  <line x1="96" y1="365" x2="256" y2="365" stroke="#4f9e63" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="36" y="356" font-size="13" fill="#5c6772" text-anchor="end">V_s</text>
  <text x="38" y="418" font-size="13" fill="#5c6772" text-anchor="end">0</text>
  <text x="190" y="352" font-size="13" fill="#4f9e63">±0.5 LSB</text>
  <text x="150" y="432" font-size="13" fill="#5c6772" text-anchor="middle">t_acq</text>

  <text x="286" y="360" font-size="13" fill="#222a32">τ = (R_s + R_in)·C_sh = 81.6 ns，t_acq ≥ 735 ns（1 µs 余量 1.36 倍）</text>
  <text x="286" y="384" font-size="13" fill="#222a32">0.5 LSB = V_REF/2^(N+1) = 402.8 µV，SNR = 6.02N + 1.76 = 74.0 dB</text>
  <text x="286" y="408" font-size="13" fill="#222a32">DAC：100 kHz 镜像 40lg(f_s/f_c) = 73 dB，带内 1 kHz 跌 0.78 dB</text>
</svg>
