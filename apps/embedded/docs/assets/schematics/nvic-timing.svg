<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">Cortex-M 中断进入、返回与尾链时序（72 MHz）</text>
  <text x="20" y="54" font-size="13" fill="#4a5568">横轴为周期数，第二行为同一点在 72 MHz 下的绝对时间；1 周期 = 13.9 ns</text>
  <line x1="20" y1="64" x2="740" y2="64" stroke="#e2e8f0"/>

  <line x1="170" y1="78" x2="170" y2="336" stroke="#c53030" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="176" y="90" font-size="13" fill="#c53030">请求挂起（周期 0）</text>

  <line x1="276" y1="84" x2="276" y2="330" stroke="#edf2f7"/>
  <line x1="346" y1="84" x2="346" y2="330" stroke="#edf2f7"/>
  <line x1="522" y1="84" x2="522" y2="330" stroke="#edf2f7"/>
  <line x1="628" y1="84" x2="628" y2="330" stroke="#edf2f7"/>

  <text x="18" y="106" font-size="13" font-weight="700" fill="#2d3748">完整一次 52 周期</text>
  <rect x="170" y="112" width="106" height="36" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="222" y="136" font-size="13" fill="#1a365d" text-anchor="middle">入栈 12</text>
  <rect x="276" y="112" width="70" height="36" rx="3" fill="#e9edf2" stroke="#4a5568" stroke-width="1.5"/>
  <text x="311" y="136" font-size="13" fill="#2d3748" text-anchor="middle">取指 8</text>
  <rect x="346" y="112" width="176" height="36" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="434" y="136" font-size="13" fill="#22543d" text-anchor="middle">ISR 主体 20</text>
  <rect x="522" y="112" width="106" height="36" rx="3" fill="#ece0f5" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="574" y="136" font-size="13" fill="#44337a" text-anchor="middle">出栈 12</text>
  <text x="636" y="136" font-size="13" fill="#2d3748">执行完毕</text>

  <text x="18" y="224" font-size="13" font-weight="700" fill="#2d3748">尾链 64 周期</text>
  <rect x="170" y="230" width="106" height="36" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="222" y="254" font-size="13" fill="#1a365d" text-anchor="middle">入栈 12</text>
  <rect x="276" y="230" width="70" height="36" rx="3" fill="#e9edf2" stroke="#4a5568" stroke-width="1.5"/>
  <text x="311" y="254" font-size="13" fill="#2d3748" text-anchor="middle">取指 8</text>
  <rect x="346" y="230" width="123" height="36" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="407" y="254" font-size="13" fill="#22543d" text-anchor="middle">ISR1 14</text>
  <rect x="469" y="230" width="53" height="36" rx="3" fill="#fde7c7" stroke="#c05621" stroke-width="1.5"/>
  <rect x="522" y="230" width="106" height="36" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="575" y="254" font-size="13" fill="#22543d" text-anchor="middle">ISR2 12</text>
  <rect x="628" y="230" width="105" height="36" rx="3" fill="#ece0f5" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="680" y="254" font-size="13" fill="#44337a" text-anchor="middle">出栈 12</text>
  <text x="496" y="220" font-size="13" fill="#9c4221" text-anchor="middle">尾链 6</text>
  <line x1="496" y1="224" x2="496" y2="230" stroke="#9c4221" stroke-width="1.2"/>

  <line x1="170" y1="336" x2="740" y2="336" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="170" y1="332" x2="170" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="276" y1="332" x2="276" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="346" y1="332" x2="346" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="522" y1="332" x2="522" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="628" y1="332" x2="628" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="733" y1="332" x2="733" y2="340" stroke="#4a5568" stroke-width="1.4"/>
  <text x="170" y="354" font-size="13" fill="#2d3748" text-anchor="middle">0</text>
  <text x="276" y="354" font-size="13" fill="#2d3748" text-anchor="middle">12</text>
  <text x="346" y="354" font-size="13" fill="#2d3748" text-anchor="middle">20</text>
  <text x="522" y="354" font-size="13" fill="#2d3748" text-anchor="middle">40</text>
  <text x="628" y="354" font-size="13" fill="#2d3748" text-anchor="middle">52</text>
  <text x="733" y="354" font-size="13" fill="#2d3748" text-anchor="middle">64</text>
  <text x="170" y="372" font-size="13" fill="#718096" text-anchor="middle">0 ns</text>
  <text x="276" y="372" font-size="13" fill="#718096" text-anchor="middle">167 ns</text>
  <text x="346" y="372" font-size="13" fill="#718096" text-anchor="middle">278 ns</text>
  <text x="522" y="372" font-size="13" fill="#718096" text-anchor="middle">556 ns</text>
  <text x="628" y="372" font-size="13" fill="#718096" text-anchor="middle">722 ns</text>
  <text x="733" y="372" font-size="13" fill="#718096" text-anchor="middle">889 ns</text>

  <rect x="20" y="392" width="14" height="14" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="40" y="404" font-size="13" fill="#2d3748">入栈 12 周期</text>
  <rect x="150" y="392" width="14" height="14" fill="#e9edf2" stroke="#4a5568" stroke-width="1.5"/>
  <text x="170" y="404" font-size="13" fill="#2d3748">向量取指与入口</text>
  <rect x="300" y="392" width="14" height="14" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="320" y="404" font-size="13" fill="#2d3748">ISR 主体</text>
  <rect x="420" y="392" width="14" height="14" fill="#fde7c7" stroke="#c05621" stroke-width="1.5"/>
  <text x="440" y="404" font-size="13" fill="#2d3748">尾链 6 周期</text>
  <rect x="550" y="392" width="14" height="14" fill="#ece0f5" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="570" y="404" font-size="13" fill="#2d3748">出栈 12 周期</text>

  <text x="20" y="428" font-size="13" fill="#4a5568">同优先级背靠背切换：正常 12 + 12 = 24 周期，尾链后 6 周期，每次省 18 周期（250 ns）</text>
</svg>
