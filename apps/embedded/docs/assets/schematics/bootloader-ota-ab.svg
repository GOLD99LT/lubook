<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>A/B 双区布局与升级状态机：槽首即向量表、元数据双页轮换、六态迁移与回滚路径</title>
  <defs>
    <marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2b3a4a"/>
    </marker>
    <marker id="abred" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b03a2e"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="24" y="28" font-size="18" font-weight="700" fill="#222a32">A/B 双区布局与升级状态机</text>
    <text x="24" y="50" font-size="13" fill="#5c6772">每次状态迁移都先写元数据、再执行动作；槽首就是向量表，VTOR 等于槽基址</text>
    <line x1="24" y1="62" x2="736" y2="62" stroke="#e3e0d7"/>

    <!-- 左：分区布局 -->
    <text x="24" y="84" font-size="13" font-weight="700" fill="#1a4f8b">Flash 分区（512 KB，未按比例）</text>

    <rect x="24" y="94" width="340" height="40" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.6"/>
    <text x="34" y="113" font-size="14" font-weight="700" fill="#b5642e">Bootloader</text>
    <text x="354" y="113" font-size="13" fill="#b5642e" text-anchor="end">16 KB · 不参与常规 OTA</text>
    <text x="34" y="129" font-size="13" fill="#b5642e">0x08000000–0x08003FFF</text>

    <rect x="24" y="142" width="340" height="30" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.6"/>
    <text x="34" y="161" font-size="13" font-weight="700" fill="#7a5fc0">Metadata 元数据</text>
    <text x="354" y="161" font-size="13" fill="#7a5fc0" text-anchor="end">0x08004000 · 4 KB</text>

    <rect x="24" y="180" width="340" height="30" fill="#f7f9fb" stroke="#5c6772" stroke-width="1.4"/>
    <text x="34" y="199" font-size="13" fill="#3c4650">参数区（校准/配置）</text>
    <text x="354" y="199" font-size="13" fill="#3c4650" text-anchor="end">0x08005000 · 4 KB</text>

    <rect x="24" y="218" width="340" height="56" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.6"/>
    <text x="34" y="238" font-size="14" font-weight="700" fill="#1a4f8b">Slot A · 活动槽</text>
    <text x="34" y="254" font-size="13" fill="#1a4f8b">0x08006000–0x08042FFF</text>
    <text x="34" y="270" font-size="13" fill="#1a4f8b">244 KB = 122 页 · VTOR 0x08006000</text>

    <rect x="24" y="282" width="340" height="56" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.6"/>
    <text x="34" y="302" font-size="14" font-weight="700" fill="#2e7d4f">Slot B · 备用槽</text>
    <text x="34" y="318" font-size="13" fill="#2e7d4f">0x08043000–0x0807FFFF</text>
    <text x="34" y="334" font-size="13" fill="#2e7d4f">244 KB = 122 页 · VTOR 0x08043000</text>

    <text x="24" y="358" font-size="13" fill="#5c6772">槽首即向量表：VTOR 等于槽基址</text>
    <text x="24" y="376" font-size="13" fill="#5c6772">页 2 KB：244 KB = 122 页，天然对齐</text>
    <text x="24" y="394" font-size="13" fill="#5c6772">16 + 4 + 4 + 244 + 244 = 512 KB</text>
    <text x="24" y="412" font-size="13" fill="#5c6772">元数据双页轮换：序号 + CRC 取有效</text>

    <!-- 右：状态机 -->
    <text x="396" y="84" font-size="13" font-weight="700" fill="#1a4f8b">升级状态机：六态与两条回退路径</text>

    <rect x="396" y="90" width="340" height="44" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
    <text x="406" y="109" font-size="14" font-weight="700" fill="#222a32">IDLE · 空闲</text>
    <text x="406" y="126" font-size="13" fill="#3c4650">上电按元数据选槽，CONFIRMED 优先</text>

    <rect x="396" y="146" width="340" height="44" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
    <text x="406" y="165" font-size="14" font-weight="700" fill="#222a32">DOWNLOADING · 接收中</text>
    <text x="406" y="182" font-size="13" fill="#3c4650">擦备用槽，边收边写，收完校验整镜像</text>

    <rect x="396" y="202" width="340" height="44" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
    <text x="406" y="221" font-size="14" font-weight="700" fill="#222a32">PENDING · 待确认</text>
    <text x="406" y="238" font-size="13" fill="#3c4650">写新槽号与 trial=0，随后复位</text>

    <rect x="396" y="258" width="340" height="44" rx="3" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.6"/>
    <text x="406" y="277" font-size="14" font-weight="700" fill="#b5642e">TRIAL · 试启动</text>
    <text x="406" y="294" font-size="13" fill="#b5642e">每次复位 trial 加 1，上限 3 次</text>

    <rect x="396" y="318" width="160" height="48" rx="3" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.6"/>
    <text x="406" y="338" font-size="14" font-weight="700" fill="#2e7d4f">CONFIRMED</text>
    <text x="406" y="355" font-size="13" fill="#2e7d4f">应用自检通过后自己写</text>

    <rect x="576" y="318" width="160" height="48" rx="3" fill="#fbeceb" stroke="#b03a2e" stroke-width="1.6"/>
    <text x="586" y="338" font-size="14" font-weight="700" fill="#b03a2e">ROLLBACK</text>
    <text x="586" y="355" font-size="13" fill="#b03a2e">试启动超限即回滚</text>

    <rect x="396" y="384" width="340" height="40" rx="3" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.4"/>
    <text x="406" y="408" font-size="13" fill="#7a5fc0">回滚后下次上电回到 IDLE，原因码留给应用</text>

    <line x1="566" y1="134" x2="566" y2="144" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ab)"/>
    <line x1="566" y1="190" x2="566" y2="200" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ab)"/>
    <line x1="566" y1="246" x2="566" y2="256" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ab)"/>
    <line x1="476" y1="302" x2="476" y2="316" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ab)"/>
    <line x1="656" y1="302" x2="656" y2="316" stroke="#b03a2e" stroke-width="2" marker-end="url(#abred)"/>
    <line x1="656" y1="366" x2="656" y2="382" stroke="#b03a2e" stroke-width="2" marker-end="url(#abred)"/>
  </g>
</svg>
