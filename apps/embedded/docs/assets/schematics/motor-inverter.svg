  <text x="88" y="198" font-size="13" fill="#2c5282">1000 µF</text>

  <line x1="50" y1="322" x2="400" y2="322" stroke="#4a5568" stroke-width="2.4"/>
  <line x1="50" y1="322" x2="50" y2="330" stroke="#4a5568" stroke-width="2"/>
  <line x1="40" y1="330" x2="60" y2="330" stroke="#4a5568" stroke-width="2.2"/>
  <line x1="44" y1="336" x2="56" y2="336" stroke="#4a5568" stroke-width="2.2"/>
  <line x1="47" y1="342" x2="53" y2="342" stroke="#4a5568" stroke-width="2.2"/>
  <text x="72" y="336" font-size="13" fill="#4a5568">GND</text>

  <line x1="130" y1="102" x2="130" y2="120" stroke="#2b6cb0" stroke-width="2"/>
  <rect x="104" y="120" width="52" height="26" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="130" y="138" font-size="13" fill="#2c5282" text-anchor="middle">HS</text>
  <line x1="130" y1="146" x2="130" y2="214" stroke="#2b6cb0" stroke-width="2"/>
  <circle cx="130" cy="185" r="4" fill="#2b6cb0"/>
  <rect x="104" y="214" width="52" height="26" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
