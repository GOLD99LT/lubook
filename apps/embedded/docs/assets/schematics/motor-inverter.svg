<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>三相逆变器与中心对齐 PWM：六只 MOSFET、低边 5 毫欧采样、250 纳秒死区与谷点 ADC 触发</title>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="30" font-size="20" font-weight="700" fill="#1a202c">三相逆变器、死区与电流采样窗口</text>
  <text x="24" y="51" font-size="13" fill="#4a5568">24 V 母线 · 20 kHz 中心对齐 · 250 ns 死区 · 低边 5 mΩ 采样 · 数值与正文一致</text>
  <line x1="24" y1="62" x2="736" y2="62" stroke="#e2e8f0"/>

  <text x="24" y="86" font-size="14" font-weight="700" fill="#2d3748">三相半桥与低边采样</text>

  <line x1="50" y1="102" x2="400" y2="102" stroke="#2b6cb0" stroke-width="2.4"/>
  <text x="50" y="95" font-size="13" font-weight="700" fill="#2c5282">+24 V</text>

  <line x1="70" y1="102" x2="70" y2="190" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="58" y1="190" x2="82" y2="190" stroke="#2b6cb0" stroke-width="2.6"/>
