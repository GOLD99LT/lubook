<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img">
  <title>工具链数据流与 SWD 调试链路：源文件经预处理、编译、汇编、链接生成 ELF，ELF 同时供烧写与 GDB 调试使用</title>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b3a4a"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#222a32">工具链数据流与 SWD 调试链路</text>
  <text x="24" y="50" font-size="13" fill="#5c6772">编译四阶段定地址，链接产物同时喂给烧写器与调试器；下方为两线 SWD 的访问路径</text>
  <line x1="24" y1="62" x2="736" y2="62" stroke="#e3e0d7"/>

  <!-- 编译链 -->
  <rect x="20" y="80" width="96" height="44" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="68" y="107" font-size="14" fill="#222a32" text-anchor="middle">源文件 .c/.h</text>

  <rect x="140" y="80" width="96" height="44" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="188" y="107" font-size="14" fill="#222a32" text-anchor="middle">cpp 预处理</text>

  <rect x="260" y="80" width="96" height="44" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="308" y="107" font-size="14" fill="#222a32" text-anchor="middle">cc1 编译</text>

  <rect x="380" y="80" width="96" height="44" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="428" y="107" font-size="14" fill="#222a32" text-anchor="middle">as 汇编</text>

  <rect x="500" y="80" width="96" height="44" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="548" y="107" font-size="14" fill="#222a32" text-anchor="middle">ld 链接</text>

  <rect x="620" y="80" width="116" height="44" rx="4" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="678" y="107" font-size="14" fill="#1a4f8b" text-anchor="middle">.elf + .map</text>

  <line x1="116" y1="102" x2="136" y2="102" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="236" y1="102" x2="256" y2="102" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="356" y1="102" x2="376" y2="102" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="476" y1="102" x2="496" y2="102" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="596" y1="102" x2="616" y2="102" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <text x="68" y="146" font-size="13" fill="#5c6772" text-anchor="middle">宏展开 → .i</text>
  <text x="188" y="146" font-size="13" fill="#5c6772" text-anchor="middle">生成 .s</text>
  <text x="308" y="146" font-size="13" fill="#5c6772" text-anchor="middle">生成 .o</text>
  <text x="428" y="146" font-size="13" fill="#5c6772" text-anchor="middle">重定位信息</text>
  <text x="548" y="146" font-size="13" fill="#5c6772" text-anchor="middle">按脚本定址</text>
  <text x="678" y="146" font-size="13" fill="#5c6772" text-anchor="middle">地址与符号表</text>

  <!-- objcopy 分支 -->
  <line x1="726" y1="124" x2="726" y2="168" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="520" y="172" width="216" height="44" rx="4" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.6"/>
  <text x="628" y="190" font-size="14" fill="#b5642e" text-anchor="middle">objcopy -O binary</text>
  <text x="628" y="208" font-size="13" fill="#b5642e" text-anchor="middle">.bin / .hex → 烧写器</text>

  <!-- 调试链 -->
  <rect x="20" y="242" width="130" height="66" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="85" y="266" font-size="14" fill="#222a32" text-anchor="middle">GDB 会话</text>
  <text x="85" y="288" font-size="13" fill="#5c6772" text-anchor="middle">读 .elf 符号</text>

  <rect x="176" y="242" width="156" height="66" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="254" y="266" font-size="14" fill="#222a32" text-anchor="middle">GDB Server</text>
  <text x="254" y="288" font-size="13" fill="#5c6772" text-anchor="middle">OpenOCD / J-Link</text>

  <rect x="358" y="242" width="116" height="66" rx="4" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.8"/>
  <text x="416" y="266" font-size="14" fill="#1a4f8b" text-anchor="middle">SWD 两线</text>
  <text x="416" y="288" font-size="13" fill="#1a4f8b" text-anchor="middle">SWCLK + SWDIO</text>

  <rect x="500" y="242" width="112" height="66" rx="4" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="556" y="266" font-size="14" fill="#222a32" text-anchor="middle">DAP / AHB-AP</text>
  <text x="556" y="288" font-size="13" fill="#5c6772" text-anchor="middle">0xE0000000</text>

  <line x1="150" y1="275" x2="172" y2="275" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="332" y1="275" x2="354" y2="275" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="474" y1="275" x2="496" y2="275" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="612" y1="275" x2="624" y2="275" stroke="#2b3a4a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- MCU 目标 -->
  <rect x="626" y="228" width="110" height="182" rx="6" fill="#f4f7f4" stroke="#2e7d4f" stroke-width="1.8"/>
  <text x="681" y="252" font-size="14" fill="#2e7d4f" text-anchor="middle">Cortex-M3</text>
  <line x1="636" y1="260" x2="726" y2="260" stroke="#cfe0d4"/>
  <text x="681" y="282" font-size="13" fill="#222a32" text-anchor="middle">Flash</text>
  <text x="681" y="300" font-size="13" fill="#5c6772" text-anchor="middle">0x08000000</text>
  <text x="681" y="326" font-size="13" fill="#222a32" text-anchor="middle">SRAM</text>
  <text x="681" y="344" font-size="13" fill="#5c6772" text-anchor="middle">0x20000000</text>
  <text x="681" y="370" font-size="13" fill="#222a32" text-anchor="middle">外设</text>
  <text x="681" y="388" font-size="13" fill="#5c6772" text-anchor="middle">0x40000000</text>

  <!-- 关键数字 -->
  <text x="20" y="342" font-size="13" fill="#222a32">一次 32 位 AP 读约 46 个 SWCLK（请求、周转、校验）</text>
  <text x="20" y="366" font-size="13" fill="#222a32">4 MHz 读回 1 MB 约 3.01 s，擦写才是烧写瓶颈</text>
  <text x="20" y="390" font-size="13" fill="#2e7d4f">64 KB 全片：64 页 × 20 ms + 32768 字 × 50 µs ≈ 2.92 s</text>
  <text x="20" y="414" font-size="13" fill="#7a5fc0">调试断点预算：6 个代码断点 + 4 个观察点</text>
</svg>
