    <rect x="322" y="364" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="332" y="379" font-size="13" text-anchor="middle" fill="#2d3748">0</text>
    <rect x="346" y="364" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="356" y="379" font-size="13" text-anchor="middle" fill="#2d3748">0</text>
    <rect x="370" y="364" width="20" height="20" fill="#c6f6d5" stroke="#2f855a"/><text x="380" y="379" font-size="13" text-anchor="middle" fill="#22543d">0</text>

    <text x="410" y="325" font-size="13" fill="#4a5568">A 与 C 在第二位分道：A 发 0，C 发 1，</text>
    <text x="410" y="345" font-size="13" fill="#4a5568">C 读到 0 后退出；最后一位 B 发 1，</text>
    <text x="410" y="365" font-size="13" fill="#4a5568">读到 A 的 0 后退出。A 全程获胜。</text>

    <text x="20" y="406" font-size="13" fill="#4a5568">错误计数：TEC 0 → 128 错误被动 → 256 Bus-Off</text>
    <text x="20" y="426" font-size="13" fill="#4a5568">恢复：128 × 11 个隐性位 = 1408 位 = 2.816 ms @ 500 kbit/s</text>
  </g>
