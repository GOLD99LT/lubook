    <line x1="266.9" y1="96" x2="266.9" y2="134" stroke="#cbd5e0"/>
    <line x1="306.3" y1="96" x2="306.3" y2="134" stroke="#cbd5e0"/>
    <line x1="345.6" y1="96" x2="345.6" y2="134" stroke="#cbd5e0"/>
    <line x1="385.0" y1="96" x2="385.0" y2="134" stroke="#cbd5e0"/>
    <line x1="424.4" y1="96" x2="424.4" y2="134" stroke="#cbd5e0"/>
    <line x1="463.8" y1="96" x2="463.8" y2="134" stroke="#cbd5e0"/>
    <line x1="503.1" y1="96" x2="503.1" y2="134" stroke="#cbd5e0"/>
    <line x1="542.5" y1="96" x2="542.5" y2="134" stroke="#cbd5e0"/>
    <line x1="581.9" y1="96" x2="581.9" y2="134" stroke="#cbd5e0"/>
    <line x1="621.3" y1="96" x2="621.3" y2="134" stroke="#cbd5e0"/>
    <line x1="660.6" y1="96" x2="660.6" y2="134" stroke="#cbd5e0"/>
    <text x="89.7" y="120" font-size="13" fill="#22543d" text-anchor="middle">Sync</text>
    <text x="365" y="120" font-size="14" fill="#1a365d" text-anchor="middle">TS1 = 13 tq = 1.625 µs（Prop + Phase1）</text>
    <text x="660.6" y="120" font-size="13" fill="#744210" text-anchor="middle">TS2 2 tq</text>
    <line x1="621.3" y1="88" x2="621.3" y2="166" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="621.3" cy="115" r="4" fill="#c53030"/>
    <line x1="542.5" y1="147" x2="621.3" y2="147" stroke="#c53030" stroke-width="2"/>
    <polygon points="542.5,147 550,143 550,151" fill="#c53030"/>
    <polygon points="621.3,147 613.3,143 613.3,151" fill="#c53030"/>
    <text x="565" y="164" font-size="13" fill="#c53030" text-anchor="end">SJW 2 tq = 250 ns</text>
    <text x="621.3" y="181" font-size="13" fill="#c53030" text-anchor="middle">采样点 87.5% = 1.75 µs</text>

    <text x="20" y="200" font-size="13" font-weight="700" fill="#2d3748">数据段：tq = 50 ns，位时间 500 ns，采样点 80%</text>
