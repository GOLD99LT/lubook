<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>CAN FD 位时序、仲裁与错误状态</title>
  <desc>500 kbit/s 标称位的 16 个时间份额、2 Mbit/s 数据段的 10 个时间份额、三节点仲裁与 Bus-Off 门限</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <text x="20" y="28" font-size="20" font-weight="700" fill="#1a202c">CAN FD 位时序、仲裁与错误状态</text>
    <text x="20" y="50" font-size="13" fill="#4a5568">80 MHz CAN 时钟：标称 500 kbit/s（16 tq，87.5%），数据段 2 Mbit/s（10 tq，80%），SJW 均为 2 tq</text>
    <line x1="20" y1="62" x2="740" y2="62" stroke="#e2e8f0"/>

    <text x="20" y="88" font-size="13" font-weight="700" fill="#2d3748">标称位：tq = 125 ns，位时间 2 µs，采样点 87.5%</text>
    <rect x="70" y="100" width="39.4" height="30" fill="#c6f6d5" stroke="#2f855a"/>
    <rect x="109.4" y="100" width="511.9" height="30" fill="#bee3f8" stroke="#2b6cb0"/>
    <rect x="621.3" y="100" width="78.7" height="30" fill="#fefcbf" stroke="#b7791f"/>
    <line x1="70" y1="96" x2="70" y2="134" stroke="#cbd5e0"/>
    <line x1="109.4" y1="96" x2="109.4" y2="134" stroke="#cbd5e0"/>
    <line x1="148.8" y1="96" x2="148.8" y2="134" stroke="#cbd5e0"/>
    <line x1="188.1" y1="96" x2="188.1" y2="134" stroke="#cbd5e0"/>
