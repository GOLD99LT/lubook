    <rect x="133" y="210" width="441" height="28" fill="#bee3f8" stroke="#2b6cb0"/>
    <rect x="574" y="210" width="126" height="28" fill="#fefcbf" stroke="#b7791f"/>
    <line x1="70" y1="206" x2="70" y2="242" stroke="#cbd5e0"/>
    <line x1="133" y1="206" x2="133" y2="242" stroke="#cbd5e0"/>
    <line x1="196" y1="206" x2="196" y2="242" stroke="#cbd5e0"/>
