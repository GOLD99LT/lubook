    <rect x="346" y="316" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="356" y="331" font-size="13" text-anchor="middle" fill="#2d3748">0</text>
    <rect x="370" y="316" width="20" height="20" fill="#c6f6d5" stroke="#2f855a"/><text x="380" y="331" font-size="13" text-anchor="middle" fill="#22543d">0</text>

    <rect x="130" y="340" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="140" y="355" font-size="13" text-anchor="middle" fill="#2d3748">0</text>
