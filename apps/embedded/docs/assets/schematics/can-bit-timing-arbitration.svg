    <rect x="250" y="340" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="260" y="355" font-size="13" text-anchor="middle" fill="#2d3748">1</text>
    <rect x="274" y="340" width="20" height="20" fill="#e2e8f0" stroke="#a0aec0"/><text x="284" y="355" font-size="13" text-anchor="middle" fill="#2d3748">0</text>
