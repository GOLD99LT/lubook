    <line x1="385" y1="206" x2="385" y2="242" stroke="#cbd5e0"/>
    <line x1="448" y1="206" x2="448" y2="242" stroke="#cbd5e0"/>
    <line x1="511" y1="206" x2="511" y2="242" stroke="#cbd5e0"/>
    <line x1="574" y1="206" x2="574" y2="242" stroke="#cbd5e0"/>
    <line x1="637" y1="206" x2="637" y2="242" stroke="#cbd5e0"/>
    <text x="101.5" y="229" font-size="13" fill="#22543d" text-anchor="middle">Sync</text>
    <text x="353" y="229" font-size="14" fill="#1a365d" text-anchor="middle">TS1 = 7 tq = 350 ns</text>
    <text x="637" y="229" font-size="13" fill="#744210" text-anchor="middle">TS2 2 tq</text>
    <line x1="574" y1="198" x2="574" y2="254" stroke="#c53030" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="574" cy="224" r="4" fill="#c53030"/>
    <text x="574" y="270" font-size="13" fill="#c53030" text-anchor="middle">采样点 80% = 400 ns</text>
    <text x="20" y="270" font-size="13" fill="#4a5568">BRS=1 后从下一位切到数据段位时序，CRC 界定符前切回</text>

    <text x="20" y="304" font-size="13" font-weight="700" fill="#2d3748">仲裁：ID 越小越早发显性；输的节点读到显性后立即转为接收</text>
    <text x="120" y="331" font-size="13" fill="#2d3748" text-anchor="end">0x120</text>
    <text x="120" y="355" font-size="13" fill="#2d3748" text-anchor="end">0x121</text>
    <text x="120" y="379" font-size="13" fill="#2d3748" text-anchor="end">0x320</text>

