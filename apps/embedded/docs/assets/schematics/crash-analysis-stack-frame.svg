<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>HardFault 栈帧与判读路径</title>
  <desc>左侧是异常入口压栈的八个字及其 SP 偏移，右侧是 EXC_RETURN、CFSR、VALID 位与 PC/LR 的判读顺序。</desc>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" fill="#102a43" font-weight="700">HardFault 栈帧与判读路径</text>
  <text x="24" y="56" font-size="13.5" fill="#486581">SP = 0x20004F20；整数帧 8 个字 = 32 B；FPU 有效时扩展到 104 B，整数帧仍在 SP 处</text>

  <rect x="20" y="76" width="380" height="316" rx="10" fill="#f8fafc" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="36" y="100" font-size="15" fill="#243b53" font-weight="600">异常入口栈帧（整数帧，向下增长）</text>

  <rect x="36" y="112" width="344" height="28" rx="4" fill="#f8fafc" stroke="#bcccdc" stroke-width="1.2"/>
  <text x="46" y="131" font-size="13.5" fill="#243b53">xPSR</text>
  <text x="120" y="131" font-size="13" fill="#486581">SP+28</text>
  <text x="370" y="131" font-size="13" fill="#243b53" text-anchor="end">0x61000000</text>

  <rect x="36" y="142" width="344" height="28" rx="4" fill="#ffe8cc" stroke="#b7791f" stroke-width="1.8"/>
  <text x="46" y="161" font-size="13.5" fill="#7b4b12" font-weight="700">PC</text>
  <text x="120" y="161" font-size="13" fill="#7b4b12">SP+24</text>
  <text x="370" y="161" font-size="13" fill="#7b4b12" text-anchor="end" font-weight="600">0x08004A2E</text>

  <rect x="36" y="172" width="344" height="28" rx="4" fill="#e8f1ff" stroke="#3e7cb1" stroke-width="1.8"/>
  <text x="46" y="191" font-size="13.5" fill="#173f5f" font-weight="700">LR</text>
  <text x="120" y="191" font-size="13" fill="#173f5f">SP+20</text>
  <text x="370" y="191" font-size="13" fill="#173f5f" text-anchor="end" font-weight="600">0x0800491D</text>

  <rect x="36" y="202" width="344" height="28" rx="4" fill="#ffffff" stroke="#bcccdc" stroke-width="1.2"/>
  <text x="46" y="221" font-size="13.5" fill="#243b53">R12</text>
  <text x="120" y="221" font-size="13" fill="#486581">SP+16</text>
  <text x="370" y="221" font-size="13" fill="#243b53" text-anchor="end">0x00000000</text>

  <rect x="36" y="232" width="344" height="28" rx="4" fill="#ffffff" stroke="#bcccdc" stroke-width="1.2"/>
  <text x="46" y="251" font-size="13.5" fill="#243b53">R3</text>
  <text x="120" y="251" font-size="13" fill="#486581">SP+12</text>
  <text x="370" y="251" font-size="13" fill="#243b53" text-anchor="end">0x50000000</text>

  <rect x="36" y="262" width="344" height="28" rx="4" fill="#ffffff" stroke="#bcccdc" stroke-width="1.2"/>
  <text x="46" y="281" font-size="13.5" fill="#243b53">R2</text>
  <text x="120" y="281" font-size="13" fill="#486581">SP+8</text>
  <text x="370" y="281" font-size="13" fill="#243b53" text-anchor="end">0x00000004</text>

  <rect x="36" y="292" width="344" height="28" rx="4" fill="#ffffff" stroke="#bcccdc" stroke-width="1.2"/>
  <text x="46" y="311" font-size="13.5" fill="#243b53">R1</text>
  <text x="120" y="311" font-size="13" fill="#486581">SP+4</text>
  <text x="370" y="311" font-size="13" fill="#243b53" text-anchor="end">0x20001E00</text>

  <rect x="36" y="322" width="344" height="28" rx="4" fill="#fff4e6" stroke="#b7791f" stroke-width="1.4"/>
  <text x="46" y="341" font-size="13.5" fill="#7b4b12" font-weight="600">R0</text>
  <text x="120" y="341" font-size="13" fill="#7b4b12">SP+0</text>
  <text x="370" y="341" font-size="13" fill="#7b4b12" text-anchor="end">0x00000000</text>

  <text x="36" y="368" font-size="13" fill="#486581">SP 指向 R0；帧顶在 SP+32 = 0x20004F40</text>
  <text x="36" y="384" font-size="13" fill="#486581">FPU 上下文位于整数帧之上的高地址，共 72 B</text>

  <rect x="420" y="76" width="320" height="316" rx="10" fill="#fffdf7" stroke="#d9b382" stroke-width="1.5"/>
  <text x="436" y="100" font-size="15" fill="#5c3d0e" font-weight="600">判读顺序</text>

  <rect x="436" y="112" width="288" height="54" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.3"/>
  <text x="446" y="132" font-size="13.5" fill="#243b53" font-weight="600">1. 读 EXC_RETURN（LR）</text>
  <text x="446" y="152" font-size="13" fill="#486581">bit2 选 MSP/PSP；bit4=0 是 FPU 帧</text>

  <rect x="436" y="174" width="288" height="54" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.3"/>
  <text x="446" y="194" font-size="13.5" fill="#243b53" font-weight="600">2. 拆 CFSR</text>
  <text x="446" y="214" font-size="13" fill="#486581">MMFSR = CFSR &amp; 0xFF；BFSR = CFSR &gt;&gt; 8</text>

  <rect x="436" y="236" width="288" height="54" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.3"/>
  <text x="446" y="256" font-size="13.5" fill="#243b53" font-weight="600">3. 看 VALID 位</text>
  <text x="446" y="276" font-size="13" fill="#486581">BFARVALID / MMARVALID 为 1 才读地址</text>

  <rect x="436" y="298" width="288" height="54" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.3"/>
  <text x="446" y="318" font-size="13.5" fill="#243b53" font-weight="600">4. PC/LR 还原源码</text>
  <text x="446" y="338" font-size="13" fill="#486581">PC 查 addr2line；LR-1 查调用点</text>

  <text x="436" y="374" font-size="13" fill="#486581">精确总线错误直接用 PC；非精确从 PC-4 扫描</text>

  <text x="24" y="420" font-size="13.5" fill="#b23f2d" font-weight="600">示例：CFSR=0x00008200 得到 BFSR=0x82，即 PRECISERR+BFARVALID，BFAR=0x50000004</text>
  <text x="24" y="436" font-size="13" fill="#486581">PC 偏移 = PC - 函数起始 = 0x08004A2E - 0x080049F0 = 0x3E = 62 B；LR 清 Thumb 位后为 0x0800491C</text>
</svg>
