<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img">
  <title>启动流程：64 KB Flash 分区、应用向量表与从复位到 main 的执行序列</title>
  <defs>
    <marker id="sar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b3a4a"/>
    </marker>
    <marker id="sgr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d4f"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#222a32">启动流程：分区、向量表与复位序列</text>
  <text x="24" y="50" font-size="13" fill="#5c6772">跳转前三件事：设 MSP、改 VTOR、确认复位向量为奇数（Thumb 位）</text>
  <line x1="24" y1="62" x2="736" y2="62" stroke="#e3e0d7"/>

  <!-- Flash 分区 -->
  <rect x="24" y="74" width="89" height="52" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.6"/>
  <text x="68" y="96" font-size="13" fill="#b5642e" text-anchor="middle">Bootloader</text>
  <text x="68" y="116" font-size="13" fill="#b5642e" text-anchor="middle">8 KB</text>

  <rect x="113" y="74" width="534" height="52" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="380" y="96" font-size="14" fill="#1a4f8b" text-anchor="middle">Application 48 KB</text>
  <text x="380" y="116" font-size="13" fill="#1a4f8b" text-anchor="middle">向量表在 0x08002000，VTOR 必须指向它</text>

  <rect x="647" y="74" width="89" height="52" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.6"/>
  <text x="691" y="96" font-size="13" fill="#7a5fc0" text-anchor="middle">参数区</text>
  <text x="691" y="116" font-size="13" fill="#7a5fc0" text-anchor="middle">8 KB</text>

  <line x1="96" y1="100" x2="128" y2="100" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <text x="132" y="88" font-size="13" fill="#2b3a4a">跳转</text>

  <text x="24" y="148" font-size="13" fill="#5c6772">0x08000000</text>
  <text x="113" y="148" font-size="13" fill="#5c6772">0x08002000</text>
  <text x="647" y="148" font-size="13" fill="#5c6772" text-anchor="end">0x0800E000</text>
  <text x="736" y="148" font-size="13" fill="#5c6772" text-anchor="end">0x0800FFFF</text>

  <!-- 向量表 -->
  <text x="24" y="172" font-size="13" font-weight="700" fill="#1a4f8b">应用向量表（VTOR = 0x08002000）</text>
  <rect x="24" y="180" width="326" height="192" fill="#fbfcfd" stroke="#1a4f8b" stroke-width="1.3"/>

  <text x="32" y="202" font-size="13" fill="#5c6772">+0x00</text>
  <text x="100" y="202" font-size="13" fill="#222a32">0x20005000</text>
  <text x="232" y="202" font-size="13" fill="#2e7d4f">初始 MSP</text>

  <text x="32" y="232" font-size="13" fill="#5c6772">+0x04</text>
  <text x="100" y="232" font-size="13" fill="#222a32">0x080021C1</text>
  <text x="232" y="232" font-size="13" fill="#b5642e">Reset 入口</text>

  <text x="32" y="262" font-size="13" fill="#5c6772">+0x08</text>
  <text x="100" y="262" font-size="13" fill="#222a32">0x0800225B</text>
  <text x="232" y="262" font-size="13" fill="#222a32">NMI</text>

  <text x="32" y="292" font-size="13" fill="#5c6772">+0x0C</text>
  <text x="100" y="292" font-size="13" fill="#222a32">0x0800225B</text>
  <text x="232" y="292" font-size="13" fill="#222a32">HardFault</text>

  <text x="32" y="322" font-size="13" fill="#5c6772">+0x3C</text>
  <text x="100" y="322" font-size="13" fill="#222a32">0x0800225B</text>
  <text x="232" y="322" font-size="13" fill="#222a32">SysTick</text>

  <text x="32" y="352" font-size="13" fill="#5c6772">+0x40</text>
  <text x="100" y="352" font-size="13" fill="#222a32">0x0800225B</text>
  <text x="232" y="352" font-size="13" fill="#222a32">IRQ0</text>

  <text x="24" y="396" font-size="13" fill="#222a32">59 项 × 4 B = 236 B，槽位 8 KB 足够</text>
  <text x="24" y="416" font-size="13" fill="#5c6772">偏移 0x2000 满足 VTOR 的 128 B 对齐</text>

  <!-- 启动流程 -->
  <rect x="392" y="168" width="318" height="32" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="402" y="189" font-size="13" fill="#222a32">复位：上电 / nRESET / 看门狗</text>

  <rect x="392" y="206" width="318" height="32" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="402" y="227" font-size="13" fill="#222a32">内核读 0x00000000 装入 MSP</text>

  <rect x="392" y="244" width="318" height="32" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.4"/>
  <text x="402" y="265" font-size="13" fill="#222a32">读 0x00000004 装入 PC，bit0 必须为 1</text>

  <rect x="392" y="282" width="318" height="32" rx="3" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="402" y="303" font-size="13" fill="#1a4f8b">Reset_Handler：SystemInit 配到 72 MHz</text>

  <rect x="392" y="320" width="318" height="32" rx="3" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="402" y="341" font-size="13" fill="#1a4f8b">拷贝 .data：LMA Flash → VMA RAM</text>

  <rect x="392" y="358" width="318" height="32" rx="3" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.4"/>
  <text x="402" y="379" font-size="13" fill="#1a4f8b">清零 .bss，跑 __libc_init_array</text>

  <rect x="392" y="396" width="318" height="32" rx="3" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="402" y="417" font-size="13" fill="#2e7d4f">main()：返回后进入死循环</text>

  <line x1="551" y1="200" x2="551" y2="204" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <line x1="551" y1="238" x2="551" y2="242" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <line x1="551" y1="276" x2="551" y2="280" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <line x1="551" y1="314" x2="551" y2="318" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <line x1="551" y1="352" x2="551" y2="356" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
  <line x1="551" y1="390" x2="551" y2="394" stroke="#2b3a4a" stroke-width="2" marker-end="url(#sar)"/>
</svg>
