<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clkTitle clkDesc" font-family="'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
  <title id="clkTitle">STM32F4 时钟树与 168 MHz PLL 配置</title>
  <desc id="clkDesc">HSE 8 MHz 或 HSI 16 MHz 经 PLLM/PLLN/PLLP/PLLQ 产生 168 MHz SYSCLK、48 MHz USB 时钟，再经 AHB、APB1、APB2 分频得到各总线时钟，并标出 CSS 与定时器倍频关系。</desc>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b4c6f"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="20" fill="#102a43" font-weight="700">时钟树：从 8 MHz 晶振到 168 MHz 系统时钟</text>
  <text x="24" y="54" font-size="13" fill="#486581">先选源，再定 PLL，最后分配总线；所有频率都由同一组分频系数推出</text>

  <rect x="24" y="86" width="120" height="44" rx="6" fill="#e8f1ff" stroke="#3e7cb1" stroke-width="1.6"/>
  <text x="84" y="105" font-size="14" fill="#173f5f" text-anchor="middle" font-weight="700">HSE 8 MHz</text>
  <text x="84" y="122" font-size="13" fill="#486581" text-anchor="middle">外部晶振</text>

  <rect x="24" y="148" width="120" height="44" rx="6" fill="#e6f6f0" stroke="#2f855a" stroke-width="1.6"/>
  <text x="84" y="167" font-size="14" fill="#1f5c41" text-anchor="middle" font-weight="700">HSI 16 MHz</text>
  <text x="84" y="184" font-size="13" fill="#1f5c41" text-anchor="middle">内部 RC，复位默认</text>

  <rect x="176" y="100" width="96" height="64" rx="8" fill="#fff4e6" stroke="#b7791f" stroke-width="1.6"/>
  <text x="224" y="126" font-size="14" fill="#7b4b12" text-anchor="middle" font-weight="600">时钟源</text>
  <text x="224" y="145" font-size="14" fill="#7b4b12" text-anchor="middle" font-weight="600">选择</text>

  <polyline points="144,108 160,108 160,132 176,132" fill="none" stroke="#2b4c6f" stroke-width="2"/>
  <polyline points="144,170 160,170 160,132 176,132" fill="none" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="272" y1="132" x2="300" y2="132" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="300" y="78" width="190" height="118" rx="8" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.6"/>
  <text x="314" y="98" font-size="15" fill="#44337a" font-weight="700">PLL</text>
  <text x="314" y="120" font-size="13" fill="#44337a">PLLM = 8  →  1 MHz</text>
  <text x="314" y="141" font-size="13" fill="#44337a">PLLN = 336 → 336 MHz</text>
  <text x="314" y="162" font-size="13" fill="#44337a">PLLP = 2  → 168 MHz</text>
  <text x="314" y="183" font-size="13" fill="#44337a">PLLQ = 7  → 48 MHz</text>

  <line x1="490" y1="110" x2="520" y2="108" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="88" width="120" height="40" rx="6" fill="#e8f1ff" stroke="#3e7cb1" stroke-width="1.6"/>
  <text x="580" y="105" font-size="13" fill="#173f5f" text-anchor="middle" font-weight="700">SYSCLK</text>
  <text x="580" y="121" font-size="13" fill="#173f5f" text-anchor="middle">168 MHz</text>

  <line x1="580" y1="128" x2="580" y2="148" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="148" width="120" height="36" rx="6" fill="#ffffff" stroke="#486581" stroke-width="1.5"/>
  <text x="580" y="171" font-size="14" fill="#243b53" text-anchor="middle">AHB / 1</text>
  <line x1="640" y1="166" x2="660" y2="166" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="148" width="76" height="36" rx="6" fill="#e8f1ff" stroke="#3e7cb1" stroke-width="1.5"/>
  <text x="698" y="165" font-size="13" fill="#173f5f" text-anchor="middle" font-weight="700">HCLK</text>
  <text x="698" y="179" font-size="13" fill="#173f5f" text-anchor="middle">168 MHz</text>

  <line x1="580" y1="184" x2="580" y2="204" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="204" width="120" height="36" rx="6" fill="#ffffff" stroke="#486581" stroke-width="1.5"/>
  <text x="580" y="227" font-size="14" fill="#243b53" text-anchor="middle">APB1 / 4</text>
  <line x1="640" y1="222" x2="660" y2="222" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="204" width="76" height="36" rx="6" fill="#e6f6f0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="698" y="221" font-size="13" fill="#1f5c41" text-anchor="middle" font-weight="700">PCLK1</text>
  <text x="698" y="235" font-size="13" fill="#1f5c41" text-anchor="middle">42 MHz</text>

  <line x1="580" y1="240" x2="580" y2="260" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="260" width="120" height="36" rx="6" fill="#ffffff" stroke="#486581" stroke-width="1.5"/>
  <text x="580" y="283" font-size="14" fill="#243b53" text-anchor="middle">APB2 / 2</text>
  <line x1="640" y1="278" x2="660" y2="278" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="260" width="76" height="36" rx="6" fill="#e6f6f0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="698" y="277" font-size="13" fill="#1f5c41" text-anchor="middle" font-weight="700">PCLK2</text>
  <text x="698" y="291" font-size="13" fill="#1f5c41" text-anchor="middle">84 MHz</text>

  <line x1="490" y1="176" x2="500" y2="176" stroke="#6b46c1" stroke-width="2"/>
  <line x1="500" y1="176" x2="500" y2="334" stroke="#6b46c1" stroke-width="2"/>
  <line x1="500" y1="334" x2="520" y2="334" stroke="#6b46c1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="316" width="120" height="36" rx="6" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="580" y="339" font-size="14" fill="#44337a" text-anchor="middle">PLLQ / 7</text>
  <line x1="640" y1="334" x2="660" y2="334" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="660" y="316" width="76" height="36" rx="6" fill="#f3e8ff" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="698" y="333" font-size="13" fill="#44337a" text-anchor="middle" font-weight="700">USB</text>
  <text x="698" y="347" font-size="13" fill="#44337a" text-anchor="middle">48 MHz</text>

  <rect x="24" y="214" width="250" height="86" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/>
  <text x="36" y="235" font-size="14" fill="#822727" font-weight="700">CSS：只监视 HSE</text>
  <text x="36" y="255" font-size="13" fill="#822727">HSE 失效 → 切到 HSI、关闭 PLL</text>
  <text x="36" y="274" font-size="13" fill="#822727">并触发 NMI；HSI 自身不受监视</text>
  <text x="36" y="292" font-size="13" fill="#822727">NMI 中必须重配时钟与外设</text>

  <text x="24" y="386" font-size="13" fill="#486581">APB 预分频不为 1 时，定时器时钟 = 2 × PCLK：APB1 定时器 84 MHz，APB2 定时器 168 MHz。</text>
  <text x="24" y="410" font-size="13" fill="#486581">验证方法：把 SYSCLK 或 PLL 输出分频到 MCO 引脚，用示波器或频率计测量。</text>
  <text x="24" y="430" font-size="13" fill="#486581">约束：PLL 输入 1–2 MHz，VCO 192–432 MHz，SYSCLK ≤ 168 MHz，APB1 ≤ 42 MHz，APB2 ≤ 84 MHz。</text>
</svg>
