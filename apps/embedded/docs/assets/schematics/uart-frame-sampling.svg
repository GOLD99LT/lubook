<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">UART 8N1 帧格式：起始沿对齐与 16 倍过采样</text>
  <text x="20" y="54" font-size="13" fill="#4a5568">8 MHz、115200 Bd：BRR = 0x45（69），USARTDIV = 4.3125，实际 115942 Bd，误差 +0.644%</text>
  <line x1="20" y1="64" x2="740" y2="64" stroke="#e2e8f0"/>

  <text x="84" y="137" font-size="13" fill="#2d3748" text-anchor="end">TXD</text>
  <line x1="110" y1="100" x2="110" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="170" y1="100" x2="170" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="230" y1="100" x2="230" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="290" y1="100" x2="290" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="350" y1="100" x2="350" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="410" y1="100" x2="410" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="470" y1="100" x2="470" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="530" y1="100" x2="530" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="590" y1="100" x2="590" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>
  <line x1="650" y1="100" x2="650" y2="166" stroke="#dbe4ee" stroke-dasharray="3 3"/>

  <polyline points="90,112 110,112 110,152 170,152 170,112 230,112 230,152 290,152 290,112 350,112 350,152 410,152 410,112 470,112 470,152 530,152 530,112 590,112 590,152 650,152 650,112 730,112" fill="none" stroke="#2b6cb0" stroke-width="2.2"/>

  <text x="140" y="184" font-size="13" fill="#2d3748" text-anchor="middle">起始 0</text>
  <text x="200" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d0 = 1</text>
  <text x="260" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d1 = 0</text>
  <text x="320" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d2 = 1</text>
  <text x="380" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d3 = 0</text>
  <text x="440" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d4 = 1</text>
  <text x="500" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d5 = 0</text>
  <text x="560" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d6 = 1</text>
  <text x="620" y="184" font-size="13" fill="#2d3748" text-anchor="middle">d7 = 0</text>
  <text x="680" y="184" font-size="13" fill="#2d3748" text-anchor="middle">停止 1</text>

  <circle cx="140" cy="152" r="3.2" fill="#c53030"/>
  <circle cx="200" cy="112" r="3.2" fill="#c53030"/>
  <circle cx="260" cy="152" r="3.2" fill="#c53030"/>
  <circle cx="320" cy="112" r="3.2" fill="#c53030"/>
  <circle cx="380" cy="152" r="3.2" fill="#c53030"/>
  <circle cx="440" cy="112" r="3.2" fill="#c53030"/>
  <circle cx="500" cy="152" r="3.2" fill="#c53030"/>
  <circle cx="560" cy="112" r="3.2" fill="#c53030"/>
  <circle cx="620" cy="152" r="3.2" fill="#c53030"/>
  <circle cx="680" cy="112" r="3.2" fill="#c53030"/>

  <text x="20" y="206" font-size="13" fill="#4a5568">红点为判决采样点：接收器从起始沿起每 16 个时钟采样一次，采样点落在每位中点（数据低位先发）</text>

  <text x="20" y="234" font-size="13" font-weight="700" fill="#2d3748">单比特放大：16 个采样时钟与三取二判决</text>
  <line x1="90" y1="252" x2="90" y2="300" stroke="#edf2f7"/>
  <line x1="110" y1="252" x2="110" y2="300" stroke="#edf2f7"/>
  <line x1="130" y1="252" x2="130" y2="300" stroke="#edf2f7"/>
  <line x1="150" y1="252" x2="150" y2="300" stroke="#edf2f7"/>
  <line x1="170" y1="252" x2="170" y2="300" stroke="#edf2f7"/>
  <line x1="190" y1="252" x2="190" y2="300" stroke="#edf2f7"/>
  <line x1="210" y1="252" x2="210" y2="300" stroke="#edf2f7"/>
  <line x1="230" y1="252" x2="230" y2="300" stroke="#f6adad" stroke-dasharray="3 2"/>
  <line x1="250" y1="252" x2="250" y2="300" stroke="#f6adad" stroke-dasharray="3 2"/>
  <line x1="270" y1="252" x2="270" y2="300" stroke="#f6adad" stroke-dasharray="3 2"/>
  <line x1="290" y1="252" x2="290" y2="300" stroke="#edf2f7"/>
  <line x1="310" y1="252" x2="310" y2="300" stroke="#edf2f7"/>
  <line x1="330" y1="252" x2="330" y2="300" stroke="#edf2f7"/>
  <line x1="350" y1="252" x2="350" y2="300" stroke="#edf2f7"/>
  <line x1="370" y1="252" x2="370" y2="300" stroke="#edf2f7"/>
  <line x1="390" y1="252" x2="390" y2="300" stroke="#edf2f7"/>
  <line x1="410" y1="252" x2="410" y2="300" stroke="#edf2f7"/>
  <polyline points="70,292 90,292 90,258 410,258 410,292 430,292" fill="none" stroke="#2b6cb0" stroke-width="2.2"/>
  <circle cx="230" cy="258" r="3.4" fill="#c53030"/>
  <circle cx="250" cy="258" r="3.4" fill="#c53030"/>
  <circle cx="270" cy="258" r="3.4" fill="#c53030"/>
  <text x="90" y="316" font-size="13" fill="#718096" text-anchor="middle">0</text>
  <text x="250" y="316" font-size="13" fill="#c53030" text-anchor="middle">8（位中点）</text>
  <text x="410" y="316" font-size="13" fill="#718096" text-anchor="middle">16</text>
  <text x="90" y="338" font-size="13" fill="#4a5568">第 8 个采样时钟落在位中点，前后各取一次共 3 次</text>

  <text x="450" y="258" font-size="13" fill="#2d3748">16 倍过采样：每位 16 个采样时钟</text>
  <text x="450" y="282" font-size="13" fill="#2d3748">115200 Bd：1 位 8.68 µs，1 时钟 0.543 µs</text>
  <text x="450" y="306" font-size="13" fill="#2d3748">起始沿清零计数器，误差不跨帧累积</text>
  <text x="450" y="330" font-size="13" fill="#2d3748">判决取 8/9/10 三点，三取二</text>

  <text x="20" y="356" font-size="13" fill="#4a5568">帧开销 2/10 = 20%：8N1、115200 Bd 的净吞吐 11520 B/s，每帧 86.8 µs</text>
  <text x="20" y="379" font-size="13" fill="#4a5568">停止位采到 0 置帧错误 FE；上一字节未读走而新字节收完置溢出 ORE</text>
  <text x="20" y="402" font-size="13" fill="#4a5568">误差 +0.644% 到停止位只累积 0.061 位，判决余量 0.375 位还剩 84%</text>
  <text x="20" y="425" font-size="13" fill="#4a5568">半双工时 DE 必须等 TC（最后一位移出）后再释放，否则末字节被截断</text>
  </g>
</svg>
