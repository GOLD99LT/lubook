<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">定时器计数、比较与 PWM 波形（72 MHz，20 kHz）</text>
  <text x="20" y="54" font-size="13" fill="#4a5568">T = (PSC+1)(ARR+1)/f_CK = 3600/72 MHz = 50 µs；D = CCR/(ARR+1) = 1800/3600 = 50%</text>
  <line x1="20" y1="64" x2="740" y2="64" stroke="#e2e8f0"/>

  <text x="300" y="96" font-size="13" fill="#2d3748">PWM1 模式：计数值小于 CCR 时输出高电平</text>

  <line x1="90" y1="112" x2="720" y2="112" stroke="#e2e8f0" stroke-dasharray="3 3"/>
  <line x1="90" y1="258" x2="720" y2="258" stroke="#e2e8f0"/>
  <line x1="405" y1="104" x2="405" y2="334" stroke="#cbd5e0" stroke-dasharray="4 3"/>
  <line x1="720" y1="104" x2="720" y2="334" stroke="#cbd5e0" stroke-dasharray="4 3"/>

  <text x="84" y="108" font-size="13" fill="#2d3748" text-anchor="end">ARR</text>
  <text x="84" y="262" font-size="13" fill="#2d3748" text-anchor="end">0</text>
  <text x="84" y="186" font-size="13" fill="#c53030" text-anchor="end">CCR</text>

  <polyline points="90,258 405,112 405,258 720,112" fill="none" stroke="#2b6cb0" stroke-width="2.2"/>
  <line x1="90" y1="185" x2="720" y2="185" stroke="#c53030" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="716" y="179" font-size="13" fill="#c53030" text-anchor="end">CCR = 1800（50%）</text>

  <polyline points="90,322 90,288 247,288 247,322 405,322 405,288 562,288 562,322 720,322" fill="none" stroke="#2f855a" stroke-width="2.2"/>
  <text x="84" y="296" font-size="13" fill="#2d3748" text-anchor="end">高</text>
  <text x="84" y="330" font-size="13" fill="#2d3748" text-anchor="end">低</text>
  <text x="168" y="282" font-size="13" fill="#22543d" text-anchor="middle">高 25 µs</text>
  <text x="326" y="316" font-size="13" fill="#22543d" text-anchor="middle">低 25 µs</text>

  <line x1="90" y1="334" x2="730" y2="334" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="90" y1="330" x2="90" y2="338" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="405" y1="330" x2="405" y2="338" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="720" y1="330" x2="720" y2="338" stroke="#4a5568" stroke-width="1.4"/>
  <text x="90" y="352" font-size="13" fill="#2d3748" text-anchor="middle">0</text>
  <text x="405" y="352" font-size="13" fill="#2d3748" text-anchor="middle">T = 50 µs</text>
  <text x="720" y="352" font-size="13" fill="#2d3748" text-anchor="middle">2T = 100 µs</text>

  <rect x="14" y="366" width="132" height="38" rx="4" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="80" y="390" font-size="13" fill="#2d3748" text-anchor="middle">时钟 72 MHz</text>
  <polygon points="146,385 164,385 158,380 164,385 158,390" fill="#4a5568"/>
  <line x1="146" y1="385" x2="162" y2="385" stroke="#4a5568" stroke-width="1.6"/>

  <rect x="164" y="366" width="132" height="38" rx="4" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="230" y="390" font-size="13" fill="#2d3748" text-anchor="middle">预分频 PSC+1</text>
  <polygon points="296,385 314,385 308,380 314,385 308,390" fill="#4a5568"/>
  <line x1="296" y1="385" x2="312" y2="385" stroke="#4a5568" stroke-width="1.6"/>

  <rect x="314" y="366" width="132" height="38" rx="4" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="380" y="390" font-size="13" fill="#2d3748" text-anchor="middle">计数 CNT 0~ARR</text>
  <polygon points="446,385 464,385 458,380 464,385 458,390" fill="#4a5568"/>
  <line x1="446" y1="385" x2="462" y2="385" stroke="#4a5568" stroke-width="1.6"/>

  <rect x="464" y="366" width="132" height="38" rx="4" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="530" y="390" font-size="13" fill="#2d3748" text-anchor="middle">比较 CCR</text>
  <polygon points="596,385 614,385 608,380 614,385 608,390" fill="#4a5568"/>
  <line x1="596" y1="385" x2="612" y2="385" stroke="#4a5568" stroke-width="1.6"/>

  <rect x="614" y="366" width="132" height="38" rx="4" fill="#e8f5ec" stroke="#2f855a" stroke-width="1.5"/>
  <text x="680" y="390" font-size="13" fill="#22543d" text-anchor="middle">PWM 输出</text>

  <text x="20" y="428" font-size="13" fill="#4a5568">N_total = (PSC+1)(ARR+1) = 1 × 3600 = 3600；总计数由频率决定，PSC 越小 ARR 越大，分辨率越高</text>
</svg>
