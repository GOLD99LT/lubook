<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img">
  <title>Cortex-M 内存映射、SRAM 内部布局与位带别名计算：0x4001080C 的 bit5 映射到 0x42210194</title>
  <defs>
    <marker id="mar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2b3a4a"/>
    </marker>
    <marker id="mgr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d4f"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="700" fill="#222a32">内存映射、SRAM 布局与位带别名</text>
  <text x="24" y="50" font-size="13" fill="#5c6772">地址自上而下递减；SRAM 与位带示意非按比例，数字可按下文公式复算</text>
  <line x1="24" y1="62" x2="736" y2="62" stroke="#e3e0d7"/>

  <!-- 左：4GB 映射 -->
  <text x="24" y="86" font-size="14" font-weight="700" fill="#222a32">4 GB 地址空间</text>

  <rect x="24" y="96" width="210" height="64" rx="3" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.6"/>
  <text x="34" y="118" font-size="13" fill="#7a5fc0">0xE0000000 · PPB 1 MB</text>
  <text x="34" y="136" font-size="13" fill="#222a32">NVIC / SCB / SysTick</text>
  <text x="34" y="152" font-size="13" fill="#5c6772">VTOR 在 0xE000ED08</text>

  <rect x="24" y="168" width="210" height="64" rx="3" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.6"/>
  <text x="34" y="190" font-size="13" fill="#b5642e">0x40000000 · 外设 512 MB</text>
  <text x="34" y="208" font-size="13" fill="#222a32">GPIO / USART / DMA</text>
  <text x="34" y="224" font-size="13" fill="#5c6772">可位带：0x40000000 起</text>

  <rect x="24" y="240" width="210" height="64" rx="3" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.6"/>
  <text x="34" y="262" font-size="13" fill="#1a4f8b">0x20000000 · SRAM 512 MB</text>
  <text x="34" y="280" font-size="13" fill="#222a32">栈 / 堆 / .data / .bss</text>
  <text x="34" y="296" font-size="13" fill="#5c6772">本机 20 KB：0x20000000 起</text>

  <rect x="24" y="312" width="210" height="64" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.6"/>
  <text x="34" y="334" font-size="13" fill="#222a32">0x00000000 · 代码区 512 MB</text>
  <text x="34" y="352" font-size="13" fill="#222a32">启动别名：Flash 或 ROM</text>
  <text x="34" y="368" font-size="13" fill="#5c6772">复位读 MSP 与 PC</text>

  <text x="24" y="398" font-size="13" fill="#5c6772">外设区按固定窗口分给各外设，</text>
  <text x="24" y="416" font-size="13" fill="#5c6772">越界访问落到保留区会触发 BusFault。</text>

  <!-- 中：SRAM 布局 -->
  <text x="260" y="86" font-size="14" font-weight="700" fill="#1a4f8b">SRAM 20 KB 内部布局</text>
  <rect x="260" y="96" width="190" height="200" rx="3" fill="#fbfcfd" stroke="#1a4f8b" stroke-width="1.4"/>

  <rect x="260" y="96" width="190" height="36" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.2"/>
  <text x="268" y="112" font-size="13" fill="#2e7d4f">栈（满递减）</text>
  <text x="268" y="128" font-size="13" fill="#5c6772">0x20005000 起向下</text>

  <rect x="260" y="138" width="190" height="36" fill="#fdf6ef" stroke="#b5642e" stroke-width="1.2"/>
  <text x="268" y="154" font-size="13" fill="#b5642e">堆（向上增长）</text>
  <text x="268" y="170" font-size="13" fill="#5c6772">malloc / _sbrk</text>

  <rect x="260" y="180" width="190" height="36" fill="#eef3fa" stroke="#1a4f8b" stroke-width="1.2"/>
  <text x="268" y="196" font-size="13" fill="#1a4f8b">.bss（启动清零）</text>
  <text x="268" y="212" font-size="13" fill="#5c6772">未初始化全局变量</text>

  <rect x="260" y="222" width="190" height="36" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.2"/>
  <text x="268" y="238" font-size="13" fill="#7a5fc0">.data（启动拷贝）</text>
  <text x="268" y="254" font-size="13" fill="#5c6772">初值 Flash，运行 RAM</text>

  <rect x="260" y="264" width="190" height="32" fill="#f7f9fb" stroke="#b9c3cd" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="268" y="285" font-size="13" fill="#5c6772">空闲 → 0x20000000</text>

  <!-- 栈/堆增长箭头 -->
  <line x1="454" y1="112" x2="454" y2="132" stroke="#2e7d4f" stroke-width="2" marker-end="url(#mgr)"/>
  <line x1="454" y1="168" x2="454" y2="148" stroke="#b5642e" stroke-width="2"/>
  <line x1="452" y1="152" x2="454" y2="148" stroke="#b5642e" stroke-width="2"/>
  <line x1="456" y1="152" x2="454" y2="148" stroke="#b5642e" stroke-width="2"/>

  <!-- 右：位带 -->
  <text x="480" y="86" font-size="14" font-weight="700" fill="#7a5fc0">位带别名（仅 Cortex-M3/M4）</text>
  <rect x="480" y="96" width="256" height="52" rx="3" fill="#f3effa" stroke="#7a5fc0" stroke-width="1.6"/>
  <text x="490" y="118" font-size="13" fill="#222a32">外设字 0x4001080C（GPIOA ODR）</text>
  <text x="490" y="138" font-size="13" fill="#7a5fc0">目标 bit5：读改写需 3 条指令</text>

  <line x1="608" y1="148" x2="608" y2="168" stroke="#7a5fc0" stroke-width="2" marker-end="url(#mar)"/>

  <text x="480" y="190" font-size="13" fill="#222a32">别名=0x42000000+偏移×32+位×4</text>
  <text x="480" y="212" font-size="13" fill="#5c6772">偏移=0x1080C，左移5位=0x210180</text>
  <text x="480" y="234" font-size="13" fill="#5c6772">bit5 × 4 = 20 = 0x14 → 0x210194</text>
  <text x="480" y="256" font-size="13" fill="#2e7d4f">结果 = 0x42210194，一次写即原子置位</text>

  <rect x="480" y="266" width="256" height="40" rx="3" fill="#e8f3ec" stroke="#2e7d4f" stroke-width="1.6"/>
  <text x="490" y="282" font-size="13" fill="#2e7d4f">*(volatile uint32_t*)0x42210194</text>
  <text x="490" y="299" font-size="13" fill="#2e7d4f">= 1;  原子置位 bit5</text>

  <text x="480" y="328" font-size="13" fill="#b5642e">M0/M0+/M7 没有位带，</text>
  <text x="480" y="348" font-size="13" fill="#b5642e">改用 BSRR 或 LDREX/STREX。</text>

  <!-- 底部：Flash 段 -->
  <rect x="260" y="316" width="190" height="40" rx="3" fill="#f7f9fb" stroke="#2b3a4a" stroke-width="1.3"/>
  <text x="268" y="334" font-size="13" fill="#222a32">Flash：向量表 + .text</text>
  <text x="268" y="350" font-size="13" fill="#5c6772">+ .rodata + .data 的 LMA</text>
  <text x="260" y="374" font-size="13" fill="#5c6772">.data 的 VMA 在 0x20000000，</text>
  <text x="260" y="392" font-size="13" fill="#5c6772">启动时从 LMA 拷到 VMA。</text>
  <text x="260" y="416" font-size="13" fill="#2e7d4f">.bss 不占 Flash，只在 RAM 里清零。</text>
</svg>
