<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gpioTitle gpioDesc" font-family="'Segoe UI','Noto Sans SC','Microsoft YaHei',sans-serif">
  <title id="gpioTitle">GPIO 推挽与开漏输出级及输入通路</title>
  <desc id="gpioDesc">左侧为 MODER、OTYPER、OSPEEDR、PUPDR、ODR/BSRR、IDR/AFR 寄存器；中间为 PMOS 上管与 NMOS 下管组成的输出级；右侧为外部负载、上拉下拉和施密特输入通路。</desc>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2b4c6f"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="20" fill="#102a43" font-weight="700">GPIO 单元：寄存器、输出级与输入通路</text>
  <text x="24" y="54" font-size="13" fill="#486581">同一根引脚，输出是两只 MOS 的互补开关，输入是施密特触发器加采样</text>

  <rect x="24" y="72" width="210" height="336" rx="10" fill="#f8fafc" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="36" y="94" font-size="15" fill="#243b53" font-weight="600">寄存器与复用</text>

  <rect x="36" y="104" width="186" height="38" rx="5" fill="#e8f1ff" stroke="#3e7cb1"/>
  <text x="46" y="120" font-size="14" fill="#173f5f" font-weight="700">MODER</text>
  <text x="46" y="136" font-size="13" fill="#173f5f">输入 · 输出 · 复用 · 模拟</text>

  <rect x="36" y="150" width="186" height="38" rx="5" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="46" y="166" font-size="14" fill="#243b53" font-weight="700">OTYPER</text>
  <text x="46" y="182" font-size="13" fill="#486581">推挽 · 开漏</text>

  <rect x="36" y="196" width="186" height="38" rx="5" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="46" y="212" font-size="14" fill="#243b53" font-weight="700">OSPEEDR</text>
  <text x="46" y="228" font-size="13" fill="#486581">低 / 中 / 高 / 超高</text>

  <rect x="36" y="242" width="186" height="38" rx="5" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="46" y="258" font-size="14" fill="#243b53" font-weight="700">PUPDR</text>
  <text x="46" y="274" font-size="13" fill="#486581">上拉 / 下拉 / 浮空</text>

  <rect x="36" y="288" width="186" height="38" rx="5" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="46" y="304" font-size="14" fill="#243b53" font-weight="700">ODR / BSRR</text>
  <text x="46" y="320" font-size="13" fill="#486581">输出数据 / 原子置位</text>

  <rect x="36" y="334" width="186" height="38" rx="5" fill="#fff4e6" stroke="#b7791f"/>
  <text x="46" y="350" font-size="14" fill="#7b4b12" font-weight="700">IDR / AFR</text>
  <text x="46" y="366" font-size="13" fill="#7b4b12">回读 / 复用功能编号</text>
  <text x="36" y="392" font-size="13" fill="#486581">复用输出仍经过同一对 MOS 管</text>

  <line x1="270" y1="82" x2="520" y2="82" stroke="#2b4c6f" stroke-width="2"/>
  <text x="270" y="72" font-size="14" fill="#243b53" font-weight="600">VDD = 3.3 V</text>

  <rect x="330" y="92" width="90" height="38" rx="5" fill="#e8f1ff" stroke="#3e7cb1" stroke-width="1.5"/>
  <text x="375" y="116" font-size="14" fill="#173f5f" text-anchor="middle" font-weight="700">PMOS 上管</text>
  <line x1="375" y1="82" x2="375" y2="92" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="420" y1="111" x2="480" y2="111" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="480" y1="111" x2="480" y2="251" stroke="#2b4c6f" stroke-width="2"/>

  <rect x="330" y="232" width="90" height="38" rx="5" fill="#e6f6f0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="375" y="256" font-size="14" fill="#1f5c41" text-anchor="middle" font-weight="700">NMOS 下管</text>
  <line x1="480" y1="251" x2="420" y2="251" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="375" y1="270" x2="375" y2="298" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="355" y1="298" x2="395" y2="298" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="361" y1="305" x2="389" y2="305" stroke="#2b4c6f" stroke-width="2"/>
  <line x1="367" y1="312" x2="383" y2="312" stroke="#2b4c6f" stroke-width="2"/>
  <text x="401" y="306" font-size="13" fill="#486581">VSS</text>

  <line x1="234" y1="307" x2="300" y2="307" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="298" font-size="13" fill="#7b4b12">使能 / 数据</text>
  <line x1="300" y1="307" x2="300" y2="251" stroke="#b7791f" stroke-width="2"/>
  <line x1="300" y1="251" x2="330" y2="251" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="251" x2="300" y2="111" stroke="#b7791f" stroke-width="2"/>
  <line x1="300" y1="111" x2="330" y2="111" stroke="#b7791f" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="480" y1="170" x2="550" y2="170" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="488" y="150" font-size="15" fill="#243b53" font-weight="700">PAx</text>
  <text x="486" y="196" font-size="13" fill="#486581">PU / PD 可选</text>
  <text x="430" y="103" font-size="13" fill="#3e7cb1">拉电流</text>
  <text x="430" y="286" font-size="13" fill="#2f855a">灌电流</text>

  <polyline points="550,170 648,170 648,158" fill="none" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="88" width="176" height="70" rx="6" fill="#fffdf7" stroke="#d9b382" stroke-width="1.5"/>
  <text x="572" y="108" font-size="14" fill="#5c3d0e" font-weight="700">外部负载</text>
  <text x="572" y="128" font-size="13" fill="#5c3d0e">LED + 限流电阻</text>
  <text x="572" y="146" font-size="13" fill="#5c3d0e">输出高：拉电流到负载</text>

  <polyline points="550,170 550,296 572,296" fill="none" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="246" width="176" height="134" rx="6" fill="#f8fafc" stroke="#bcccdc" stroke-width="1.5"/>
  <text x="572" y="266" font-size="14" fill="#243b53" font-weight="700">输入通路（数字）</text>
  <rect x="572" y="278" width="152" height="32" rx="4" fill="#ffffff" stroke="#9fb3c8"/>
  <text x="648" y="299" font-size="13" fill="#243b53" text-anchor="middle">施密特触发器</text>
  <line x1="648" y1="310" x2="648" y2="324" stroke="#2b4c6f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="572" y="324" width="152" height="30" rx="4" fill="#fff4e6" stroke="#b7791f"/>
  <text x="648" y="344" font-size="13" fill="#7b4b12" text-anchor="middle">IDR / 边沿检测</text>
  <text x="572" y="370" font-size="13" fill="#486581">PUPDR 决定默认电平</text>

  <text x="270" y="340" font-size="13" fill="#486581">推挽 / 开漏由 OTYPER 选择</text>
  <text x="270" y="358" font-size="13" fill="#486581">OSPEEDR 只调边沿斜率</text>
  <text x="270" y="376" font-size="13" fill="#486581">AF 与 GPIO 共用输出级</text>
  <text x="24" y="427" font-size="13" fill="#486581">开漏高电平靠外部上拉；推挽两管互补，低阻驱动；输出电流必须查目标型号的绝对最大额定值。</text>
</svg>
