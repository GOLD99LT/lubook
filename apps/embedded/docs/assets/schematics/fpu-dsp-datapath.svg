<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>FPU 流水线、Q15 位域与 256 抽头 FIR 的周期账</title>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">FPU 流水线、Q15 位域与 256 抽头 FIR 的周期账</text>
  <text x="20" y="52" font-size="13" fill="#4a5568">Cortex-M4F @168 MHz：VFMA 延迟 3 周期、吞吐 1 周期；SMLAD 一次算两个抽头</text>
  <line x1="20" y1="62" x2="740" y2="62" stroke="#e2e8f0"/>

  <text x="20" y="88" font-size="15" font-weight="700" fill="#1a202c">乘加通路：取指 → 装载 → 乘加 → 写回</text>
  <rect x="20" y="98" width="80" height="34" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="60" y="120" font-size="13" fill="#1a365d" text-anchor="middle">取指</text>
  <rect x="108" y="98" width="80" height="34" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="148" y="120" font-size="13" fill="#1a365d" text-anchor="middle">装载 S2,S3</text>
  <rect x="196" y="98" width="80" height="34" rx="3" fill="#fde7c7" stroke="#c05621" stroke-width="1.5"/>
  <text x="236" y="120" font-size="13" fill="#7b341e" text-anchor="middle">VFMA</text>
  <rect x="284" y="98" width="80" height="34" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="324" y="120" font-size="13" fill="#22543d" text-anchor="middle">写回 S0</text>
  <line x1="100" y1="115" x2="104" y2="115" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="108,115 101,111 101,119" fill="#4a5568"/>
  <line x1="188" y1="115" x2="192" y2="115" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="196,115 189,111 189,119" fill="#4a5568"/>
  <line x1="276" y1="115" x2="280" y2="115" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="284,115 277,111 277,119" fill="#4a5568"/>
  <text x="60" y="150" font-size="13" fill="#4a5568" text-anchor="middle">1</text>
  <text x="148" y="150" font-size="13" fill="#4a5568" text-anchor="middle">1</text>
  <text x="236" y="150" font-size="13" fill="#c05621" text-anchor="middle">3</text>
  <text x="324" y="150" font-size="13" fill="#4a5568" text-anchor="middle">1</text>
  <text x="20" y="176" font-size="13" fill="#4a5568">依赖前一次结果时，乘加要等满 3 个周期</text>
  <text x="20" y="198" font-size="13" fill="#4a5568">四条独立累加链交替发射，可把延迟填满</text>

  <text x="20" y="233" font-size="13" fill="#2d3748">单累加器</text>
  <rect x="120" y="216" width="182" height="22" rx="2" fill="#fde7c7" stroke="#c05621" stroke-width="1.4"/>
  <text x="293" y="233" font-size="13" fill="#7b341e" text-anchor="end">192 周期</text>
  <text x="20" y="269" font-size="13" fill="#2d3748">四累加器</text>
  <rect x="120" y="252" width="87" height="22" rx="2" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.4"/>
  <text x="212" y="269" font-size="13" fill="#22543d">67 周期</text>
  <text x="20" y="292" font-size="13" fill="#4a5568">同为 64 抽头点积，只改累加器数：2.87 倍</text>

  <text x="400" y="88" font-size="15" font-weight="700" fill="#1a202c">Q15 位域与双 MAC</text>
  <rect x="400" y="98" width="20" height="26" fill="#fde7c7" stroke="#c05621"/>
  <rect x="420" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="440" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="460" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="480" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="500" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="520" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="540" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="560" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="580" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="600" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="620" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="640" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="660" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="680" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="700" y="98" width="20" height="26" fill="#dbe9f6" stroke="#2b6cb0"/>
  <text x="410" y="142" font-size="13" fill="#9c4221" text-anchor="middle">1 位符号</text>
  <text x="470" y="142" font-size="13" fill="#1a365d">15 位小数（2^-1 到 2^-15）</text>
  <text x="400" y="166" font-size="13" fill="#4a5568">分辨率 2^-15 = 3.05e-5，满量程 0.99997</text>

  <rect x="400" y="186" width="320" height="24" fill="#dbe9f6" stroke="#2b6cb0"/>
  <rect x="400" y="186" width="20" height="24" fill="#fde7c7" stroke="#c05621"/>
  <text x="400" y="230" font-size="13" fill="#4a5568">Q31：1 位符号 + 31 位小数，分辨率 4.66e-10</text>

  <rect x="400" y="246" width="320" height="26" rx="2" fill="#f7fafc" stroke="#4a5568" stroke-width="1.3"/>
  <text x="410" y="264" font-size="13" fill="#2d3748">R1 = 样本 n ｜ 样本 n+1（打包 2 个 16 位）</text>
  <rect x="400" y="278" width="320" height="26" rx="2" fill="#f7fafc" stroke="#4a5568" stroke-width="1.3"/>
  <text x="410" y="296" font-size="13" fill="#2d3748">R2 = 系数 h(n) ｜ h(n+1)</text>
  <text x="400" y="326" font-size="13" fill="#4a5568">SMLAD → 两次 16×16 乘加，32 位累加</text>

  <text x="20" y="344" font-size="15" font-weight="700" fill="#1a202c">256 抽头 FIR：每样本周期与时间</text>
  <text x="20" y="370" font-size="13" fill="#2d3748">float32</text>
  <rect x="120" y="354" width="509" height="22" rx="2" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="621" y="370" font-size="13" fill="#1a365d" text-anchor="end">768 周期 / 4.57 µs</text>
  <text x="20" y="400" font-size="13" fill="#2d3748">Q15 双 MAC</text>
  <rect x="120" y="384" width="265" height="22" rx="2" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.4"/>
  <text x="377" y="400" font-size="13" fill="#22543d" text-anchor="end">400 周期 / 2.38 µs</text>
  <text x="20" y="430" font-size="13" fill="#2d3748">Q31</text>
  <rect x="120" y="414" width="520" height="22" rx="2" fill="#edf2f7" stroke="#4a5568" stroke-width="1.4"/>
  <text x="632" y="430" font-size="13" fill="#2d3748" text-anchor="end">784 周期 / 4.67 µs</text>
  </g>
</svg>
