<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">SPI 四种模式：CPOL 定空闲电平，CPHA 定采样沿</text>
  <text x="20" y="54" font-size="13" fill="#4a5568">模式 0/3 在上升沿采样，模式 1/2 在下降沿采样；数据总在另一个沿更新，半个周期就是建立与保持的预算</text>
  <line x1="20" y1="64" x2="740" y2="64" stroke="#e2e8f0"/>

  <rect x="16" y="74" width="356" height="158" rx="4" fill="#f7fafc" stroke="#cbd5e0"/>
