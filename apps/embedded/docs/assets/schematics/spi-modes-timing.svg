  <text x="30" y="114" font-size="13" fill="#4a5568">空闲低；上升沿（第 1 沿）采样</text>
  <text x="30" y="142" font-size="13" fill="#2d3748">SCL</text>
  <polyline points="66,130 101,130 101,148 136,148 136,130 171,130 171,148 206,148 206,130 241,130 241,148 276,148 276,130 311,130 311,148 346,148 356,148" fill="none" stroke="#2b6cb0" stroke-width="2"/>
