  <text x="578" y="382" font-size="13" fill="#4a5568" text-anchor="middle">b6</text>
  <text x="648" y="382" font-size="13" fill="#4a5568" text-anchor="middle">b5</text>
  <text x="718" y="382" font-size="13" fill="#4a5568" text-anchor="middle">b4</text>

  <text x="20" y="424" font-size="13" fill="#4a5568">红点为采样点；数据在相反沿更新。错配现象：低速能通、提速失败，或整字节错一位</text>
