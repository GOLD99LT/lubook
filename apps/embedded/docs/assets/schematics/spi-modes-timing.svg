  <text x="402" y="280" font-size="13" fill="#4a5568">空闲高；上升沿（第 2 沿）采样</text>
  <text x="402" y="308" font-size="13" fill="#2d3748">SCL</text>
  <polyline points="438,296 473,296 473,314 508,314 508,296 543,296 543,314 578,314 578,296 613,296 613,314 648,314 648,296 683,296 683,314 718,314 728,314" fill="none" stroke="#2b6cb0" stroke-width="2"/>
