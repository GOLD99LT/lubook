<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <title>DMA 驱动的硬件加速流水线与 AES 预算占用</title>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">DMA 驱动的硬件加速流水线与 AES 预算占用</text>
  <text x="20" y="52" font-size="13" fill="#4a5568">生产者 → 搬运者 → 变换者 → 消费者；密钥只进加速器寄存器</text>
  <line x1="20" y1="62" x2="740" y2="62" stroke="#e2e8f0"/>

  <rect x="20" y="84" width="110" height="54" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="75" y="108" font-size="14" fill="#1a365d" text-anchor="middle">外设</text>
  <text x="75" y="128" font-size="13" fill="#2d3748" text-anchor="middle">ADC 2 MB/s</text>

  <rect x="155" y="84" width="120" height="54" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="215" y="108" font-size="14" fill="#22543d" text-anchor="middle">DMA 双缓冲</text>
  <text x="215" y="128" font-size="13" fill="#2d3748" text-anchor="middle">1 KB × 2 块</text>

  <rect x="300" y="70" width="200" height="92" rx="4" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/>
  <text x="312" y="88" font-size="13" fill="#4a5568">加速器</text>
  <rect x="308" y="94" width="184" height="26" rx="2" fill="#fde7c7" stroke="#c05621" stroke-width="1.3"/>
  <text x="400" y="112" font-size="13" fill="#7b341e" text-anchor="middle">AES-128 ｜ 39.5 MB/s</text>
  <rect x="308" y="122" width="184" height="26" rx="2" fill="#fde7c7" stroke="#c05621" stroke-width="1.3"/>
  <text x="400" y="140" font-size="13" fill="#7b341e" text-anchor="middle">CRC-32 ｜ 168 MB/s</text>

  <rect x="525" y="84" width="120" height="54" rx="3" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="585" y="108" font-size="14" fill="#2d3748" text-anchor="middle">存储 / 链路</text>
  <text x="585" y="128" font-size="13" fill="#4a5568" text-anchor="middle">Flash / 串口</text>

  <line x1="130" y1="111" x2="149" y2="111" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="155,111 146,106 146,116" fill="#4a5568"/>
  <line x1="275" y1="111" x2="294" y2="111" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="300,111 291,106 291,116" fill="#4a5568"/>
  <line x1="500" y1="111" x2="519" y2="111" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="525,111 516,106 516,116" fill="#4a5568"/>

  <rect x="20" y="190" width="120" height="50" rx="3" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="80" y="212" font-size="14" fill="#1a365d" text-anchor="middle">TRNG</text>
  <text x="80" y="230" font-size="13" fill="#2d3748" text-anchor="middle">40 周期/字</text>

  <rect x="165" y="190" width="130" height="50" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="230" y="212" font-size="14" fill="#2d3748" text-anchor="middle">健康测试</text>
  <text x="230" y="230" font-size="13" fill="#4a5568" text-anchor="middle">重复计数 / 比例</text>

  <rect x="320" y="190" width="130" height="50" rx="3" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
  <text x="385" y="212" font-size="14" fill="#22543d" text-anchor="middle">密钥寄存器</text>
  <text x="385" y="230" font-size="13" fill="#2d3748" text-anchor="middle">只写、不进 RAM</text>

  <rect x="475" y="190" width="120" height="50" rx="3" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
  <text x="535" y="212" font-size="14" fill="#2d3748" text-anchor="middle">OTP / PCROP</text>
  <text x="535" y="230" font-size="13" fill="#4a5568" text-anchor="middle">主密钥</text>

  <line x1="140" y1="215" x2="159" y2="215" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="165,215 156,210 156,220" fill="#4a5568"/>
  <line x1="295" y1="215" x2="314" y2="215" stroke="#4a5568" stroke-width="1.6"/>
  <polygon points="320,215 311,210 311,220" fill="#4a5568"/>
  <line x1="450" y1="215" x2="469" y2="215" stroke="#4a5568" stroke-width="1.6" stroke-dasharray="4 3"/>
  <polygon points="475,215 466,210 466,220" fill="#4a5568"/>
  <line x1="385" y1="190" x2="385" y2="168" stroke="#2f855a" stroke-width="1.8"/>
  <polygon points="385,162 380,171 390,171" fill="#2f855a"/>
  <text x="395" y="180" font-size="13" fill="#22543d">密钥直送</text>

  <text x="20" y="286" font-size="15" font-weight="700" fill="#1a202c">一块 1 KB、每 500 µs 到达：AES 占多少</text>
  <rect x="20" y="296" width="720" height="26" fill="#edf2f7" stroke="#cbd5e0"/>
  <rect x="20" y="296" width="36" height="26" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.4"/>
  <text x="65" y="314" font-size="13" fill="#22543d">硬件 25.3 µs（5.1%）</text>
  <rect x="20" y="334" width="720" height="26" fill="#edf2f7" stroke="#cbd5e0"/>
  <rect x="20" y="334" width="223" height="26" fill="#fde7c7" stroke="#c05621" stroke-width="1.4"/>
  <text x="256" y="352" font-size="13" fill="#7b341e">软件 154.8 µs（31.0%）</text>

  <text x="20" y="384" font-size="13" fill="#4a5568">CRC 1 MiB：硬件 6.24 ms ｜ 查表 18.72 ms ｜ 逐位 49.93 ms</text>
  <text x="20" y="406" font-size="13" fill="#4a5568">TRNG 1.2 M 字/s：128 位密钥 3.33 µs；CTR 32 位计数器 9.54 h 换钥</text>
  <text x="20" y="428" font-size="13" fill="#4a5568">2 MB/s 流下，硬件加密给 CPU 留出约 25.9% 的预算</text>
  </g>
</svg>
