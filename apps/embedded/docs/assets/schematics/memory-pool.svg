    <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">堆的碎片剖面与固定块内存池</text>
    <text x="20" y="52" font-size="13" fill="#4a5568">同一段 32 KiB SRAM：交替分配后堆只剩 256 B 的岛，固定块池没有外部碎片</text>
    <line x1="20" y1="62" x2="740" y2="62" stroke="#e2e8f0"/>

    <text x="30" y="86" font-size="15" font-weight="700" fill="#1a365d">堆：首次适配，交替分配 64 组后的剖面</text>
    <text x="460" y="86" font-size="15" font-weight="700" fill="#1a365d">固定块池：槽位等长</text>

