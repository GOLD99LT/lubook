    <text x="460" y="222" font-size="13" fill="#2b6cb0">深色 已分配</text>
    <text x="576" y="222" font-size="13" fill="#4a5568">浅色 空闲</text>
    <text x="460" y="244" font-size="13" fill="#4a5568">128 B / 槽，共 256 槽</text>

    <rect x="30" y="196" width="400" height="62" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.4"/>
    <text x="44" y="220" font-size="15" font-weight="700" fill="#822727">此时申请 2048 B 连续块：失败</text>
    <text x="44" y="243" font-size="13" fill="#9b2c2c">空闲总量 16 KiB 是请求的 8 倍，仍拼不出</text>

    <text x="30" y="284" font-size="13" fill="#4a5568">浅色段是空闲块，深色段是仍被占用的块，两者交替排布，无法合并</text>

    <rect x="30" y="298" width="226" height="112" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="42" y="320" font-size="14" font-weight="700" fill="#1a365d">碎片率</text>
    <text x="42" y="344" font-size="13" fill="#2d3748">F = 1 - L / T</text>
    <text x="42" y="366" font-size="13" fill="#2d3748">= 1 - 256 / 16384</text>
    <text x="42" y="392" font-size="15" font-weight="700" fill="#c53030">= 98.4%</text>

    <rect x="266" y="298" width="226" height="112" rx="6" fill="#f7fafc" stroke="#cbd5e0"/>
    <text x="278" y="320" font-size="14" font-weight="700" fill="#1a365d">可分配上限</text>
    <text x="278" y="344" font-size="13" fill="#2d3748">L = 256 B，T = 16384 B</text>
    <text x="278" y="366" font-size="13" fill="#2d3748">需求 2056 B 大于 L</text>
    <text x="278" y="392" font-size="15" font-weight="700" fill="#c53030">L 只有需求的 1/8</text>

    <rect x="502" y="298" width="228" height="112" rx="6" fill="#f0fff4" stroke="#9ae6b4"/>
    <text x="514" y="320" font-size="14" font-weight="700" fill="#22543d">固定块池</text>
    <text x="514" y="344" font-size="13" fill="#2d3748">12 B 请求占满 128 B</text>
    <text x="514" y="366" font-size="13" fill="#2d3748">槽内效率 12 / 128</text>
    <text x="514" y="392" font-size="15" font-weight="700" fill="#2f855a">9.4%，但不会失败</text>
  </g>
