<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif">
    <rect width="760" height="440" fill="#ffffff"/>
    <defs>
      <marker id="s-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
      </marker>
      <marker id="s-ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
      </marker>
    </defs>

    <text x="20" y="30" font-size="20" font-weight="700" fill="#1a202c">同步原语：ISR 到任务的三条通路，与死锁的循环等待</text>
    <text x="20" y="52" font-size="13" fill="#4a5568">上半区决定"用什么把事件交出去"，下半区决定"为什么会互相卡死"</text>
    <line x1="20" y1="62" x2="740" y2="62" stroke="#e2e8f0"/>

    <text x="20" y="80" font-size="14" font-weight="700" fill="#2d3748">A 中断上下文如何把事件交给任务</text>

    <rect x="40" y="96" width="150" height="64" rx="6" fill="#fde7c7" stroke="#c05621" stroke-width="1.6"/>
    <text x="115" y="124" font-size="16" font-weight="700" fill="#7b341e" text-anchor="middle">ISR</text>
    <text x="115" y="144" font-size="13" fill="#7b341e" text-anchor="middle">中断上下文</text>

    <rect x="250" y="84" width="170" height="48" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.5"/>
    <text x="335" y="104" font-size="14" font-weight="700" fill="#1a365d" text-anchor="middle">队列 Queue</text>
    <text x="335" y="122" font-size="13" fill="#2a4365" text-anchor="middle">复制数据，有深度</text>

    <rect x="250" y="148" width="170" height="48" rx="6" fill="#d9f0e0" stroke="#2f855a" stroke-width="1.5"/>
    <text x="335" y="168" font-size="14" font-weight="700" fill="#22543d" text-anchor="middle">信号量 Semaphore</text>
    <text x="335" y="186" font-size="13" fill="#22543d" text-anchor="middle">只计数，无所有者</text>

    <rect x="250" y="212" width="170" height="48" rx="6" fill="#ece0f5" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="335" y="232" font-size="14" font-weight="700" fill="#44337a" text-anchor="middle">任务通知 Notification</text>
    <text x="335" y="250" font-size="13" fill="#44337a" text-anchor="middle">32 位值，开销最低</text>

    <rect x="580" y="110" width="150" height="120" rx="6" fill="#e9edf2" stroke="#4a5568" stroke-width="1.6"/>
    <text x="655" y="160" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle">任务 Task</text>
    <text x="655" y="182" font-size="13" fill="#2d3748" text-anchor="middle">阻塞在等待点</text>

    <line x1="190" y1="120" x2="246" y2="110" stroke="#4a5568" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <line x1="190" y1="128" x2="246" y2="170" stroke="#4a5568" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <line x1="190" y1="136" x2="246" y2="234" stroke="#4a5568" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <line x1="420" y1="106" x2="576" y2="140" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <line x1="420" y1="170" x2="576" y2="166" stroke="#2f855a" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <line x1="420" y1="234" x2="576" y2="196" stroke="#6b46c1" stroke-width="1.5" marker-end="url(#s-ar)"/>

    <text x="20" y="274" font-size="13" fill="#4a5568">数据要排队用队列；只表示"事件到了"用信号量；同一任务点对点唤醒用通知（更快但不能堆积多个值）</text>

    <line x1="20" y1="284" x2="740" y2="284" stroke="#e2e8f0"/>
    <text x="20" y="302" font-size="14" font-weight="700" fill="#2d3748">B 两任务两锁：环如何形成</text>

    <rect x="60" y="320" width="120" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.6"/>
    <text x="120" y="348" font-size="14" font-weight="700" fill="#1a365d" text-anchor="middle">任务 A</text>

    <rect x="240" y="300" width="120" height="36" rx="6" fill="#e9edf2" stroke="#4a5568" stroke-width="1.5"/>
    <text x="300" y="324" font-size="14" font-weight="700" fill="#2d3748" text-anchor="middle">锁 L1</text>

    <rect x="240" y="380" width="120" height="36" rx="6" fill="#e9edf2" stroke="#4a5568" stroke-width="1.5"/>
    <text x="300" y="404" font-size="14" font-weight="700" fill="#2d3748" text-anchor="middle">锁 L2</text>

    <rect x="480" y="320" width="120" height="44" rx="6" fill="#dbe9f6" stroke="#2b6cb0" stroke-width="1.6"/>
    <text x="540" y="348" font-size="14" font-weight="700" fill="#1a365d" text-anchor="middle">任务 B</text>

    <line x1="120" y1="320" x2="238" y2="312" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <text x="216" y="306" font-size="13" fill="#2a4365" text-anchor="middle">持有</text>
    <line x1="360" y1="312" x2="478" y2="330" stroke="#c53030" stroke-width="1.5" marker-end="url(#s-ar-red)"/>
    <text x="420" y="306" font-size="13" fill="#9b2c2c" text-anchor="middle">等待</text>
    <line x1="540" y1="364" x2="362" y2="390" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#s-ar)"/>
    <text x="470" y="382" font-size="13" fill="#2a4365" text-anchor="middle">持有</text>
    <line x1="240" y1="398" x2="122" y2="366" stroke="#c53030" stroke-width="1.5" marker-end="url(#s-ar-red)"/>
    <text x="175" y="410" font-size="13" fill="#9b2c2c" text-anchor="middle">等待</text>

    <text x="620" y="348" font-size="13" fill="#4a5568">断环：统一锁序</text>
    <text x="620" y="366" font-size="13" fill="#4a5568">或带超时 trylock</text>
    <text x="20" y="432" font-size="13" fill="#4a5568">四个条件同时成立才死锁：互斥、占有并等待、不可剥夺、循环等待；破坏任意一个即可预防</text>
  </g>
</svg>
